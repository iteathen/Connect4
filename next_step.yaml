qualified_premises:
  - id: enabled_singleton_terminal_predecessor
    statement: >-
      An enabled live P0 singleton on a P0 turn is an exact immediate terminal predecessor
      unless an already-terminal boundary has been reached.
  - id: chain_reselection_descent
    statement: >-
      The retained non-target A/B chain branches admit another same-column P0 action with
      strict selected-column capacity descent and preserved target singleton, subject to exact
      terminal guards.
  - id: universal_terminal_response_states
    statement: >-
      The exact twelve blocking rank-22 states are locally P0-losing: every legal P0 action has
      an immediate exact P1 terminal response.
  - id: adversarial_tail_elimination
    statement: >-
      Eight of twelve D/E/F tail actions are eliminated because P1 has a reply into one of the
      exact universal terminal-response states.
  - id: adjacent_tail_survivor_rule
    statement: >-
      In the retained D/E/F family, the only tail survivor is the column adjacent to the
      remaining target: F for G3, D for C3, independent of resolved-singleton ownership.
  - id: complementary_tail_rule
    statement: >-
      In each exact no-A/B survivor state, after P1 consumes one of the two remaining D/E/F
      tails, P0 consuming the other is the unique currently-qualified immediate continuation.
  - id: repair_capacity_induction
    statement: >-
      On the sixteen nonterminal successors of the four adjacent-tail survivor actions, a
      restricted alternating-predecessor proof over A/B/D/E/F closes 16/16 starts under the
      well-founded measure mu=sum remaining capacities in A,B,D,E,F. P0 decreases mu by one;
      P1 replies never increase it. Physical memo states are witnesses, not semantic identity.
    qualification:
      physical_proof_states: 9635
      start_states: 16
      proved_start_states: 16
      failed_start_states: 0
      max_induction_depth: 7
      canonical_proof_classes_including_terminal: 1022
      distinct_start_proof_classes: 9
      boundary: >-
        1022 classes is not a small universal calculus and is not q/state equality.

execution:
  cycle: assess -> research -> reassess -> plan -> execute -> qualify -> review -> cleanup/document
  domain: >-
    Start from the exact retained rank-20 latent-contract states used by the action-progress
    controls. Do not expand to an arbitrary q frontier.
  predecessor_test:
    for_each_rank20_state:
      - enumerate every legal P0 action through exact C4-0010 transitions
      - reject an action if any legal P1 reply is terminal for P1
      - accept an action only when every legal P1 reply has an explicit qualified discharge
      - record the exact theorem/contract discharging each reply
      - if no action closes, preserve the smallest exact state/action/reply falsifier
  accepted_reply_routes:
    - immediate_P0_terminal_predecessor
    - qualified_A_or_B_chain_descent
    - qualified_adjacent_tail_repair_capacity_induction
    - exact_guarded_reentry_contract
  forbidden_shortcuts:
    - solved_WDL_or_external_solver_as_premise
    - recursive_q_frontier_search_as_proof
    - unknown_as_loss
    - candidate_family_failure_as_loss
    - physical_state_or_proof_class_equality_as_q_equality
    - phase_weight_as_value_classifier
    - terminal_line_cardinality_as_premise
    - unproved_69_to_28_geometric_line_reduction
  wall_clock_limit_seconds: 300
  inner_timeout_seconds: 270

success_criteria:
  - every retained exact rank-20 latent-contract state has at least one branch-complete P0 predecessor witness
  - every P1 reply of every accepted witness has a named qualified discharge contract
  - no accepted action drops terminal, R, C, N, resource, deadline, or observed provenance obligations
  - result is rerun under bounded CI
  - exact theorem boundary and any remaining composition gap are documented

on_success:
