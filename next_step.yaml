next_task:
  name: derive_defect_transfer_quotient_and_rank
  purpose: >
    Compress the opening-3 top-defect response problem into a guarded certificate-switch
    graph whose nodes retain exactly the support/phase/WSL/CPC/NDC/resource information
    needed for sound transfer, and whose switch edges decrease a well-founded rank.
  seed_state:
    standard_board: 7x6_connect4
    p0_first_move: 3
    p1_structural_reply: 4
    fact: bottom_up_vertical_response_covers_all_60_live_minimal_p0_residuals
    defects: [[3,6],[4,6]]
  steps:
    - model vertical-cover response phase and live defect tokens independently of move ordering
    - quotient commuting paired trigger-response events before response-choice exploration
    - define legal defect-transfer response edges with exact successor WSL coverage
    - include CPC event ownership and NDC guard closure where a response releases or changes phase
    - derive a monotone rank over remaining response resources / defect obligations
    - require every attacker alternative to have at least one rank-decreasing certified defender response
    - compare the compressed graph against the physical-state control only as a falsifier
    - retain the smallest quotient collision or lost-response counterexample if compression is unsound
    - use synchronized-channel certificates as terminal safety seeds
    - keep small deterministic race lemmas explicit and separately proved if they remain necessary
    - promote opening3_no_win only if the compressed certificate graph closes with no fallback to exact game value
    - carry Pi0 separately for later output reachability; this task is value/safety only
  success_conditions:
    - response_switch_graph_is_strictly_smaller_than_physical_policy_graph
    - every switch edge has a local legality_and_coverage proof
    - rank_strictly_decreases_on_every_nonterminal_switch_cycle_candidate
    - zero bounded policy failures
    - no exact solved value is used as an acceptance premise
    - opening3 is either structurally closed or left explicitly unproved with a smallest remaining obstruction
  forbidden_shortcuts:
    - brute_force_any_response_until_a_draw_strategy_is_found
    - use_known_opening_value_as_the_proof
    - erase_response_phase_or_defect_resource_identity
    - merge_states_only_because_they_share_a_certificate
    - use_non_strict_value_elimination_to_delete_terminal_line_output_paths

