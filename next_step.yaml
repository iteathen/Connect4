  id: derive_deadline_valued_ndc_selector
  objective: >-
    Continue from the board-parameterized K=4 invariant family. Derive or falsify an exact deadline-valued
    CPC/NDC closure that selects/characterizes the relevant terminal/control envelope from W,H,K=4,
    turn parity and generated structural facts without recursive legal-move child-value solving. Standard
    7x6 must emerge as the core-balanced, perfect-pairing, unique-initial-centrality case and produce its
    canonical 28 envelope without predefined 28 or oracle prefix/distance premises.

