  bounded_steps:
    - use the completed one-step sibling census as the fixed boundary; do not recurse it deeper
    - separate each observed branch difference into causal branching versus interleaving-only branching
    - express each existing structural fragment as a typed event-poset obligation/contract where possible
    - define implication only when the full typed certificate entails another certificate, not from q cardinality or guessed state dominance
    - compare closing siblings against 46656555 for the smallest typed fact that breaks their otherwise identical arity signature
    - exploit the twelve exact-q convergence points as positive confluence controls
    - retain counterexamples whenever a proposed implication erases a deadline, resource conflict, CPC fact, NDC guard, terminal boundary, or provenance
    - do not enumerate a physical move tree; if a finite typed relation is small enough, exhaustively generate that relation instead
    - if a sound implication/compatibility rule emerges, prove it before rerunning any broader frontier
  success_conditions:
    - a finite typed causal representation explains at least one closing-vs-broad differential absent from child counts
    - implication is theorem-backed and preserves all load-bearing context
    - interleaving equivalence is separated from genuine causal/strategic choice
    - fragment vocabulary remains semantic rather than state-ID-specific
    - any promoted positive rule includes both safety and well-founded progress
  stop_conditions:
