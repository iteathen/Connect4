branch: solver/hybrid-confluence
solver_family: hybrid_confluence

authority:
  repository_context: AGENT_LOCAL.md
  branch_identity: HYBRID_CONFLUENCE_BRANCH.md
  shared_foundation: main
  shared_research: research/semantic-quotient
  topology_decision: docs/decisions/2026-09-17-closed-durable-lane-topology.md

ownership:
  owns:
    - hybrid_confluence_contract
    - exact_cross_solver_result_exchange
    - hybrid_specific_transport_and_scheduling
    - hybrid_specific_qualification_and_performance_evidence
  does_not_own:
    - minimax_private_search_or_tt_state
    - cuda_bsfp_private_recurrence_or_storage
    - isometric_structural_calculus
    - sut_semantics
    - canonical_shared_research

task:
  id: define_exact_hybrid_confluence_contract
  objective: >-
    Establish the smallest exact branch-local contract for composing independently owned solver
    capabilities without importing their private internals or converting partial/stale evidence into
    false exact results.

required_questions:
  - what_exact_semantic_identity_is_shared
  - what_result_or_proof_strength_order_is_monotone
  - when_a_result_may_close_or_supersede_other_work
  - how_stale_information_remains_sound
  - what_cancellation_is_semantically_safe
  - what_bounded_controls_falsify_the_contract

constraints:
  - no_wholesale_copy_of_parent_solver_internals
  - no_performance_claim_before_exact_composition_qualification
  - no_assumption_that_sut_and_hybrid_confluence_are_the_same_solver
  - temporary_work_branches_must_return_durable_results_here_and_retire

success_criteria:
  - explicit_exact_confluence_contract
  - bounded_independent_correctness_controls
  - clear_ownership_and_lifecycle
  - branch_local_status_updated_before_substantive_implementation
