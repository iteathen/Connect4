  support_model: >
    Legal support configurations are order ideals of seven disjoint height-six
    column chains. Sequential histories are parity-colored linearizations; independent
    column events exhibit exact local confluence when legality, player coloring, and
    nonterminal boundaries are preserved.
  positive_macro_step: "P0 witness -> all P1 replies -> base discharge or next exact-q hard frontier"
