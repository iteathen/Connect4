qualified_premises:
  - id: regular_k4_invariant_family
    statement: >-
      Generated K=4 geometry defines B,Q_axis,Q_phase,Y_cell,Y_line and Delta on every board. In the
      regular regime: L=4WH-9W-9H+18, rankB=WH-7, axis rank=W+H-6, phase rank=W-1,
      Y_cell=WH-W-H-1, Y_line=3WH-10W-9H+26, Delta=(W-4)(2H-9)-9, with explicit narrow degeneracies.
  - id: balanced_shapes
    statement: >-
      Delta=0 iff (W-4)(2H-9)=9 in the regular positive-integer regime, giving 5x9/core30,
      7x6/core28, and 13x5/core46. Standard 7x6 is the only balanced shape with <=42 cells.
  - id: board_family_cpc_parity
    statement: >-
      q_(W,H)(S)=(W-1)H+C(S)+r_max(S) mod2. The standard q=C+r shorthand is not cross-board valid.
  - id: phase_path_transport
    statement: >-
      C_phase is canonically the edge space of the width-W path graph. Boundary(edge_i)=e_i+e_(i+1),
      each displacement e_a+e_b has the unique interval lift between a,b, and structural phase transport
      length is |a-b|. Same-column two-ply play is zero transport. Game-theoretic distance monotonicity is not assumed.
  - id: initial_event_centrality
    statement: >-
      Empty-board bottom-event impact is d_W(c)=1+h4_W(c)+I(c<=W-4)+I(c>=3). W=7 is the unique
      K=4 width with one unique maximum-impact initially legal event; profile [3,4,5,7,5,4,3], maximum center.
  - id: combined_standard_classification
    statement: >-
      Core balance plus unique maximum initial-event impact forces W=7,H=6 and then common core
      Y=WH-W-H-1=28. This is structural classification, not yet an optimal-move theorem.
  - id: balance_not_pairing
    statement: >-
      Existing corrected beta/gamma forms are perfect only on 7x6 among the three balanced shapes:
      ranks 28/26 on 5x9, 28/28 on 7x6, 42/34 on 13x5. Equal core dimension is insufficient.
  - id: preterminal_capacity
    statement: >-
      X5(W,H) measures static five-ply exclusion of P0 maximal-delay support predicates. Standard 7x6
      has envelope38,X5=10,min28 uniquely at the center stack. But 8x7 also has min survivors=Y_cell=40,
      so this scalar equality is not a universal selector.
  - id: canonical_standard_bridge
    statement: >-
      Searchlessly on 7x6, symmetry/P/maximal-delay geometry produces the same 28-line envelope later
      observed externally. The unresolved fact is semantic deadline/control selection, not discovery of 28.

execution:
  cycle: assess -> research -> reassess -> plan -> execute -> qualify -> review -> cleanup/document
  primary_question: >-
    Can exact strong-distance/control selection be represented as a finite ranked NDC closure over residual
    requirements and deadlines, using phase-path transport and response resources, rather than recursive moves?
  first_construction:
    - >-
      Define a horizon-bearing certificate type: prerequisites, response/resource guards, consequence,
      and exact earliest/latest rank. Keep proof polarity and universal response obligations explicit.
    - >-
      For conjunctive prerequisites derive horizon from the latest prerequisite. For alternative exact
      witnesses use the earliest certified witness only where logical polarity permits. Do not hide opponent
      universality inside an informal min/max shortcut.
    - >-
      Define requirement-completion horizon from support/event precedence plus CPC ownership/phase facts.
      Define blocker horizon separately. A blocker solves a requirement only when certification plus timing
      proves the opponent cannot complete before the blocker/response event.
    - >-
      Lift e_a+e_b through the canonical phase path so reservation/release/response changes carry explicit
      transport support, not merely an anonymous even-weight vector.
    - >-
      Test the smallest complete Connect-4 controls first (4x4,5x3/4x5 where applicable), then standard
      structural anchors. Full legal-state enumeration may be used only as an independent oracle/falsifier,
      never as the production closure mechanism.
  required_checks:
    - no solved WDL, best move, forced prefix or terminal-distance premise in production derivation
    - no predefined 28,30,69 or fitted terminal census scalar
    - no recursive minimax, Negamax, MCTS or PNS as proof mechanism
    - preserve response/resource/deadline conditions whenever CPC facts depend on them
    - preserve q_(W,H) board constant in residual parity
    - preserve thin-board and narrow-degeneracy handling
    - preserve Delta and beta/gamma radicals/cokernels instead of forcing square common-Y semantics
    - distinguish phase transport length from game-theoretic strong distance until proved
    - incoming exact board data is validation/falsification only
  falsification:
    - if two certificates merged by the proposed state have different next deadline consequences, compression fails
    - if schedule/order changes the closure result, the NDC profile is unsound
    - if a certified blocker arrives after the requirement can complete, it cannot be used for elimination
    - if a scalar count predicts selection but a qualified board/control contradicts it, preserve the counterexample
    - if the closure reconstructs the full legal move tree with no meaningful dependency sharing, it fails the searchless objective

success_criteria:
  - exact horizon-bearing certificate semantics with monotone/ranked closure
  - direct geometry-to-closure construction on at least one complete small-game control without state-tree generation
  - independent oracle agreement for outcome and, where claimed, distance horizon
  - standard 7x6 structural path remains compatible and no 28 special case is inserted
  - board-family invariant vector remains the input contract
  - durable theorem/falsifier note and synchronized routers

