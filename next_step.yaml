next_task:
  name: compile_canonical_R_P_C_N_bridge_on_4665655_siblings
  purpose: >
    Determine whether the fixed sibling differential can be explained by one compact
    canonical typed certificate instead of exact-q recursion. Build R residual
    obligations, P parity/time facts, C resource/response contracts and N implication
    edges; then test whether those structures separate the three closing controls from
    broad-reexpansion control 46656555.
  control_family:
    closing_controls: ["46656551", "46656552", "46656557"]
    broad_reexpansion_control: "46656555"
  allowed_derived_views:
    - blocker_duals_and_minimal_transversals
    - danger_response_intersections_and_forks
    - gain_cost_rest_projection
    - Hall_or_capacity_deficiency_where_unit_resource_assumptions_hold
    - Allis_fragment_generators_compiled_to_typed_contracts
    - event_trace_confluence_for_proved_independent_interleavings
  bounded_steps:
    - use completed one-step sibling census as fixed boundary; no deeper recursive hard-frontier descent
    - generate only the finite R/P/C/N relation needed by the four controls
    - normalize isomorphic representations to canonical owners before comparison
    - compare the three closing controls against 46656555 for the smallest structural differential
    - when a derived view separates the controls, translate it back into canonical R/P/C/N predicates before claiming progress
    - prove any promoted implication exactly; otherwise keep it in the Bayesian mask
    - if the finite relation becomes one descriptor per exact q state, stop and record failure
  success_conditions:
    - one finite semantic R/P/C/N invariant separates closing from broad behavior
    - the invariant is not merely cardinality or opaque q identity
    - all load-bearing timing/resource/CPC/NDC context is preserved
    - the resulting rule has a clear G consequence: safety, progress, or exact predecessor implication
    - no new semantic layer is introduced when an existing canonical owner suffices
  stop_conditions:
    - representation degenerates to exact-q identity
    - analysis reconstructs physical move-tree branching
    - candidate requires oracle scores or solved values as proof premises
    - wall_clock_reaches_5_minutes

