  success_conditions:
    - fragment vocabulary remains small and semantic rather than state-ID-specific
    - closing siblings obtain a materially smaller or fully discharged compatible-cover core
    - broad control exposes a precise missing contract/resource/order fact rather than generic state explosion
    - any promoted positive rule includes both safety and well-founded progress
  stop_conditions:
    - fragment inventory becomes effectively one fragment per exact state
    - generic compatible-cover search reconstructs physical move-tree branching
    - no structural difference remains after typed contracts and NDC/CPC context
    - candidate requires oracle scores or solved values as proof premises
    - wall_clock_exceeds_10_minutes_without_a_bounded_local_bottleneck

