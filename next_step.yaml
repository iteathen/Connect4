qualified_premises:
  - id: target_free_common_Y
    statement: >-
      Standard 7x6 derives a natural 28-dimensional common Y from GF(2), K=4, H=6, W=7 without
      predefined 28 or 69. The direct T:Y_line->Y_cell and the 28+7 / 28+6 splittings remain qualified.
  - id: exact_standard_oracle_28
    statement: >-
      Issue #41 supplies external validation evidence for exactly 28 distance-optimal terminal lines
      on 7x6, terminal move 41, with the first five moves forced to center. This is not a premise of
      the target-free Y theorem.
  - id: optimal_28_not_Y_basis
    statement: >-
      The 28 optimal line coordinates have incidence rank 26, two dependencies inside Y_line,
      a 20-dimensional cell-image intersection with Y_cell, and axis-boundary rank 6. Therefore the
      oracle line set is not a basis of common Y.
  - id: terminal_support_bound
    statement: >-
      For externally supplied decisive terminal move T, q=W*H-T+1 and t=max(0,H-q) give the sound
      geometry/gravity upper bound U=G(W,H)-G(W,t). The compact q*(4W-9) form is conditional on the
      unclipped K=4 regime; use G-difference globally.
  - id: issue42_decisive_caps_reproduced
    statement: >-
      Independent geometry and gravity-deficit enumeration reproduces issue #42's decisive support caps:
      6x4=15, 6x6=15, 6x7=30, 7x6=38 before prefix, 8x4=23, 8x5=46, 9x4=27, 10x4=31.
      No arithmetic inconsistency was found in these caps under the pinned source premises.
  - id: standard_prefix_filtration
    statement: >-
      On 7x6 the externally proved five-center prefix refines 38->30->28. GF(2) sectors change
      38=(6 line-core +4 phase +22 cell-core +6 axis) ->
      30=(4+0+20+6) -> 28=(2+0+20+6). The ten-coordinate reduction lowers the incidence image
      only from 28 to 26 and annihilates the support-envelope phase sector.
  - id: q2_finite_width_pattern
    statement: >-
      Finite W=4..30, H=5, q=2 controls find support sectors
      (2W-8) line-core +(W-3) phase +(4W-6) cell-core +(W-1) axis = 8W-18,
      with incidence image rank 5W-7 and phase equal to the even-weight interior-column subspace.
      This is finite family evidence, not an unbounded theorem.
  - id: transpose_warning
    statement: >-
      Bare 6x7 and 7x6 both have L=69, rankB=35, ker=34, while 6x7 has Y_cell=28, gravity-oriented
      Y_line=29 and support upper 30. Therefore neither bare incidence nor cell-side 28 predicts the
      external optimal terminal-line count across orientation.

