    This is a projection of the ownership-lift/domain-wall representation, not an independent proof primitive.

execution:
  cycle: assess -> research -> reassess -> plan -> execute -> qualify -> review -> cleanup/document
  authority_publication_rule: >-
    This file is an operational derived view. Any new durable logic, changed claim status, new theorem, falsifier,
    missing law or research conclusion must be incorporated into a successor qualified IsoGraph authority revision;
    editing this file or a legacy Markdown/JSON bridge does not itself change logic authority.
  proof_standard: >-
    Any unbounded board-family claim requires symbolic proof. Finite solved tables, constrained strategy solves,
    board sweeps and oracle data may falsify or guide discovery only.
  relation_promotion: >-
    Treat every newly discovered source-target correspondence as a claim until it has deductive or guarded-exact
    proof. Empirical confirmation may strengthen the claim but must not create a native IsoGraph relation edge.
    When proof is obtained, record the relation explicitly in the successor IsoGraph and carry any load-bearing
    guards with it. Unproved relation claims must not be consumed as established topology.
  discrepancy_handling: >-
    Treat a material mismatch as an observation first. Align semantic quantity, scope, layer, aggregation,
    authority and closure before repair. Record qualification_disposition separately from discovery_disposition.
    A qualification error may leave an open structural lead; an open lead is not authority.
  identity_handling: >-
    When a discovery branch becomes an identity or safe-collapse question, evaluate it under the applied NEI
    profile layer before merging referents or claiming natural distinctness. Keep physical, artifact, event,
    lineage and future-behavior identities separate. Historical NEI-C4-0007 remains incomplete under its pinned
    evidence revision, while the later q-congruence proof is a candidate SAME result pending independent
    qualification. Do not assume a context-free quotient map: evidence artifacts may participate in multiple
    lineages, so any identity projection must preserve the context/anchor that makes it single-valued. Treat
    artifact identity and artifact-lineage occurrence as separate concepts. NEI DISTINCT never implies statistical
    independence, and NEI SAME at a projected profile never erases fine-grained provenance.
  method_emergence_context: >-
    Treat the guarded obligation rule as a shortcut controllable-predecessor derivation over the common Connect4
    value-dependency topology. Do not invent solver-specific semantics where the existing action/terminal/quantifier
    relations already suffice. Separate state-evolution direction from value-dependency direction, and separate
    semantic relation from evaluation schedule and representation.
  primary_question: >-
    Can the predecessor-closed support-local clause carrier be projected into exact residual/q-value bounds under
    controller-existential and opponent-universal choice before universal proof alternatives are distributed,
    while preserving realizability, support, deadlines, response resources and first-win stopping?
  supporting_guarded_obligation_construction:
    - >-
      Start from zero-based A=[6,6,6,6,2,2] and B=[2,6,6,2,6,6]. Both have support [0,0,2,0,0,0,4]
      and equal current-owner low-order jets; keep their distinct full positive residual antichains.
    - >-
      Use exact owner-labelled cofactor substitution, including mixed-owner compositions. Do not add a new
      enabling coordinate merely to cache a relation already derivable from residual incidence plus an event owner.
    - >-
      Separate algebra from time: cofactor substitutions on distinct cells commute, while legal/admissible event
      order is carried by support, side-to-move, reserved responses, deadlines and first-win stopping.
    - >-
      Define obligation birth only when a contracted residual is certified active before its deadline. Degree drop
      alone is not an obligation. Reuse existing singleton/fork, blocker-clause and response-capacity consequence
      forms rather than inventing a fourth Boolean consequence type.
    - >-
      Quantify intervening opponent choices over the post-cofactor consequence, not over survival of one named
      residual. An opponent may kill one residual while an alternative residual/certificate survives.
    - >-
      Merge equal consequences in the NDC certificate DAG. Apply min/max only with explicit controller-existential
      or opponent-universal semantics. Stop at the first guard not derivable from support, blocker, control-potential,
      response-resource, deadline or first-win coordinates; only that residue is a candidate new predicate.
    - >-
      Use solved BDD evidence only to falsify proposed strengthenings. Absence of sampled collisions is not proof,
      and a nearly injective signature is not a compact value selector.
  required_checks:
    - any material discrepancy preserves raw observations before normalization and records separate qualification/discovery dispositions
    - any identity projection used for collapse is explicitly scoped/anchored when the source referent can participate in multiple higher-level identities
    - artifact object identity is not conflated with a lineage-local artifact occurrence
    - q-congruence use is limited to ordinary legal future behavior; path/provenance/NDC context outside q remains separate
    - NEI SAME/DISTINCT is not lifted into unrelated properties such as evidence independence
    - pair blocker must not be silently promoted to XOR
    - eventual ownership must not replace ownership-before-deadline
    - a lower-degree residual must not be promoted to a defensive obligation without support/deadline/resource proof
    - pure-followup/domain-wall safety is defensive substrate, not a signed value theorem
    - finite outcome interpolation is never proof
    - outcome player/sign bit is derived from an exact terminal ownership lift
    - draw is canonical 00 and does not require an arbitrary player bit
    - preserve first-win stopping semantics
    - no Hall deficiency is a forcing certificate only where its guards are proved; absence is not draw evidence
  falsification:
    - a rule instance needs a consequence not expressible as affine fact, monotone clause or guarded temporal composition
    - two different substitution orders on distinct cells produce different canonical positive cofactors
    - affine/clause propagation derives a stronger fact after its deadline rather than before it
    - two merged states with equal parity/clause sets have different support/resource obligations relevant to future proof
    - universal intervention closure silently ignores an admissible opponent event that destroys the claimed consequence
    - a candidate signed selector disagrees with an independently solved board (validation only)
    - standard 7x6 requires inserting the known +1 label or 28 as a premise

success_criteria:
  - exact guarded mixed-cofactor-to-obligation composition with explicit quantifier and deadline semantics
  - owner-labelled enabling remains derived unless a concrete non-derivable guard residue is exhibited
  - complete consequence-shape classification of currently used strategic rules
  - exact guarded affine-clause NDC closure with explicit information order and deadline semantics
  - no duplicated CPC/phase/player-color representation where one potential suffices
  - standard 7x6 terminal proof returns canonical 01 without solved-label premise
  - thin-board theorem returns canonical 00 from the same value semantics
  - second-player-winning controls, when used, are validation only until independently derived
  - structural magnitude remains distinct from win/draw sign until a natural coupling is proved
  - synchronized STATUS.md / next_step.yaml and durable theorem notes

validation_only:
  - published finite W/D/L tables
  - standard 7x6 strong-distance/oracle data
  - constrained pure-followup solves
  - finite generated-rank/barcode controls
  - varying-board censuses
  - >-
    2026-09-14 solved-db structural discovery: 30254 standard-board states; finite source collisions falsify
    boundary-capacity, degree2, F2-span and current-owner degree2-jet value completeness. Full exact residual
    identity and ownerJet have no observed sampled collision, which is validation only and not completeness proof.
  - >-
    2026-09-14 independent assessment: the A/B collision's 13/49 two-event low-order divergence was reproduced
    without solved labels. The distinction is already present in full positive residual incidence and is exposed
    by a derived mixed owner cofactor; the unresolved seam is guarded quantifier closure into obligations.

