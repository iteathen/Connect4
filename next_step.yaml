objective: >
  Close or precisely falsify the remaining off-subsystem progress premise at the fixed
  latent C3/G3 contract state. Work over already-qualified local semantic-effect theorem
  classes, not a physical q move tree. Every admissible off-target event class must either
  compose to exact latent-contract re-entry, terminal closure, a response-capacity circuit
  with a proved Connect4 obligation/slot map, or a strict decrease in a well-founded exact
  E/R/P/C/N progress rank. If this is impossible, retain the smallest exact theorem-class
  cycle/SCC that demonstrates the missing structural invariant.

