  Derive a complete structural solve proof and then the exact perfect-W/D/L P0
  terminal-line set. Preserve the theorem-backed hard-frontier recursion calculus,
  but do not recurse further through broad exact-q frontiers until a stronger
  typed causal/set-level policy certificate is proved.

