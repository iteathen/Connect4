next_task:
  name: extract_structural_witness_or_broad_base_rule
  purpose: >
    Use the closed expand/collapse certificates and nearest broad-reexpansion controls
    to derive the smallest theorem-backed rule that either chooses a useful P0 witness
    structurally or discharges a recurring 5..7-hard consequence family before it
    expands.
  primary_control_family:
    root_prefix_family: "4665655*"
    reason: >
      Closely related depth-8 states in this family exhibit both successful finite
      frontier closure and broad re-expansion, giving a tight causal differential.
  steps:
    - freeze the successful and failed hard-frontier certificates in the 4665655* family
    - compare support-event order, CPC ownership/timing, WSL residual transformations, NDC guards, response-resource conflicts, and race/deadline structure at the first point their frontiers diverge
    - identify relations that are preserved across the successful siblings but fail in the broad-reexpansion sibling; do not use state IDs or solved values as predicate inputs
    - prefer transition/transport relations over parent-state scalar summaries
    - formulate the smallest candidate implication for either witness admissibility or a new positive base certificate
    - falsify the candidate on all retained closed and overflow low-width controls, then on complete smaller games where semantics apply
    - if falsification succeeds, prove the implication from CPC/WSL/NDC/support/resource semantics before adding it to the base grammar
    - rerun the 723-root boundary only after the new theorem is frozen
    - measure added constructive closures and whether broad-frontier incidence shrinks
  success_conditions:
    - candidate rule has no state IDs and no solved-value labels
    - rule distinguishes successful transport/closure from at least the known broad-reexpansion control for a structural reason
    - independent bounded falsification finds zero counterexamples
    - theorem proof derives from accepted structural semantics
    - adding the rule closes additional standard7x6 roots or reduces broad-frontier width without unsafe q merging
  stop_conditions:
    - candidate descriptor grows toward exact state identity
    - only accidental scalar correlations remain after transition/context analysis
    - proposed rule requires oracle scores as a proof premise
    - experiment starts reconstructing a large physical game tree
    - wall_clock_exceeds_10_minutes_without_a_bounded_local_bottleneck

