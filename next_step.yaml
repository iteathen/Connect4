  - no_parent_solver_internal_ownership_transfer
  - no_speculative_shared_state_layout
  - no_concurrency_or_performance_claim_before_exact_contract
  - temporary_sut_work_must_return_durable_results_here_and_retire

success_criteria:
  - explicit_small_exact_weld_contract
  - clear_distinction_from_hybrid_confluence
  - independent_bounded_correctness_control
