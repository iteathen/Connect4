task:
  id: derive_total_domain_connect4_calculus
  objective: >-
    Derive the Connect4 structural/response calculus over arbitrary positive integer board dimensions W,H.
    Small and large boards must be consequences of the same generated geometry/support/response definitions.
    Finite board sweeps, solved tables and varying-board censuses are falsification/implementation checks only;
    they are forbidden as evidence for any all-board theorem.

