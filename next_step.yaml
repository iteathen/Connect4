objective: >
  Reuse exact structural theorems across physically different Connect4 contexts by
  deriving only the dependency cone required by the claim being proved. Preserve full
  C4-0010 q identity for state semantics; proof compression belongs at the theorem layer.

canonical_layers:
  E: causal_event_poset_and_support_ideals
  R: residual_winning_obligation_antichains
  P: CPC_GF2_parity_precedence_deadlines
  C: typed_temporal_policy_contracts_resources_and_compatibility
  N: guarded_monotone_dependency_closure
  G: alternating_predecessor_fixed_point
  Q: observation_sensitive_value_and_provenance_quotients

exact_principles:
  observation_sensitive_projection_congruence: >
    A distinction may be forgotten only for an observation whose complete load-bearing
    dependency cone does not depend on that distinction.
  claim_relative_signature: >
    Sigma_O(X,x) is the typed E/P/R/C/N/terminal/provenance dependency cone needed to
    prove exact claim O about event x in context X. Isomorphic cones license reuse of
    the theorem for O only.
  state_boundary: >
    Claim-relative theorem equivalence never implies q equality, full successor
    equivalence, later strategy equivalence, or provenance equivalence.

