      - "center response serialization: prefix 45112, target C1"
      - "latent target response: prefix 466565554644373, target C3"
      - "latent target response: prefix 466565554644377, target G3"
    theorem: >
      EnabledLiveP0Singleton(x) AND SideToMove=P1 implies that P1 claiming x on the
      current turn discharges that singleton obligation, unless the move itself is
      already a P1 terminal win.
    result: >
      The historical center forced terminal block and the latent-target responses are
      one exact theorem class even though their complete successor states differ.
