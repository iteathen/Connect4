  - erase_unrelated_global_facts_rather_than_parameterize_over_them
  - increase_frontier_or_q_caps_to_hide_missing_mathematics
  - enumerate_the_physical_game_tree_and_call_it_structural_progress
  - infer_positive_win_from_P1_nonwin

