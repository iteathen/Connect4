  visibility_to_exact_logic: none
  promotion_membrane: >
    Only exact guarded theorem schemas and qualified signatures cross into proof logic;
    confidence and utility annotations are discarded.

constraints:
  - final_terminal_line_cardinality_is_output_only
  - no_known_center_win_as_proof_premise
  - exact_search_oracles_are_discovery_and_falsification_controls_only
  - preserve_exact_c4_0010_q_identity
  - claim_relative_equivalence_is_not_state_equivalence
  - every_claim_signature_must_include_all_load_bearing_CPC_NDC_resource_deadline_terminal_and_provenance_guards
  - nonincident_context_remains_live_opaque_context
  - bayesian_mask_is_external_to_exact_logic
  - unresolved_frontiers_are_unknown_not_negative_values
  - do_not_raise_q_state_caps_or_recursive_depth_without_a_new_theorem
  - every_experiment_has_a_hard_five_minute_wall_clock_cap

next_task:
  name: build_claim_relative_signature_library
  purpose: >
    Construct a generic proof-theorem interface TypedEventSignature(claim,context,event)
    over already-qualified evidence, derive claim dependency cones from explicit NDC-style
    premises, and canonicalize them to discover hidden cross-family theorem classes.
  seed_claims:
    - enabled_singleton_discharge
    - same_column_stutter_preserves_latent_contract
    - cross_support_pair_establishes_two_chain_stage
    - phase_defect_transport
    - size_two_response_capacity_circuit
    - universal_hinge_generates_two_latent_singletons
  required_operations:
    - DependencyCone_of_claim
    - Canonicalize_typed_cone
    - Verify_structure_preserving_renaming
    - Instantiate_theorem_with_opaque_nonincident_context
  bounded_steps:
    - use only retained exact theorem premises and fixed bounded controls
    - derive the smallest sufficient cone for each seed claim
    - attempt cross-family canonical grouping
    - for every rejected merge retain the smallest separating field
    - treat full q or q_plus_Pi0 as observations only when the claim actually requires them
    - stop if theorem signatures degenerate into one signature per physical state
  success_conditions:
    - at least two independently qualified cross-family theorem classes
    - a reusable schema whose soundness boundary explicitly states the observation or claim
    - smaller proof vocabulary without weakening exact game semantics
  stop_conditions:
    - physical q-tree reconstruction begins
    - WDL labels become proof premises
    - a claimed merge omits a load-bearing guard
    - wall_clock_reaches_5_minutes

forbidden_shortcuts:
  - cite_known_connect4_solution_as_the_proof
  - use_minimax_or_oracle_value_labels_as_certificate_facts
  - use_bayesian_credence_as_proof_authority
  - turn_claim_relative_isomorphism_into_q_state_equality
