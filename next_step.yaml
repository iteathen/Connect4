next_task:
  name: prove_temporal_contract_stutter_and_tail_composition
  purpose: >
    Extend the exact C3/G3 latent-target cross-pair contract only by proving which
    external response macros are true stutters and by representing the resource/parity
    effect released when one target is consumed. Do not solve the surrounding q tree.
  fixed_state: "466565554644"
  latent_contract:
    support_pair: [C1,G1]
    targets: [C3,G3]
  bounded_steps:
    - derive candidate off-target two-ply response macros from existing exact vertical/typed response contracts
    - classify a macro as stutter only if it preserves C/G support state live-target facts terminal safety CPC reservoir effect active deadlines and NDC guards
    - quotient macros only by the full temporal-contract observation, never by blocker coverage alone
    - after P1 consumes C3 or G3, explicitly account for the newly exposed upper tail C4-C6 or G4-G6
    - determine whether tail effects normalize to a small contract state, GF2/resource token, or response circuit
    - compose response-matroid checks only over obligations active at each automaton state
    - stop if the representation starts carrying one state per physical continuation
  success_conditions:
    - exact stutter/product theorem extending the latent scheduler across a nontrivial class of external P0 moves
    - and a compact exact representation of post-target tail release
    - or a smallest exact counterexample identifying which C/P/N invariant is still missing
  stop_conditions:
    - physical q-tree reconstruction begins
    - candidate requires solved W/D/L labels as proof premises
    - off-target context cannot be quotiented under the complete temporal observation
    - wall_clock_reaches_5_minutes

