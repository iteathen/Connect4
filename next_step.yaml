qualified_premises:
  - id: total_domain_geometric_count
    statement: >-
      For every positive W,H with K=4, let a=(W-3)_+ and b=(H-3)_+.
      The generated geometric winspace has exactly L(W,H)=H*a+W*b+2*a*b requirements.
      This is a counting proof over arbitrary integers, not an empirical fit.
  - id: total_domain_elementary_frontier
    statement: >-
      For every positive W,H, the qualified elementary Baseinverse/Claimeven construction leaves unresolved
      exactly the horizontal length-4 requirements on zero-based even rows y>=2. Their exact count is
      R1(W,H)=(W-3)_+*floor((H-1)/2). This is proved by residue/parity arguments over arbitrary integers.
  - id: universal_mate_response_lemma
    statement: >-
      If a legal disjoint mate-response matching hits every generated opponent winning requirement,
      the opponent cannot complete a requirement. If the same construction is available to either player,
      both players have no-loss strategies and the finite empty-board value is draw.
  - id: width_below_connect_draw
    statement: >-
      For every positive H and every 1<=W<4, generated requirements are vertical only (or empty),
      and every vertical length-4 interval contains an even-depth support-successor pair.
      Therefore every W<4 board is draw, by logic proof over arbitrary H.
  - id: one_row_draw
    statement: >-
      For every positive W with H=1, generated requirements are horizontal only (or empty),
      and every horizontal length-4 interval contains an adjacent initial-frontier response pair.
      Therefore every one-row board is draw, by logic proof over arbitrary W.
  - id: standard_common_Y
    statement: >-
      Standard 7x6 generated incidence has Y_cell=Y_line=28 and the qualified beta/gamma forms are perfect,
      defining a natural T:Y_line->Y_cell. No solved label or predefined 28 is used.

execution:
  cycle: assess -> research -> reassess -> plan -> execute -> qualify -> review -> cleanup/document
  proof_standard: >-
    Every claim quantified over unbounded W or H requires a symbolic derivation valid for arbitrary positive integers.
    A program may instantiate examples to catch mistakes, but no finite set of executions may be cited as proof of the quantified claim.
  primary_question: >-
    What generated algebraic/response objects extend the standard structural calculus to every positive W,H so that
    narrow boards collapse naturally and regular-board formulas emerge as the nondegenerate case?
  first_construction:
    - >-
      Derive exact degeneracy conditions from the definitions (empty direction classes, zero-rank quotients,
      collapsed residual spaces) instead of dimension-specific branches.
    - >-
      Lift the incidence/core definitions Y_cell and Y_line to arbitrary W,H by exact generated ranks.
      Seek symbolic rank formulas or logically proved regime decompositions; do not infer them from a board census.
    - >-
      Re-express CPC/phase/residual operators so constants are board-derived and every operator remains defined
      when a direction class or quotient collapses to zero.
    - >-
      Only after the total-domain structural objects are proved should the 7x6 equality Y_cell=Y_line=28 be recovered
      as a corollary and connected to the canonical terminal envelope.
  required_checks:
    - finite board sweeps are validation/falsification only
    - no interpolation from sampled board sizes
    - no solved WDL or distance labels as premises
    - no recursive minimax, Negamax, MCTS or PNS proof mechanism
    - no special-case small-board mode in production definitions
    - all zero/empty cases must arise from generated sets, positive parts, kernels, images or quotients
    - distinguish an exact quantified proof from an executable sanity control
  falsification:
    - any formula producing negative counts or dimensions on a valid board is not total-domain
    - any theorem whose proof says 'verified for W,H up to N' fails the all-board standard
    - any operator requiring a hand-written W<4/H<4 branch fails unless the branch is merely notation for an already-proved empty generated set
    - equal sampled values do not identify structures or prove a natural isomorphism
    - if a regular formula disagrees with the exact generated rank on a degeneracy, the generated rank is authoritative

success_criteria:
  - symbolic all-positive-W,H geometry theorem
  - logically proved degeneracy/collapse lemmas for narrow boards
  - total-domain definitions for the structural quotients/operators
  - exact proof of each claimed rank/count regime, not finite extrapolation
  - standard 7x6 28-core recovered as a corollary of the same definitions
  - durable research note and implementation controls clearly labeled validation-only
  - synchronized STATUS.md / next_step.yaml

