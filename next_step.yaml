next_task:
  name: derive_guarded_alternative_implication_and_choice_elimination
  purpose: >
    Reduce the remaining PreE/PreA strategic predecessor differential by proving
    implication or elimination relations between distinct exact quotient alternatives,
    without redefining state identity or enumerating the full game tree as proof.
  steps:
    - use C4-0010 q as the exact value-state substrate
    - add Pi0 whenever original terminal-line identity is observable
    - construct sibling-alternative certificate records with explicit interval, CPC, WSL, NDC, temporal-resource, deadline, and progress premises
    - derive P0 max-side and P1 min-side elimination rules only when interval endpoints are provably preserved
    - require well-founded structural progress for positive P0-win implications
    - treat paired-response as a qualified one-sided refinement primitive, not an equality relation
    - mechanically test every candidate rule on complete controls
    - preserve the smallest WDL, transition, or output counterexample for every rejected rule
    - persist any accepted theorem and its reproducer/evidence before broadening the candidate family
  success_conditions:
    - every accepted implication has an explicit semantic proof obligation
    - no accepted rule changes exact max/min predecessor value on complete controls
    - no output-sensitive rule changes exact provenance-normalized G where Pi0 is in scope
    - positive-win rules carry an explicit progress argument
    - rejected relations retain smallest counterexamples
    - no result depends on suspected final 7x6 output cardinality or retired scratch counts
  forbidden_shortcuts:
    - tune_toward_suspected_final_line_count
    - tune_toward_2023_419_1604
    - convert_interval_refinement_into_state_equality
    - infer_strategy_from_static_blocker_or_capacity_counts
    - erase_origin_line_provenance_for_output_semantics
    - use_exact_enumeration_as_the_mathematical_explanation

