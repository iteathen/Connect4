objective: >
  Continue the structural 7x6 proof by reusing local typed event transformers across
  distinct global contexts without weakening exact C4-0010 state identity. Build proof
  compression at the dependency-cone/action layer, not by inventing a coarser q state.

canonical_layers:
  E: causal_event_poset_and_support_ideals
  R: residual_winning_obligation_antichains
  P: CPC_GF2_parity_precedence_deadlines
  C: typed_temporal_policy_contracts_resources_and_compatibility
  N: guarded_monotone_dependency_closure
  G: alternating_predecessor_fixed_point
  Q: observation_sensitive_value_and_provenance_quotients

exact_principles:
  observation_sensitive_projection_congruence: >
    Erase a distinction only when it is congruent for every downstream transition and
    observation being claimed.
  typed_event_product: >
    One legal event simultaneously advances E support, toggles P phase/rank, applies
    the R monotone Boolean cofactor, advances active C temporal contracts, then emits
    consequences into guarded N closure.
  local_reuse_not_state_equality: >
    Matching dependency-cone event signatures license reuse of the local transformer
    under checked C/N guards; nonincident global context remains live and q identity is
    unchanged.

