qualified_premises:
  - id: retained_rank20_closure
    statement: >-
      The original retained 20 rank-20 latent-contract states close 20/20 by exact
      branch-complete predecessor witnesses and the repair induction.
  - id: repair_capacity_rank
    statement: >-
      mu=sum remaining capacities in A/B/D/E/F is a valid well-founded repair coordinate, but
      exact matched positive/negative controls prove that mu, root deadline set, GF2 phase and
      sorted repair-capacity shape are not sufficient proof-success or value classifiers.
  - id: resolved_tail_lexicographic_induction
    statement: >-
      The qualified support-distance-one theorem uses rho=(delta,mu), where delta is remaining
      capacity in the previously resolved C/G column and mu is repair capacity over A/B/D/E/F.
      Resolved-tail P0 actions decrease delta, repair actions decrease mu, and legal P1 replies
      are nonincreasing under exact terminal/live-target/deadline guards.
    qualification:
      full_clean_mu15_corpus: 160
      full_clean_mu15_proved: 160
      full_clean_mu15_failed: 0
      execution_only_structural_shards: 42
      maximum_proof_states_in_one_shard: 41893
