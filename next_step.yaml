qualified_premises:
  - id: target_free_incidence_dimensions
    statement: >-
      From GF(2), K=4, H=6, W=7, the standard geometry derives L=69, rank(B)=35,
      dim ker(B)=34, and the common excess 28 without 28 or 69 as primitive theorem inputs.
  - id: original_projection_falsifiers
    statement: >-
      Column parity restricted to im(B) has rank 4, not 7. Pure-horizontal-line parity by row
      restricted to ker(B) has rank 5, not 6.
  - id: corrected_middle_cores
    statement: >-
      Row-plus-column axis parity on im(B) has rank 7; vertical-line parity by column on ker(B)
      has rank 6. Their explicit kernels Y_cell and Y_line both have derived dimension 28.
  - id: symmetry_scope
    statement: >-
      Bare-incidence top-bottom reflection fixed dimensions differ (Y_cell 16, Y_line 14), so a
      B-only reflection-equivariant identification is falsified. This is not a Connect4-level
      falsifier because gravity/support order breaks top-bottom symmetry. Left-right fixed dimensions
      agree at 14 and remain a required naturality check.
  - id: residual_complex
    statement: >-
      The residual boundary satisfies partial_3*partial_4=0, partial_4 is injective, and
      J_3*partial_4=B. Degree-3 residual incidence has rank 42, falsifying naive W*(K-1)=21
      as an automatic residual-core dimension.
  - id: support_graded_perfect_pairing
    statement: >-
      g(S)=supportClosureSize(S)+componentCountAlongOriginalLine(S)+maxRow(S) mod 2 on
      S=line\\{cell} induces a left-right-equivariant perfect pairing of rank 28 between
      Y_cell and Y_line. Hence Y_line is naturally identified with Y_cell^* under this pairing.
    qualification:
      control: quotient-standard7x6-support-graded-middle-duality-control.mjs
      local_payload: proved:true
      commit: 6dd91db38392cef03e499b6e526eea9ba8dc4eaf
      github_actions_run: 34907472035
      github_actions_result: infrastructure_failure_before_checkout
  - id: no_free_self_duality
    statement: >-
      Ambient dot products restricted to Y_cell and Y_line each have rank 24, so the perfect pairing
      does not canonically identify either core with its own dual.
  - id: P_boundary
    statement: >-
      Same-column CPC two-ply stutter is zero displacement. Distinct-column phase deltas lie in the
      corrected length-4 column-interval boundary only for one-based pairs (1,5), (2,6), (3,7).
      Therefore generic P transport is not yet an action solely on the boundary quotient.
  - id: family_falsification
    statement: >-
      In the finite W=2K-1,H=2K-2 neighborhood K=2..8, only K=4 has equal image-over-width and
      kernel-over-height excess. K=2 is the smallest tested counterexample.

execution:
  cycle: assess -> research -> reassess -> plan -> execute -> qualify -> review -> cleanup/document
  primary_question: >-
    Is there a Connect4-defined nondegenerate self-pairing or direct map on Y_cell that composes with
    the qualified residual/support perfect pairing to produce a natural T:Y_line->Y_cell?
  candidate_order:
    - >-
      CPC/event-order forms derived from the exact zero-reservation event reservoir. A candidate must
      be defined on semantic cell/event structure before choosing any Y basis.
    - >-
      Residual-induced cell forms obtained from the qualified g(S) pairing and the graded residual
      boundary, provided their type and commuting relations are explicit.
    - >-
      Support-filtration or cycle/cocycle constructions that preserve gravity order and left-right
      reflection while making no top-bottom-symmetry assumption.
    - >-
      If all natural self-duality candidates remain degenerate, attempt an impossibility statement
      under an explicit naturality class rather than inventing an arbitrary complement.
  required_checks:
    - compute the restricted rank before claiming nondegeneracy
    - verify left-right reflection equivariance
    - do not require top-bottom reflection invariance
    - prove any claimed map lands in Y_cell and is injective/surjective there
    - if using the perfect pairing, distinguish Y_cell from Y_cell^*
    - test commutation with the residual boundary/cofactor construction where typed
    - keep P/CPC support-height phase distinct from arbitrary cell-incidence vectors
    - preserve the K=2..8 counterexamples when proposing a general theorem
  falsification:
    - a degenerate restricted form cannot define the desired self-duality
    - a basis-dependent Gaussian match is not canonical evidence
    - top-bottom reflection mismatch is not a valid Connect4-level rejection by itself
    - residual arity reduction alone does not imply 28->21
    - P acting on phase space does not imply an action on Y without an explicit intertwiner
  proof_boundaries:
    - unknown_is_not_loss
    - theorem_failure_is_not_opposite_game_outcome
    - resource_failure_is_not_logical_rejection
    - same_dimension_is_not_canonical_isomorphism
    - vector_space_split_is_not_natural_split
    - no_predefined_28_in_target_free_middle_theorem
    - no_predefined_69_in_strongest_target_free_control
    - connect4_residual_cofactor_is_not_connect3_incidence_without_map
    - candidate_specs_0006_0007_remain_candidate

success_criteria:
  direct_isomorphism_success:
    - define T from Connect4 incidence/support/residual/CPC structure before basis selection
    - prove T maps Y_line into Y_cell
    - prove rank(T|Y_line)=dim(Y_line)
    - verify left-right naturality and required commuting diagrams
    - persist a proved:true executable control and research note
  duality_terminal_success:
    - define an explicit naturality class for admissible direct intertwiners/self-pairings
    - prove or finitely exhaust that class sufficiently to justify why no canonical direct T follows
    - preserve Y_line ~= Y_cell^* as the strongest theorem rather than forcing self-identification

