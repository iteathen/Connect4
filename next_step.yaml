qualified_premises:
  - id: universal_structural_definitions
    statement: >-
      For generated Connect-4 geometry define B, the row+column axis quotient on im(B), the
      vertical-line phase quotient on ker(B), Y_cell, Y_line and Delta=dim(Y_line)-dim(Y_cell).
      These definitions remain valid on thin and degenerate boards even when closed forms do not.
  - id: regular_k4_closed_forms
    statement: >-
      In the regular K=4 regime the derived dimensions are L=4WH-9W-9H+18, rank(B)=WH-7,
      rank(Q_axis)=W+H-6, rank(Q_phase)=W-1, Y_cell=WH-W-H-1 and
      Y_line=3WH-10W-9H+26, with explicit 4x4 incidence and 4x5 phase degeneracies.
  - id: oriented_core_imbalance
    statement: >-
      Delta=(W-4)(2H-9)-9 and Delta(W,H)-Delta(H,W)=H-W. The cell core is transpose
      symmetric while the line core retains gravity orientation.
  - id: balanced_shape_classification
    statement: >-
      Delta=0 iff (W-4)(2H-9)=9 in the regular positive-integer regime, giving exactly
      5x9 with core 30, 7x6 with core 28, and 13x5 with core 46. Standard 7x6 is the only
      balanced shape with at most 42 cells.
  - id: board_family_cpc_parity
    statement: >-
      The residual event-rank parity is q_(W,H)(S)=(W-1)H+C(S)+r_max(S) mod 2. The standard
      shorthand C+r is valid only when the omitted board constant is even.
  - id: balance_not_sufficient
    statement: >-
      Reusing the existing CPC/residual forms on the three balanced boards gives beta/gamma ranks
      28/26 on 5x9, 28/28 on 7x6, and 42/34 on 13x5. Equal core dimensions do not generically
      imply a perfect natural pairing. No impossibility claim is made for alternative pairings.
  - id: standard_canonical_envelope
    statement: >-
      On 7x6 the target-free symmetry/P/maximal-delay construction generates the same 28-line
      geometry later observed externally. The missing semantic fact is still selection, not discovery
      of the number or line set.
  - id: player_specific_support_capacity
    statement: >-
      Board capacity and turn parity define a latest possible terminal horizon for each player and a
      gravity support envelope E_max=G(W,H)-G(W,H-q). This is capacity only, not an optimal-distance theorem.

execution:
  cycle: assess -> research -> reassess -> plan -> execute -> qualify -> review -> cleanup/document
  primary_question: >-
    What additional exact CPC/NDC/support invariant maps the board invariant vector to the selected
    terminal/control envelope without recursive child-value comparison?
  candidate_order:
    - >-
      Derive a player-relative control-capacity functional from residual requirements, blocker reach,
      CPC event rank and deadline order. It must be defined for Delta<0, Delta=0 and Delta>0.
    - >-
      Determine whether beta/gamma degeneracy identifies missing control degrees. Track radicals and
      cokernels rather than forcing a square isomorphism on unbalanced boards.
    - >-
      Generalize the standard nonrecursive extremal lemma: derive, from preterminal event counts and
      support depth, the maximum blocker/final-landing exclusion available to each player on arbitrary W,H.
    - >-
      Combine the support-capacity and pairing-defect invariants only after each is independently exact.
      Prefer a vector/quotient law over a fitted scalar count.
    - >-
      Use incoming varying-board exact censuses only to falsify or validate the derived law after the fact.

required_checks:
  - no solved WDL, optimal prefix, or terminal-distance premise in the strongest derivation
  - no predefined 28, 30, 69 or other target census count
  - no recursive minimax, Negamax, MCTS, PNS or hidden child-value enumeration
  - preserve thin-board and explicit degeneracy handling instead of extrapolating regular formulas
  - preserve gravity orientation; never assume W,H transpose equivalence
  - use q_(W,H) with the board constant in every cross-board residual calculation
  - distinguish dimension balance from perfect pairing
  - preserve smallest counterexample to every proposed scalar reduction
  - standard 7x6 must emerge as a consequence, not a special-case branch

falsification:
  - if two boards share the proposed invariant but require different structurally qualified envelopes, the invariant is insufficient
  - if two structural states share the compressed selector state but disagree on a required CPC/NDC deadline fact, the compression fails
  - if a proposed universal pairing becomes rank-deficient on any qualified board, retain the radical/cokernel rather than redefining it away
  - if the law needs an externally solved winner or terminal ply, it has not met the searchless target

success_criteria:
  - board-parameterized exact selector or quotient law with explicit assumptions
  - standard 7x6 produces the canonical 28 envelope without special-casing 28
  - unbalanced boards receive explicit residual/radical/defect semantics rather than a fake common-Y scalar
  - executable Node control covering representative regular, transpose, balanced and degenerate boards
  - incoming exact board evidence can be checked against the law without changing its definition
  - durable note plus synchronized STATUS.md and next_step.yaml

