temporal_contract_model:
  schema_fields:
    - states
    - initial_state
    - event_guards
    - required_actions
    - forbidden_actions
    - resource_claims
    - phase_effects
    - deadlines
    - consequences
    - NDC_guards
  relationship_to_response_matroid: >
    Temporal contracts own activation/deactivation and contingent deadlines. At any
    automaton state, active obligations project to the existing response-matroid
    matching/rank/circuit calculus. The matroid is a snapshot view, not a competing
    temporal semantics.
  compiled_shapes:
    - immediate_response_pair
    - Baseinverse_shaped_cross_support_pair
    - latent_singleton_watcher
    - Before_like_disjunctive_contract_candidate

