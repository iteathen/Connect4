next_task:
  name: build_generic_typed_event_signature
  purpose: >
    Implement one generic local proof object for legal events that derives their
    E/P/R/C/N dependency-cone signature, then use it to identify repeated operator
    classes across already-qualified certificate families. Do not use it as a q-state
    quotient.
  initial_families:
    - same_column_stutter_pair
    - latent_cross_support_pair
    - latent_target_response
    - phase_debt_repair
    - center_response_serialization_collision
  required_fields:
    - enabled_support_event_and_tail_type
    - support_rank_and_phase_delta
    - mover_and_opponent_residual_incidence
    - residual_cofactor_or_kill_effect
    - active_temporal_contract_prestate
    - triggered_required_or_forbidden_actions
    - resource_claims_and_sharing
    - active_deadlines_and_races
    - relevant_NDC_prerequisites_and_consequences
    - terminal_guard
    - provenance_guard_when_observable
  bounded_steps:
    - compile signatures only from existing exact facts and already-qualified controls
    - group events only under explicit structure-preserving renaming of every signature field
    - retain nonincident global facts as opaque context parameters
    - test theorem reuse on at least two formerly separate rule families
    - reject any candidate grouping that needs WDL labels or full physical-history identity
    - stop if signature derivation degenerates into one object per q state
  success_conditions:
    - one reusable TypedEventSignature schema covering multiple existing certificate families
    - at least one exact cross-family local-operator isomorphism
    - explicit counterexamples identifying which field separates any tempting false merges
  stop_conditions:
    - physical q-tree reconstruction begins
    - solved WDL labels become proof premises
    - no local signature smaller than full q context survives
    - wall_clock_reaches_5_minutes

