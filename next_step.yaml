routing_rules:
  - main_is_shared_accepted_substrate_not_a_solver_head
  - durable_lane_set_is_closed_without_explicit_owner_instruction
  - temporary_branches_must_name_an_owner_lane_and_retirement_condition
  - temporary_branch_commit_volume_never_promotes_it_to_authority
  - shared_domain_oracle_benchmark_and_cross_lane_contract_changes_route_to_main
  - all_research_routes_to_research_semantic_quotient
  - solver_branches_do_not_own_research
  - no_new_durable_focused_research_branches
  - minimax_search_policy_tt_scheduler_and_search_kernel_work_routes_to_minimax
  - bsfp_recurrence_cuda_profiles_symbolic_storage_and_bsfp_qualification_routes_to_cuda_bsfp
  - hybrid_confluence_transport_proof_exchange_and_hybrid_qualification_route_to_hybrid_confluence
  - isometric_structural_frontier_solver_implementation_routes_to_isometric
  - sut_solver_implementation_routes_to_sut
  - shared_facts_discovered_on_solver_heads_are_selectively_promoted_to_the_shared_owner
  - accepted_shared_changes_flow_from_main_into_solver_heads
  - solver_specific_implementation_does_not_move_to_main_for_history_synchronization

temporary_branch_policy:
  prefixes:
    - work/
    - experiment/
    - feature/
    - handoff_or_staging_refs
    - evidence_refs
  before_creation:
    - identify_durable_owner
    - define_bounded_question_or_change
    - define_acceptance_or_falsifier
    - define_retirement_condition
  before_retirement:
    - preserve_useful_code_or_result_in_owner
    - preserve_all_research_results_negative_results_hypotheses_evidence_and_open_questions_in_research_semantic_quotient
    - archive_exact_head_when_history_has_continuing_value
  prohibition:
    - no_new_durable_lane_without_owner_authorization_and_decision_record

main_role:
  shared:
    - components_domain
    - components_oracle
    - qualified_incumbent_reference_baseline
    - benchmark_and_fairness_authority
    - accepted_cross_lane_specs_and_decisions
    - repository_routing_and_provenance
  solver_specific_ownership:
    minimax: solver/minimax-alpha-beta
    bsfp: solver/cuda-bsfp
    hybrid_confluence: solver/hybrid-confluence
    isometric: solver/isometric
    sut: solver/sut

restructure:
  original_lane_decision: docs/decisions/2026-09-10-repository-lane-restructure.md
  three_solver_extension: docs/decisions/2026-09-11-main-shared-foundation-three-solver-heads.md
  closed_five_solver_topology: docs/decisions/2026-09-17-solver-namespace-normalization.md
  single_research_owner: docs/decisions/2026-09-17-single-research-owner.md
  historical_manifest: research/MIGRATION_MANIFEST.json
  historical_branch_retirement: research/BRANCH_RETIREMENT.md
  repository_structure: REPOSITORY_STRUCTURE.md
  historical_physical_cleanup: research/RETIREMENT_PROOFS.json

next_actions:
