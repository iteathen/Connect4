task:
  id: derive_post_center_strong_distance_selector
  objective: >-
    Continue from the searchless theorem that any P0 forced win on 7 x even-H must open center.
    Starting from P0 center, derive or falsify a nonrecursive deadline-valued CPC/NDC certificate showing
    why the longest-resistance P1 response is the same-column zero-phase response, and whether the same
    selection mechanism repeats through the natural preterminal rank 2K-3=5. Issue #41's best-move scores,
    five-center prefix and ply-41 result are validation only and forbidden as premises.

