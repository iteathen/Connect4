next_task:
  name: derive_center_positive_progress_certificate
  purpose: >
    Prove that P0 opening column 4 is winning by constructing a finite structural
    progress certificate whose rank decreases across every P1 alternative and whose
    terminal bases are immediate P0 wins.
  seed_state:
    board: standard_7x6_connect4
    p0_first_move: 4
    side_to_move: P1
  steps:
    - partition the seven legal P1 replies by exact reflection and any stronger q/certificate isomorphism
    - for each distinct P1 reply class, discover candidate P0 continuation certificates using exact search only as a falsifier/theorem-discovery oracle
    - express candidate progress obligations in CPC/WSL/NDC/response-resource terms over exact q
    - identify a well-founded rank such as unresolved obligation depth, event-frontier rank, or nested dependency measure
    - require every P1 choice to admit at least one legal P0 response with strictly lower rank
    - prove terminal base certificates as immediate P0 wins rather than exact-value lookups
    - mechanically falsify candidate implication/rank rules on complete smaller games and retained 7x6 controls
    - preserve smallest rank-cycle, missing-response, or resource-conflict counterexample
    - avoid turning the progress proof into a replay of the physical game tree; require quotient/certificate compression
    - once center win closes, combine it with noncenter safety to obtain a complete first-move/root solve proof
    - only then propagate W and Pi0 to the perfect-play terminal-line output layer
  success_conditions:
    - center certificate is finite and substantially smaller than the physical policy graph
    - every P1 reply class is covered
    - every nonterminal certificate transition decreases a proven well-founded rank
    - no exact solved center value is used as a proof premise
    - bounded falsification finds zero counterexamples
    - root P0Win follows from the certificate plus exact predecessor semantics
  forbidden_shortcuts:
    - cite_known_connect4_solution_as_the_proof
    - use_minimax_value_labels_as_certificate_facts
    - enumerate_physical_game_tree_and_call_it_structural_progress
    - infer_positive_win_from_P1_nonwin
    - erase_CPC_NDC_resource_or_deadline_context_when_load_bearing
    - merge_states_only_because_they_share_a_progress_hint

