qualified_premises:
  - id: standard_common_Y
    statement: >-
      Standard 7x6 generated incidence has Y_cell=Y_line=28 and the qualified beta/gamma forms are perfect,
      defining a natural T:Y_line->Y_cell. No solved label or predefined 28 is used.
  - id: board_family_invariants
    statement: >-
      In regular K=4 geometry, Y_cell=WH-W-H-1, Y_line=3WH-10W-9H+26 and
      Delta=(W-4)(2H-9)-9, with generated-rank definitions authoritative on narrow degeneracies.
      Cross-board CPC residual parity is q_(W,H)(S)=(W-1)H+C(S)+r_max(S) mod2.
  - id: phase_path_transport
    statement: >-
      C_phase is canonically the edge space of the width-W path. Each e_a+e_b has the unique interval lift
      between a,b and structural phase transport |a-b|. Same-column two-ply response has zero phase transport.
      No monotonic relation to game-theoretic strong distance is assumed yet.
  - id: canonical_28_bridge
    statement: >-
      On 7x6 the target-free symmetry/P/maximal-delay construction gives the oracle-matching 28-line envelope;
      natural preterminal rank is 5 and the five-high center stack uniquely maximizes maximal-delay exclusion 38-10=28.
      The remaining issue is semantic strong-distance selection.
  - id: elementary_response_frontier
    statement: >-
      For empty K=4 W x H, generic compatible Claimeven/Baseinverse programs certify all geometric P0 requirements
      except horizontal length-4 requirements on one-based odd rows >=3. Exact unresolved count is
      (W-3)*floor((H-1)/2). Standard 7x6 gives 61 certified / 8 unresolved.
  - id: center_opening_necessary
    statement: >-
      For every even H>=4 on width 7, every non-center P0 opening has an explicit P1 draw certificate built
      from Before, Baseinverse and Claimeven response programs. Therefore any P0 forced win must open center.
      This is constructive and searchless; it does not assume that the empty board is a P0 win.
  - id: compatibility_provenance
    statement: >-
      PR #39's base U1/Test-B file is a preserved v1 harness whose descriptor omitted claims. The v3 runner
      patches that seam and restores zero false negatives against the conservative Allis compatibility table.
      Do not use the v1 generic compatibility implementation as proof authority.
  - id: selector_shortcuts_falsified
    statement: >-
      Terminal-envelope cardinality, preterminal exclusion capacity, cooperative completion horizons,
      minimum blocker hitting sets, raw release unions, and simple same-support residual dominance are
      insufficient as universal strong-distance selectors.

execution:
  cycle: assess -> research -> reassess -> plan -> execute -> qualify -> review -> cleanup/document
  primary_question: >-
    After P0 opens center, what exact static/ranked response-support invariant makes P1's same-column response
    uniquely maximize certified survival horizon without comparing recursive child game values?
  first_construction:
    - >-
      Define a deadline-bearing response certificate with prerequisites, response resources, blocker consequence,
      support events discharged by the response, and earliest/latest rank horizon.
    - >-
      Compile elementary and Before-style response programs into that common certificate form. A response event
      must update both blocker coverage and gravity support prerequisites before the next closure step.
    - >-
      Compare the seven P1 replies after P0 center using only generated residual requirements, support precedence,
      corrected CPC parity, phase-path transport and exact response certificates. Derive a certified P0 completion
      upper bound or P1 survival lower bound; do not use child W/D/L or oracle distance.
    - >-
      If the zero-phase center reply is uniquely best under the exact bound, repeat the same proof at plies 2,3,4
      along the selected chain. If not, preserve the smallest reply/prefix counterexample and identify the missing
      certificate relation.
    - >-
      Only after the five-event chain is derived should the maximal-delay terminal boundary and canonical 28
      envelope be composed into the game-semantic theorem.
  required_checks:
    - no issue #41 best-move scores, forced prefix or terminal ply as premises
    - no solved WDL label required to prove center-opening necessity or post-center ranking
    - no recursive minimax, Negamax, MCTS or PNS proof mechanism
    - preserve board constant in CPC parity
    - preserve response/resource guards and deadlines
    - model response-support transfer explicitly
    - distinguish phase-path transport length from strong distance until proved
    - use conservative rule compatibility where generic extra combinations lack proof authority
    - complete small-board/state-tree data may be independent falsification oracle only
  falsification:
    - if two response certificates with equal compressed state yield different next deadline/support consequences, compression fails
    - if a blocker horizon does not beat the opponent completion horizon, it cannot eliminate that requirement
    - if a defender response helps the attacker by releasing support and the model ignores it, the model fails
    - if an off-center reply ties or beats center under the proposed exact static horizon, center selection is not proved by that invariant
    - if closure outcome depends on scheduling order, the profile is unsound
    - if proving reply ranking requires recursive child-value comparison, it fails the searchless objective

success_criteria:
  - exact deadline-valued response/support certificate semantics
  - searchless unique selection of P1 center after P0 center, or a durable minimal falsifier
  - if selected, repeated derivation through the natural five-event prefix without oracle premises
  - explicit statement whether resulting theorem establishes only prefix selection or also maximal delay / 28 terminal geometry
  - executable Node control and durable research note
  - synchronized STATUS.md / next_step.yaml

