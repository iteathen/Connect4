objective: >
  Reuse exact structural theorems across physically different Connect4 contexts by
  deriving only the dependency cone required by the claim being proved. Preserve full
  C4-0010 q identity for state semantics; proof compression belongs at the theorem layer.

canonical_layers:
  E: causal_event_poset_and_support_ideals
  R: residual_winning_obligation_antichains
  P: CPC_GF2_parity_precedence_deadlines
  C: typed_temporal_policy_contracts_resources_and_compatibility
  N: guarded_monotone_dependency_closure
  G: alternating_predecessor_fixed_point
  Q: observation_sensitive_value_and_provenance_quotients

unified_statement:
  event_product: >
    Every legal placement is one typed event with simultaneous E/R/P/C/N projections.
  claim_relative_signature: >
    Sigma_O(S,e) is the load-bearing typed dependency cone required to prove exact
    claim O about event e in context S. Isomorphic signatures license theorem reuse
    only for O; nonincident context remains live and q identity is unchanged.
  exact_value: "W = mu X . [ I union PreE(X) union PreA(X) ]"
  ordinary_value_identity: "q = support + normalized R0 + normalized R1"
  output_identity: "q + Pi0 when terminal-line provenance is observable"
  governing_projection_rule: >
    Erase a distinction only when it is a congruence for every downstream transition
    and the exact claim or observation being proved.
  completion_boundary: >
    This is not yet the solve. The center-opening positive proof still must close
    structurally inside W; terminal-line provenance is the second-stage output.

