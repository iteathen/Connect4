    branch: main
    purpose: accepted_domain_specs_oracles_benchmarks_cross_lane_contracts_and_repository_dashboard
    solver_head: false
  shared_research:
    branch: research/semantic-quotient
    purpose: all_connect4_research_claims_derivations_hypotheses_experiments_results_evidence_negative_results_open_questions_synthesis_and_provenance
    solver_head: false
  minimax:
    branch: solver/minimax-alpha-beta
    solver_head: true
  cuda_bsfp:
    branch: solver/cuda-bsfp
    solver_head: true
  hybrid_confluence:
    branch: solver/hybrid-confluence
    solver_head: true
  isometric:
    branch: solver/isometric
    solver_head: true
  sut:
    branch: solver/sut
    solver_head: true
