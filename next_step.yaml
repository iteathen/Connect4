next_task:
  name: formalize_two_latent_singleton_temporal_scheduler
  purpose: >
    Determine whether the simultaneous latent targets C3 and G3 can be defended by one
    finite exact P1 schedule over their support chains and a bounded class of off-column
    phase-shift resources, or whether every admissible schedule contains a finite
    parity/resource/deadline obstruction. Do not solve the surrounding q state tree.
  fixed_state: "466565554644"
  target_contracts:
    C3:
      chain: [C1,C2,C3]
      old_poisoned_response: "C1->C2"
    G3:
      chain: [G1,G2,G3]
      old_poisoned_response: "G1->G2"
  required_contract_fields:
    - support_prerequisite
    - global_rank_or_turn_parity
    - trigger_event
    - forbidden_immediate_response
    - allowed_skip_or_phase_shift_resource_class
    - target_response
    - resource_sharing_or_exclusivity
    - phase_displacement
    - deadline
    - terminal_consequence
    - NDC_guards
  bounded_steps:
    - represent only the two target support chains and the smallest equivalence classes of off-column events needed to shift parity
    - quotient off-column events only when their C/P/N effects are proved identical for both target contracts
    - derive exact scheduler transitions symbolically; do not recurse the physical q frontier
    - check whether one schedule can satisfy both target contracts for every P0 support-advancement choice
    - if infeasible, extract the smallest response-capacity, GF2, order or deadline circuit
    - if feasible, compile the schedule as a typed C/N certificate and determine which bottom/row5 fragments remain compatible
    - stop immediately if the scheduler starts reconstructing arbitrary board histories
  success_conditions:
    - exact finite scheduler certificate for both latent targets
    - or exact finite obstruction covering every admissible target-defense schedule
    - result is expressed in canonical E/P/C/N predicates and yields a sound G bound or predecessor implication
  stop_conditions:
    - representation degenerates to one state per physical continuation
    - proof requires solved W/D/L labels as premises
    - off-column context cannot be quotiented without carrying the full board state
    - wall_clock_reaches_5_minutes

