task:
  id: derive_k4_board_parameterized_selection_law
  objective: >-
    Generalize the searchless standard 7x6 derivation into a board-parameterized K=4 selection law.
    Treat 28 as an output, never a reusable primitive. Starting only from W,H,K=4, turn parity,
    generated geometry and Candidate CPC/NDC/support semantics, derive the invariant that selects or
    characterizes the relevant terminal/control envelope on each board without recursive child-value
    solving. The law must reproduce standard 7x6 as the zero-core-imbalance, perfect-pairing case.

