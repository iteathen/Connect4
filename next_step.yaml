qualified_premises:
  - id: retained_rank20_closure
    statement: >-
      The original retained 20 rank-20 latent-contract states close 20/20 by exact
      branch-complete predecessor witnesses and the well-founded repair-capacity induction.
  - id: repair_capacity_rank
    statement: >-
      mu=sum remaining capacities in A,B,D,E,F is a valid well-founded rank inside the
      qualified repair subsystem: selected P0 repair actions decrease mu by one and P1 replies
      never increase it. Mu is not by itself a winning classifier.
  - id: resolved_column_forced_defense
    statement: >-
      In the exact twelve target-block survivor states, the enabled P1 singleton at C4/G4 is a
      one-turn deadline: every nonblocking nonterminal P0 action permits an immediate P1 win.
  - id: rank20_gap_census
    statement: >-
      The exact post-block/rank-20 diagnostic census contains 362 unique unclosed states and 55
      coarse obstruction classes. The dominant obstruction is an uncertified child that remains
      inside the live-target/support-distance-one invariant rather than target loss.
    qualification:
      unique_gap_states: 362
      coarse_obstruction_classes: 55
      states_with_clean_invariant_uncertified_child: 342
      states_with_deadline_bearing_uncertified_child: 233
      states_with_P1_terminal_exposure: 29
      states_with_target_killed_child: 0
      no_root_deadline_states: 275
      no_root_deadline_with_clean_invariant_child: 275
  - id: representative_direct_probes
    statement: >-
      Five dominant clean-gap representatives were run directly through the existing recursive
      repair induction in isolated bounded controls: all five completed, two proved and three
      failed logically, with zero resource failures. Therefore certificate coverage alone is
      not the whole gap and a missing structural premise remains.
    qualification:
      attempted: 5
      completed: 5
      proved: 2
      logical_failures: 3
      resource_failures: 0

execution:
  cycle: assess -> research -> reassess -> plan -> execute -> qualify -> review -> cleanup/document
  matched_pair_test:
    - reconstruct exact candidate states from replayable sequences
    - directly evaluate proof outcome with the existing repair-capacity proof engine
    - prefer pairs equal on target, mu, root deadline set, phase and coarse support shape
    - relax matching dimensions only explicitly and report the relaxed tier
  action_conditioned_observations:
    - selected landing/support-tail facts
    - exact P0/P1 residual incidence and cofactors at the selected action cell
    - immediate P1 terminal-response alternatives
    - enabled P1 singleton/deadline topology after the selected action and replies
    - child repair-action availability under exact terminal and live-target guards
    - CPC/GF2 phase location where it is load-bearing
  candidate_rule:
    - derive candidate predicates from positive/negative differences
    - rank candidates by discrimination over directly evaluated examples
    - do not promote a candidate that merely memorizes physical state, sequence or q identity
    - falsify surviving candidates against the retained exact corpus before theorem promotion
  forbidden_shortcuts:
    - solved_WDL_or_external_solver_as_premise
    - unknown_as_loss
    - proof_failure_as_loss
    - physical_state_or_sequence_as_separator
    - q_equality_from_claim_relative_signature
    - mu_as_value_classifier
    - phase_weight_as_value_classifier
    - unproved_69_to_28_geometric_line_reduction
    - storage_or_recursion_cap_increase_without_structural_reason
  wall_clock_limit_seconds: 300
  inner_timeout_seconds: 270

success_criteria:
  - at least one exact matched proved/unproved pair is obtained under a stated matching tier
  - action-conditioned differences are emitted without erasing terminal/deadline/residual facts
  - candidate predicates are scored on more than the pair that generated them
  - every surviving candidate has explicit counterexample accounting or exact corpus coverage
  - no candidate is promoted to theorem solely from correlation
  - focused CI is bounded and reproducible
  - STATUS.md and research evidence are updated with the result and remaining seam

on_success:
  next: >-
    Turn the smallest surviving separator into an explicit guarded predecessor theorem candidate
    and test whether adding that premise closes the dominant clean-invariant obstruction classes
    and then the latent target scheduler composition.

on_failure:
  next: >-
    Preserve the closest matched positive/negative states and the first action-conditioned field
    still insufficient to separate them. Expand only the exact dependency cone implicated by
    that falsifier, not the physical frontier or proof-state cap.
