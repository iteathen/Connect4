bayesian_research_mask:
  role: research_priority_only
  visibility_to_exact_logic: none
  anti_double_counting_rule: >
    Isomorphic, dual or specialization views inside one canonical class are correlated
    evidence. Do not multiply or sum their support as if they were independent hypotheses.
  evidence_clusters: [E, R, P, C, N, G, Q]
  uncertainty_is_concentrated_on_bridges:
    - "R + P + C -> compact exact safety certificate"
    - "C + N -> reusable typed implication/composition"
    - "N + G -> complete positive progress proof without exact-q state explosion"
    - "E trace normalization -> material pre-enumeration proof compression"
    - "finite restriction of paving -> exact boundary-defect theorem"
  promotion_membrane: >
    A candidate enters exact logic only after exact proof with explicit guards. Bayesian
    probability, confidence, utility and test rank are discarded on promotion.

