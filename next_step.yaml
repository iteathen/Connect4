task:
  id: derive_action_conditioned_clean_invariant_separator
  objective: >-
    Derive and qualify the smallest tested action-conditioned structural predicate that
    separates directly proved from directly unproved clean live-target repair states. Use
    matched positive/negative examples under the same target, repair-capacity rank and as much
    shared support/phase/deadline context as the exact corpus permits. Treat candidate
    separators as hypotheses until falsified against the retained exact corpus.

