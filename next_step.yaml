qualified_premises:
  - id: natural_common_Y
    statement: >-
      Corrected Y_cell and Y_line are 28-dimensional and are naturally isomorphic by the explicit map
      T defined through beta_flat o T = gamma_flat, where gamma is CPC-event-parity-weighted residual
      cofactor pairing and beta combines that parity with residual connectedness.
  - id: natural_splittings
    statement: >-
      im(B)=Y_cell direct-sum C_axis with an explicit bottom-horizontal/center-vertical section, and
      ker(B)=Y_line direct-sum C_phase with six explicit center-star dependency-cycle lifts.
  - id: typed_P
    statement: >-
      The CPC two-ply displacement e_a+e_b lies exactly in Even(F2^7), the line-side 6D quotient.
      Same-column stutter is zero; distinct-column transport changes only the lifted boundary coordinate
      in the structural representation. Do not reinterpret phase vectors as arbitrary cell vectors.
  - id: first_formal_residual_core
    statement: >-
      In D(Y_line), pi_3(S)=topColumns(S) XOR q(S)*supportPhase(S) has rank 7, leaving a natural
      21-dimensional first formal residual core. D itself remains injective on Y.
  - id: sequential_ladder_falsifier
    statement: >-
      Repeating the same fragment-only frontier in marked form does not yield 21->14->7. Formal marked
      ranks are 7,0,0 (cores 21,21,21). Support-ordered marked ranks are 6,7,0 (cores 22,15,15).
      Therefore further descent requires additional history/support semantics.
  - id: aggregate_boundary_boundary
    statement: >-
      partial_3*partial_4=0. The aggregate GF(2) residual boundary is homological and cannot by itself
      represent ordered sequential cofactors.
  - id: family_falsification
    statement: >-
      The equal 28-style middle-dimension condition is special in finite W=2K-1,H=2K-2 tests; K=2 is
      the smallest counterexample and only K=4 succeeds through K=8.

execution:
  cycle: assess -> research -> reassess -> plan -> execute -> qualify -> review -> cleanup/document
  primary_question: >-
    What is the smallest exact marked residual state that transports consumed-event support/CPC history
    sufficiently for sequential cofactor descent without reconstructing a colored-board move tree?
  candidate_order:
    - >-
      Carry an explicit history phase/reservoir vector equal to the GF(2) column contribution of consumed
      events, typed through the already-qualified Even(F2^7) P quotient.
    - >-
      Carry the minimal support-height lower envelope required by consumed residual events, distinguishing
      formal algebraic cofactor order from gravity-realizable event order.
    - >-
      Re-derive the CPC event-count parity of each later residual target from current marked support plus
      history; do not reuse the empty/minimal-fragment q formula when prior events materially changed the reservoir.
    - >-
      Only after the marked state is exact, recompute quotient ranks at residual degrees 2 and 1. Treat 14
      and 7 as hypotheses/falsifiers, never targets to force.
  required_checks:
    - compare formal marked and support-legal marked categories explicitly
    - preserve first formal Y_3 as evidence without calling it a legal-play state space
    - prove any history compression preserves CPC parity/event order for all marked transitions in scope
    - verify left-right reflection naturality
    - preserve the typed P quotient and beta_flat o T = gamma_flat identities
    - no solved WDL labels as premises
    - no arbitrary basis matching or complement advertised as canonical
  falsification:
    - if two marked histories with the same proposed compressed state produce different next CPC/frontier facts, the compression fails
    - if a claimed degree-r quotient rank depends on an illegal deletion order, do not promote it to legal sequential R
    - if the next core is not 14 or 7, preserve the counterexample rather than widening/redefining the quotient to hit the arithmetic

success_criteria:
