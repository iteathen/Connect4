qualified_premises:
  - id: total_domain_static_core
    statement: >-
      For a=(W-3)_+, b=(H-3)_+, p=min(W,3), q=min(H,3), d=min(2,ab):
      L=Ha+Wb+2ab; rank(B)=WH-pq+d; ker(B)=3ab-d; rank(Q_axis)=a+b;
      rank(Q_phase)=min(a,ab)+min(2,ab,a+floor((b-1)_+/2));
      Y_cell=rank(B)-rank(Q_axis); Y_line=ker(B)-rank(Q_phase).
  - id: thin_board_draw
    statement: >-
      For every positive W,H, min(W,H)<4 implies empty-board draw by quantified legal mate-response proof.
  - id: absolute_cpc_owner
    statement: >-
      With owner bit 0=first player and 1=second player, the zero-reservation absolute owner of target (c,r)
      is q0=((W-1)H+r) mod2. A certified prior-event parity correction rho gives q=kappa+r+rho.
  - id: control_potential_derivatives
    statement: >-
      Horizontal disagreement is delta_x rho; vertical disagreement is 1+delta_y rho; seam transport is
      mixed-difference commutation. Every geometric Connect-4 terminal line is three consecutive zero
      disagreement edges in its direction.
  - id: gravity_normal_form
    statement: >-
      One ownership anchor + bottom horizontal disagreement word + one vertical seam mask per row boundary is
      a lossless WH-bit coordinate system. Pure-followup neutral pairs only decrement integer pair-depth counters.
  - id: anchored_zero_edge_target
    statement: >-
      A four-line path is invertibly represented by one owner anchor and three path disagreement edges.
      Player-p terminal target is anchor=p and edge word 000.
  - id: blocker_clause_form
    statement: >-
      Against player p, x_v=q(v)+p. A certified blocker B is the positive clause OR_(v in B)x_v=1.
      It blocks residual R exactly when B subset_of R. Pair blocker is not XOR unless split ownership is
      independently certified.
  - id: safe_affine_seam_cube
    statement: >-
      Around any one-move safe setup column c, e_c + span{e_j : parity(j)!=parity(c)} is entirely
      pure-followup-safe. At most one seam in each free coordinate may occur at arbitrary heights without
      introducing a geometric Connect-4.
  - id: standard_static_corollary
    statement: >-
      Standard 7x6 has L=69, rankB=35, kerB=34, Q_axis=7, Q_phase=6, Y_cell=Y_line=28.

outcome_encoding:
  bits: "[sign_player, win]"
  canonical:
    "00": draw
    "01": first_player_win_plus_one
    "11": second_player_win_minus_one
    "10": reserved_noncanonical
  note: >-
    This is a projection of the ownership-lift/domain-wall representation, not an independent proof primitive.

execution:
  cycle: assess -> research -> reassess -> plan -> execute -> qualify -> review -> cleanup/document
  proof_standard: >-
    Any unbounded board-family claim requires symbolic proof. Finite solved tables, constrained strategy solves,
    board sweeps and oracle data may falsify or guide discovery only.
  primary_question: >-
    Can exact W/D/L be obtained as the least fixed point of guarded affine ownership facts and monotone blocker
    clauses over anchored zero-edge win targets, with support and completion-before-deadline semantics carried
    explicitly, so that the decisive player bit is an ownership lift rather than a separately fitted sign?
  first_construction:
    - >-
      Classify every currently consumed strategic certificate consequence as one of:
      exact affine fact; monotone blocker clause; guarded composition of affine/clause with deadline;
      or genuinely missing relation.
    - >-
      Define the canonical closure state with one owner/control-potential system, blocker-clause antichains,
      residual zero-edge targets, support/accessibility, resource reservations and temporal ranks.
    - >-
      Derive exact propagation rules: affine closure; affine substitution into clauses; unit forcing;
      clause discharge; blocker upward closure; residual elimination; CPC potential updates; deadline validation.
    - >-
      Prove monotonicity/well-foundedness of the selected information order and identify which feedback cycles
      require a least fixed point rather than an acyclic DAG.
    - >-
      Apply the closure first to already-proved infinite families (thin boards, width-7 noncenter draw certificates)
      and then to the standard 7x6 center seam without using solved W/D/L as a premise.
    - >-
      Only after the closure is exact, seek a board-family closed selector for the win bit and player/sign lift.
  required_checks:
    - pair blocker must not be silently promoted to XOR
    - eventual ownership must not replace ownership-before-deadline
    - pure-followup/domain-wall safety is defensive substrate, not a signed value theorem
    - finite outcome interpolation is never proof
    - outcome player/sign bit is derived from an exact terminal ownership lift
    - draw is canonical 00 and does not require an arbitrary player bit
    - preserve first-win stopping semantics
  falsification:
    - a rule instance needs a consequence not expressible as affine fact, monotone clause or guarded temporal composition
    - affine/clause propagation derives a stronger fact after its deadline rather than before it
    - two merged states with equal parity/clause sets have different support/resource obligations relevant to future proof
    - a candidate signed selector disagrees with an independently solved board (validation only)
    - standard 7x6 requires inserting the known +1 label or 28 as a premise

success_criteria:
  - complete consequence-shape classification of currently used strategic rules
  - exact guarded affine-clause NDC closure with explicit information order and deadline semantics
  - no duplicated CPC/phase/player-color representation where one potential suffices
  - standard 7x6 terminal proof returns canonical 01 without solved-label premise
  - thin-board theorem returns canonical 00 from the same value semantics
  - second-player-winning controls, when used, are validation only until independently derived
  - structural magnitude remains distinct from win/draw sign until a natural coupling is proved
  - synchronized STATUS.md / next_step.yaml and durable theorem notes

validation_only:
  - published finite W/D/L tables
  - standard 7x6 strong-distance/oracle data
  - constrained pure-followup solves
  - finite generated-rank/barcode controls
  - varying-board censuses

