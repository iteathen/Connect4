    - resource_footprint
    - response_relation
    - sharing_policy
    - CPC_or_parity_commitments
    - event_order_and_deadlines
    - guards
    - progress_consequence
  bounded_steps:
    - compile fragments directly from WSL residuals, support and CPC/NDC facts; no legal-move tree recursion
    - remove dominated fragments only under the proved semantic dominance order
    - propagate forced-fragment and requirement-subsumption rules
    - split independent coverage/conflict components
    - apply parity/order/resource contradictions
    - report residual uncovered core and feasible-preservation antichains
    - compare the three closing siblings with 46656555 at the typed-contract level
    - if a common finite policy skeleton emerges, freeze it and prove its safety plus controlled-completion progress theorem
