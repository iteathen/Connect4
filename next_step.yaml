objective: >
  Derive a complete structural solve proof and then the exact perfect-W/D/L P0
  terminal-line set. The ontology search is now narrowed: use the resolved canonical
  structures rather than treating each literature formalism as a separate logic.

canonical_exact_layers:
  E_causal_event_substrate: >
    Future gravity events form seven disjoint vertical chains. Legal supports are
    order ideals in their finite distributive ideal lattice; legal histories are
    parity-colored linearizations, with only proved-independent interleavings quotiented.
  R_residual_obligations: >
    WSL minimal residual requirement antichains are the canonical winning-obligation
    object. Sperner-hypergraph and monotone-DNF views are representation-equivalent;
    blocker/transversal families are derived duals whose strategic realizability still
    requires P/C/N guards.
  P_parity_temporal_constraints: >
    CPC owns event-rank parity, GF(2) ownership/split facts, response precedence and
    deadline-sensitive control. Allis even-release Zugzwang parity is the same mod-2 invariant.
  C_typed_policy_resources: >
    One typed fragment/contract object owns coverage, prerequisites, resource footprint,
    response relation, sharing, parity commitments, event order, guards, deadlines and
    progress consequence. Named rules, gain-cost-rest, matching/Hall, dangers/forks,
    paving and compatible-cover SAT are generators, projections, special cases or
    implementations rather than separate semantic owners.
  N_guarded_dependency_closure: >
    NDC is a guarded monotone directed-hypergraph implication system. Multiple premise
    hyperedges with one consequence are disjunctive/alternative enabling and share the
    same consequent rather than requiring a branch matrix.
  G_alternating_strategic_proof: >
    W = mu X.[I union PreE(X) union PreA(X)]. E/A grammars, AND/OR proof DAGs and
    alternating monotone circuits are presentations of the same predecessor semantics.
    Safety plus well-founded progress are certificate obligations, not separate game semantics.
  Q_observation_quotient: >
    q is the accepted ordinary-transition/value quotient. q+Pi0 is the required output
    refinement when terminal winning-line provenance is observable. Proof compression
    does not automatically imply a coarser state quotient.

