qualified_premises:
  - id: corrected_middle_cores
    statement: >-
      Y_cell=ker((row+column parity)|im(B)) and Y_line=ker(vertical-line parity|ker(B)) are explicit
      28-dimensional GF(2) spaces derived from standard geometry. The original column-only and
      horizontal-row-only projections have ranks 4 and 5 and remain falsified.
  - id: residual_complex
    statement: >-
      partial_4 is injective, partial_3*partial_4=0, and J_3*partial_4=B. Raw degree-3 residual incidence
      has rank 42, so residual arity alone does not establish 28->21.
  - id: cpc_residual_event_parity
    statement: >-
      For degree-3 residual S, q(S)=supportClosureSize(S)+maxRow(S) mod2 equals zero-reservation CPC
      event-count parity N(t) mod2 at any highest residual event after the rest of the minimal support
      closure. q is event-rank parity, not the owner bit N(t)-1.
  - id: nondegenerate_line_self_pairing
    statement: >-
      gamma(y,z)=(partial_4 y)^T diag(q)(partial_4 z) has rank 28 on Y_line. Weighting by q XOR 1 has rank 16.
  - id: nondegenerate_cross_pairing
    statement: >-
      beta(c,l) uses incident-cell weight q(l\\{c}) XOR connected(l\\{c}). On the corrected cores,
      q alone has rank 20, connectedness alone rank 16, and the combined pairing rank 28.
  - id: natural_direct_isomorphism
    statement: >-
      T is defined without a basis by beta(Ty,z)=gamma(y,z) for every z in Y_line, equivalently
      beta_flat o T = gamma_flat. The exact control proves rank(T)=28, T(Y_line)=Y_cell,
      left-right equivariance, and invariance under independent changes of the arbitrary execution bases.
    qualification:
      control: quotient-standard7x6-cpc-residual-middle-isomorph-control.mjs
      local_payload: proved:true
      commit: 5a7ded1666cf55e701c5b22f828cf69f0e89f643
      github_actions_run: 34908549249
      github_actions_result: infrastructure_failure_before_checkout
  - id: symmetry_scope
    statement: >-
      Left-right reflection is preserved. Top-bottom symmetry is intentionally not required because gravity/support
      order is theorem data; the bare-incidence top-bottom fixed-space mismatch is not a Connect4-level falsifier.
  - id: P_boundary
    statement: >-
      Same-column two-ply phase stutter is zero. A generic distinct-column phase delta e_a+e_b is not automatically
      a cell-incidence vector or an action solely on the corrected boundary quotient. Keep CPC phase space typed.
  - id: family_falsification
    statement: >-
      In finite W=2K-1,H=2K-2 tests K=2..8, only K=4 has equal image-over-width and kernel-over-height excess;
      K=2 is the smallest counterexample.

execution:
  cycle: assess -> research -> reassess -> plan -> execute -> qualify -> review -> cleanup/document
  order:
    - id: natural_boundary_sections
      question: >-
        Do the corrected exact sequences admit Connect4-defined sections? Construct explicit sections only from
        interval/support/incidence structure. If no natural section emerges, preserve the exact sequences without
        rewriting ordinary vector-space splitting as canonical.
      cell_sequence: 0 -> Y_cell -> im(B) -> Q_axis -> 0
      line_sequence: 0 -> Y_line -> ker(B) -> Even(F2^W) -> 0
    - id: typed_P_transport
      question: >-
        Define the actual typed relationship between CPC phase space and the corrected quotient/core decomposition.
        Test same-column stutter and every distinct-column pair through an explicit map; do not add phase vectors
        directly to arbitrary cell-incidence vectors.
    - id: residual_degree_descent
      question: >-
        Push partial_4 through the identified common Y using the CPC/support quotient. Determine whether a genuine
        degree-3 core of dimension W*(K-1)=21 appears only after the correct quotient, or preserve the smallest
        counterexample if it does not.
    - id: generalization
      question: >-
        Re-test the complete construction, not just dimensions, on nearby parameter values where typing permits it.
        Preserve K=2 as the smallest current middle-dimension counterexample.
  required_checks:
    - every claimed section has an explicit right-inverse identity
    - every induced core action has an explicit domain/codomain and rank
    - preserve beta_flat o T = gamma_flat as the commuting identity for the middle object
    - verify left-right naturality for newly claimed structural maps
    - do not require top-bottom reflection invariance
    - keep event-rank parity distinct from eventual-owner parity
    - do not infer 28->21 from residual arity alone
    - do not use solved WDL labels as structural premises
  proof_boundaries:
    - unknown_is_not_loss
    - theorem_failure_is_not_opposite_game_outcome
    - resource_failure_is_not_logical_rejection
    - vector_space_split_is_not_natural_split
    - phase_space_is_not_cell_space_without_map
    - no_predefined_28_in_target_free_middle_theorem
    - no_predefined_69_in_strongest_target_free_control
    - connect4_residual_cofactor_is_not_connect3_incidence_without_map
    - candidate_specs_0006_0007_remain_candidate

