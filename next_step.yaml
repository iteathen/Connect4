next_task:
  name: test_N_entailment_prime_proof_normalization_on_4665655_siblings
  purpose: >
    Determine whether the failed exact-q proof-term antichain becomes compressive when
    the same G monotone-DNF terms are normalized under exact NDC entailment over typed
    R/P/C facts rather than literal child identity.
  fixed_input:
    - completed_one_step_sibling_census
    - existing_C4_0010_residual_transitions
    - existing_CPC_parity_and_deadline_facts
    - existing_typed_response_contracts
    - existing_NDC_implications
  bounded_steps:
    - do not descend beyond the already generated one-step hard children
    - compile each hard child into a finite typed fact set over R/P/C/N
    - compute only the finite exact N-closure needed by those fact sets
    - define "A entails_N B" only when B is contained in the exact guarded closure of A under identical parent observation/horizon
    - normalize each parent G term family to prime terms under exact entailment
    - compare prime-boundary size and invariant signatures between the three closing controls and 46656555
    - record which invariant first creates separation: master-rank/deadline, parity circuit, response circuit, closure generator, or progress consequence
    - use the twelve exact-q confluence points as positive checks that irrelevant interleavings do not alter closure
    - stop if closure requires one opaque fact per q state or reconstructs physical move-tree recursion
  success_conditions:
    - at least one G term is removed or merged by a proved typed entailment unavailable to literal q-ID subset order
    - or a precise falsifier shows N-entailment remains non-compressive at this boundary
    - any separation is stated in canonical R/P/C/N invariants, not rule names or q IDs
    - all guards/resources/deadlines/horizons remain explicit
  stop_conditions:
    - representation degenerates to exact-q identity
    - analysis reconstructs physical move-tree branching
    - candidate requires solved W/D/L labels as proof premises
    - wall_clock_reaches_5_minutes

