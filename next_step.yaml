qualified_premises:
  - id: total_domain_incidence_rank
    statement: >-
      For a=(W-3)_+, b=(H-3)_+, p=min(W,3), q=min(H,3), d=min(2,ab),
      rank(B)=WH-pq+d and dim ker(B)=3ab-d for every positive W,H.
  - id: total_domain_axis_core
    statement: >-
      rank(Q_axis)=a+b and Y_cell=WH-pq+d-a-b for every positive W,H.
  - id: total_domain_phase_core
    statement: >-
      rank(Q_phase)=min(a,ab)+min(2,ab,a+floor((b-1)_+/2)); Y_line is ker(B) minus that rank.
  - id: derivative_geometry
    statement: >-
      Every Connect-4 line is a translated third derivative partial_d^3 over F2.
      Diagonal third derivatives are derived from X=partial_x,Y=partial_y:
      partial_+^3=XY^2+X^2Y and partial_-^3=XY^2+X^2Y+X^2Y^2.
  - id: response_pair_shape
    statement: >-
      A two-cell mate-response pair is a first-derivative incidence partial_d; legality and timing remain
      governed by support/resource/deadline semantics.
  - id: total_domain_geometry_and_response_basics
    statement: >-
      L(W,H)=H(W-3)_+ + W(H-3)_+ + 2(W-3)_+(H-3)_+;
      W<4 boards are draws by support response; H=1 boards are draws by frontier response;
      R1(W,H)=(W-3)_+ floor((H-1)/2).
  - id: standard_corollary
    statement: >-
      Standard 7x6 gives L=69, rankB=35, kerB=34, Q_axis=7, Q_phase=6,
      Y_cell=Y_line=28 from the same total-domain formulas.

execution:
  cycle: assess -> research -> reassess -> plan -> execute -> qualify -> review -> cleanup/document
  proof_standard: >-
    Any unbounded board-family claim requires symbolic proof. Finite runs and solved outcome tables may
    falsify or guide discovery only; they are not theorem evidence.
  primary_question: >-
    Can every load-bearing strategic response/control relation be expressed as a composition of
    first/mixed derivative boundaries plus gravity support, GF(2) event-rank parity, resource guards and deadlines?
  first_construction:
    - >-
      Re-express Claimeven, Baseinverse, Vertical, Lowinverse, Highinverse and Baseclaim consequences
      as path-boundary / first-derivative response resources where exact.
    - >-
      Re-express Before, Aftereven and Specialbefore as compositions of the same response resources
      with support precedence and completion-before-deadline guards.
    - >-
      If a valid known rule cannot be represented without adding a new primitive, isolate the smallest
      missing relation and test whether it is a derived axiom of the existing event/support algebra.
    - >-
      Decompose published infinite/semi-infinite Connect-Four non-losing paving strategies into the same
      primitives. Separate periodic bulk invariants from finite top/side boundary defects.
    - >-
      Only after decomposition, build a neighborhood-preserving canonical form. Preserve derivative module,
      mixed coupling, start-grid adjacency/checkerboard class, gravity direction, response resources,
      parity and deadline labels.
  falsification:
    - whole-board isomorphism before decomposition
    - equal scalar ranks treated as structural identity
    - named strategic rules retained as primitives when their consequences decompose to generic relations
    - a proposed response abstraction that drops support/resource/deadline premises
    - finite outcome interpolation treated as proof
    - special small-board mode or hand-written dimensional exceptions

success_criteria:
  - exact derivative/support representation for the elementary response families
  - explicit statement of any irreducible missing strategic axiom
  - decomposed invariant description of the infinite-board paving strategies if source detail is available
  - a bulk-vs-boundary hypothesis stated in the decomposed vocabulary
  - neighborhood-preserving isomorphism search only over the decomposed structures
  - synchronized durable research notes and controls

validation_only:
  - finite generated-rank controls
  - published finite W/D/L tables
  - standard 7x6 strong-distance oracle
  - varying-board censuses

