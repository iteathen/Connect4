next_task:
  name: classify_external_phase_debt_transport_resources
  purpose: >
    For the five common repair columns A/B/D/E/F, derive the exact typed resource-state
    transition caused by spending one P1 phase-debt repair move. Determine whether the
    five transitions collapse into a small number of isomorphic C/P/N resource classes.
  fixed_interface:
    obligation: PhaseDebt1
    response_neighborhood: [A,B,D,E,F]
    remaining_target: one_of_[C3,G3]
  required_transition_fields:
    - pre_support_phase
    - repair_event
    - post_support_phase
    - GF2_defect_location_or_class
    - newly_playable_event
    - response_relation_created_or_destroyed
    - private_WSL_coverage_changed
    - active_deadlines_changed
    - NDC_guards_changed
    - terminal_or_race_effect
  bounded_steps:
    - inspect exactly one repair event per A/B/D/E/F class from the qualified tail states
    - compare the resulting transitions under the complete temporal-contract observation
    - merge classes only when support parity resource deadline coverage and NDC effects are equivalent
    - test whether repair is pure defect transport and identify the destination contract class
    - if two odd resources meet, test the exact collapse condition instead of branching histories
    - stop if representation expands into arbitrary physical continuations
  success_conditions:
    - finite typed transition table for A/B/D/E/F with at least one nontrivial isomorphic class merge
    - or exact counterexample showing which additional invariant prevents such merging
    - result composes with response-matroid snapshot feasibility and NDC closure
  stop_conditions:
    - physical q-tree reconstruction begins
    - solved W/D/L labels become proof premises
    - no quotient smaller than exact physical continuation survives the full temporal observation
    - wall_clock_reaches_5_minutes

