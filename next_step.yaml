qualified_premises:
  - id: target_free_common_Y
    statement: >-
      From GF(2), K=4, H=6, W=7, generated incidence derives L=69, rank(B)=35,
      dim ker(B)=34 and the common 28-dimensional middle without predefined 28 or 69.
      The natural T:Y_line->Y_cell and 28+7 / 28+6 splittings remain qualified.
  - id: canonical_critical_column
    statement: >-
      Empty-board horizontal reflection has exactly one fixed column because W=7 is odd.
      The critical column c*=(W-1)/2 is therefore generated by symmetry, not supplied as an opening move.
  - id: natural_preterminal_rank
    statement: >-
      P0's earliest possible K-stone terminal occurs on ply 2K-1. The preceding P0 rank is 2K-3,
      which equals 5 for K=4; at that rank P0 has K-1 events and P1 has K-2 events.
  - id: canonical_P_chain
    statement: >-
      On the unique reflection-fixed column, every complete two-ply same-column pair is a GF(2)
      P-stutter with zero phase displacement. Two such pairs followed by P0's preterminal event generate
      the alternating five-cell center stack without importing solved opening data.
  - id: maximal_delay_capacity
    statement: >-
      On a 42-cell board P0's latest parity-compatible possible terminal is ply 41. This is a structural
      capacity boundary only; it is not yet a theorem that optimal defense attains that distance.
  - id: canonical_terminal_envelope
    statement: >-
      Filtering generated winning predicates by the canonical critical-stack blockers and the maximal-delay
      gravity landing boundary produces a target-free terminal envelope whose derived cardinality equals the
      independently generated GF(2) middle dimension. The selector contains no predefined 28 or 69.
  - id: nonrecursive_extremal_lemma
    statement: >-
      At maximal-delay support there are 38 candidate lines. At rank 5, P1's two stones can block at most
      eight support candidates. A P0 top-two-row cell can already exist only via a five-event single-column
      stack; total candidate exclusions by stack column are 4,6,8,10,8,6,4. Equality is unique at center.
      This is finite geometry/support reasoning, not recursive game solving.
  - id: oracle_validation_only
    statement: >-
      Issue #41 later observes the same 28-line geometry, five-center prefix, and ply-41 distance under
      external solved data. These facts validate the candidate bridge but are forbidden as proof premises.
  - id: oracle_28_not_Y_basis
    statement: >-
      The 28 external line coordinates have incidence rank 26 and fingerprint 2 line-core +20 cell-core +6 axis.
      Do not identify the coordinate set with a basis of common Y merely because cardinalities match.

execution:
  cycle: assess -> research -> reassess -> plan -> execute -> qualify -> review -> cleanup/document
  primary_question: >-
    What exact empty-board CPC/NDC/support invariant forces or characterizes the canonical critical/maximal-delay
    envelope strongly enough that the emergent structural 28 becomes a game-semantic theorem rather than only
    a canonical candidate envelope?
  candidate_order:
    - >-
      Prove a strong-distance selection rule for the reflection-fixed same-column P-stutter chain using only
      exact support, phase, residual requirements, blocker capacity and deadline semantics. Do not compare
      recursive child values.
    - >-
      Construct a nonrecursive P1 maximal-delay certificate: a finite response/blocker/zugzwang invariant that
      prevents P0 terminality before the latest parity-compatible horizon while preserving eventual P0 win
      compatibility. A static pairing or NDC response certificate is admissible; recursive minimax is not.
    - >-
      Search for a weaker invariant than literal prefix/distance selection. If an empty-board quotient or
      extremal condition uniquely implies the same canonical terminal envelope, prove that instead.
    - >-
      Use Allis/CPC rule forms only as credited lemmas after translating them into the repository's generic
      event/response/blocker language. Do not import a solved root label.
  required_checks:
    - strongest derivation starts only from 2,K,H,W and generated geometry
    - no predefined 28 or 69 in the target-free control
    - no issue #41/#42 terminal distance or forced-prefix premise
    - no recursive legal move-tree enumeration, minimax, Negamax, MCTS or PNS as proof mechanism
    - distinguish latest-possible terminal capacity from proved optimal terminal distance
    - distinguish canonical symmetry/P chain from game-theoretically forced optimal chain
    - preserve left-right reflection naturality and gravity asymmetry
    - preserve common-Y / T / P type boundaries
    - external varying-board evidence may falsify a proposed law but cannot establish it
  falsification:
    - if another target-free structural chain satisfies the proposed selection invariant but yields a different envelope, the invariant is insufficient
    - if a claimed maximal-delay certificate fails on one legal structural transition, preserve that smallest counterexample
    - if proving the selection rule requires recursive child-value comparison, it does not satisfy the requested derivation
    - if the canonical envelope equality depends on importing terminal ply or center prefix from solved data, reject the derivation

success_criteria:
  - target-free semantic rule selecting the canonical 28 envelope from the empty board
  - executable finite theorem/control with explicit assumptions and no solved-label premise
  - proof that no recursive game-tree evaluation is hidden inside the control
  - exact statement of whether the theorem proves cardinality only or the full 28-line geometry
  - durable note and synchronized STATUS.md / next_step.yaml

