new_cross_layer_principle:
  name: observation_sensitive_projection_congruence
  statement: >
    A projection may erase a degree of freedom only when the forgotten distinctions
    are congruent for every downstream transition and observation being claimed.
  instances:
    - "q value identity is too coarse for terminal-line provenance; use q+Pi0"
    - "policy blocker coverage is too coarse for temporal/resource realizability"
    - "event/interleaving quotienting is valid only under proved terminal/order guards"

