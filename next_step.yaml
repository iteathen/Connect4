  objective: >-
    Continue from the target-free common-Y theorem and the new empty-board canonical terminal-envelope
    construction. Prove or falsify the missing semantic selection theorem: derive from CPC/NDC/support
    structure, without solved labels or recursive game-tree solving, why distance-optimal play selects
    the canonical reflection-fixed P chain and maximal-delay P0 horizon, or derive a weaker invariant
    that implies the same canonical envelope. Do not use issue #41's five-center prefix or ply-41 result
    as premises.

