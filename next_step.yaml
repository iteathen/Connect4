execution:
  cycle: assess -> research -> reassess -> plan -> execute -> qualify -> review -> cleanup/document
  residual_domain:
    G3_logical_roots: 17
    C3_logical_roots: 5
    total_logical_roots: 22
    rule: >-
      Work only from exact replayable residual roots and their exact failed action/reply branches.
      Do not regenerate a wider q frontier merely to discover more states.
  dependency_cone_extraction:
    - for each failed root enumerate legal P0 actions exactly as the enhanced predecessor does
    - preserve the first adversarial P1 reply for each rejected action
    - record exact enabled P1 singleton terminal obligations before and after the selected action
    - retain P0 immediate terminal alternatives and exact target-support distance
    - retain rho=(delta,mu) and the first no-lex-predecessor child when present
    - retain only residual incidence/cofactor facts that touch the selected action, terminal cell,
      live target, or next required response
    - compare mirrored C3/G3 failures under typed structural renaming before adding new predicates
  candidate_theorem_family:
    name: guarded_deadline_response_capacity_predecessor
    hypothesis: >-
      A branch may be closable when the selected progress action, exact enabled-P1 terminal
      obligations, P0 terminal alternatives, available defensive response slots, and a decreasing
      rho child form a terminal-complete response-capacity contract. This is a hypothesis until
      exact obligation-to-slot mapping and exhaustive P1 coverage are proved.
    requirements:
      - no implicit frame rule
      - every enabled P1 singleton terminal alternative remains explicit
      - a P1-terminal reply rejects that candidate action unless a prior terminal certificate applies
      - no-lex-predecessor children remain unresolved until a new guarded theorem proves them
      - theorem reuse may use typed claim-relative isomorphism only after load-bearing R/P/C facts match
  qualification:
    - test the smallest candidate predicate first on at least one mirrored C3/G3 failure family
    - falsify it against all exact residual roots to which its preconditions apply
    - compose any surviving theorem back into the enhanced rank-18 predecessor
    - rerun C3 and G3 halves under unchanged limits
    - preserve every remaining exact logical falsifier rather than relabeling it as loss
  resource_hygiene:
    - preserve the 100000 proof-state cap
    - preserve configured quotient/search-storage bounds
    - isolate roots/actions/replies only for execution hygiene when needed
    - execution partition membership is never semantic identity
  forbidden_shortcuts:
    - solved_WDL_or_external_solver_as_premise
    - unknown_as_loss
    - proof_failure_or_candidate_family_failure_as_loss
    - physical_state_or_sequence_as_semantic_separator
    - q_equality_from_claim_relative_signature_or_execution_shard
    - mu_phase_or_deadline_count_as_value_classifier
    - arbitrary_q_frontier_recursion
    - proof_or_quotient_cap_increase_without_structural_reason
    - implicit_frame_rule
    - unproved_69_to_28_geometric_line_reduction
  wall_clock_limit_seconds: 300
  inner_timeout_seconds: 270

success_criteria:
  - every new theorem premise is derived from an exact residual dependency cone
  - any response-capacity use has an explicit obligation-to-response-slot mapping
  - all accepted P0 actions remain exhaustive over legal P1 replies and exact terminal alternatives
  - the enhanced C3 and G3 post-block predecessor is rerun after theorem integration
  - either both halves close 42/42 or the remaining exact roots form a strictly smaller,
    structurally characterized residual family
  - no resource ambiguity is interpreted as logical failure
  - STATUS.md and the current research note remain synchronized with the qualified result

on_success:
