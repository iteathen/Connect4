name: Research CPC marked common residual core

on:
  push:
    branches:
      - research/universal-structural-policy-20260930
    paths:
      - .github/workflows/research-cpc-marked-common-residual-core.yml
      - research/isograph/discovery/2026-09-30-universal-structural-policy/run-cpc-marked-common-residual-core.mjs

permissions:
  contents: write

jobs:
  census:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Pin Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26.7.0
      - name: Fetch pinned JSMinSys
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/iteathen/JSMinSys.git jsminsys
          git -C jsminsys checkout 0899c5811918e68c22dc1b0e4dd8af97d9b4bbcb
      - name: Run common residual diagnostic
        shell: bash
        run: |
          set -euo pipefail
          OUT=research/isograph/discovery/2026-09-30-universal-structural-policy/CPC_MARKED_COMMON_RESIDUAL_CORE_0_1.json
          node research/isograph/discovery/2026-09-30-universal-structural-policy/run-cpc-marked-common-residual-core.mjs ./jsminsys > "$OUT"
          node - "$OUT" <<'NODE'
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          for(const root of r.rows){
            console.log('ROOT='+root.id);
            for(const s of root.setups){
              const pairs=s.commonBySize['2']??[];
              console.log(JSON.stringify({
                setup:s.setupColumn,
                replies:s.admissibleReplyColumns,
                common:s.commonMinimalResidualCount,
                commonPairs:pairs
              }));
            }
          }
          NODE
      - name: Commit durable discovery evidence
        shell: bash
        run: |
          set -euo pipefail
          BRANCH=research/universal-structural-policy-20260930
          FILE=research/isograph/discovery/2026-09-30-universal-structural-policy/CPC_MARKED_COMMON_RESIDUAL_CORE_0_1.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$FILE"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research: record CPC marked common residual core"
          git fetch origin "$BRANCH"
          git rebase "origin/$BRANCH"
          git push origin HEAD:"$BRANCH"
