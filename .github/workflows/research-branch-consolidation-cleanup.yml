name: Research branch consolidation cleanup

on:
  push:
    branches:
      - research/semantic-quotient
    paths:
      - research/provenance/BRANCH_CLEANUP_TRIGGER_2026-09-17.json

permissions:
  contents: write

concurrency:
  group: research-branch-consolidation-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Archive and delete verified research refs
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          CANONICAL_SHA: ${{ github.sha }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const request=JSON.parse(fs.readFileSync('research/provenance/BRANCH_CLEANUP_TRIGGER_2026-09-17.json','utf8'));
          if(process.env.REPOSITORY!=='iteathen/Connect4') throw new Error('unexpected repository');
          if(request.repository!==process.env.REPOSITORY) throw new Error('request repository mismatch');
          if(request.canonical_branch!=='research/semantic-quotient') throw new Error('unexpected canonical branch');
          if(!process.env.GH_TOKEN) throw new Error('GITHUB_TOKEN unavailable');

          const [owner,repo]=process.env.REPOSITORY.split('/');
          const canonical=process.env.CANONICAL_SHA;
          const api='https://api.github.com';
          const headers={
            'Authorization':`Bearer ${process.env.GH_TOKEN}`,
            'Accept':'application/vnd.github+json',
            'X-GitHub-Api-Version':'2022-11-28',
            'Content-Type':'application/json'
          };
          const enc=s=>s.split('/').map(encodeURIComponent).join('/');

          async function gh(path,{method='GET',body,ok=[200]}={}){
            const res=await fetch(`${api}${path}`,{method,headers,body:body===undefined?undefined:JSON.stringify(body)});
            const text=await res.text();
            if(!ok.includes(res.status)) throw new Error(`${method} ${path} -> ${res.status}: ${text.slice(0,1000)}`);
            return text?JSON.parse(text):null;
          }
          async function refSha(branch){
            const d=await gh(`/repos/${owner}/${repo}/git/ref/heads/${enc(branch)}`);
            return d.object.sha;
          }
          async function commitTree(commitSha){
            const d=await gh(`/repos/${owner}/${repo}/git/commits/${commitSha}`);
            return d.tree.sha;
          }
          async function pathSha(commitSha,path){
            let tree=await commitTree(commitSha);
            for(const part of path.split('/')){
              const d=await gh(`/repos/${owner}/${repo}/git/trees/${tree}`);
              const e=d.tree.find(x=>x.path===part);
              if(!e) throw new Error(`missing ${path} at ${commitSha}`);
              tree=e.sha;
            }
            return tree;
          }
          async function fileText(commitSha,path){
            const d=await gh(`/repos/${owner}/${repo}/contents/${enc(path)}?ref=${commitSha}`);
            return Buffer.from(d.content,'base64').toString('utf8');
          }
          async function isAncestor(base,head){
            const d=await gh(`/repos/${owner}/${repo}/compare/${base}...${head}`);
            return d.merge_base_commit?.sha===base && d.behind_by===0;
          }
          async function verifyTag(tag,expected){
            try{
              const r=await gh(`/repos/${owner}/${repo}/git/ref/tags/${enc(tag)}`);
              if(r.object.type==='commit') return r.object.sha===expected;
              if(r.object.type==='tag'){
                const t=await gh(`/repos/${owner}/${repo}/git/tags/${r.object.sha}`);
                return t.object?.sha===expected;
              }
              return false;
            }catch(e){
              if(String(e).includes('-> 404:')) return null;
              throw e;
            }
          }
          async function createArchiveTag(tag,branch,expected){
            const existing=await verifyTag(tag,expected);
            if(existing===true) return;
            if(existing===false) throw new Error(`archive tag ${tag} exists with wrong target`);
            const t=await gh(`/repos/${owner}/${repo}/git/tags`,{
              method:'POST',ok:[201],
              body:{tag,message:`Archive ${branch} before research branch consolidation cleanup`,object:expected,type:'commit'}
            });
            await gh(`/repos/${owner}/${repo}/git/refs`,{
              method:'POST',ok:[201],
              body:{ref:`refs/tags/${tag}`,sha:t.sha}
            });
            if(await verifyTag(tag,expected)!==true) throw new Error(`archive tag verification failed: ${tag}`);
          }

          const canonicalRef=await refSha(request.canonical_branch);
          if(canonicalRef!==canonical) throw new Error(`canonical branch moved during cleanup: ${canonicalRef} != ${canonical}`);

          const ledger=JSON.parse(await fileText(canonical,'research/provenance/BRANCH_CONSOLIDATION_2026-09-17.json'));
          const manifest=JSON.parse(await fileText(canonical,'research/provenance/SOURCE_MANIFEST.json'));
          const ledgerMap=new Map(ledger.retire.map(x=>[x.name,x]));

          const unifiedPaths=[
            'research/AGENTS.md','research/README.md','research/canonical','research/confidence',
            'research/evidence','research/experiments','research/history','research/hypotheses',
            'research/maps','research/open-questions','research/untriaged'
          ];
          async function verifyUnifiedAttached(sourceSha){
            for(const p of unifiedPaths){
              if(await pathSha(sourceSha,p)!==await pathSha(canonical,p)) throw new Error(`unified path mismatch: ${p}`);
            }
            if(await pathSha(sourceSha,'research/provenance/SOURCE_MANIFEST.json')!==await pathSha(canonical,'research/provenance/SOURCE_MANIFEST.json')){
              throw new Error('SOURCE_MANIFEST mismatch');
            }
          }

          for(const item of request.branches){
            const branch=item.name;
            if(branch.startsWith('research/bsfp')) throw new Error(`refusing protected BSFP research branch ${branch}`);
            if(!(branch.startsWith('research/')||branch.startsWith('research-unified-knowledge-staging'))){
              throw new Error(`refusing non-research branch ${branch}`);
            }

            const actual=await refSha(branch);
            if(actual!==item.expected_head) throw new Error(`${branch} moved: ${actual}`);
            const recorded=ledgerMap.get(branch);
            if(!recorded||recorded.head!==actual) throw new Error(`ledger mismatch for ${branch}`);

            switch(item.proof){
              case 'ancestor_of_canonical':
                if(!await isAncestor(actual,canonical)) throw new Error(`${branch} not ancestor of canonical`);
                break;
              case 'ancestor_of_unified':
                if(!await isAncestor(actual,request.unified_head)) throw new Error(`${branch} not ancestor of unified knowledge`);
                await verifyUnifiedAttached(request.unified_head);
                break;
              case 'normalized_source_archive':
                if(!manifest.sources.some(x=>x.ref===branch)) throw new Error(`${branch} absent from source manifest`);
                await pathSha(canonical,item.source_path);
                break;
              case 'manifest_subsumed':
                if(!manifest.subsumed_or_alias_refs.includes(branch)) throw new Error(`${branch} absent from subsumed source manifest`);
                break;
              case 'unified_tree_attached':
                await verifyUnifiedAttached(actual);
                break;
              case 'export_snapshot':
                break;
              case 'staging_alias':
                if(!await isAncestor(actual,request.unified_head)) throw new Error(`${branch} not contained by unified knowledge`);
                break;
              default:
                throw new Error(`unknown proof class ${item.proof}`);
            }

            await createArchiveTag(item.archive_tag,branch,actual);
            await gh(`/repos/${owner}/${repo}/git/refs/heads/${enc(branch)}`,{method:'DELETE',ok:[204]});
            console.log(`archived+deleted ${branch} @ ${actual} -> ${item.archive_tag}`);
          }
          NODE
