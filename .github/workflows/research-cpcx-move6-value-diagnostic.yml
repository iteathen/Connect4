name: Research CPCX move6 value diagnostic

on:
  push:
    branches:
      - experiment/cpcx-20261002
    paths:
      - research/isograph/discovery/2026-10-02-cpcx/run-cpcx-move6-cpc2-setup-restriction.mjs
      - research/isograph/discovery/2026-10-02-cpcx/run-cpcx-move6-restriction-ladder.mjs
      - research/isograph/discovery/2026-10-02-cpcx/run-cpcx-move6-final-block-ranked-reservoir.mjs
      - research/isograph/discovery/2026-10-02-cpcx/run-cpcx-move6-final-block-pair-options.mjs
      - research/isograph/discovery/2026-10-02-cpcx/run-cpcx-move6-final-block-one-defect-attachment.mjs
      - research/isograph/discovery/2026-10-02-cpcx/cpcx-one-defect-attachment-rcic.mjs
      - research/isograph/discovery/2026-10-02-cpcx/cpcx-reservoir-gap-rcic.mjs
      - research/isograph/discovery/2026-10-02-cpcx/run-cpcx-move6-control-quotient.mjs
      - research/isograph/discovery/2026-10-02-cpcx/run-cpcx-move6-representative-proof-matrix.mjs
      - research/isograph/discovery/2026-10-02-cpcx/cpcx-control-quotient.mjs
      - research/isograph/discovery/2026-10-02-cpcx/cpcx-cpc2.mjs
      - research/isograph/discovery/2026-10-02-cpcx/cpcx-successor.mjs
      - research/isograph/discovery/2026-10-02-cpcx/cpcx-progress.mjs
      - .github/workflows/research-cpcx-move6-value-diagnostic.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "26.7.0"
      - name: Run move6 CPC2 setup restriction diagnostic
        run: |
          node research/isograph/discovery/2026-10-02-cpcx/run-cpcx-move6-cpc2-setup-restriction.mjs > cpcx-move6-cpc2-setup-restriction.json
          node research/isograph/discovery/2026-10-02-cpcx/run-cpcx-move6-restriction-ladder.mjs > cpcx-move6-restriction-ladder.json
          node research/isograph/discovery/2026-10-02-cpcx/run-cpcx-move6-final-block-ranked-reservoir.mjs > cpcx-move6-final-block-ranked-reservoir.json
          node research/isograph/discovery/2026-10-02-cpcx/run-cpcx-move6-final-block-pair-options.mjs > cpcx-move6-final-block-pair-options.json
          node research/isograph/discovery/2026-10-02-cpcx/run-cpcx-move6-final-block-one-defect-attachment.mjs > cpcx-move6-final-block-one-defect-attachment.json
          node research/isograph/discovery/2026-10-02-cpcx/run-cpcx-move6-control-quotient.mjs > cpcx-move6-control-quotient.json
          node research/isograph/discovery/2026-10-02-cpcx/run-cpcx-move6-representative-proof-matrix.mjs > cpcx-move6-representative-proof-matrix.json
          node --input-type=module -e "
            import fs from 'node:fs';
            const x=JSON.parse(fs.readFileSync('cpcx-move6-cpc2-setup-restriction.json','utf8'));
            console.log(JSON.stringify({
              summary:x.summary,
              rows:x.rows.map(r=>({
                sixthMove:r.sixthMove,
                certifiedSetups:r.certifiedSetups.map(s=>({
                  setupCell:s.setupCell,
                  class:s.class,
                  blockers:s.cpc2?.blockingLabels??[]
                })),
                bestRestrictionSetups:r.bestRestrictionSetups.map(s=>({
                  setupCell:s.setupCell,
                  blockers:s.cpc2?.blockingLabels??[],
                  unresolved:s.blockerChildren.filter(x=>!x.certified).map(x=>({
                    blocker:x.blockerCell,
                    seam:x.certificate.seam
                  }))
                }))
              }))
            },null,2));
          "
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: cpcx-move6-value-diagnostic
          path: |
            cpcx-move6-cpc2-setup-restriction.json
            cpcx-move6-restriction-ladder.json
            cpcx-move6-final-block-ranked-reservoir.json
            cpcx-move6-final-block-pair-options.json
            cpcx-move6-final-block-one-defect-attachment.json
            cpcx-move6-control-quotient.json
            cpcx-move6-representative-proof-matrix.json
          if-no-files-found: error
