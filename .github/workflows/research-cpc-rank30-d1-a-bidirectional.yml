name: Research CPC rank30 D1 A bidirectional proof-library closure

concurrency:
  group: rank30-d1-a-bidirectional-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [research/universal-structural-policy-20260930]
    paths:
      - .github/workflows/research-cpc-rank30-d1-a-bidirectional.yml
      - research/isograph/discovery/2026-09-30-universal-structural-policy/CPC_RANK30_D1_A_BIDIRECTIONAL_PROOF_LIBRARY_CLOSURE_DESIGN_0_1.md
      - research/isograph/discovery/2026-09-30-universal-structural-policy/test-cpc-rank30-d1-a-bidirectional-proof-library-closure.mjs
      - research/isograph/discovery/2026-09-30-universal-structural-policy/run-cpc-rank30-d1-a-bidirectional-proof-library-closure.mjs
      - research/isograph/discovery/2026-09-30-universal-structural-policy/CPC_RANK32_Q9F_MONOTONE_PROOF_LIBRARY_CLASSIFICATION_0_1.json
      - research/isograph/discovery/2026-09-30-universal-structural-policy/CPC_RANK20_RANK32_FORCED_OBLIGATION_LOSS_CENSUS_0_1.json

permissions:
  contents: write

jobs:
  classify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {fetch-depth: 0}
      - name: Check out pinned JSMinSys authority
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: iteathen/JSMinSys
          ref: bf23d3a67652cd42e1975f29c7dc4eed54f7eb42
          path: .jsminsys
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: {node-version: 26.7.0}
      - name: Verify frozen bidirectional closure contract
        run: node research/isograph/discovery/2026-09-30-universal-structural-policy/test-cpc-rank30-d1-a-bidirectional-proof-library-closure.mjs "$GITHUB_WORKSPACE/.jsminsys"
      - name: Generate durable bidirectional closure
        shell: bash
        run: |
          set -euo pipefail
          DIR=research/isograph/discovery/2026-09-30-universal-structural-policy
          OUT="$DIR/CPC_RANK30_D1_A_BIDIRECTIONAL_PROOF_LIBRARY_CLOSURE_0_1.json"
          node "$DIR/run-cpc-rank30-d1-a-bidirectional-proof-library-closure.mjs" "$GITHUB_WORKSPACE/.jsminsys" > "$OUT"
          node - "$OUT" <<'NODE'
          const fs=require('fs');const r=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          console.log(JSON.stringify({
            leafDisposition:r.leafDisposition,
            rootMoveDisposition:r.rootMoveDisposition,
            summary:r.summary,
            children:r.children.map(x=>({defender:x.defenderColumn,q:x.exactQClass,disposition:x.disposition,positive:x.positiveCertificates,loss:x.lossCertificate}))
          }));
          NODE
      - name: Commit durable bidirectional closure
        shell: bash
        run: |
          set -euo pipefail
          BRANCH=research/universal-structural-policy-20260930
          FILE=research/isograph/discovery/2026-09-30-universal-structural-policy/CPC_RANK30_D1_A_BIDIRECTIONAL_PROOF_LIBRARY_CLOSURE_0_1.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$FILE"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research: record rank30 D1 A bidirectional closure"
          git pull --rebase origin "$BRANCH"
          git push origin HEAD:"$BRANCH"
