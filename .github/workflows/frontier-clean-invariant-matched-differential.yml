name: Frontier clean-invariant matched differential

on:
  push:
    branches:
      - research/frontier-negamax-conformance
    paths:
      - research/semantic-quotient/state-identity-unification/src/quotient-standard7x6-clean-invariant-matched-differential.mjs
      - .github/workflows/frontier-clean-invariant-matched-differential.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  differential:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      candidates: ${{ steps.run.outputs.candidates }}
      evaluated: ${{ steps.run.outputs.evaluated }}
      proved: ${{ steps.run.outputs.proved }}
      unproved: ${{ steps.run.outputs.unproved }}
      matched: ${{ steps.run.outputs.matched }}
      tier: ${{ steps.run.outputs.tier }}
      resource: ${{ steps.run.outputs.resource }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26.7.0
      - name: Qualify matched clean-invariant differential
        id: run
        shell: bash
        run: |
          set -euo pipefail
          f="$RUNNER_TEMP/clean-invariant-differential.txt"
          timeout 270s node research/semantic-quotient/state-identity-unification/src/quotient-standard7x6-clean-invariant-matched-differential.mjs | tee "$f"
          RESULT_FILE="$f" node <<'NODE'
          const fs=require('node:fs');
          const line=fs.readFileSync(process.env.RESULT_FILE,'utf8').split(/\r?\n/).find(x=>x.startsWith('MATCHED_CLEAN_INVARIANT_DIFFERENTIAL='));
          if(!line) throw new Error('matched differential summary missing');
          const x=JSON.parse(line.slice(line.indexOf('=')+1));
          if(x.exactCleanCandidateStates<1) throw new Error('clean candidate corpus empty');
          if(x.completedDirectProbes<5) throw new Error('known direct-probe baseline did not complete');
          if(x.provedDirectProbes<2||x.unprovedDirectProbes<3) throw new Error('known positive/negative baseline drift');
          fs.appendFileSync(process.env.GITHUB_OUTPUT,[
            `candidates=${x.exactCleanCandidateStates}`,
            `evaluated=${x.completedDirectProbes}`,
            `proved=${x.provedDirectProbes}`,
            `unproved=${x.unprovedDirectProbes}`,
            `matched=${x.matchedPairCount}`,
            `tier=${x.selectedMatchingTier}`,
            `resource=${x.resourceFailure?1:0}`,
          ].join('\n')+'\n');
          NODE

  summary:
    needs: differential
    name: diff-c${{ needs.differential.outputs.candidates }}-e${{ needs.differential.outputs.evaluated }}-p${{ needs.differential.outputs.proved }}-u${{ needs.differential.outputs.unproved }}-m${{ needs.differential.outputs.matched }}-t${{ needs.differential.outputs.tier }}-r${{ needs.differential.outputs.resource }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - run: echo "matched clean-invariant differential counts encoded in job name"
