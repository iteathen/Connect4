name: Research CPC 3+1 deferred-singleton tail qualification

concurrency:
  group: cpc-3plus1-deferred-singleton-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [research/universal-structural-policy-20260930]
    paths:
      - .github/workflows/research-cpc-3plus1-deferred-singleton-tail-qualification.yml
      - research/isograph/discovery/2026-09-30-universal-structural-policy/CPC_3PLUS1_DEFERRED_SINGLETON_TAIL_NONWIN_THEOREM.md
      - research/isograph/discovery/2026-09-30-universal-structural-policy/test-cpc-3plus1-deferred-singleton-tail-qualification.mjs
      - research/isograph/discovery/2026-09-30-universal-structural-policy/run-cpc-3plus1-deferred-singleton-tail-qualification.mjs
      - research/isograph/discovery/2026-09-30-universal-structural-policy/CPC_RANK38_3PLUS1_TAIL_EVENT_PRODUCT_0_1.json

permissions:
  contents: write

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {fetch-depth: 0}
      - name: Check out pinned JSMinSys authority
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: iteathen/JSMinSys
          ref: bf23d3a67652cd42e1975f29c7dc4eed54f7eb42
          path: .jsminsys
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: {node-version: 26.7.0}
      - name: Verify frozen theorem qualification
        run: node research/isograph/discovery/2026-09-30-universal-structural-policy/test-cpc-3plus1-deferred-singleton-tail-qualification.mjs "$GITHUB_WORKSPACE/.jsminsys"
      - name: Generate durable theorem qualification
        shell: bash
        run: |
          set -euo pipefail
          DIR=research/isograph/discovery/2026-09-30-universal-structural-policy
          OUT="$DIR/CPC_3PLUS1_DEFERRED_SINGLETON_TAIL_QUALIFICATION_0_1.json"
          node "$DIR/run-cpc-3plus1-deferred-singleton-tail-qualification.mjs" "$GITHUB_WORKSPACE/.jsminsys" > "$OUT"
          node - "$OUT" <<'NODE'
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          console.log(JSON.stringify({accept:r.accept,summary:r.summary}));
          NODE
      - name: Commit durable theorem qualification
        shell: bash
        run: |
          set -euo pipefail
          BRANCH=research/universal-structural-policy-20260930
          FILE=research/isograph/discovery/2026-09-30-universal-structural-policy/CPC_3PLUS1_DEFERRED_SINGLETON_TAIL_QUALIFICATION_0_1.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$FILE"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research: record 3+1 tail theorem qualification"
          git pull --rebase origin "$BRANCH"
          git push origin HEAD:"$BRANCH"
