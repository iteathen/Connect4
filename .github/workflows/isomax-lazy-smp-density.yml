name: IsoMax Lazy SMP Sharing Density Sweep

on:
  push:
    branches:
      - work/isomax-jsminsys-boundary-cleanup
    paths:
      - '.github/workflows/isomax-lazy-smp-density.yml'
      - 'tools/bench-lazy-smp-control.mjs'
  workflow_dispatch:

jobs:
  sweep:
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          submodules: recursive
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '26.7.0'
          cache: npm
      - run: npm ci
      - name: Four-worker Lazy SMP sharing-density sweep
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          function Use-JSMinSys([string]$sha) {
            git -C vendor/jsminsys cat-file -e "$sha^{commit}" 2>$null
            if ($LASTEXITCODE -ne 0) {
              git -C vendor/jsminsys fetch --no-tags origin $sha
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            }
            git -C vendor/jsminsys checkout --detach $sha
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            Write-Host "JSMS_HEAD $((git -C vendor/jsminsys rev-parse HEAD).Trim())"
          }
          $baseline='19a96823cad46c7e5e9e70e0d68079d5574f92a3'
          $candidate='06ad9b4425ec56bef85814baf9ff1ef33e3028fd'

          Write-Host "SWEEP baseline-1 mask=0"
          Use-JSMinSys $baseline
          node --experimental-ffi tools/bench-lazy-smp-control.mjs 0

          Use-JSMinSys $candidate
          foreach ($mask in 0,1,3,7,15,31,63,127,255) {
            Write-Host "SWEEP candidate mask=$mask"
            node --experimental-ffi tools/bench-lazy-smp-control.mjs $mask
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

          Write-Host "SWEEP baseline-2 mask=0"
          Use-JSMinSys $baseline
          node --experimental-ffi tools/bench-lazy-smp-control.mjs 0
