name: Research UC4A fresh board validation repair

on:
  push:
    branches:
      - research/universal-structural-policy-20260930
    paths:
      - .github/workflows/research-uc4a-fresh-board-validation-repair.yml
      - research/isograph/discovery/2026-09-30-universal-structural-policy/run-uc4a-fresh-board-validation-one-coordinate-repair.mjs
      - research/isograph/discovery/2026-09-30-universal-structural-policy/UC4A_FRESH_BOARD_VALIDATION_ONE_COORDINATE_REPAIR_0_1.md

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact pushed revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Pin Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26.7.0
      - name: Run fresh validation and frozen-coordinate repair
        shell: bash
        run: |
          set -euo pipefail
          DIR=research/isograph/discovery/2026-09-30-universal-structural-policy
          OUT="$DIR/UC4A_FRESH_BOARD_VALIDATION_ONE_COORDINATE_REPAIR_RESULT_0_1.json"
          node "$DIR/run-uc4a-fresh-board-validation-one-coordinate-repair.mjs" > "$OUT"
          node - "$OUT" <<'NODE'
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          if(r.sealedHoldoutsAccessed!==false)throw new Error('sealed holdout boundary violated');
          console.log(JSON.stringify({
            baseline:r.baselineValidation.map(x=>({
              features:x.features,coverage:x.coverage,accuracy:x.accuracy,
              wrong:x.wrong,uncovered:x.uncovered,
              wrongRows:x.rows.filter(y=>y.prediction&&y.prediction!==y.actual)
            })),
            combined:r.baselineCombined,
            bestRepairs:{
              T1:r.oneCoordinateRepairs.T1.slice(0,5).map(x=>({
                added:x.addedFeature,mixed:x.mixedCells,pureRows:x.pureRows,signatures:x.signatureCells
              })),
              T2:r.oneCoordinateRepairs.T2.slice(0,5).map(x=>({
                added:x.addedFeature,mixed:x.mixedCells,pureRows:x.pureRows,signatures:x.signatureCells
              }))
            },
            collisionFamily:r.collisionFamily
          }));
          NODE
      - name: Commit durable validation evidence
        shell: bash
        run: |
          set -euo pipefail
          BRANCH=research/universal-structural-policy-20260930
          FILE=research/isograph/discovery/2026-09-30-universal-structural-policy/UC4A_FRESH_BOARD_VALIDATION_ONE_COORDINATE_REPAIR_RESULT_0_1.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$FILE"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research: record UC4A fresh validation repair"
          for attempt in 1 2 3; do
            git fetch origin "$BRANCH"
            git rebase --autostash "origin/$BRANCH"
            if git push origin HEAD:"$BRANCH"; then exit 0; fi
            sleep 1
          done
          exit 1
