name: Minimax RID implication signature prefilter

on:
  push:
    branches:
      - work/minimax-impl-prefilter-20260911-copy
    paths:
      - 'research/minimax/composition-campaign/impl_rid_signature_prefilter.mjs'
      - '.github/workflows/minimax-impl-signature-prefilter.yml'
  workflow_dispatch:

jobs:
  impl-prefilter:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26.7.0
      - name: Run RID implication signature prefilter matrix
        run: node --max-old-space-size=6144 research/minimax/composition-campaign/impl_rid_signature_prefilter.mjs | tee /tmp/impl-prefilter.json
      - name: Preserve prefilter evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: minimax-impl-signature-prefilter
          path: /tmp/impl-prefilter.json
          if-no-files-found: error
