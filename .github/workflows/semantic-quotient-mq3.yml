name: Semantic quotient MQ3 residual sufficiency

on:
  push:
    branches:
      - research/semantic-quotient
    paths:
      - 'research/semantic-quotient/mq3-residual-sufficiency.mjs'
      - '.github/workflows/semantic-quotient-mq3.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mq3:
    name: MQ3 residual sufficiency
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.7.0
      - name: Test minimal residual antichain sufficiency
        run: node --expose-gc --max-old-space-size=4096 research/semantic-quotient/mq3-residual-sufficiency.mjs
