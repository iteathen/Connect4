name: Research CPC reply7 c6 obstruction handoff

on:
  push:
    branches:
      - research/universal-structural-policy-20260930
    paths:
      - .github/workflows/research-cpc-reply7-c6-obstruction-handoff.yml
      - research/isograph/discovery/2026-09-30-universal-structural-policy/run-cpc-rank25-reply7-c6-obstruction-handoff.mjs
      - research/isograph/discovery/2026-09-30-universal-structural-policy/CPC_RANK25_REPLY7_C6_OBSTRUCTION_HANDOFF_THEOREM.md

permissions:
  contents: write

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26.7.0
      - name: Fetch pinned JSMinSys authority
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/iteathen/JSMinSys.git jsminsys
          git -C jsminsys checkout bf23d3a67652cd42e1975f29c7dc4eed54f7eb42
      - name: Generate c6 obstruction handoff evidence
        shell: bash
        run: |
          set -euo pipefail
          DIR=research/isograph/discovery/2026-09-30-universal-structural-policy
          OUT="$DIR/CPC_RANK25_REPLY7_C6_OBSTRUCTION_HANDOFF_0_1.json"
          node "$DIR/run-cpc-rank25-reply7-c6-obstruction-handoff.mjs" ./jsminsys > "$OUT"
          node - "$OUT" <<'NODE'
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          if(r.oracleUsed!==false||r.solvedInputsUsed!==false)throw new Error('forbidden solved evidence');
          console.log(JSON.stringify({
            accept:r.accept,
            obstruction:r.obstructionMove,
            singleton:r.handoff.singletonAfterP1C3,
            nativeCpcForcesC3:r.handoff.nativeCpcForcesC3,
            literalOnlyC3:r.handoff.literal.onlyC3,
            postForced:r.handoff.postForced,
            downstreamAccept:r.downstreamCompression?.accept??false
          }));
          NODE
      - name: Commit durable qualification or rejection evidence
        shell: bash
        run: |
          set -euo pipefail
          BRANCH=research/universal-structural-policy-20260930
          FILE=research/isograph/discovery/2026-09-30-universal-structural-policy/CPC_RANK25_REPLY7_C6_OBSTRUCTION_HANDOFF_0_1.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$FILE"
          if ! git diff --cached --quiet; then
            git commit -m "research: record reply7 c6 obstruction handoff result"
            for attempt in 1 2 3; do
              git fetch origin "$BRANCH"
              git rebase --autostash "origin/$BRANCH"
              if git push origin HEAD:"$BRANCH"; then break; fi
              sleep 1
            done
          fi
      - name: Enforce frozen theorem verdict
        shell: bash
        run: |
          set -euo pipefail
          FILE=research/isograph/discovery/2026-09-30-universal-structural-policy/CPC_RANK25_REPLY7_C6_OBSTRUCTION_HANDOFF_0_1.json
          node - "$FILE" <<'NODE'
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          if(r.accept!==true)throw new Error('c6 obstruction handoff rejected');
          if(!r.handoff.nativeCpcForcesC3||!r.handoff.literal.onlyC3)throw new Error('forced c3 mismatch');
          if(!r.downstreamCompression?.accept)throw new Error('downstream compression rejected');
          NODE
