name: Minimax Allis marginal coverage

on:
  push:
    branches:
      - work/minimax-candidate-composition-20260911
    paths:
      - 'research/minimax/composition-campaign/allis_marginal_coverage.mjs'
      - '.github/workflows/minimax-allis-order.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  marginal-coverage:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.7.0
      - name: Run A1-A9 marginal coverage probe
        run: node --max-old-space-size=4096 research/minimax/composition-campaign/allis_marginal_coverage.mjs | tee /tmp/allis-marginal.json
      - name: Preserve Allis evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: minimax-allis-marginal-coverage
          path: /tmp/allis-marginal.json
          if-no-files-found: error
