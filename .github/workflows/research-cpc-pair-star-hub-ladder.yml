name: Research CPC pair-star hub ladder

on:
  push:
    branches:
      - research/universal-structural-policy-20260930
    paths:
      - .github/workflows/research-cpc-pair-star-hub-ladder.yml
      - research/isograph/discovery/2026-09-30-universal-structural-policy/run-cpc-pair-star-hub-ladder.mjs

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact pushed revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Pin Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26.7.0

      - name: Assert exact Node runtime
        run: node -e "if (process.version !== 'v26.7.0') throw new Error('expected Node v26.7.0, got ' + process.version)"

      - name: Verify pair-star hub ladder
        shell: bash
        run: |
          set -euo pipefail
          OUT=research/isograph/discovery/2026-09-30-universal-structural-policy/CPC_PAIR_STAR_HUB_LADDER_0_1.json
          node research/isograph/discovery/2026-09-30-universal-structural-policy/run-cpc-pair-star-hub-ladder.mjs > "$OUT"
          node - "$OUT" <<'NODE'
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          console.log('PAIR_STAR='+JSON.stringify(r.pairStar));
          console.log('STATES='+r.states.length);
          console.log('SUMMARY='+JSON.stringify(r.controlSummary));
          console.log('BRANCHES='+JSON.stringify(r.states.map(x=>({
            label:x.label,
            e3Depth:x.e3Depth,
            guard:x.firstWinGuard,
            branchCount:x.branches.length,
            terminalBranches:x.branches.filter(b=>b.terminal===true).length,
            singletonBranches:x.branches.filter(b=>b.terminal===false).length
          }))));
          NODE

      - name: Commit durable pair-star evidence
        shell: bash
        run: |
          set -euo pipefail
          BRANCH=research/universal-structural-policy-20260930
          FILE=research/isograph/discovery/2026-09-30-universal-structural-policy/CPC_PAIR_STAR_HUB_LADDER_0_1.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$FILE"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research: verify CPC pair-star hub ladder"
          for attempt in 1 2 3; do
            git fetch origin "$BRANCH"
            git rebase "origin/$BRANCH"
            if git push origin HEAD:"$BRANCH"; then
              exit 0
            fi
            sleep 1
          done
          exit 1
