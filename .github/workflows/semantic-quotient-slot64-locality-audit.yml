name: Standard 7x6 slot64 transition locality

on:
  push:
    branches:
      - research/semantic-quotient
    paths:
      - 'research/semantic-quotient/state-identity-unification/src/quotient-slot64-slot-change-audit.mjs'
      - '.github/workflows/semantic-quotient-slot64-locality-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Audit slot64 transition locality
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      EXPAND_THROUGH_RANK: '8'
      MAX_STATES: '2000000'
      PREFIX_CLASSES: '4096'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26.7.0
      - name: Run slot64 transition locality audit
        run: node --expose-gc --max-old-space-size=6144 research/semantic-quotient/state-identity-unification/src/quotient-slot64-slot-change-audit.mjs
