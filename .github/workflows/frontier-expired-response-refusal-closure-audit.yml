name: Frontier expired-response refusal closure audit

on:
  push:
    branches:
      - research/frontier-negamax-conformance
    paths:
      - research/semantic-quotient/state-identity-unification/src/quotient-standard7x6-expired-response-refusal-closure.mjs
      - research/semantic-quotient/state-identity-unification/src/quotient-standard7x6-rho-action-branch-composition.mjs
      - research/semantic-quotient/state-identity-unification/src/quotient-standard7x6-expired-response-rho-probe.mjs
      - .github/workflows/frontier-expired-response-refusal-closure-audit.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refusal-closure:
    strategy:
      fail-fast: false
      matrix:
        refusal: [A, B, D, E, F]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26.7.0
      - name: Qualify refusal ${{ matrix.refusal }}
        shell: bash
        run: |
          set -o pipefail
          timeout 300s node research/semantic-quotient/state-identity-unification/src/quotient-standard7x6-expired-response-refusal-closure.mjs '${{ matrix.refusal }}' 2>&1 | tee refusal-${{ matrix.refusal }}.log
