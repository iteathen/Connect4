name: Research RLC proof-library monotonicity audit

concurrency:
  group: rlc-proof-library-monotonicity-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [research/universal-structural-policy-20260930]
    paths:
      - .github/workflows/research-rlc-proof-library-monotonicity-audit.yml
      - research/isograph/discovery/2026-09-30-universal-structural-policy/RLC_PROOF_LIBRARY_MONOTONICITY_AUDIT_DESIGN_0_1.md
      - research/isograph/discovery/2026-09-30-universal-structural-policy/test-rlc-proof-library-monotonicity-audit.mjs
      - research/isograph/discovery/2026-09-30-universal-structural-policy/run-rlc-proof-library-monotonicity-audit.mjs
      - research/isograph/discovery/2026-09-30-universal-structural-policy/rlc-proof-library-catalog.mjs
      - research/isograph/discovery/2026-09-30-universal-structural-policy/rlc-legacy-target-adapter.mjs
      - research/isograph/discovery/2026-09-30-universal-structural-policy/CPC_RANK20_LEGACY_REPAIR_ROUTE_REENTRY_PROBE_0_1.json
      - research/isograph/discovery/2026-09-30-universal-structural-policy/CPC_RANK20_FORCED_C3_LEGACY_PROOF_FAMILY_MATRIX_0_1.json
      - research/isograph/discovery/2026-09-30-universal-structural-policy/RLC_PROOF_LIBRARY_MONOTONICITY_AUDIT_0_1.json

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {fetch-depth: 0}
      - name: Check out pinned JSMinSys authority
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: iteathen/JSMinSys
          ref: bf23d3a67652cd42e1975f29c7dc4eed54f7eb42
          path: .jsminsys
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: {node-version: 26.7.0}
      - name: Verify proof-library monotonicity
        run: node research/isograph/discovery/2026-09-30-universal-structural-policy/test-rlc-proof-library-monotonicity-audit.mjs "$GITHUB_WORKSPACE/.jsminsys"
      - name: Generate durable monotonicity evidence
        shell: bash
        run: |
          set -euo pipefail
          DIR=research/isograph/discovery/2026-09-30-universal-structural-policy
          OUT="$DIR/RLC_PROOF_LIBRARY_MONOTONICITY_AUDIT_0_1.json"
          node "$DIR/run-rlc-proof-library-monotonicity-audit.mjs" "$GITHUB_WORKSPACE/.jsminsys" > "$OUT"
          node - "$OUT" <<'NODE'
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          console.log(JSON.stringify({
            summary:r.summary,
            legacyTargetAdapter:r.legacyTargetAdapter,
            rank20Regression:r.rank20Regression
          }));
          NODE
      - name: Commit durable monotonicity evidence
        shell: bash
        run: |
          set -euo pipefail
          BRANCH=research/universal-structural-policy-20260930
          FILE=research/isograph/discovery/2026-09-30-universal-structural-policy/RLC_PROOF_LIBRARY_MONOTONICITY_AUDIT_0_1.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$FILE"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research: record RLC proof-library monotonicity audit"
          git pull --rebase origin "$BRANCH"
          git push origin HEAD:"$BRANCH"
