name: Frontier refusal root action routing

on:
  push:
    branches:
      - research/frontier-negamax-conformance
    paths:
      - research/semantic-quotient/state-identity-unification/src/quotient-standard7x6-refusal-root-action-routing.mjs
      - research/semantic-quotient/state-identity-unification/src/quotient-standard7x6-resolved-tail-lexicographic-proof-lib.mjs
      - research/semantic-quotient/state-identity-unification/src/quotient-standard7x6-repair-capacity-proof-lib.mjs
      - .github/workflows/frontier-refusal-root-action-routing.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refusal-root:
    strategy:
      fail-fast: false
      matrix:
        refusal: [A, B, D, E, F]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26.7.0
      - name: Route refusal ${{ matrix.refusal }} root actions
        shell: bash
        run: |
          set -o pipefail
          timeout 300s node research/semantic-quotient/state-identity-unification/src/quotient-standard7x6-refusal-root-action-routing.mjs '${{ matrix.refusal }}' 2>&1 | tee refusal-root-${{ matrix.refusal }}.log
