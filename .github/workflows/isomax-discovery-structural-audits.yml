name: IsoMax discovery structural audits

on:
  push:
    branches:
      - experiment/isomax-discovery-structural-audits-20260929
    paths:
      - '.github/workflows/isomax-discovery-structural-audits.yml'
      - 'research/isograph/discovery/2026-09-29-isomax-full-discovery/run-structural-audits.mjs'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '26'
      - name: Run structural discovery audits
        run: node research/isograph/discovery/2026-09-29-isomax-full-discovery/run-structural-audits.mjs
      - name: Research integrity
        run: node tools/verify-research-integrity.mjs
      - name: Commit structural audit evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/isograph/discovery/2026-09-29-isomax-full-discovery/STRUCTURAL_AUDIT_OBSERVATIONS_0_1.json
          if git diff --cached --quiet; then
            echo "No generated discovery changes."
          else
            git commit -m "research(isomax): freeze structural audit evidence"
            git push origin HEAD:experiment/isomax-discovery-structural-audits-20260929
          fi
