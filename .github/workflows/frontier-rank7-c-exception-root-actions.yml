name: Frontier rank7 C exception root actions

on:
  push:
    branches:
      - research/frontier-negamax-conformance
    paths:
      - 'research/semantic-quotient/state-identity-unification/src/quotient-standard7x6-generic-lambda-root-branch-probe.mjs'
      - 'research/semantic-quotient/state-identity-unification/src/quotient-standard7x6-generic-target-distance-sequence-probe.mjs'
      - 'research/semantic-quotient/state-identity-unification/src/quotient-standard7x6-generic-target-distance-mu-proof-lib.mjs'
      - '.github/workflows/frontier-rank7-c-exception-root-actions.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        action: [G, A, B, D, E, F]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    name: root-${{ matrix.action }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26.7.0
      - name: Probe C-exception root action
        env:
          SEQUENCE: '46656553664474'
          TARGET: G5
          MAX_TARGET_DISTANCE: '4'
          ACTION: ${{ matrix.action }}
        run: |
          set -euo pipefail
          f="$RUNNER_TEMP/out.txt"
          timeout 300s node research/semantic-quotient/state-identity-unification/src/quotient-standard7x6-generic-lambda-root-branch-probe.mjs | tee "$f"
          RESULT_FILE="$f" node <<'NODE'
          const fs=require('node:fs');
          const line=fs.readFileSync(process.env.RESULT_FILE,'utf8').split(/\r?\n/).find(x=>x.startsWith('GENERIC_LAMBDA_ROOT_BRANCH_PROBE='));
          if(!line) throw new Error('lambda branch output missing');
          const x=JSON.parse(line.slice(line.indexOf('=')+1));
          if(x.proved!==true) throw new Error(`root action ${x.rootAction} unproved: ${x.proofKind}`);
          NODE
