name: Research CPC bottom-response guard D17

on:
  push:
    branches:
      - research/universal-structural-policy-20260930
    paths:
      - .github/workflows/research-cpc-bottom-response-guard-d17.yml
      - research/isograph/discovery/2026-09-30-universal-structural-policy/run-cpc-bottom-response-guard-renewal.mjs
      - research/isograph/discovery/2026-09-30-universal-structural-policy/CPC_BOTTOM_RESPONSE_GUARD_ESTABLISHMENT_COROLLARY.md

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact pushed revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Pin Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26.7.0
      - name: Fetch pinned JSMinSys authority
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/iteathen/JSMinSys.git jsminsys
          git -C jsminsys checkout 0899c5811918e68c22dc1b0e4dd8af97d9b4bbcb
      - name: Run bottom-response guard spectrum through D17
        shell: bash
        run: |
          set -euo pipefail
          OUT=research/isograph/discovery/2026-09-30-universal-structural-policy/CPC_BOTTOM_RESPONSE_GUARD_D17_0_1.json
          node research/isograph/discovery/2026-09-30-universal-structural-policy/run-cpc-bottom-response-guard-renewal.mjs ./jsminsys 17 > "$OUT"
          node - "$OUT" <<'NODE'
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          console.log('ROWS='+JSON.stringify(r.rows.map(x=>({
            id:x.id,
            max:x.membership.filter(m=>m.accept).at(-1)?.D??null,
            firstFailure:x.membership.find(m=>!m.accept)?.D??null,
            guardEstablishments:x.membership.flatMap(m=>(m.witnessByTrigger??[])
              .filter(w=>w.establishesGuard)
              .map(w=>({D:m.D,a:w.attackerColumn,r:w.responseColumn,g:w.establishesGuard,child:w.childClass})))
          }))));
          console.log('WORK='+JSON.stringify(r.work));
          NODE
      - name: Commit durable D17 evidence
        shell: bash
        run: |
          set -euo pipefail
          BRANCH=research/universal-structural-policy-20260930
          FILE=research/isograph/discovery/2026-09-30-universal-structural-policy/CPC_BOTTOM_RESPONSE_GUARD_D17_0_1.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$FILE"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research: verify bottom-response guard D17"
          for attempt in 1 2 3; do
            git fetch origin "$BRANCH"
            git rebase "origin/$BRANCH"
            if git push origin HEAD:"$BRANCH"; then exit 0; fi
            sleep 1
          done
          exit 1
