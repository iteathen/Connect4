name: IsoMax discovery 4x5 structural control

on:
  push:
    branches:
      - experiment/isomax-discovery-structural-audits-20260929
    paths:
      - '.github/workflows/isomax-discovery-4x5-structural-control.yml'
      - 'research/isograph/discovery/2026-09-29-isomax-full-discovery/run-4x5-structural-control.mjs'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 0}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with: {node-version: '26'}
      - name: Run 4x5 structural control
        run: node research/isograph/discovery/2026-09-29-isomax-full-discovery/run-4x5-structural-control.mjs
      - name: Research integrity
        run: node tools/verify-research-integrity.mjs
      - name: Commit control evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/isograph/discovery/2026-09-29-isomax-full-discovery/STRUCTURAL_AUDIT_4X5_CONTROL_0_1.json
          if git diff --cached --quiet; then echo "No generated discovery changes."; else
            git commit -m "research(isomax): freeze 4x5 structural control"
            git push origin HEAD:experiment/isomax-discovery-structural-audits-20260929
          fi
