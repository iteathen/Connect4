name: Research CPC rank20 rank32 consequence exchange census

concurrency:
  group: rank20-rank32-consequence-exchange-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [research/universal-structural-policy-20260930]
    paths:
      - .github/workflows/research-cpc-rank20-rank32-consequence-exchange.yml
      - research/isograph/discovery/2026-09-30-universal-structural-policy/CPC_RANK20_RANK32_CONSEQUENCE_EXCHANGE_CENSUS_DESIGN_0_1.md
      - research/isograph/discovery/2026-09-30-universal-structural-policy/test-cpc-rank20-rank32-consequence-exchange-census.mjs
      - research/isograph/discovery/2026-09-30-universal-structural-policy/run-cpc-rank20-rank32-consequence-exchange-census.mjs
      - research/isograph/discovery/2026-09-30-universal-structural-policy/CPC_RANK20_FORCED_C3_RANK5_LOCAL_GRAMMAR_PROBE_0_1.json

permissions:
  contents: write

jobs:
  census:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {fetch-depth: 0}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: {node-version: 26.7.0}
      - name: Verify exchange census contract
        run: node research/isograph/discovery/2026-09-30-universal-structural-policy/test-cpc-rank20-rank32-consequence-exchange-census.mjs
      - name: Generate durable exchange census
        shell: bash
        run: |
          set -euo pipefail
          DIR=research/isograph/discovery/2026-09-30-universal-structural-policy
          OUT="$DIR/CPC_RANK20_RANK32_CONSEQUENCE_EXCHANGE_CENSUS_0_1.json"
          node "$DIR/run-cpc-rank20-rank32-consequence-exchange-census.mjs" > "$OUT"
          node - "$OUT" <<'NODE'
          const fs=require('fs');const r=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          console.log(JSON.stringify({
            sourceTransitionCount:r.sourceTransitionCount,
            distinctSourceQClasses:r.distinctSourceQClasses,
            repeatedSourceQClassCount:r.repeatedSourceQClassCount,
            motifGroups:r.motifGroups,
            sourceQPreservingConnected:r.repeatedClasses.filter(x=>x.sourceQPreservingSwapDistance!==null).length
          }));
          NODE
      - name: Commit durable exchange census
        shell: bash
        run: |
          set -euo pipefail
          BRANCH=research/universal-structural-policy-20260930
          FILE=research/isograph/discovery/2026-09-30-universal-structural-policy/CPC_RANK20_RANK32_CONSEQUENCE_EXCHANGE_CENSUS_0_1.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$FILE"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research: record rank32 consequence exchange census"
          git pull --rebase origin "$BRANCH"
          git push origin HEAD:"$BRANCH"
