name: IsoMax Lazy SMP Shared Cache Capacity Sweep

on:
  push:
    branches:
      - work/isomax-jsminsys-boundary-cleanup
    paths:
      - '.github/workflows/isomax-lazy-smp-capacity.yml'
      - 'tools/bench-lazy-smp-capacity.mjs'
  workflow_dispatch:

jobs:
  sweep:
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          submodules: recursive
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '26.7.0'
          cache: npm
      - run: npm ci
      - name: Four-worker mask-7 shared-cache capacity sweep
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          function Use-JSMinSys([string]$sha) {
            git -C vendor/jsminsys cat-file -e "$sha^{commit}" 2>$null
            if ($LASTEXITCODE -ne 0) {
              git -C vendor/jsminsys fetch --no-tags origin $sha
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            }
            git -C vendor/jsminsys checkout --detach $sha
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            Write-Host "JSMS_HEAD $((git -C vendor/jsminsys rev-parse HEAD).Trim())"
          }

          $candidate='3966486bf6c630ff017d30f855bcf7bdfa6645c8'
          Use-JSMinSys $candidate

          foreach ($capacity in 65536,4096,8192,16384,32768,131072,65536) {
            Write-Host "CAPACITY_SWEEP sharedCacheCapacity=$capacity"
            node --experimental-ffi tools/bench-lazy-smp-capacity.mjs $capacity
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
