name: IsoMax direct sufficiency holdout

on:
  push:
    branches:
      - experiment/isomax-direct-sufficiency-holdout-20260929
    paths:
      - '.github/workflows/isomax-direct-sufficiency-holdout.yml'
      - 'research/isograph/discovery/2026-09-29-isomax-direct-sufficiency-holdout/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  holdout:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 0}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with: {node-version: '26'}
      - name: Run fresh direct-sufficiency holdouts
        run: node research/isograph/discovery/2026-09-29-isomax-direct-sufficiency-holdout/run-direct-sufficiency-holdout.mjs
      - name: Research integrity
        run: node tools/verify-research-integrity.mjs
      - name: Commit holdout evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/isograph/discovery/2026-09-29-isomax-direct-sufficiency-holdout/DIRECT_SUFFICIENCY_HOLDOUT_0_1.json
          if git diff --cached --quiet; then echo "No generated changes."; else
            git commit -m "research(isomax): freeze direct sufficiency holdout"
            git push origin HEAD:experiment/isomax-direct-sufficiency-holdout-20260929
          fi
