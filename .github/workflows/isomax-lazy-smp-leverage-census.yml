name: IsoMax Lazy SMP Leverage Census

on:
  push:
    branches:
      - work/isomax-jsminsys-boundary-cleanup
    paths:
      - '.github/workflows/isomax-lazy-smp-leverage-census.yml'
      - 'tools/bench-lazy-smp-leverage.mjs'
  workflow_dispatch:

jobs:
  census:
    runs-on: windows-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          submodules: recursive
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '26.7.0'
          cache: npm
      - run: npm ci
      - name: Checkout leverage-instrumented JSMinSys
        shell: pwsh
        run: |
          $sha='79a54026ded43d36e917a40d0513adf6154b01af'
          git -C vendor/jsminsys fetch --no-tags origin $sha
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C vendor/jsminsys checkout --detach $sha
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Solved control winner-critical leverage
        shell: pwsh
        run: |
          1..4 | ForEach-Object {
            node --experimental-ffi tools/bench-lazy-smp-leverage.mjs 45461667 30000
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Late exact-position winner-critical leverage
        shell: pwsh
        run: |
          1..4 | ForEach-Object {
            node --experimental-ffi tools/bench-lazy-smp-leverage.mjs LATE 30000
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Hard-position cross-worker leverage
        shell: pwsh
        run: |
          node --experimental-ffi tools/bench-lazy-smp-leverage.mjs 13333111 15000
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --experimental-ffi tools/bench-lazy-smp-leverage.mjs EMPTY 15000
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
