# Branch Manager optimization campaign: attachment-stamp reuse
# Corrected Branch Manager scaling: manager-owned dedupe/cleanup
name: IsoMax Branch Manager Scaling

on:
  push:
    branches:
      - work/isomax-jsminsys-rebuild
    paths:
      - '.github/workflows/isomax-branch-manager-scaling.yml'
  workflow_dispatch:

jobs:
  scaling:
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          submodules: recursive
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '26.7.0'
          cache: npm
      - run: npm ci
      - name: Branch Manager 1-2-4 scaling
        shell: pwsh
        run: node --experimental-ffi tools/bench-isomax-branch-manager.mjs
