name: Frontier direct packed semantic hash A-B

on:
  push:
    branches: [research/frontier-negamax-conformance]
    paths: ['.github/workflows/frontier-direct-semantic-hash-ab.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  paired:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26.7.0
      - name: Generate qualify and pair
        shell: bash
        run: |
          set -euo pipefail
          base=0c0e6f0eae896540cdfbc1991307d90d105606fd
          baseline="$RUNNER_TEMP/baseline"
          candidate="$RUNNER_TEMP/candidate"
          git worktree add --detach "$baseline" "$base"
          git worktree add --detach "$candidate" "$base"

          cat > "$RUNNER_TEMP/patch.mjs" <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          const root = process.argv[2];
          function load(relative) { return [path.join(root, relative), fs.readFileSync(path.join(root, relative), 'utf8')]; }
          function save(file, source) { fs.writeFileSync(file, source); }
          function uniqueIndex(source, marker, relative) {
            const first = source.indexOf(marker);
            if (first < 0) throw new Error(`missing source seam: ${relative}: ${marker}`);
            if (source.indexOf(marker, first + 1) >= 0) throw new Error(`non-unique source seam: ${relative}: ${marker}`);
            return first;
          }
          function insertBefore(relative, marker, insertion) {
            const [file, source] = load(relative);
            const at = uniqueIndex(source, marker, relative);
            save(file, source.slice(0, at) + insertion + source.slice(at));
          }
          function replaceRange(relative, startMarker, endMarker, replacement) {
            const [file, source] = load(relative);
            const start = uniqueIndex(source, startMarker, relative);
            const endStart = source.indexOf(endMarker, start + startMarker.length);
            if (endStart < 0) throw new Error(`missing end seam: ${relative}: ${endMarker}`);
            if (source.indexOf(endMarker, endStart + 1) >= 0) throw new Error(`non-unique end seam: ${relative}: ${endMarker}`);
            const end = endStart + endMarker.length;
            save(file, source.slice(0, start) + replacement + source.slice(end));
          }

          const residual = 'research/semantic-quotient/state-identity-unification/src/quotient-slot64-residual-pool-v2.mjs';
          const semanticMethod = [
            '  // Canonical packed chunks already contain the exact ordered residual terms.',
            '  // Hash directly from those DWORDs instead of materializing Uint16 term IDs',
            '  // and traversing them a second time. Hash is only an address filter.',
            '  pool.writeSemanticMetadata = function slot64WriteSemanticMetadata(id, target) {',
            '    assertClassId(id);',
            "    if (!target || typeof target !== 'object' || Array.isArray(target) || Object.isFrozen(target)) {",
            "      throw new TypeError('slot64 semantic metadata target must be mutable');",
            '    }',
            '    let hashLo = 0x811c9dc5;',
            '    let hashHi = 0x9e3779b9;',
            '    let index = 0;',
            '    for (let slot = 0; slot < CHUNKS_PER_CLASS; slot += 1) {',
            '      const chunkId = classSlotIds[slot][id];',
            '      if (chunkId === 0) continue;',
            '      const words = slotPools[slot].words;',
            '      const base = chunkId * CHUNK_WORDS;',
            '      const termBase = slot << 6;',
            '      let active = words[base] | 0;',
            '      while (active !== 0) {',
            '        const termId = termBase + 31 - Math.clz32(active & -active);',
            '        if (termId >= vocabulary.count) throw new Error(`slot64 semantic term ${termId} exceeds vocabulary`);',
            '        const term = (termId + 1) >>> 0;',
            '        hashLo = Math.imul(hashLo ^ term, 0x01000193) >>> 0;',
            '        hashLo = mix32(hashLo ^ index);',
            '        hashHi = Math.imul(hashHi ^ term, 0x85ebca6b) >>> 0;',
            '        hashHi = mix32(hashHi ^ index);',
            '        index += 1;',
            '        active &= active - 1;',
            '      }',
            '      active = words[base + 1] | 0;',
            '      while (active !== 0) {',
            '        const termId = termBase + 63 - Math.clz32(active & -active);',
            '        if (termId >= vocabulary.count) throw new Error(`slot64 semantic term ${termId} exceeds vocabulary`);',
            '        const term = (termId + 1) >>> 0;',
            '        hashLo = Math.imul(hashLo ^ term, 0x01000193) >>> 0;',
            '        hashLo = mix32(hashLo ^ index);',
            '        hashHi = Math.imul(hashHi ^ term, 0x85ebca6b) >>> 0;',
            '        hashHi = mix32(hashHi ^ index);',
            '        index += 1;',
            '        active &= active - 1;',
            '      }',
            '    }',
            '    if (index !== classTermCounts[id]) {',
            '      throw new Error(`slot64 semantic term count drift: expected ${classTermCounts[id]}, hashed ${index}`);',
            '    }',
            '    target.length = index;',
            '    target.hashLo = mix32(hashLo ^ index);',
            '    target.hashHi = mix32(hashHi ^ index);',
            '    return target;',
            '  };',
            '',
          ].join('\n');
          insertBefore(residual, '  pool.writeTermIds = function slot64WriteTermIds(id, target, offset = 0) {', semanticMethod);

          const descriptor = 'research/semantic-quotient/state-identity-unification/src/quotient-local-semantic-descriptor.mjs';
          insertBefore(descriptor, '  const stateHashScratch = { lo: 0, hi: 0 };', [
            "  const directClassMetadata = typeof kernel.classes.writeSemanticMetadata === 'function';",
            '  const directClassScratch = { length: 0, hashLo: 0, hashHi: 0 };',
          ].join('\n') + '\n');
          replaceRange(descriptor,
            '    writeClassTerms(classId, termScratch, 0, length);',
            '    classHashReady[word] |= bit;',
            [
              '    if (directClassMetadata) {',
              '      kernel.classes.writeSemanticMetadata(classId, directClassScratch);',
              '      if (directClassScratch.length !== length) {',
              '        throw new Error(`semantic class ${classId} direct length drift: expected ${length}, got ${directClassScratch.length}`);',
              '      }',
              '      classHashLo[classId] = directClassScratch.hashLo;',
              '      classHashHi[classId] = directClassScratch.hashHi;',
              '    } else {',
              '      writeClassTerms(classId, termScratch, 0, length);',
              '      hashResidualTermIds(termScratch, length, classHashScratch);',
              '      classHashLo[classId] = classHashScratch.lo;',
              '      classHashHi[classId] = classHashScratch.hi;',
              '    }',
              '    classHashReady[word] |= bit;',
            ].join('\n'));
          NODE
          node "$RUNNER_TEMP/patch.mjs" "$candidate"
          git -C "$candidate" diff --check

          node --test "$candidate/research/semantic-quotient/state-identity-unification/src/quotient-storage-contract.test.mjs"
          node --test "$candidate/research/semantic-quotient/state-identity-unification/src/quotient-semantic-arena-contract.test.mjs"
          node "$candidate/research/semantic-quotient/state-identity-unification/src/quotient-slot64-residual-campaign.mjs"
          node "$candidate/research/semantic-quotient/state-identity-unification/src/quotient-semantic-tt-replacement-campaign.mjs"

          cat > "$RUNNER_TEMP/case.mjs" <<'NODE'
          import { performance } from 'node:perf_hooks';
          import { resolve } from 'node:path';
          import { pathToFileURL } from 'node:url';
          const tree = process.argv[2], variant = process.argv[3];
          const src = resolve(tree, 'research/semantic-quotient/state-identity-unification/src');
          const load = async name => import(pathToFileURL(resolve(src, name)).href);
          const { createSlot64ResidualQuotientKernel } = await load('quotient-native-negamax-slot64-residual-kernel.mjs');
          const { createSemanticSharedTtArena } = await load('quotient-semantic-shared-tt.mjs');
          const { createOnlineSemanticQuotientSearcher } = await load('quotient-online-semantic-search-lib.mjs');
          const { createBoundedStoragePlan } = await load('quotient-bounded-storage-plan.mjs');
          const domain = { columns: 7, rows: 6, connect: 4 };
          const { kernel } = createSlot64ResidualQuotientKernel(domain, { cacheEdges: true, prefixClasses: 4096 });
          const plan = createBoundedStoragePlan(kernel, 8, 2048 * 1048576);
          kernel.prepareSearchStorage(plan.searchStorage);
          const arena = createSemanticSharedTtArena({ ...plan.arena, domainSpec: domain });
          const searcher = createOnlineSemanticQuotientSearcher(kernel, arena, { etc: false });
          const before = kernel.storageGrowthStats();
          const cpuStart = process.cpuUsage();
          const start = performance.now();
          const result = searcher.searchBounded(kernel.rootId, -2, 2, 8);
          const searchMs = performance.now() - start;
          const cpu = process.cpuUsage(cpuStart);
          const after = kernel.storageGrowthStats();
          if (JSON.stringify(before) !== JSON.stringify(after)) throw new Error('storage grew during search');
          const stats = searcher.stats();
          console.log(JSON.stringify({ variant, searchMs, cpuMs:(cpu.user+cpu.system)/1000,
            kernelBytes:kernel.memoryStats().totalTypedBytes,
            descriptorBytes:stats.descriptorCache.retainedTypedBytes + stats.descriptorCache.scratchBytes,
            rss:process.memoryUsage().rss,
            directTermWrites:stats.descriptorCache.directTermWrites,
            directTermIdsWritten:stats.descriptorCache.directTermIdsWritten,
            classBuilds:stats.descriptorCache.classBuilds,
            maxBucketScan:stats.semanticTt.maxBucketScan,
            invariant:{result,search:stats.search,proofStore:stats.proofStore,localStates:stats.localStates,
              localClasses:stats.localClasses,transitionMetrics:kernel.transitionMetrics,stateMetrics:kernel.states.metrics,growth:after}}));
          NODE

          run_case() {
            label="$1"; tree="$2"; n="$3"; out="$RUNNER_TEMP/r$n.json"
            node --expose-gc "$RUNNER_TEMP/case.mjs" "$tree" "$label" > "$out"
            N="$n" OUT="$out" node - <<'NODE'
          const fs=require('node:fs'),d=JSON.parse(fs.readFileSync(process.env.OUT,'utf8'));
          console.log('PAIR_RESULT='+JSON.stringify({n:+process.env.N,variant:d.variant,searchMs:d.searchMs,cpuMs:d.cpuMs,
            kernelBytes:d.kernelBytes,descriptorBytes:d.descriptorBytes,rss:d.rss,directTermWrites:d.directTermWrites,
            directTermIdsWritten:d.directTermIdsWritten,classBuilds:d.classBuilds,maxBucketScan:d.maxBucketScan,
            calls:d.invariant.search.calls,expanded:d.invariant.search.expanded,states:d.invariant.localStates,classes:d.invariant.localClasses}));
          NODE
          }

          node "$RUNNER_TEMP/case.mjs" "$candidate" candidate >/dev/null
          node "$RUNNER_TEMP/case.mjs" "$baseline" baseline >/dev/null
          node "$RUNNER_TEMP/case.mjs" "$baseline" baseline >/dev/null
          node "$RUNNER_TEMP/case.mjs" "$candidate" candidate >/dev/null
          run_case baseline "$baseline" 1
          run_case candidate "$candidate" 2
          run_case candidate "$candidate" 3
          run_case baseline "$baseline" 4
          run_case candidate "$candidate" 5
          run_case baseline "$baseline" 6
          run_case baseline "$baseline" 7
          run_case candidate "$candidate" 8

          RUNNER_TEMP="$RUNNER_TEMP" node - <<'NODE'
          const fs=require('node:fs'),path=require('node:path');
          const rows=[];for(let i=1;i<=8;i++)rows.push(JSON.parse(fs.readFileSync(path.join(process.env.RUNNER_TEMP,`r${i}.json`),'utf8')));
          const a=rows.filter(x=>x.variant==='baseline'),b=rows.filter(x=>x.variant==='candidate');
          const invariant=JSON.stringify(a[0].invariant);for(const x of rows)if(JSON.stringify(x.invariant)!==invariant)throw Error('work invariant mismatch');
          const mean=(x,k)=>x.reduce((s,r)=>s+r[k],0)/x.length;
          const med=(x,k)=>{const v=x.map(r=>r[k]).sort((p,q)=>p-q);return(v[1]+v[2])/2};
          console.log('PAIR_SUMMARY='+JSON.stringify({baselineSearchMeanMs:mean(a,'searchMs'),candidateSearchMeanMs:mean(b,'searchMs'),
            searchMeanRatio:mean(b,'searchMs')/mean(a,'searchMs'),baselineSearchMedianMs:med(a,'searchMs'),candidateSearchMedianMs:med(b,'searchMs'),
            searchMedianRatio:med(b,'searchMs')/med(a,'searchMs'),baselineCpuMeanMs:mean(a,'cpuMs'),candidateCpuMeanMs:mean(b,'cpuMs'),
            cpuMeanRatio:mean(b,'cpuMs')/mean(a,'cpuMs'),baselineKernelBytes:a[0].kernelBytes,candidateKernelBytes:b[0].kernelBytes,
            baselineDescriptorBytes:a[0].descriptorBytes,candidateDescriptorBytes:b[0].descriptorBytes,
            baselineDirectTermWrites:a[0].directTermWrites,candidateDirectTermWrites:b[0].directTermWrites,
            baselineDirectTermIdsWritten:a[0].directTermIdsWritten,candidateDirectTermIdsWritten:b[0].directTermIdsWritten,
            baselineClassBuilds:a[0].classBuilds,candidateClassBuilds:b[0].classBuilds,
            baselineMaxBucketScan:Math.max(...a.map(x=>x.maxBucketScan)),candidateMaxBucketScan:Math.max(...b.map(x=>x.maxBucketScan)),invariantMatch:true}));
          NODE
