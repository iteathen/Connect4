name: Connect4 q_o redundancy audit

on:
  push:
    branches:
      - research/rank-sufficient-qg-dg-20260929
    paths:
      - '.github/workflows/connect4-qgdg-qo-redundancy.yml'
      - 'research/isograph/discovery/2026-09-29-rank-sufficient-qg-dg/run-qo-redundancy-audit.mjs'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 0}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with: {node-version: '26'}
      - name: Run q_o redundancy audit
        run: node research/isograph/discovery/2026-09-29-rank-sufficient-qg-dg/run-qo-redundancy-audit.mjs
      - name: Research integrity
        run: node tools/verify-research-integrity.mjs
      - name: Commit redundancy evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/isograph/discovery/2026-09-29-rank-sufficient-qg-dg/QO_REDUNDANCY_AUDIT_0_1.json
          if git diff --cached --quiet; then echo "No generated changes."; else
            git commit -m "research(connect4): freeze q_o redundancy audit"
            git push origin HEAD:research/rank-sufficient-qg-dg-20260929
          fi
