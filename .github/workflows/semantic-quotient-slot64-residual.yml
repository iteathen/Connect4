name: Slot-local 64-bit residual pool

on:
  push:
    branches:
      - research/semantic-quotient
      - research/frontier-negamax-conformance
    paths:
      - '.github/workflows/semantic-quotient-slot64-residual.yml'
      - 'components/bsfp/geometry.mjs'
      - 'components/bsfp/ownership-antichain-solver.mjs'
      - 'components/bsfp/support-lattice.mjs'
      - 'research/semantic-quotient/state-identity-unification/src/quotient-live-line-move-order.mjs'
      - 'research/semantic-quotient/state-identity-unification/src/quotient-local-proof-store.mjs'
      - 'research/semantic-quotient/state-identity-unification/src/quotient-native-negamax-scaled-term-id-kernel.mjs'
      - 'research/semantic-quotient/state-identity-unification/src/quotient-native-negamax-slot64-residual-kernel.mjs'
      - 'research/semantic-quotient/state-identity-unification/src/quotient-native-negamax-support-layout-kernel.mjs'
      - 'research/semantic-quotient/state-identity-unification/src/quotient-negamax-domain-contract.mjs'
      - 'research/semantic-quotient/state-identity-unification/src/quotient-negamax-engine.mjs'
      - 'research/semantic-quotient/state-identity-unification/src/quotient-slot64-residual-campaign.mjs'
      - 'research/semantic-quotient/state-identity-unification/src/quotient-slot64-residual-pool-v2.mjs'
      - 'research/semantic-quotient/state-identity-unification/src/quotient-storage-contract.test.mjs'
      - 'research/semantic-quotient/state-identity-unification/src/quotient-term-id-pool.mjs'
      - 'research/semantic-quotient/state-identity-unification/src/quotient-term-id-prefix-pool.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    name: Qualify slot-local 64-bit residual pool
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26.7.0
      - name: Run slot64 residual qualification campaign
        run: node --expose-gc --max-old-space-size=6144 research/semantic-quotient/state-identity-unification/src/quotient-slot64-residual-campaign.mjs
      - name: Exercise storage value and allocation boundaries
        run: node --test research/semantic-quotient/state-identity-unification/src/quotient-storage-contract.test.mjs
