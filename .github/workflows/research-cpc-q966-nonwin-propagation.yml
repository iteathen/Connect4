name: Research CPC q966 nonwin propagation audit

concurrency:
  group: cpc-q966-nonwin-propagation-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [research/universal-structural-policy-20260930]
    paths:
      - .github/workflows/research-cpc-q966-nonwin-propagation.yml
      - research/isograph/discovery/2026-09-30-universal-structural-policy/CPC_Q966_NONWIN_PROPAGATION_SURVIVING_G_AUDIT_DESIGN_0_1.md
      - research/isograph/discovery/2026-09-30-universal-structural-policy/test-cpc-q966-nonwin-propagation-surviving-g-audit.mjs
      - research/isograph/discovery/2026-09-30-universal-structural-policy/run-cpc-q966-nonwin-propagation-surviving-g-audit.mjs
      - research/isograph/discovery/2026-09-30-universal-structural-policy/CPC_RANK32_Q966_EXTENDED_REPAIR_COMPOSITION_0_1.json
      - research/isograph/discovery/2026-09-30-universal-structural-policy/CPC_Q2DB_TWO_COLUMN_TERMINAL_EXPOSURE_0_1.json
      - research/isograph/discovery/2026-09-30-universal-structural-policy/CPC_Q2DB_FORCED_TERMINAL_SAFETY_CHAIN_0_1.json
      - research/isograph/discovery/2026-09-30-universal-structural-policy/CPC_Q649_TWO_REPLY_CONSEQUENCE_CLASS_CLOSURE_0_1.json
      - research/isograph/discovery/2026-09-30-universal-structural-policy/CPC_Q5D34_STRUCTURAL_NONWIN_BACKPROP_0_1.json
      - research/isograph/discovery/2026-09-30-universal-structural-policy/rlc-proof-library-catalog.mjs

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {fetch-depth: 0}
      - name: Check out pinned JSMinSys authority
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: iteathen/JSMinSys
          ref: bf23d3a67652cd42e1975f29c7dc4eed54f7eb42
          path: .jsminsys
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: {node-version: 26.7.0}
      - name: Verify frozen q966 nonwin propagation
        run: node research/isograph/discovery/2026-09-30-universal-structural-policy/test-cpc-q966-nonwin-propagation-surviving-g-audit.mjs "$GITHUB_WORKSPACE/.jsminsys"
      - name: Generate durable q966 nonwin evidence
        shell: bash
        run: |
          set -euo pipefail
          DIR=research/isograph/discovery/2026-09-30-universal-structural-policy
          OUT="$DIR/CPC_Q966_NONWIN_PROPAGATION_SURVIVING_G_AUDIT_0_1.json"
          node "$DIR/run-cpc-q966-nonwin-propagation-surviving-g-audit.mjs" "$GITHUB_WORKSPACE/.jsminsys" > "$OUT"
          node - "$OUT" <<'NODE'
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          console.log(JSON.stringify({
            classification:r.classification,
            interval:r.interval,
            q2db:r.q2dbPremise,
            q5d:r.q5dPremise,
            root:r.rootActions
          }));
          NODE
      - name: Commit durable q966 nonwin evidence
        shell: bash
        run: |
          set -euo pipefail
          BRANCH=research/universal-structural-policy-20260930
          FILE=research/isograph/discovery/2026-09-30-universal-structural-policy/CPC_Q966_NONWIN_PROPAGATION_SURVIVING_G_AUDIT_0_1.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$FILE"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research: record q966 nonwin propagation audit"
          git pull --rebase origin "$BRANCH"
          git push origin HEAD:"$BRANCH"
