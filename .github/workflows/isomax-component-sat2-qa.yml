name: IsoMax component SAT2 QA audit

on:
  push:
    branches:
      - experiment/isomax-component-sat2-qa-20260929
    paths:
      - '.github/workflows/isomax-component-sat2-qa.yml'
      - 'research/isograph/discovery/2026-09-29-isomax-component-sat2-qa/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 0}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with: {node-version: '26'}
      - name: Run seven-case component QA audit
        run: node research/isograph/discovery/2026-09-29-isomax-component-sat2-qa/run-component-multiplicity-qa.mjs
      - name: Research integrity
        run: node tools/verify-research-integrity.mjs
      - name: Commit QA evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/isograph/discovery/2026-09-29-isomax-component-sat2-qa/COMPONENT_MULTIPLICITY_QA_AUDIT_0_1.json
          if git diff --cached --quiet; then echo "No generated changes."; else
            git commit -m "research(isomax): freeze component SAT2 QA evidence"
            git push origin HEAD:experiment/isomax-component-sat2-qa-20260929
          fi
