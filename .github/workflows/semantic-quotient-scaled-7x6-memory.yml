name: Scaled quotient 7x6 memory summary

on:
  push:
    branches:
      - research/semantic-quotient
    paths:
      - 'research/semantic-quotient/state-identity-unification/src/quotient-scaled-7x6-memory-summary.mjs'
      - '.github/workflows/semantic-quotient-scaled-7x6-memory.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  summarize:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26.7.0
      - run: node research/semantic-quotient/state-identity-unification/src/quotient-scaled-7x6-memory-summary.mjs
