name: Frontier G3 mu16 target-support falsifier routing

on:
  push:
    branches:
      - research/frontier-negamax-conformance
    paths:
      - research/semantic-quotient/state-identity-unification/src/quotient-standard7x6-g3-mu16-target-support-falsifier-routing.mjs
      - .github/workflows/frontier-g3-mu16-target-support-falsifier-routing.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  routing:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      roots: ${{ steps.run.outputs.roots }}
      branches: ${{ steps.run.outputs.branches }}
      p1_terminal: ${{ steps.run.outputs.p1_terminal }}
      p0_terminal: ${{ steps.run.outputs.p0_terminal }}
      consumed: ${{ steps.run.outputs.consumed }}
      deviations: ${{ steps.run.outputs.deviations }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26.7.0
      - name: Qualify target-support routing on shared mu16 falsifiers
        id: run
        shell: bash
        run: |
          set -euo pipefail
          f="$RUNNER_TEMP/g3-mu16-target-support.txt"
          timeout 270s node research/semantic-quotient/state-identity-unification/src/quotient-standard7x6-g3-mu16-target-support-falsifier-routing.mjs | tee "$f"
          RESULT_FILE="$f" node <<'NODE'
          const fs=require('node:fs');
          const line=fs.readFileSync(process.env.RESULT_FILE,'utf8').split(/\r?\n/).find(x=>x.startsWith('G3_MU16_TARGET_SUPPORT_FALSIFIER_ROUTING='));
          if(!line) throw new Error('target-support falsifier routing summary missing');
          const x=JSON.parse(line.slice(line.indexOf('=')+1));
          if(x.exactFalsifiers!==2) throw new Error('mu16 falsifier inventory drift');
          const c=x.routeCounts||{};
          fs.appendFileSync(process.env.GITHUB_OUTPUT,[
            `roots=${x.exactFalsifiers}`,
            `branches=${x.branchCount}`,
            `p1_terminal=${c.P1_terminal||0}`,
            `p0_terminal=${c.immediate_P0_terminal||0}`,
            `consumed=${c.target_consumed_nonterminal||0}`,
            `deviations=${c.target_support_deviation_nonterminal||0}`,
          ].join('\n')+'\n');
          NODE

  summary:
    needs: routing
    name: g3target-r${{ needs.routing.outputs.roots }}-b${{ needs.routing.outputs.branches }}-pt${{ needs.routing.outputs.p1_terminal }}-p0${{ needs.routing.outputs.p0_terminal }}-c${{ needs.routing.outputs.consumed }}-d${{ needs.routing.outputs.deviations }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - run: echo "G3 mu16 target-support routing counts encoded in job name"
