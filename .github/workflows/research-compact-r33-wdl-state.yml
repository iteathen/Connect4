name: Research compact rank33 WDL state artifact

on:
  push:
    branches:
      - research/semantic-quotient
    paths:
      - '.github/workflows/research-compact-r33-wdl-state.yml'

permissions:
  contents: read
  actions: read

jobs:
  compact:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26.7.0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: wdl-shell-r33
          path: ${{ runner.temp }}/full
          github-token: ${{ github.token }}
          repository: iteathen/Connect4
          run-id: 38937734403
      - name: Extract rank33 state boundaries only
        run: |
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import crypto from 'node:crypto';
          const src=path.join(process.env.RUNNER_TEMP,'full');
          const dst=path.join(process.env.RUNNER_TEMP,'r33-state');
          fs.mkdirSync(dst,{recursive:true});
          let supports=0,upper=0,lower=0;
          const manifest=[];
          for(const name of fs.readdirSync(src).filter(x=>x.endsWith('.json'))){
            let meta;
            try{meta=JSON.parse(fs.readFileSync(path.join(src,name),'utf8'));}catch{continue;}
            if(meta.rank!==33||!Array.isArray(meta.support)||!Number.isInteger(meta.upper)||!Number.isInteger(meta.lower))continue;
            const base=name.slice(0,-5);
            for(const suffix of ['.json','.U.hex','.L.hex'])fs.copyFileSync(path.join(src,base+suffix),path.join(dst,base+suffix));
            supports++;upper+=meta.upper;lower+=meta.lower;
            manifest.push([base,meta.upper_sha256,meta.lower_sha256,meta.upper,meta.lower]);
          }
          manifest.sort((a,b)=>a[0].localeCompare(b[0]));
          if(supports!==4809||upper!==2049203||lower!==5999813)throw new Error('rank33 compact totals mismatch');
          const manifestText=JSON.stringify({schema:'wdl-r33-state-v0_1',supports,upper,lower,manifest},null,2)+'\n';
          fs.writeFileSync(path.join(dst,'manifest.json'),manifestText);
          console.log(JSON.stringify({supports,upper,lower,generators:upper+lower,manifestSha256:crypto.createHash('sha256').update(manifestText).digest('hex')},null,2));
          NODE
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: wdl-r33-state
          path: ${{ runner.temp }}/r33-state
          if-no-files-found: error
          retention-days: 7
