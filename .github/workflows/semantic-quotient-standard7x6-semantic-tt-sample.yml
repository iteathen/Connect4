name: Quotient standard 7x6 semantic TT density sample

on:
  push:
    branches:
      - research/semantic-quotient
    paths:
      - 'research/semantic-quotient/state-identity-unification/src/quotient-standard7x6-semantic-tt-sample.mjs'
      - '.github/workflows/semantic-quotient-standard7x6-semantic-tt-sample.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  EXPAND_THROUGH_RANK: '8'
  SAMPLES_PER_RANK: '12000'
  PREFIX_CLASSES: '4096'
  TARGET_LOAD: '0.65'

jobs:
  sample:
    name: Sample standard 7x6 semantic TT density
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26.7.0
      - name: Run semantic TT density sample
        run: >-
          node --expose-gc --max-old-space-size=6144
          research/semantic-quotient/state-identity-unification/src/quotient-standard7x6-semantic-tt-sample.mjs
