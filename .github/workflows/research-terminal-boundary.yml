name: research-terminal-boundary
on:
  push:
    branches:
      - research/low-confidence-survival-2026-09-09

permissions:
  contents: read

jobs:
  terminal-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26.7.0
      - run: node reference/research-prototypes/2026-09-09-low-confidence-survival/terminal_boundary_qualify.mjs
      - run: node reference/research-prototypes/2026-09-09-low-confidence-survival/terminal_known_fixture_qualify.mjs
