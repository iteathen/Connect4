name: Research CPCX U30 anchor pivot

on:
  push:
    branches:
      - experiment/cpcx-20261002
    paths:
      - research/isograph/discovery/2026-10-02-cpcx/run-uc4a-cpcx-u30-a-cycle-anchor-pivot.mjs
      - .github/workflows/research-cpcx-u30-anchor-pivot.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "26.7.0"
      - run: node research/isograph/discovery/2026-10-02-cpcx/run-uc4a-cpcx-u30-a-cycle-anchor-pivot.mjs > u30-anchor-pivot.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: u30-anchor-pivot
          path: u30-anchor-pivot.json
          if-no-files-found: error
