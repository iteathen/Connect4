name: Research CPC rank26 reply7 structural continuation probe

on:
  push:
    branches:
      - research/universal-structural-policy-20260930
    paths:
      - .github/workflows/research-cpc-rank26-reply7-structural-probe.yml
      - research/isograph/discovery/2026-09-30-universal-structural-policy/CPC_RANK26_REPLY7_STRUCTURAL_CONTINUATION_PROBE_DESIGN_0_1.md
      - research/isograph/discovery/2026-09-30-universal-structural-policy/test-cpc-rank26-reply7-structural-continuation-probe.mjs
      - research/isograph/discovery/2026-09-30-universal-structural-policy/run-cpc-rank26-reply7-structural-continuation-probe.mjs

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26.7.0
      - name: Fetch pinned JSMinSys authority
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/iteathen/JSMinSys.git jsminsys
          git -C jsminsys checkout bf23d3a67652cd42e1975f29c7dc4eed54f7eb42
          test -z "$(git -C jsminsys status --porcelain)"
      - name: Verify frozen structural probe contract
        run: node research/isograph/discovery/2026-09-30-universal-structural-policy/test-cpc-rank26-reply7-structural-continuation-probe.mjs ./jsminsys
      - name: Generate durable structural probe evidence
        shell: bash
        run: |
          set -euo pipefail
          DIR=research/isograph/discovery/2026-09-30-universal-structural-policy
          OUT="$DIR/CPC_RANK26_REPLY7_STRUCTURAL_CONTINUATION_PROBE_0_1.json"
          node "$DIR/run-cpc-rank26-reply7-structural-continuation-probe.mjs" ./jsminsys > "$OUT"
          node - "$OUT" <<'NODE'
          const fs=require('fs'),r=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          if(r.oracleUsed!==false||r.solvedInputsUsed!==false||r.ordinaryGameTreeSearchUsed!==false)throw new Error('forbidden value evidence');
          if(r.jsMinSysSha!=='bf23d3a67652cd42e1975f29c7dc4eed54f7eb42')throw new Error('authority drift');
          if(JSON.stringify(r.legalP1Moves)!=='[1,3,5,6,7]')throw new Error('legal move family drift');
          console.log(JSON.stringify({state:r.state,rows:r.rows.map(x=>({p1Column:x.p1Column,terminal:x.terminal,cpc:x.cpcForP2?.baseline??null,forcedChild:x.forcedChild??null}))}));
          NODE
      - name: Commit durable structural probe evidence
        shell: bash
        run: |
          set -euo pipefail
          BRANCH=research/universal-structural-policy-20260930
          FILE=research/isograph/discovery/2026-09-30-universal-structural-policy/CPC_RANK26_REPLY7_STRUCTURAL_CONTINUATION_PROBE_0_1.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$FILE"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research: record rank26 reply7 structural continuation probe"
          for attempt in 1 2 3; do
            git fetch origin "$BRANCH"
            git rebase --autostash "origin/$BRANCH"
            if git push origin HEAD:"$BRANCH"; then exit 0; fi
            sleep 1
          done
          exit 1
