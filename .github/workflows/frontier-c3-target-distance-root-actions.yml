name: Frontier C3 target-distance root actions

on:
  push:
    branches:
      - research/frontier-negamax-conformance
    paths:
      - research/semantic-quotient/state-identity-unification/src/quotient-standard7x6-target-distance-lexicographic-proof-lib.mjs
      - research/semantic-quotient/state-identity-unification/src/quotient-standard7x6-c3-target-distance-root-action-probe.mjs
      - .github/workflows/frontier-c3-target-distance-root-actions.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        root:
          - '466565554644757776'
          - '466565554644757777'
          - '466565554644767775'
        action: [A,B,C,D,E,F,G]
    name: c3-${{ matrix.root }}-${{ matrix.action }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26.7.0
      - name: Qualify isolated root action
        shell: bash
        env:
          ROOT_SEQUENCE: ${{ matrix.root }}
          ACTION: ${{ matrix.action }}
        run: |
          set -euo pipefail
          f="$RUNNER_TEMP/c3-${ROOT_SEQUENCE}-${ACTION}.txt"
          timeout 270s node --expose-gc research/semantic-quotient/state-identity-unification/src/quotient-standard7x6-c3-target-distance-root-action-probe.mjs | tee "$f"
          RESULT_FILE="$f" EXPECT_ROOT="$ROOT_SEQUENCE" EXPECT_ACTION="$ACTION" node <<'NODE'
          const fs=require('node:fs');
          const line=fs.readFileSync(process.env.RESULT_FILE,'utf8').split(/\r?\n/).find(x=>x.startsWith('C3_TARGET_DISTANCE_ROOT_ACTION_PROBE='));
          if(!line) throw new Error('root-action summary missing');
          const x=JSON.parse(line.slice(line.indexOf('=')+1));
          if(x.sequence!==process.env.EXPECT_ROOT||x.action!==process.env.EXPECT_ACTION) throw new Error('root-action identity drift');
          if(x.proofKind==='execution_error') throw new Error(`unexpected execution error: ${x.error}`);
          console.log(`C3_ROOT_ACTION_RESULT=${x.sequence}-${x.action}-proved${x.proved?1:0}-${x.proofKind}-states${x.stats.combinedProofStates}`);
          NODE
