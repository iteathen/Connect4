name: IsoMax Shifted Shared Slot Hard Check

on:
  push:
    branches:
      - work/isomax-jsminsys-boundary-cleanup
    paths:
      - '.github/workflows/isomax-lazy-smp-shifted-slot-hard.yml'
  workflow_dispatch:

jobs:
  hard:
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          submodules: recursive
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '26.7.0'
          cache: npm
      - run: npm ci
      - name: Baseline vs shifted slots on unresolved probes
        shell: pwsh
        run: |
          $baseline='04d37498607ace16dae33c79462ddfe1503c8a0d'
          $candidate='cb93c196b458b1a249f8dc5dfda1b1bd26ef3bc9'
          function Use-JSMinSys([string]$sha) {
            git -C vendor/jsminsys cat-file -e "$sha^{commit}" 2>$null
            if ($LASTEXITCODE -ne 0) {
              git -C vendor/jsminsys fetch --no-tags origin $sha
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            }
            git -C vendor/jsminsys checkout --detach $sha
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          foreach ($input in '13333111','EMPTY') {
            Write-Host "SHIFT_HARD $input baseline"
            Use-JSMinSys $baseline
            node --experimental-ffi tools/bench-lazy-smp-lead-census.mjs $input 7 7 65536 65536 15000
            Write-Host "SHIFT_HARD $input candidate"
            Use-JSMinSys $candidate
            node --experimental-ffi tools/bench-lazy-smp-lead-census.mjs $input 7 7 65536 65536 15000
          }
