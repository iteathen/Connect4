name: Research CPC rank27 c5 obstruction endpoint handoff

on:
  push:
    branches:
      - research/universal-structural-policy-20260930
    paths:
      - .github/workflows/research-cpc-rank27-c5-obstruction-endpoint-handoff.yml
      - research/isograph/discovery/2026-09-30-universal-structural-policy/CPC_RANK27_C5_OBSTRUCTION_ENDPOINT_HANDOFF_THEOREM.md
      - research/isograph/discovery/2026-09-30-universal-structural-policy/test-cpc-rank27-c5-obstruction-endpoint-handoff.mjs
      - research/isograph/discovery/2026-09-30-universal-structural-policy/run-cpc-rank27-c5-obstruction-endpoint-handoff.mjs

permissions:
  contents: write

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26.7.0
      - name: Fetch pinned JSMinSys authority
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/iteathen/JSMinSys.git jsminsys
          git -C jsminsys checkout bf23d3a67652cd42e1975f29c7dc4eed54f7eb42
          test -z "$(git -C jsminsys status --porcelain)"
      - name: Verify frozen rank27 c5 handoff contract
        run: node research/isograph/discovery/2026-09-30-universal-structural-policy/test-cpc-rank27-c5-obstruction-endpoint-handoff.mjs ./jsminsys
      - name: Generate durable qualification evidence
        shell: bash
        run: |
          set -euo pipefail
          DIR=research/isograph/discovery/2026-09-30-universal-structural-policy
          OUT="$DIR/CPC_RANK27_C5_OBSTRUCTION_ENDPOINT_HANDOFF_0_1.json"
          node "$DIR/run-cpc-rank27-c5-obstruction-endpoint-handoff.mjs" ./jsminsys > "$OUT"
          node - "$OUT" <<'NODE'
          const fs=require('fs'),r=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          if(r.oracleUsed!==false||r.solvedInputsUsed!==false)throw new Error('forbidden solved evidence flag');
          if(r.jsMinSysSha!=='bf23d3a67652cd42e1975f29c7dc4eed54f7eb42')throw new Error('authority drift');
          if(r.accept!==true)throw new Error('rank27 c5 obstruction handoff rejected');
          if(r.rows.length!==5||r.rows.some(x=>x.accept!==true))throw new Error('not every legal defender reply is closed');
          console.log(JSON.stringify({accept:r.accept,state:r.state,rows:r.rows.map(x=>({defenderColumn:x.defenderColumn,kind:x.kind,accept:x.accept})),conclusion:r.conclusion}));
          NODE
      - name: Commit durable qualification evidence
        shell: bash
        run: |
          set -euo pipefail
          BRANCH=research/universal-structural-policy-20260930
          FILE=research/isograph/discovery/2026-09-30-universal-structural-policy/CPC_RANK27_C5_OBSTRUCTION_ENDPOINT_HANDOFF_0_1.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$FILE"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research: record rank27 c5 obstruction endpoint handoff"
          for attempt in 1 2 3; do
            git fetch origin "$BRANCH"
            git rebase --autostash "origin/$BRANCH"
            if git push origin HEAD:"$BRANCH"; then exit 0; fi
            sleep 1
          done
          exit 1
