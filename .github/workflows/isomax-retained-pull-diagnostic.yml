name: isomax-retained-pull-diagnostic

on:
  pull_request:
    paths:
      - 'components/isometric/execution/branch-manager.mjs'
      - 'components/isometric/execution/manager-worker.mjs'
      - 'components/isometric/execution/worker.mjs'
      - 'components/isometric/execution/shared-tt.mjs'
      - 'components/isometric/execution/shared-events.mjs'
      - 'components/isometric/execution/portable-q.mjs'
      - 'components/isometric/test/execution.test.mjs'
      - '.github/workflows/isomax-retained-pull-diagnostic.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  worker-death-recovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26.7.0
      - name: Shared-q worker death recovery
        run: node --test --test-name-pattern="dead evaluator" components/isometric/test/execution.test.mjs
