name: isomax-subtractive-cache-key-r2

on:
  push:
    branches:
      - experiment/isomax-subtractive-cache-key-r2
    paths:
      - 'components/isometric/isomax-index.mjs'
      - '.github/workflows/isomax-subtractive-cache-key-r2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hard-three-serial:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Setup exact Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26.7.0

      - name: Fetch exact baseline and candidate
        shell: bash
        env:
          BASE_SHA: a26ef2254c850243f68505eeff1d849ad0f4f0c0
        run: |
          set -euo pipefail
          uname -a
          echo "nproc=$(nproc)"
          lscpu
          echo "node=$(node --version)"
          git -c credential.helper= clone --no-tags "https://github.com/${GITHUB_REPOSITORY}.git" "$RUNNER_TEMP/candidate"
          git -C "$RUNNER_TEMP/candidate" checkout --detach "$GITHUB_SHA"
          git -c credential.helper= clone --no-tags "https://github.com/${GITHUB_REPOSITORY}.git" "$RUNNER_TEMP/baseline"
          git -C "$RUNNER_TEMP/baseline" checkout --detach "$BASE_SHA"
          test "$(git -C "$RUNNER_TEMP/candidate" rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C "$RUNNER_TEMP/baseline" rev-parse HEAD)" = "$BASE_SHA"

      - name: Paired subtractive falsifier
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/out"
          cd "$RUNNER_TEMP/candidate"
          node benchmarks/isomax-workers/compare-hot-loop.mjs "$RUNNER_TEMP/baseline" "$RUNNER_TEMP/out" serial three
          echo '=== RESULT ==='
          cat "$RUNNER_TEMP/out/result.json"
