name: Research CPC absolute ply-41 survival spectrum

on:
  push:
    branches:
      - research/universal-structural-policy-20260930
    paths:
      - .github/workflows/research-cpc-absolute-ply41-survival.yml
      - research/isograph/discovery/2026-09-30-universal-structural-policy/run-cpc-trigger-adaptive-renewal.mjs

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact pushed revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Pin Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26.7.0

      - name: Fetch pinned JSMinSys CPC/RBA authority
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/iteathen/JSMinSys.git jsminsys
          git -C jsminsys checkout 0899c5811918e68c22dc1b0e4dd8af97d9b4bbcb
          test "$(git -C jsminsys rev-parse HEAD)" = "0899c5811918e68c22dc1b0e4dd8af97d9b4bbcb"

      - name: Run structural spectrum to absolute ply 41
        shell: bash
        run: |
          set -euo pipefail
          OUT=research/isograph/discovery/2026-09-30-universal-structural-policy/CPC_ABSOLUTE_PLY41_SURVIVAL_SPECTRUM_0_1.json
          # Roots are rank 10. Relative horizon 31 reaches absolute ply 41.
          node research/isograph/discovery/2026-09-30-universal-structural-policy/run-cpc-trigger-adaptive-renewal.mjs ./jsminsys 31 > "$OUT"
          node - "$OUT" <<'NODE'
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          const summary=r.rows.map(x=>({
            id:x.id,
            highestAccepted:x.membership.filter(m=>m.accept).at(-1)?.D??null,
            firstFailure:x.membership.find(m=>!m.accept)?.D??null,
            D27:x.membership.find(m=>m.D===27)?.accept??null,
            D29:x.membership.find(m=>m.D===29)?.accept??null,
            D31:x.membership.find(m=>m.D===31)?.accept??null
          }));
          console.log('PLY41_SUMMARY='+JSON.stringify(summary));
          console.log('WORK='+JSON.stringify(r.work));
          NODE

      - name: Commit durable ply-41 evidence
        shell: bash
        run: |
          set -euo pipefail
          BRANCH=research/universal-structural-policy-20260930
          FILE=research/isograph/discovery/2026-09-30-universal-structural-policy/CPC_ABSOLUTE_PLY41_SURVIVAL_SPECTRUM_0_1.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$FILE"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research: verify structural survival to absolute ply 41"
          for attempt in 1 2 3; do
            git fetch origin "$BRANCH"
            git rebase "origin/$BRANCH"
            if git push origin HEAD:"$BRANCH"; then exit 0; fi
            sleep 1
          done
          exit 1
