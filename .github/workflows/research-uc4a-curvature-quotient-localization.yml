name: Research UC4A curvature quotient localization

concurrency:
  group: uc4a-curvature-quotient-localization-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - research/universal-structural-policy-20260930
    paths:
      - .github/workflows/research-uc4a-curvature-quotient-localization.yml
      - research/isograph/discovery/2026-09-30-universal-structural-policy/UC4A_CURVATURE_QUOTIENT_LOCALIZATION_EXPERIMENT_DESIGN_0_1.md
      - research/isograph/discovery/2026-09-30-universal-structural-policy/test-uc4a-curvature-quotient-localization.mjs
      - research/isograph/discovery/2026-09-30-universal-structural-policy/run-uc4a-curvature-quotient-localization.mjs
      - research/isograph/discovery/2026-09-30-universal-structural-policy/UC4A_SECOND_ORDER_CURVATURE_STRUCTURAL_0_1.json
      - research/isograph/discovery/2026-09-30-universal-structural-policy/UC4A_SECOND_ORDER_CURVATURE_ANALYSIS_0_1.json

permissions:
  contents: write

jobs:
  localize:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact pushed revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Pin Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26.7.0
      - name: Verify frozen localization contract
        run: node research/isograph/discovery/2026-09-30-universal-structural-policy/test-uc4a-curvature-quotient-localization.mjs
      - name: Generate localization evidence
        shell: bash
        run: |
          set -euo pipefail
          DIR=research/isograph/discovery/2026-09-30-universal-structural-policy
          OUT="$DIR/UC4A_CURVATURE_QUOTIENT_LOCALIZATION_0_1.json"
          node "$DIR/run-uc4a-curvature-quotient-localization.mjs" > "$OUT"
          node - "$OUT" <<'NODE'
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          if(r.curvatureRowCount!==101)throw new Error('unexpected curvature row count');
          if(r.sealedHoldoutsAccessed!==false)throw new Error('sealed holdout boundary violated');
          if(r.productionCpcModified!==false||r.jsMinSysModified!==false||r.bsfpModified!==false)throw new Error('read-only production boundary violated');
          console.log(JSON.stringify({
            integerNovelty:Object.fromEntries(Object.entries(r.part1.blockSubsetLocalization.integer).map(([k,v])=>[k,v.fullSpaceBoundaryNovelDimension])),
            minimalBlockCarriers:Object.fromEntries(Object.entries(r.part1.blockSubsetLocalization.integer).map(([k,v])=>[k,v.minimalFullNoveltyBlockSubsets])),
            minimalFieldCarrierCounts:Object.fromEntries(Object.entries(r.part3.primitiveFieldSubsetCensus).map(([k,v])=>[k,v.minimalFullNoveltyFieldSubsets.length])),
            quotientDirectionCounts:Object.fromEntries(Object.entries(r.part2.canonicalIntegerQuotients).map(([k,v])=>[k,v.directions.length])),
            focus:r.focus
          }));
          NODE
      - name: Commit durable localization evidence
        shell: bash
        run: |
          set -euo pipefail
          BRANCH=research/universal-structural-policy-20260930
          FILE=research/isograph/discovery/2026-09-30-universal-structural-policy/UC4A_CURVATURE_QUOTIENT_LOCALIZATION_0_1.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$FILE"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research: record UC4A curvature quotient localization"
          for attempt in 1 2 3; do
            git fetch origin "$BRANCH"
            git rebase --autostash "origin/$BRANCH"
            if git push origin HEAD:"$BRANCH"; then exit 0; fi
            sleep 1
          done
          exit 1
