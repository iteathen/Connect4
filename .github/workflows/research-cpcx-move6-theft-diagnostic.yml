name: Research CPCX move6 theft diagnostic

on:
  push:
    branches:
      - experiment/cpcx-20261002
    paths:
      - research/isograph/discovery/2026-10-02-cpcx/run-cpcx-move6-theft-setups.mjs
      - research/isograph/discovery/2026-10-02-cpcx/run-cpcx-move6-theft-two-ply.mjs
      - research/isograph/discovery/2026-10-02-cpcx/run-cpcx-move6-theft-vertical-transport.mjs
      - .github/workflows/research-cpcx-move6-theft-diagnostic.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "26.7.0"
      - name: Run theft setup diagnostic
        run: |
          node research/isograph/discovery/2026-10-02-cpcx/run-cpcx-move6-theft-setups.mjs > cpcx-move6-theft-setups.json
          node research/isograph/discovery/2026-10-02-cpcx/run-cpcx-move6-theft-two-ply.mjs > cpcx-move6-theft-two-ply.json
          node research/isograph/discovery/2026-10-02-cpcx/run-cpcx-move6-theft-vertical-transport.mjs > cpcx-move6-theft-vertical-transport.json
          node --input-type=module -e "
            import fs from 'node:fs';
            const x=JSON.parse(fs.readFileSync('cpcx-move6-theft-setups.json','utf8'));
            const y=JSON.parse(fs.readFileSync('cpcx-move6-theft-two-ply.json','utf8'));
            const z=JSON.parse(fs.readFileSync('cpcx-move6-theft-vertical-transport.json','utf8'));
            console.log(JSON.stringify({
              onePlySummary:x.summary,
              twoPlySummary:y.summary,
              verticalTransportSummary:z.summary,
              onePlyRows:x.rows.map(r=>({
                sixthMove:r.sixthMove,
                stolenTrigger:r.stolenTrigger,
                certifiedSetups:r.certifiedSetups.map(s=>({
                  setupCell:s.setupCell,
                  source:s.certificate?.firstSource??s.progress?.source??null,
                  traceLength:s.certificate?.traceLength??null
                }))
              })),
              twoPlyRows:y.rows.map(r=>({
                sixthMove:r.sixthMove,
                stolenTrigger:r.stolenTrigger,
                universalSetups:r.universalSetups.map(x=>x.setupCell),
                bestSetups:r.bestSetups.map(x=>({
                  setupCell:x.setupCell,
                  certifiedReplyCount:x.certifiedReplyCount??null,
                  replyCount:x.replyCount??null
                }))
              }))
            },null,2));
          "
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: cpcx-move6-theft-setups
          path: |
            cpcx-move6-theft-setups.json
            cpcx-move6-theft-two-ply.json
            cpcx-move6-theft-vertical-transport.json
          if-no-files-found: error
