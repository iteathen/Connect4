name: BSFP OQS R6 compact evidence

on:
  push:
    branches:
      - research/zdd-transfer-20260910
    paths:
      - 'reference/research-prototypes/2026-09-10-oqs/compact-r6-summary.mjs'
      - '.github/workflows/bsfp-oqs-r6-compact.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  oqs-r6-compact:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26.7.0
      - name: Replay R6 and emit compact evidence
        run: node reference/research-prototypes/2026-09-10-oqs/compact-r6-summary.mjs
