# Branch Manager benchmark trigger: corrected manager-owned dedupe/cleanup
name: IsoMax Fhourstones Benchmark

on:
  push:
    branches:
      - benchmark/isomax-fhourstones-current-20260924
    paths:
      - '.github/workflows/isomax-fhourstones-benchmark.yml'
  workflow_dispatch:

jobs:
  fhourstones:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          submodules: recursive
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '26.7.0'
          cache: npm
      - run: npm ci
      - name: Standard Fhourstones qualification
        shell: pwsh
        run: node --experimental-ffi tools/bench-fhourstones.mjs
