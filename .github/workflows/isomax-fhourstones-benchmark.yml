name: IsoMax Fhourstones CPC Forced Macro A-B

on:
  push:
    branches:
      - benchmark/isomax-cpc-forced-macro-ab-20260924
    paths:
      - '.github/workflows/isomax-fhourstones-benchmark.yml'
  workflow_dispatch:

jobs:
  fhourstones-ab:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '26.7.0'
          cache: npm
      - run: npm ci
      - name: Same-runner CPC forced-macro baseline-candidate-candidate-baseline
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $baseline = '70ada3430dc733abe518b64143422ecd03dd3384'
          $candidate = 'd60616f9993fc3fed24e7adb0dec89ccde8ca03d'
          function Run-Phase([string]$label, [string]$sha) {
            Write-Output "AB_PHASE $label $sha"
            git -C vendor/jsminsys fetch origin $sha
            git -C vendor/jsminsys checkout --detach $sha
            Write-Output "JSMS_HEAD $(git -C vendor/jsminsys rev-parse HEAD)"
            node --experimental-ffi tools/bench-fhourstones.mjs "docs/qualification/fhourstones-$label.json"
          }
          Run-Phase 'baseline-1' $baseline
          Run-Phase 'candidate-1' $candidate
          Run-Phase 'candidate-2' $candidate
          Run-Phase 'baseline-2' $baseline
