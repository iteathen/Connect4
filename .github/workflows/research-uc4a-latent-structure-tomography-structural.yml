name: Research UC4A latent structure tomography structural freeze

on:
  push:
    branches:
      - research/universal-structural-policy-20260930
    paths:
      - .github/workflows/research-uc4a-latent-structure-tomography-structural.yml
      - research/isograph/discovery/2026-09-30-universal-structural-policy/UC4A_LATENT_STRUCTURE_TOMOGRAPHY_FIELD_DICTIONARY_0_1.md
      - research/isograph/discovery/2026-09-30-universal-structural-policy/run-uc4a-latent-structure-tomography-structural.mjs
      - research/isograph/discovery/2026-09-30-universal-structural-policy/test-uc4a-latent-structure-tomography-structural.mjs

permissions:
  contents: write

jobs:
  structural-freeze:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact pushed revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Pin Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26.7.0
      - name: Verify frozen structural producer
        run: node research/isograph/discovery/2026-09-30-universal-structural-policy/test-uc4a-latent-structure-tomography-structural.mjs
      - name: Generate outcome-blind structural atlas
        shell: bash
        run: |
          set -euo pipefail
          DIR=research/isograph/discovery/2026-09-30-universal-structural-policy
          OUT="$DIR/UC4A_LATENT_STRUCTURE_TOMOGRAPHY_STRUCTURAL_0_1.json"
          node "$DIR/run-uc4a-latent-structure-tomography-structural.mjs" > "$OUT"
          node - "$OUT" <<'NODE'
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          if(r.boardCount!==52)throw new Error('expected frozen 52-board geometry cohort');
          if(r.oracleUsed!==false||r.solvedInputsUsed!==false||r.outcomeLabelsAccessibleToProducer!==false)throw new Error('outcome-blind boundary violated');
          if(r.sealedHoldoutsAccessed!==false)throw new Error('sealed holdout boundary violated');
          if(r.productionCpcModified!==false||r.bsfpModified!==false)throw new Error('read-only production boundary violated');
          console.log(JSON.stringify({boardCount:r.boardCount,atlas:r.structuralAtlasSha256,rowHashes:r.rowHashes.length,standard:r.rows.find(x=>x.board==='7x6').blocks.R}));
          NODE
      - name: Commit durable structural atlas
        shell: bash
        run: |
          set -euo pipefail
          BRANCH=research/universal-structural-policy-20260930
          FILE=research/isograph/discovery/2026-09-30-universal-structural-policy/UC4A_LATENT_STRUCTURE_TOMOGRAPHY_STRUCTURAL_0_1.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$FILE"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research: freeze UC4A tomography structural atlas"
          for attempt in 1 2 3; do
            git fetch origin "$BRANCH"
            git rebase --autostash "origin/$BRANCH"
            if git push origin HEAD:"$BRANCH"; then exit 0; fi
            sleep 1
          done
          exit 1
