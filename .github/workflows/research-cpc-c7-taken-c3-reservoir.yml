name: Research CPC c7-taken c3 reservoir qualification

on:
  push:
    branches:
      - research/universal-structural-policy-20260930
    paths:
      - .github/workflows/research-cpc-c7-taken-c3-reservoir.yml
      - research/isograph/discovery/2026-09-30-universal-structural-policy/run-cpc-rank24-reply7-c7-taken-c3-reservoir.mjs
      - research/isograph/discovery/2026-09-30-universal-structural-policy/CPC_TRUNCATED_TARGET_RESERVOIR_PAIRING_THEOREM.md

permissions:
  contents: write

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26.7.0
      - name: Fetch pinned JSMinSys authority
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/iteathen/JSMinSys.git jsminsys
          git -C jsminsys checkout bf23d3a67652cd42e1975f29c7dc4eed54f7eb42
          test -z "$(git -C jsminsys status --porcelain)"
      - name: Qualify c3 target reservoir
        shell: bash
        run: |
          set -euo pipefail
          DIR=research/isograph/discovery/2026-09-30-universal-structural-policy
          OUT="$DIR/CPC_RANK24_REPLY7_C7_TAKEN_C3_RESERVOIR_0_1.json"
          node "$DIR/run-cpc-rank24-reply7-c7-taken-c3-reservoir.mjs" ./jsminsys > "$OUT"
          node - "$OUT" <<'NODE'
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          if(r.oracleUsed!==false||r.solvedInputsUsed!==false||r.oracleValuesUsed!==false)
            throw new Error('forbidden solved/oracle evidence');
          if(r.accept!==true)throw new Error('c7-taken c3 reservoir qualification rejected');
          if(!r.template?.targetIsResponse||!r.validation?.pass)throw new Error('target certificate incomplete');
          console.log(JSON.stringify({
            accept:r.accept,
            target:r.target,
            pairs:r.template.synchronizedPairs,
            residuals:r.template.defenderResidualCount,
            validation:{
              nodes:r.validation.defenderNodes,
              pairs:r.validation.responsePairs,
              maxDepth:r.validation.maxPairDepth
            }
          }));
          NODE
      - name: Commit durable qualification evidence
        shell: bash
        run: |
          set -euo pipefail
          BRANCH=research/universal-structural-policy-20260930
          FILE=research/isograph/discovery/2026-09-30-universal-structural-policy/CPC_RANK24_REPLY7_C7_TAKEN_C3_RESERVOIR_0_1.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$FILE"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research: record c7-taken c3 reservoir qualification"
          for attempt in 1 2 3; do
            git fetch origin "$BRANCH"
            git rebase --autostash "origin/$BRANCH"
            if git push origin HEAD:"$BRANCH"; then exit 0; fi
            sleep 1
          done
          exit 1
