name: Research CPC rank24 reply3 singleton handoff

on:
  push:
    branches:
      - research/universal-structural-policy-20260930
    paths:
      - .github/workflows/research-cpc-rank24-reply3-singleton-handoff.yml
      - research/isograph/discovery/2026-09-30-universal-structural-policy/run-cpc-rank24-reply3-singleton-handoff-composition.mjs
      - research/isograph/discovery/2026-09-30-universal-structural-policy/CPC_RANK24_REPLY3_SINGLETON_HANDOFF_COMPOSITION_THEOREM.md

permissions:
  contents: write

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact pushed revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Pin Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26.7.0
      - name: Assert exact Node runtime
        run: node -e "if (process.version !== 'v26.7.0') throw new Error('expected Node v26.7.0, got ' + process.version)"
      - name: Fetch pinned JSMinSys authority
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/iteathen/JSMinSys.git jsminsys
          git -C jsminsys checkout bf23d3a67652cd42e1975f29c7dc4eed54f7eb42
          test -z "$(git -C jsminsys status --porcelain)"
      - name: Qualify singleton handoff composition
        shell: bash
        run: |
          set -euo pipefail
          DIR=research/isograph/discovery/2026-09-30-universal-structural-policy
          OUT="$DIR/CPC_RANK24_REPLY3_SINGLETON_HANDOFF_COMPOSITION_0_1.json"
          node "$DIR/run-cpc-rank24-reply3-singleton-handoff-composition.mjs" ./jsminsys > "$OUT"
          node - "$OUT" <<'NODE'
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          if(r.oracleUsed!==false||r.solvedInputsUsed!==false)throw new Error('forbidden solved evidence flag');
          if(r.jsMinSysSha!=='bf23d3a67652cd42e1975f29c7dc4eed54f7eb42')throw new Error('JSMinSys authority drift');
          if(r.accept!==true)throw new Error('singleton handoff theorem rejected');
          if(!r.handoff.activeSingleton.active)throw new Error('singleton premise failed');
          if(!r.handoff.nativeCpcForcesC1||!r.handoff.literal.onlyC1)throw new Error('forced c1 mismatch');
          if(!r.downstreamCompression?.accept)throw new Error('downstream compression rejected');
          console.log(JSON.stringify({
            accept:r.accept,
            currentState:r.currentState,
            handoff:{
              p1:r.handoff.p1MoveColumn,
              forcedP2:r.handoff.forcedReplyColumn,
              postForced:r.handoff.postForced
            },
            downstreamAccept:r.downstreamCompression.accept
          }));
          NODE
      - name: Commit durable qualification evidence
        shell: bash
        run: |
          set -euo pipefail
          BRANCH=research/universal-structural-policy-20260930
          FILE=research/isograph/discovery/2026-09-30-universal-structural-policy/CPC_RANK24_REPLY3_SINGLETON_HANDOFF_COMPOSITION_0_1.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$FILE"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research: record rank24 reply3 singleton handoff qualification"
          for attempt in 1 2 3; do
            git fetch origin "$BRANCH"
            git rebase --autostash "origin/$BRANCH"
            if git push origin HEAD:"$BRANCH"; then exit 0; fi
            sleep 1
          done
          exit 1
