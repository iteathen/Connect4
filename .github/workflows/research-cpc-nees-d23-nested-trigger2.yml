name: Research NEES D23 nested trigger2 diagnostic

on:
  push:
    branches:
      - research/universal-structural-policy-20260930
    paths:
      - .github/workflows/research-cpc-nees-d23-nested-trigger2.yml
      - research/isograph/discovery/2026-09-30-universal-structural-policy/run-cpc-nees-guard-trigger-diagnostic.mjs

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact pushed revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Pin Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26.7.0
      - name: Fetch diagnostic-qualified JSMinSys
        shell: bash
        run: |
          set -euo pipefail
          git clone --branch research/cpc-guard-proof-memo-nees-v1 --single-branch https://github.com/iteathen/JSMinSys.git jsminsys
          git -C jsminsys checkout bf23d3a67652cd42e1975f29c7dc4eed54f7eb42
      - name: Run nested D23 trigger2 diagnostic
        shell: bash
        env:
          NODE_OPTIONS: --max-old-space-size=2048
        run: |
          set -euo pipefail
          DIR=research/isograph/discovery/2026-09-30-universal-structural-policy
          OUT="$DIR/CPC_NEES_D23_AFTER_A6D6_A2D3_TRIGGER2_DIAGNOSTIC_0_1.json"
          timeout 900 node "$DIR/run-cpc-nees-guard-trigger-diagnostic.mjs" ./jsminsys 44444156666623 23 2 4194304 > "$OUT"
          node - "$OUT" <<'NODE'
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          console.log('NESTED_TRIGGER2='+JSON.stringify({
            root:r.root,horizon:r.horizon,trigger:r.triggerColumn,candidateMask:r.candidateMask,
            responses:r.responses.map(x=>({
              response:x.responseColumn,code:x.childCode,failed:x.childFailedTrigger,
              support:x.childSupport,guards:x.childGuards,cpc:x.childCpc,
              residuals:x.attackerResidualProfile
            }))
          }));
          NODE
      - name: Commit durable nested diagnostic
        shell: bash
        run: |
          set -euo pipefail
          BRANCH=research/universal-structural-policy-20260930
          FILE=research/isograph/discovery/2026-09-30-universal-structural-policy/CPC_NEES_D23_AFTER_A6D6_A2D3_TRIGGER2_DIAGNOSTIC_0_1.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$FILE"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research: diagnose nested D23 trigger2 frontier"
          for attempt in 1 2 3; do
            git fetch origin "$BRANCH"
            git rebase --autostash "origin/$BRANCH"
            if git push origin HEAD:"$BRANCH"; then exit 0; fi
            sleep 1
          done
          exit 1
