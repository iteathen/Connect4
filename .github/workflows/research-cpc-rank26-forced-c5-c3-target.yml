name: Research CPC rank26 forced-c5 c3-target composition

on:
  push:
    branches:
      - research/universal-structural-policy-20260930
    paths:
      - .github/workflows/research-cpc-rank26-forced-c5-c3-target.yml
      - research/isograph/discovery/2026-09-30-universal-structural-policy/CPC_RANK26_REPLY7_FORCED_C5_C3_TARGET_COMPOSITION_THEOREM.md
      - research/isograph/discovery/2026-09-30-universal-structural-policy/test-cpc-rank26-reply7-forced-c5-c3-target-composition.mjs
      - research/isograph/discovery/2026-09-30-universal-structural-policy/run-cpc-rank26-reply7-forced-c5-c3-target-composition.mjs

permissions:
  contents: write

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26.7.0
      - name: Fetch pinned JSMinSys authority
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/iteathen/JSMinSys.git jsminsys
          git -C jsminsys checkout bf23d3a67652cd42e1975f29c7dc4eed54f7eb42
          test -z "$(git -C jsminsys status --porcelain)"
      - name: Verify frozen rank26 composition contract
        run: node research/isograph/discovery/2026-09-30-universal-structural-policy/test-cpc-rank26-reply7-forced-c5-c3-target-composition.mjs ./jsminsys
      - name: Generate durable qualification evidence
        shell: bash
        run: |
          set -euo pipefail
          DIR=research/isograph/discovery/2026-09-30-universal-structural-policy
          OUT="$DIR/CPC_RANK26_REPLY7_FORCED_C5_C3_TARGET_COMPOSITION_0_1.json"
          node "$DIR/run-cpc-rank26-reply7-forced-c5-c3-target-composition.mjs" ./jsminsys > "$OUT"
          node - "$OUT" <<'NODE'
          const fs=require('fs'),r=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          if(r.oracleUsed!==false||r.solvedInputsUsed!==false||r.ordinaryGameTreeSearchUsed!==false)throw new Error('forbidden value evidence');
          if(r.jsMinSysSha!=='bf23d3a67652cd42e1975f29c7dc4eed54f7eb42')throw new Error('authority drift');
          if(r.accept!==true)throw new Error('rank26 forced-c5 composition rejected');
          if(!r.p1c5.nativeCpcForcesC5||!r.p1c5.literalOnlyC5||!r.p1c1.validation?.pass)throw new Error('composition premise failure');
          console.log(JSON.stringify({accept:r.accept,state:r.state,p1c5:r.p1c5,forcedP2c5:r.forcedP2c5,p1c1:{support:r.p1c1.support,c3r5Singleton:r.p1c1.c3r5Singleton,validation:r.p1c1.validation},conclusion:r.conclusion}));
          NODE
      - name: Commit durable qualification evidence
        shell: bash
        run: |
          set -euo pipefail
          BRANCH=research/universal-structural-policy-20260930
          FILE=research/isograph/discovery/2026-09-30-universal-structural-policy/CPC_RANK26_REPLY7_FORCED_C5_C3_TARGET_COMPOSITION_0_1.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$FILE"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research: record rank26 forced-c5 c3-target composition"
          for attempt in 1 2 3; do
            git fetch origin "$BRANCH"
            git rebase --autostash "origin/$BRANCH"
            if git push origin HEAD:"$BRANCH"; then exit 0; fi
            sleep 1
          done
          exit 1
