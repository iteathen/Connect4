name: Research triadic CPCX pair-relation seam

on:
  push:
    branches:
      - experiment/triadic-relational-normalization-20261003
    paths:
      - 'research/isograph/discovery/2026-10-03-triadic-relational-normalization/run-cpcx-pair-relation-seam-normalization.mjs'
      - '.github/workflows/research-triadic-cpcx-pair-relation-seam.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pair-relations:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - name: Run CPCX pair-relation seam probe
        run: |
          mkdir -p research/isograph/discovery/2026-10-03-triadic-relational-normalization/artifacts
          node research/isograph/discovery/2026-10-03-triadic-relational-normalization/run-cpcx-pair-relation-seam-normalization.mjs \
            > research/isograph/discovery/2026-10-03-triadic-relational-normalization/artifacts/cpcx-pair-relation-seam-v0_2.json
          cat research/isograph/discovery/2026-10-03-triadic-relational-normalization/artifacts/cpcx-pair-relation-seam-v0_2.json
      - name: Upload pair-relation result
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: triadic-cpcx-pair-relation-seam-v0-2
          path: research/isograph/discovery/2026-10-03-triadic-relational-normalization/artifacts/cpcx-pair-relation-seam-v0_2.json
