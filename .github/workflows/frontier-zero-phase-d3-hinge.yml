name: Frontier zero-phase D3 hinge

on:
  push:
    branches: [research/frontier-negamax-conformance]
    paths:
      - '.github/workflows/frontier-zero-phase-d3-hinge.yml'
      - 'research/semantic-quotient/state-identity-unification/src/quotient-standard7x6-zero-phase-d3-hinge.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hinge:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26.7.0
      - name: Check D3 hinge consequence across every P1 reply
        shell: bash
        run: |
          set -euo pipefail
          timeout 270s node research/semantic-quotient/state-identity-unification/src/quotient-standard7x6-zero-phase-d3-hinge.mjs
