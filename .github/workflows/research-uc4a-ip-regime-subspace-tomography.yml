name: Research UC4A I/P regime subspace tomography

concurrency:
  group: uc4a-ip-regime-subspace-\${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - research/universal-structural-policy-20260930
    paths:
      - .github/workflows/research-uc4a-ip-regime-subspace-tomography.yml
      - research/isograph/discovery/2026-09-30-universal-structural-policy/UC4A_IP_REGIME_SUBSPACE_TOMOGRAPHY_EXPERIMENT_DESIGN_0_1.md
      - research/isograph/discovery/2026-09-30-universal-structural-policy/UC4A_IP_SYMMETRY_PHASE_STRUCTURAL_0_1.json
      - research/isograph/discovery/2026-09-30-universal-structural-policy/test-uc4a-ip-regime-subspace-tomography.mjs
      - research/isograph/discovery/2026-09-30-universal-structural-policy/run-uc4a-ip-regime-subspace-tomography.mjs

permissions:
  contents: write

jobs:
  tomography:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact pushed revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Pin Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26.7.0
      - name: Verify frozen regime-subspace contract
        run: node research/isograph/discovery/2026-09-30-universal-structural-policy/test-uc4a-ip-regime-subspace-tomography.mjs
      - name: Generate label-free regime-subspace atlas
        shell: bash
        run: |
          set -euo pipefail
          DIR=research/isograph/discovery/2026-09-30-universal-structural-policy
          OUT="$DIR/UC4A_IP_REGIME_SUBSPACE_TOMOGRAPHY_0_1.json"
          node "$DIR/run-uc4a-ip-regime-subspace-tomography.mjs" > "$OUT"
          node - "$OUT" <<'NODE'
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          if(r.localizationArtifactAccessibleToProducer!==false||r.outcomeLabelsAccessibleToProducer!==false)throw new Error('label/localization isolation violated');
          if(r.sealedHoldoutsAccessed!==false)throw new Error('holdout boundary violated');
          console.log(JSON.stringify({
            regimes:r.part1.regimes.length,
            comparisons:r.part2.controlledComparisons.length,
            comparisonAxes:Object.fromEntries([...new Set(r.part2.controlledComparisons.map(x=>x.axis))].map(a=>[a,r.part2.controlledComparisons.filter(x=>x.axis===a).length])),
            recurringDefectCount:r.part5.recurringDefects.length,
            topDefects:r.part5.recurringDefects.slice(0,20),
            genericInterior:Object.fromEntries(Object.entries(r.part6.genericInterior).map(([k,v])=>[k,{rank:v.rank,parityCells:v.parityCells.map(x=>({widthParity:x.widthParity,heightParity:x.heightParity,rowCount:x.rowCount,rank:x.rank}))}]))
          }));
          NODE
      - name: Commit durable regime-subspace evidence
        shell: bash
        run: |
          set -euo pipefail
          BRANCH=research/universal-structural-policy-20260930
          FILE=research/isograph/discovery/2026-09-30-universal-structural-policy/UC4A_IP_REGIME_SUBSPACE_TOMOGRAPHY_0_1.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$FILE"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research: record UC4A I/P regime subspace tomography"
          for attempt in 1 2 3; do
            git fetch origin "$BRANCH"
            git rebase --autostash "origin/$BRANCH"
            if git push origin HEAD:"$BRANCH"; then exit 0; fi
            sleep 1
          done
          exit 1
