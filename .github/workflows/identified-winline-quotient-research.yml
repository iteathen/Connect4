name: identified-winline-quotient-research

on:
  push:
    branches:
      - research/identified-winline-quotient-test
    paths:
      - reference/research-prototypes/2026-09-10-identified-winline-quotient/**
      - .github/workflows/identified-winline-quotient-research.yml

permissions:
  contents: read

jobs:
  exact-quotient-falsification:
    name: exact-quotient-falsification
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26.7.0
      - name: Exact runtime
        run: node --version
      - name: Falsify identified winline quotient
        run: node --expose-gc reference/research-prototypes/2026-09-10-identified-winline-quotient/qualify.mjs | tee identified-winline-quotient-evidence.json
