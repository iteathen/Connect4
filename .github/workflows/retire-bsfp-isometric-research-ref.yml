name: Retire consolidated BSFP Isometric research branch

on:
  push:
    branches:
      - research/semantic-quotient
    paths:
      - research/provenance/RETIRE_BSFP_ISOMETRIC_RESEARCH_BRANCH_2026-09-17.json

permissions:
  contents: write

concurrency:
  group: retire-bsfp-isometric-research-branch
  cancel-in-progress: false

jobs:
  retire:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out canonical research
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: research/semantic-quotient
          persist-credentials: false

      - name: Prevalidate, archive, and delete consolidated research ref
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          CANONICAL_SHA: ${{ github.sha }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const req=JSON.parse(fs.readFileSync('research/provenance/RETIRE_BSFP_ISOMETRIC_RESEARCH_BRANCH_2026-09-17.json','utf8'));
          if(process.env.REPOSITORY!=='iteathen/Connect4'||req.repository!==process.env.REPOSITORY) throw new Error('repository mismatch');

          const [owner,repo]=process.env.REPOSITORY.split('/');
          const api='https://api.github.com';
          const headers={
            Authorization:`Bearer ${process.env.GH_TOKEN}`,
            Accept:'application/vnd.github+json',
            'X-GitHub-Api-Version':'2022-11-28',
            'Content-Type':'application/json'
          };
          const enc=s=>s.split('/').map(encodeURIComponent).join('/');
          async function gh(path,{method='GET',body,ok=[200]}={}){
            const r=await fetch(api+path,{method,headers,body:body===undefined?undefined:JSON.stringify(body)});
            const text=await r.text();
            if(!ok.includes(r.status)) throw new Error(`${method} ${path} -> ${r.status}: ${text.slice(0,800)}`);
            return text?JSON.parse(text):null;
          }
          async function refSha(branch){
            return (await gh(`/repos/${owner}/${repo}/git/ref/heads/${enc(branch)}`)).object.sha;
          }
          async function fileSha(ref,path){
            return (await gh(`/repos/${owner}/${repo}/contents/${enc(path)}?ref=${ref}`)).sha;
          }
          async function activeRunCount(branch,status){
            const q=new URLSearchParams({branch,status,per_page:'1'});
            return (await gh(`/repos/${owner}/${repo}/actions/runs?${q}`)).total_count;
          }
          async function tagTarget(tag){
            try{
              const r=await gh(`/repos/${owner}/${repo}/git/ref/tags/${enc(tag)}`);
              if(r.object.type==='commit') return r.object.sha;
              return (await gh(`/repos/${owner}/${repo}/git/tags/${r.object.sha}`)).object.sha;
            }catch(e){
              if(String(e).includes('-> 404:')) return null;
              throw e;
            }
          }
          async function ensureTag(tag,branch,sha){
            const existing=await tagTarget(tag);
            if(existing!==null){
              if(existing!==sha) throw new Error(`archive tag mismatch: ${tag}`);
              return;
            }
            const t=await gh(`/repos/${owner}/${repo}/git/tags`,{
              method:'POST',ok:[201],
              body:{tag,message:`Archive ${branch} after consolidation into canonical research`,object:sha,type:'commit'}
            });
            await gh(`/repos/${owner}/${repo}/git/refs`,{
              method:'POST',ok:[201],
              body:{ref:`refs/tags/${tag}`,sha:t.sha}
            });
            if(await tagTarget(tag)!==sha) throw new Error(`archive verification failed: ${tag}`);
          }

          const canonical=process.env.CANONICAL_SHA;
          if(await refSha(req.canonical_branch)!==canonical) throw new Error('canonical research moved during cleanup');

          const oldSha=await refSha(req.old_branch);
          if(oldSha!==req.old_head) throw new Error(`old branch moved: ${oldSha}`);

          const manifest=JSON.parse(fs.readFileSync('research/provenance/SOURCE_MANIFEST.json','utf8'));
          const source=manifest.sources.find(x=>x.ref===req.old_branch);
          if(!source||source.head!==oldSha||source.disposition!=='integrated_into_canonical_research_then_archive_and_retire'){
            throw new Error('source manifest does not authorize retirement');
          }

          const record=JSON.parse(fs.readFileSync('research/provenance/BSFP_ISOMETRIC_TRANSFER_CONSOLIDATION_2026-09-17.json','utf8'));
          if(record.source_branch!==req.old_branch||record.source_head!==oldSha||record.canonical_research_branch!==req.canonical_branch){
            throw new Error('consolidation record mismatch');
          }

          for(const path of req.exact_preserved_paths){
            const [a,b]=await Promise.all([fileSha(req.old_branch,path),fileSha(req.canonical_branch,path)]);
            if(a!==b) throw new Error(`canonical preservation mismatch: ${path}`);
          }
          for(const pair of req.historical_archives){
            const [a,b]=await Promise.all([fileSha(req.old_branch,pair.source),fileSha(req.canonical_branch,pair.archive)]);
            if(a!==b) throw new Error(`historical archive mismatch: ${pair.source}`);
          }

          const prs=await gh(`/repos/${owner}/${repo}/pulls?state=open&per_page=100`);
          for(const p of prs){
            if(p.head.ref===req.old_branch||p.base.ref===req.old_branch) throw new Error(`open PR #${p.number} still depends on old research branch`);
          }
          const pr47=await gh(`/repos/${owner}/${repo}/pulls/47`);
          if(pr47.base.ref!==req.canonical_branch) throw new Error('PR47 is not retargeted to canonical research');

          if(await activeRunCount(req.old_branch,'queued')||await activeRunCount(req.old_branch,'in_progress')){
            throw new Error('active workflow still depends on old research branch');
          }

          await ensureTag(req.archive_tag,req.old_branch,oldSha);
          await gh(`/repos/${owner}/${repo}/git/refs/heads/${enc(req.old_branch)}`,{method:'DELETE',ok:[204]});
          console.log(`archived+deleted ${req.old_branch} @ ${oldSha}`);
          NODE
