name: Frontier post-block lexicographic predecessor

on:
  push:
    branches:
      - research/frontier-negamax-conformance
    paths:
      - research/semantic-quotient/state-identity-unification/src/quotient-standard7x6-postblock-lexicographic-predecessor.mjs
      - research/semantic-quotient/state-identity-unification/src/quotient-standard7x6-resolved-tail-lexicographic-proof-lib.mjs
      - .github/workflows/frontier-postblock-lexicographic-predecessor.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  predecessor:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      states: ${{ steps.run.outputs.states }}
      evaluated: ${{ steps.run.outputs.evaluated }}
      closed: ${{ steps.run.outputs.closed }}
      failed: ${{ steps.run.outputs.failed }}
      resource: ${{ steps.run.outputs.resource }}
      shards: ${{ steps.run.outputs.shards }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26.7.0
      - name: Qualify post-block branch-complete predecessor
        id: run
        shell: bash
        run: |
          set -euo pipefail
          f="$RUNNER_TEMP/postblock-lex-predecessor.txt"
          timeout 270s node --expose-gc research/semantic-quotient/state-identity-unification/src/quotient-standard7x6-postblock-lexicographic-predecessor.mjs | tee "$f"
          RESULT_FILE="$f" node <<'NODE'
          const fs=require('node:fs');
          const line=fs.readFileSync(process.env.RESULT_FILE,'utf8').split(/\r?\n/).find(x=>x.startsWith('POSTBLOCK_LEXICOGRAPHIC_PREDECESSOR='));
          if(!line) throw new Error('post-block lexicographic predecessor summary missing');
          const x=JSON.parse(line.slice(line.indexOf('=')+1));
          if(x.exactRank18States!==84) throw new Error('post-block rank18 domain drift');
          fs.appendFileSync(process.env.GITHUB_OUTPUT,[
            `states=${x.exactRank18States}`,
            `evaluated=${x.evaluatedStates}`,
            `closed=${x.closedStates}`,
            `failed=${x.failedStates}`,
            `resource=${x.resourceShards}`,
            `shards=${x.structuralShardCount}`,
          ].join('\n')+'\n');
          NODE

  summary:
    needs: predecessor
    name: postlex-s${{ needs.predecessor.outputs.states }}-e${{ needs.predecessor.outputs.evaluated }}-c${{ needs.predecessor.outputs.closed }}-f${{ needs.predecessor.outputs.failed }}-r${{ needs.predecessor.outputs.resource }}-n${{ needs.predecessor.outputs.shards }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - run: echo "post-block lexicographic predecessor counts encoded in job name"
