name: Research CPC rank38 3+1 tail event product

concurrency:
  group: cpc-rank38-3plus1-tail-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [research/universal-structural-policy-20260930]
    paths:
      - .github/workflows/research-cpc-rank38-3plus1-tail-event-product.yml
      - research/isograph/discovery/2026-09-30-universal-structural-policy/CPC_RANK38_3PLUS1_TAIL_EVENT_PRODUCT_DESIGN_0_1.md
      - research/isograph/discovery/2026-09-30-universal-structural-policy/test-cpc-rank38-3plus1-tail-event-product.mjs
      - research/isograph/discovery/2026-09-30-universal-structural-policy/run-cpc-rank38-3plus1-tail-event-product.mjs
      - research/isograph/discovery/2026-09-30-universal-structural-policy/CPC_Q5D34_G5_SURVIVOR_RANK38_MONOTONE_COMPOSITION_0_1.json

permissions:
  contents: write

jobs:
  event-product:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {fetch-depth: 0}
      - name: Check out pinned JSMinSys authority
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: iteathen/JSMinSys
          ref: bf23d3a67652cd42e1975f29c7dc4eed54f7eb42
          path: .jsminsys
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: {node-version: 26.7.0}
      - name: Verify frozen 3+1 tail event-product contract
        run: node research/isograph/discovery/2026-09-30-universal-structural-policy/test-cpc-rank38-3plus1-tail-event-product.mjs "$GITHUB_WORKSPACE/.jsminsys"
      - name: Generate durable 3+1 tail evidence
        shell: bash
        run: |
          set -euo pipefail
          DIR=research/isograph/discovery/2026-09-30-universal-structural-policy
          OUT="$DIR/CPC_RANK38_3PLUS1_TAIL_EVENT_PRODUCT_0_1.json"
          node "$DIR/run-cpc-rank38-3plus1-tail-event-product.mjs" "$GITHUB_WORKSPACE/.jsminsys" > "$OUT"
          node - "$OUT" <<'NODE'
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          console.log(JSON.stringify({
            summary:r.summary,
            states:r.states.map(x=>({q:x.exactQClass,actions:x.rootActions,outcomes:x.outcomeCounts})),
            cross:r.crossStateComparison
          }));
          NODE
      - name: Commit durable 3+1 tail evidence
        shell: bash
        run: |
          set -euo pipefail
          BRANCH=research/universal-structural-policy-20260930
          FILE=research/isograph/discovery/2026-09-30-universal-structural-policy/CPC_RANK38_3PLUS1_TAIL_EVENT_PRODUCT_0_1.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$FILE"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research: record rank38 3+1 tail event product"
          git pull --rebase origin "$BRANCH"
          git push origin HEAD:"$BRANCH"
