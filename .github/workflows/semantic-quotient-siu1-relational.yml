name: Semantic quotient SIU-1 relational dual-direction

on:
  push:
    branches:
      - research/semantic-quotient
    paths:
      - 'research/semantic-quotient/state-identity-unification/**'
      - '.github/workflows/semantic-quotient-siu1-relational.yml'
      - 'components/bsfp/residual-winspace.mjs'
      - 'components/bsfp/support-lattice.mjs'
      - 'components/bsfp/ownership-antichain-solver.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  siu1-relational:
    name: SIU-1 relational dual-direction
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.7.0
      - name: Run relational forward/backward exactness experiment
        run: node --expose-gc --max-old-space-size=4096 research/semantic-quotient/state-identity-unification/src/siu1-relational-dual-direction.mjs
