name: Frontier no-A/B continuation focus

on:
  push:
    branches:
      - research/frontier-negamax-conformance
    paths:
      - research/semantic-quotient/state-identity-unification/src/quotient-standard7x6-adjacent-tail-noab-all-action-routing.mjs
      - research/semantic-quotient/state-identity-unification/src/quotient-standard7x6-noab-continuation-forward-routing.mjs
      - research/semantic-quotient/state-identity-unification/src/quotient-standard7x6-repair-capacity-predecessor-induction.mjs
      - .github/workflows/frontier-noab-continuation-focus.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      key: ${{ steps.inventory.outputs.key }}
      forward_cert: ${{ steps.forward.outputs.cert }}
      forward_continue: ${{ steps.forward.outputs.continue }}
      forward_unresolved: ${{ steps.forward.outputs.unresolved }}
      induction_proved: ${{ steps.induction.outputs.proved }}
      induction_failed: ${{ steps.induction.outputs.failed }}
      induction_states: ${{ steps.induction.outputs.states }}
      induction_depth: ${{ steps.induction.outputs.depth }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26.7.0
      - id: inventory
        shell: bash
        run: |
          set -euo pipefail
          f="$RUNNER_TEMP/noab.txt"
          timeout 270s node research/semantic-quotient/state-identity-unification/src/quotient-standard7x6-adjacent-tail-noab-all-action-routing.mjs | tee "$f"
          ROUTING_FILE="$f" node <<'NODE'
          const fs=require('node:fs');
          const line=fs.readFileSync(process.env.ROUTING_FILE,'utf8').split(/\r?\n/).find(x=>x.startsWith('ADJACENT_TAIL_NOAB_ALL_ACTION_ROUTING='));
          if(!line) throw new Error('routing summary missing');
          const x=JSON.parse(line.slice(line.indexOf('=')+1));
          const short=m=>m.replace('C_resolved_P0_owned_C1:','CP0-').replace('C_resolved_P1_owned_C1:','CP1-').replace('G_resolved_P1_owned_G1:','GP1-').replace('G_resolved_P0_owned_G1:','GP0-');
          const key=x.continuationRows.map(r=>`${short(r.member)}>${r.continuationActions.map(a=>a.column+(a.status==='forced_block_continuation'?'f':'s')).join('')}`).join('__');
          fs.appendFileSync(process.env.GITHUB_OUTPUT,`key=${key}\n`);
          NODE
      - id: forward
        shell: bash
        run: |
          set -euo pipefail
          f="$RUNNER_TEMP/forward.txt"
          timeout 270s node research/semantic-quotient/state-identity-unification/src/quotient-standard7x6-noab-continuation-forward-routing.mjs | tee "$f"
          ROUTING_FILE="$f" node <<'NODE'
          const fs=require('node:fs');
          const line=fs.readFileSync(process.env.ROUTING_FILE,'utf8').split(/\r?\n/).find(x=>x.startsWith('NOAB_COMPLEMENTARY_TAIL_FORWARD_ROUTING='));
          if(!line) throw new Error('forward routing summary missing');
          const x=JSON.parse(line.slice(line.indexOf('=')+1));
          fs.appendFileSync(process.env.GITHUB_OUTPUT,[
            `cert=${x.repliesWithP0Certificate}`,
            `continue=${x.repliesWithQualifiedContinuation}`,
            `unresolved=${x.unresolvedReplies}`,
          ].join('\n')+'\n');
          NODE
      - id: induction
        shell: bash
        run: |
          set -euo pipefail
          f="$RUNNER_TEMP/induction.txt"
          timeout 270s node research/semantic-quotient/state-identity-unification/src/quotient-standard7x6-repair-capacity-predecessor-induction.mjs | tee "$f"
          ROUTING_FILE="$f" node <<'NODE'
          const fs=require('node:fs');
          const line=fs.readFileSync(process.env.ROUTING_FILE,'utf8').split(/\r?\n/).find(x=>x.startsWith('REPAIR_CAPACITY_PREDECESSOR_INDUCTION='));
          if(!line) throw new Error('repair-capacity induction summary missing');
          const x=JSON.parse(line.slice(line.indexOf('=')+1));
          fs.appendFileSync(process.env.GITHUB_OUTPUT,[
            `proved=${x.provedStartStates}`,
            `failed=${x.failedStartStates}`,
            `states=${x.proofStates}`,
            `depth=${x.maxDepth}`,
          ].join('\n')+'\n');
          NODE

  summary:
    needs: inventory
    name: noab forward-c${{ needs.inventory.outputs.forward_cert }}-k${{ needs.inventory.outputs.forward_continue }}-u${{ needs.inventory.outputs.forward_unresolved }} induction-p${{ needs.inventory.outputs.induction_proved }}-f${{ needs.inventory.outputs.induction_failed }}-n${{ needs.inventory.outputs.induction_states }}-d${{ needs.inventory.outputs.induction_depth }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - run: echo "focused continuation and induction counts encoded in job name"
