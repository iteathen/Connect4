name: IsoMax repaired cubic quotient target

on:
  push:
    branches:
      - experiment/isomax-late-xor-components-20260929
    paths:
      - '.github/workflows/isomax-repaired-cubic-quotient-target.yml'
      - 'research/isograph/discovery/2026-09-29-isomax-late-xor-components/run-repaired-cubic-quotient-target.mjs'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 0}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with: {node-version: '26'}
      - name: Reduce cubic quotient and isolate scalar target
        run: node research/isograph/discovery/2026-09-29-isomax-late-xor-components/run-repaired-cubic-quotient-target.mjs
      - name: Research integrity
        run: node tools/verify-research-integrity.mjs
      - name: Commit cubic quotient target evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/isograph/discovery/2026-09-29-isomax-late-xor-components/REPAIRED_CUBIC_QUOTIENT_TARGET_0_1.json
          if git diff --cached --quiet; then
            echo "No generated changes."
          else
            git commit -m "research(isomax): freeze repaired cubic quotient target"
            git pull --rebase origin experiment/isomax-late-xor-components-20260929
            git push origin HEAD:experiment/isomax-late-xor-components-20260929
          fi
