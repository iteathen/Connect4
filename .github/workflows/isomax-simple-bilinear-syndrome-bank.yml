name: IsoMax simple bilinear syndrome bank

on:
  push:
    branches:
      - experiment/isomax-late-xor-components-20260929
    paths:
      - '.github/workflows/isomax-simple-bilinear-syndrome-bank.yml'
      - 'research/isograph/discovery/2026-09-29-isomax-late-xor-components/run-simple-bilinear-syndrome-bank.mjs'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 0}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with: {node-version: '26'}
      - name: Test simple bilinear syndrome bank
        run: node research/isograph/discovery/2026-09-29-isomax-late-xor-components/run-simple-bilinear-syndrome-bank.mjs
      - name: Research integrity
        run: node tools/verify-research-integrity.mjs
      - name: Commit syndrome-bank evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/isograph/discovery/2026-09-29-isomax-late-xor-components/SIMPLE_BILINEAR_SYNDROME_BANK_0_1.json
          if git diff --cached --quiet; then
            echo "No generated changes."
          else
            git commit -m "research(isomax): freeze simple bilinear syndrome bank"
            git push origin HEAD:experiment/isomax-late-xor-components-20260929
          fi
