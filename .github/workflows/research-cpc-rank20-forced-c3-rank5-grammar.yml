name: Research CPC rank20 forced c3 rank5 local grammar

concurrency:
  group: rank20-forced-c3-rank5-grammar-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [research/universal-structural-policy-20260930]
    paths:
      - .github/workflows/research-cpc-rank20-forced-c3-rank5-grammar.yml
      - research/isograph/discovery/2026-09-30-universal-structural-policy/CPC_RANK20_FORCED_C3_RANK5_LOCAL_GRAMMAR_PROBE_DESIGN_0_1.md
      - research/isograph/discovery/2026-09-30-universal-structural-policy/test-cpc-rank20-forced-c3-rank5-local-grammar-probe.mjs
      - research/isograph/discovery/2026-09-30-universal-structural-policy/run-cpc-rank20-forced-c3-rank5-local-grammar-probe.mjs
      - research/isograph/discovery/2026-09-30-universal-structural-policy/CPC_RANK20_FORCED_C3_FIRST_FAILURE_LOCAL_GRAMMAR_PROBE_0_1.json

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {fetch-depth: 0}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: {node-version: 26.7.0}
      - name: Verify rank5 grammar contract
        run: node research/isograph/discovery/2026-09-30-universal-structural-policy/test-cpc-rank20-forced-c3-rank5-local-grammar-probe.mjs
      - name: Generate durable rank5 grammar evidence
        shell: bash
        run: |
          set -euo pipefail
          DIR=research/isograph/discovery/2026-09-30-universal-structural-policy
          OUT="$DIR/CPC_RANK20_FORCED_C3_RANK5_LOCAL_GRAMMAR_PROBE_0_1.json"
          node "$DIR/run-cpc-rank20-forced-c3-rank5-local-grammar-probe.mjs" > "$OUT"
          node - "$OUT" <<'NODE'
          const fs=require('fs');const r=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          console.log(JSON.stringify({
            summary:r.summary,
            proved:r.rows.filter(x=>x.rank5Proved).map(x=>({sourceLeafId:x.sourceLeafId,rootMove:x.rootMove,expression:x.rank5Expression})),
            unresolved:r.rows.filter(x=>!x.rank5Proved).map(x=>x.sourceLeafId)
          }));
          NODE
      - name: Commit durable rank5 grammar evidence
        shell: bash
        run: |
          set -euo pipefail
          BRANCH=research/universal-structural-policy-20260930
          FILE=research/isograph/discovery/2026-09-30-universal-structural-policy/CPC_RANK20_FORCED_C3_RANK5_LOCAL_GRAMMAR_PROBE_0_1.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$FILE"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research: record forced-c3 rank5 grammar probe"
          git pull --rebase origin "$BRANCH"
          git push origin HEAD:"$BRANCH"
