name: Research CPC rank20 rank32 consequence transport census

concurrency:
  group: rank20-rank32-consequence-transport-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [research/universal-structural-policy-20260930]
    paths:
      - .github/workflows/research-cpc-rank20-rank32-consequence-transport.yml
      - research/isograph/discovery/2026-09-30-universal-structural-policy/CPC_RANK20_RANK32_CONSEQUENCE_CLASS_TRANSPORT_CENSUS_DESIGN_0_1.md
      - research/isograph/discovery/2026-09-30-universal-structural-policy/test-cpc-rank20-rank32-consequence-class-transport-census.mjs
      - research/isograph/discovery/2026-09-30-universal-structural-policy/run-cpc-rank20-rank32-consequence-class-transport-census.mjs
      - research/isograph/discovery/2026-09-30-universal-structural-policy/CPC_RANK20_FORCED_C3_RANK5_LOCAL_GRAMMAR_PROBE_0_1.json

permissions:
  contents: write

jobs:
  census:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {fetch-depth: 0}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: {node-version: 26.7.0}
      - name: Verify consequence transport contract
        run: node research/isograph/discovery/2026-09-30-universal-structural-policy/test-cpc-rank20-rank32-consequence-class-transport-census.mjs
      - name: Generate durable consequence transport evidence
        shell: bash
        run: |
          set -euo pipefail
          DIR=research/isograph/discovery/2026-09-30-universal-structural-policy
          OUT="$DIR/CPC_RANK20_RANK32_CONSEQUENCE_CLASS_TRANSPORT_CENSUS_0_1.json"
          node "$DIR/run-cpc-rank20-rank32-consequence-class-transport-census.mjs" > "$OUT"
          node - "$OUT" <<'NODE'
          const fs=require('fs');const r=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          console.log(JSON.stringify({
            summary:r.summary,
            repeated:r.unresolvedQClasses.filter(x=>x.incomingTransitionCount>1).map(x=>({q:x.exactQClass,incoming:x.incomingTransitionCount,sources:x.sourceLeafIds,labels:x.macroLabels}))
          }));
          NODE
      - name: Commit durable consequence transport evidence
        shell: bash
        run: |
          set -euo pipefail
          BRANCH=research/universal-structural-policy-20260930
          FILE=research/isograph/discovery/2026-09-30-universal-structural-policy/CPC_RANK20_RANK32_CONSEQUENCE_CLASS_TRANSPORT_CENSUS_0_1.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$FILE"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research: record rank32 consequence transport census"
          git pull --rebase origin "$BRANCH"
          git push origin HEAD:"$BRANCH"
