name: Research CPC horizontal ladder ancestry

on:
  push:
    branches:
      - research/universal-structural-policy-20260930
    paths:
      - .github/workflows/research-cpc-horizontal-ladder-ancestry.yml
      - research/isograph/discovery/2026-09-30-universal-structural-policy/run-cpc-horizontal-ladder-ancestry-probe.mjs

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact pushed revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Pin Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26.7.0
      - name: Run ancestry-safe ladder probe
        shell: bash
        run: |
          set -euo pipefail
          OUT=research/isograph/discovery/2026-09-30-universal-structural-policy/CPC_HORIZONTAL_LADDER_ANCESTRY_0_1.json
          node research/isograph/discovery/2026-09-30-universal-structural-policy/run-cpc-horizontal-ladder-ancestry-probe.mjs > "$OUT"
          node - "$OUT" <<'NODE'
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          console.log('ROWS='+JSON.stringify(r.rows.map(x=>({
            id:x.id,
            before:x.trackedBefore,
            afterTrigger:x.trackedAfterTrigger,
            BC:x.replies.filter(y=>y.responseColumn===2||y.responseColumn===3).map(y=>({
              response:y.responseColumn,
              bcHeights:y.bcHeights,
              tracked:y.tracked
            }))
          }))));
          NODE
      - name: Commit durable ancestry evidence
        shell: bash
        run: |
          set -euo pipefail
          BRANCH=research/universal-structural-policy-20260930
          FILE=research/isograph/discovery/2026-09-30-universal-structural-policy/CPC_HORIZONTAL_LADDER_ANCESTRY_0_1.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$FILE"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research: record ancestry-safe horizontal ladder"
          for attempt in 1 2 3; do
            git fetch origin "$BRANCH"
            git rebase "origin/$BRANCH"
            if git push origin HEAD:"$BRANCH"; then exit 0; fi
            sleep 1
          done
          exit 1
