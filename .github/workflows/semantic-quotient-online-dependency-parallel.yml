name: Quotient online dependency-aware Negamax

on:
  push:
    branches:
      - research/semantic-quotient
      - research/frontier-negamax-conformance
    paths:
      - '.github/workflows/semantic-quotient-online-dependency-parallel.yml'
      - 'components/bsfp/geometry.mjs'
      - 'components/bsfp/support-lattice.mjs'
      - 'research/semantic-quotient/state-identity-unification/src/quotient-branch-manager-worker.mjs'
      - 'research/semantic-quotient/state-identity-unification/src/quotient-explore-hint-service.mjs'
      - 'research/semantic-quotient/state-identity-unification/src/quotient-explore-path.mjs'
      - 'research/semantic-quotient/state-identity-unification/src/quotient-live-line-move-order.mjs'
      - 'research/semantic-quotient/state-identity-unification/src/quotient-local-proof-store.mjs'
      - 'research/semantic-quotient/state-identity-unification/src/quotient-local-semantic-descriptor.mjs'
      - 'research/semantic-quotient/state-identity-unification/src/quotient-lookahead-work-dag.mjs'
      - 'research/semantic-quotient/state-identity-unification/src/quotient-native-negamax-slot64-residual-kernel.mjs'
      - 'research/semantic-quotient/state-identity-unification/src/quotient-native-negamax-support-layout-kernel.mjs'
      - 'research/semantic-quotient/state-identity-unification/src/quotient-negamax-domain-contract.mjs'
      - 'research/semantic-quotient/state-identity-unification/src/quotient-negamax-engine.mjs'
      - 'research/semantic-quotient/state-identity-unification/src/quotient-negamax-search-record.mjs'
      - 'research/semantic-quotient/state-identity-unification/src/quotient-online-dependency-coordinator.mjs'
      - 'research/semantic-quotient/state-identity-unification/src/quotient-online-dependency-parallel-campaign.mjs'
      - 'research/semantic-quotient/state-identity-unification/src/quotient-online-only-state-storage.mjs'
      - 'research/semantic-quotient/state-identity-unification/src/quotient-online-semantic-search-lib.mjs'
      - 'research/semantic-quotient/state-identity-unification/src/quotient-online-semantic-search-worker.mjs'
      - 'research/semantic-quotient/state-identity-unification/src/quotient-online-semantic-worker-pool.mjs'
      - 'research/semantic-quotient/state-identity-unification/src/quotient-packed-proof-store.mjs'
      - 'research/semantic-quotient/state-identity-unification/src/quotient-proof-resource-service.mjs'
      - 'research/semantic-quotient/state-identity-unification/src/quotient-search-worker-executor.mjs'
      - 'research/semantic-quotient/state-identity-unification/src/quotient-semantic-identity.mjs'
      - 'research/semantic-quotient/state-identity-unification/src/quotient-semantic-shared-tt.mjs'
      - 'research/semantic-quotient/state-identity-unification/src/quotient-shared-graph-lib.mjs'
      - 'research/semantic-quotient/state-identity-unification/src/quotient-slot64-residual-pool-v2.mjs'
      - 'research/semantic-quotient/state-identity-unification/src/quotient-term-id-pool.mjs'
      - 'research/semantic-quotient/state-identity-unification/src/quotient-work-plan-service.mjs'
  workflow_dispatch:

permissions:
  contents: read

env:
  REPEATS: '5'
  SPLIT_DEPTHS: '2,3,4'
  WORKER_COUNTS: '1,2,3,4'
  PRIORITY_PROBE_DEPTH: '0'
  PREFIX_CLASSES: '4096'

jobs:
  benchmark:
    name: Compare online dependency-aware Negamax
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26.7.0
      - name: Run online dependency-aware campaign
        run: >-
          node --expose-gc --max-old-space-size=6144
          research/semantic-quotient/state-identity-unification/src/quotient-online-dependency-parallel-campaign.mjs
