name: isomax-retained-pull-economics

on:
  pull_request:
    paths:
      - 'benchmarks/isomax-workers/retained-pull-comparison.mjs'
      - 'components/isometric/execution/shared-work-pool.mjs'
      - 'components/isometric/execution/pull-*.mjs'
      - '.github/workflows/isomax-retained-pull-economics.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  ISOMAX_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  late-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26.7.0
      - run: ISOMAX_RETAINED_PULL_SUMMARY_ONLY=1 node benchmarks/isomax-workers/retained-pull-comparison.mjs

  hard-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      ISOMAX_RETAINED_PULL_CORPUS: hard
      ISOMAX_RETAINED_PULL_SUMMARY_ONLY: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26.7.0
      - run: node benchmarks/isomax-workers/retained-pull-comparison.mjs

  hard-linux-1x:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      ISOMAX_RETAINED_PULL_CORPUS: hard
      ISOMAX_RETAINED_PULL_SUMMARY_ONLY: '1'
      ISOMAX_RETAINED_PULL_EXECUTION_FACTOR: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26.7.0
      - run: node benchmarks/isomax-workers/retained-pull-comparison.mjs

  hard-linux-lifo:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      ISOMAX_RETAINED_PULL_CORPUS: hard
      ISOMAX_RETAINED_PULL_SUMMARY_ONLY: '1'
      ISOMAX_RETAINED_PULL_CANDIDATE_ORDER: lifo
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26.7.0
      - run: node benchmarks/isomax-workers/retained-pull-comparison.mjs

  late-windows:
    runs-on: windows-latest
    timeout-minutes: 8
    env:
      ISOMAX_RETAINED_PULL_SUMMARY_ONLY: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26.7.0
      - run: node benchmarks/isomax-workers/retained-pull-comparison.mjs

  hard-windows:
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      ISOMAX_RETAINED_PULL_CORPUS: hard
      ISOMAX_RETAINED_PULL_SUMMARY_ONLY: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26.7.0
      - run: node benchmarks/isomax-workers/retained-pull-comparison.mjs
