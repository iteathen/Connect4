name: Frontier dual-exit rho class DAG

on:
  push:
    branches:
      - research/frontier-negamax-conformance
    paths:
      - research/semantic-quotient/state-identity-unification/src/quotient-standard7x6-dual-exit-rho-class-dag.mjs
      - .github/workflows/frontier-dual-exit-rho-class-dag.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    name: dual-exit-rho-${{ matrix.case }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - { case: D-A, refusal: D, first: A }
          - { case: D-B, refusal: D, first: B }
          - { case: D-C, refusal: D, first: C }
          - { case: D-D, refusal: D, first: D }
          - { case: D-E, refusal: D, first: E }
          - { case: D-F, refusal: D, first: F }
          - { case: D-G, refusal: D, first: G }
          - { case: E-A, refusal: E, first: A }
          - { case: E-B, refusal: E, first: B }
          - { case: E-C, refusal: E, first: C }
          - { case: E-D, refusal: E, first: D }
          - { case: E-E, refusal: E, first: E }
          - { case: E-F, refusal: E, first: F }
          - { case: E-G, refusal: E, first: G }
          - { case: F-A, refusal: F, first: A }
          - { case: F-B, refusal: F, first: B }
          - { case: F-C, refusal: F, first: C }
          - { case: F-D, refusal: F, first: D }
          - { case: F-E, refusal: F, first: E }
          - { case: F-F, refusal: F, first: F }
          - { case: F-G, refusal: F, first: G }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26.7.0
      - name: Solve exact rho class DAG
        shell: bash
        run: |
          set -euo pipefail
          timeout 300s node research/semantic-quotient/state-identity-unification/src/quotient-standard7x6-dual-exit-rho-class-dag.mjs "${{ matrix.refusal }}" "${{ matrix.first }}"
