name: Oracle-blind 444 defect propagation

on:
  workflow_dispatch:
  push:
    branches: [research/44-geometry-blind-20260928]
    paths:
      - "research/isograph/discovery/2026-09-28-44-geometry-blind/444-defect-propagation.mjs"
      - ".github/workflows/444-defect-propagation.yml"

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        sequence: ["44414","44424","44434","44444"]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with: {node-version: "26.7.0"}
      - name: Guard solved-data boundary
        run: "! grep -E 'solved-actions|openingbook|bdd_w7_h6|solution_w7_h6|ExactConnect4Oracle|reference/oracles' research/isograph/discovery/2026-09-28-44-geometry-blind/444-defect-propagation.mjs"
      - name: Run safety-cover propagation
        env: {SEQUENCE: "${{ matrix.sequence }}"}
        run: node research/isograph/discovery/2026-09-28-44-geometry-blind/444-defect-propagation.mjs > result-${{ matrix.sequence }}.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: connect4-defect-${{ matrix.sequence }}
          path: result-${{ matrix.sequence }}.json
          if-no-files-found: error
