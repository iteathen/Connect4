name: Agent event router

on:
  issue_comment:
    types: [created, edited]
  issues:
    types: [opened, edited, reopened, closed]
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft, closed, review_requested]
  pull_request_review:
    types: [submitted, edited, dismissed]
  push:
    branches:
      - main
      - solver/isometric
      - research/semantic-quotient
      - 'prototype/isomax-*'
      - 'work/isomax-*'
      - 'research/isomax-*'
  workflow_run:
    workflows: [verify, strength-evidence, benchmark-evidence]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: read
  actions: read

concurrency:
  group: agent-event-router-${{ github.event_name }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  route:
    name: Route sanitized wake event
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Build sanitized event record
        id: event
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REPOSITORY: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          action="$(jq -r '.action // "none"' "$GITHUB_EVENT_PATH")"
          source_number=""
          source_url=""
          source_ref=""
          head_sha=""
          targets=""

          case "$EVENT_NAME" in
            issue_comment|issues)
              source_number="$(jq -r '.issue.number' "$GITHUB_EVENT_PATH")"
              if [[ "$source_number" == "139" ]]; then
                echo "route=false" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              if [[ "$source_number" != "102" && "$source_number" != "126" ]]; then
                echo "route=false" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              source_url="$(jq -r 'if .comment then .comment.html_url else .issue.html_url end' "$GITHUB_EVENT_PATH")"
              source_ref="issue:$source_number"
              if [[ "$source_number" == "102" ]]; then
                targets="isomax-director,isomax-reviewer,isomax-research,isomax-implementation,isomax-qualification,security"
              else
                targets="isomax-director,capacity-manager,security"
              fi
              ;;

            pull_request)
              source_number="$(jq -r '.pull_request.number' "$GITHUB_EVENT_PATH")"
              source_url="$(jq -r '.pull_request.html_url' "$GITHUB_EVENT_PATH")"
              source_ref="pr:$source_number"
              head_sha="$(jq -r '.pull_request.head.sha' "$GITHUB_EVENT_PATH")"
              targets="isomax-director,isomax-reviewer,isomax-qualification,security"
              ;;

            pull_request_review)
              source_number="$(jq -r '.pull_request.number' "$GITHUB_EVENT_PATH")"
              source_url="$(jq -r '.review.html_url // .pull_request.html_url' "$GITHUB_EVENT_PATH")"
              source_ref="pr-review:$source_number"
              head_sha="$(jq -r '.pull_request.head.sha' "$GITHUB_EVENT_PATH")"
              targets="isomax-director,isomax-reviewer,isomax-qualification,security"
              ;;

            push)
              source_url="$(jq -r '.compare // empty' "$GITHUB_EVENT_PATH")"
              source_ref="branch:$REF_NAME"
              head_sha="$(jq -r '.after // empty' "$GITHUB_EVENT_PATH")"
              case "$REF_NAME" in
                research/semantic-quotient|research/isomax-*)
                  targets="isomax-director,isomax-research,isomax-reviewer"
                  ;;
                prototype/isomax-*|work/isomax-*|solver/isometric)
                  targets="isomax-director,isomax-reviewer,isomax-qualification,isomax-implementation"
                  ;;
                main)
                  targets="isomax-director,isomax-reviewer,security"
                  ;;
                *)
                  echo "route=false" >> "$GITHUB_OUTPUT"
                  exit 0
                  ;;
              esac
              ;;

            workflow_run)
              source_url="$(jq -r '.workflow_run.html_url' "$GITHUB_EVENT_PATH")"
              source_ref="workflow:$(jq -r '.workflow_run.name' "$GITHUB_EVENT_PATH")"
              head_sha="$(jq -r '.workflow_run.head_sha // empty' "$GITHUB_EVENT_PATH")"
              action="$(jq -r '.workflow_run.conclusion // .action // "completed"' "$GITHUB_EVENT_PATH")"
              targets="isomax-director,isomax-reviewer,isomax-qualification"
              ;;

            workflow_dispatch)
              source_url="https://github.com/$REPOSITORY/actions/runs/$RUN_ID"
              source_ref="manual:event-router"
              head_sha="$SHA"
              targets="isomax-director,security"
              ;;

            *)
              echo "route=false" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
          esac

          {
            echo "route=true"
            echo "event_name=$EVENT_NAME"
            echo "action=$action"
            echo "source_number=$source_number"
            echo "source_url=$source_url"
            echo "source_ref=$source_ref"
            echo "head_sha=$head_sha"
            echo "targets=$targets"
          } >> "$GITHUB_OUTPUT"

      - name: Publish wake-only event
        if: steps.event.outputs.route == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ steps.event.outputs.event_name }}
          EVENT_ACTION: ${{ steps.event.outputs.action }}
          SOURCE_NUMBER: ${{ steps.event.outputs.source_number }}
          SOURCE_URL: ${{ steps.event.outputs.source_url }}
          SOURCE_REF: ${{ steps.event.outputs.source_ref }}
          HEAD_SHA: ${{ steps.event.outputs.head_sha }}
          TARGETS: ${{ steps.event.outputs.targets }}
          ACTOR: ${{ github.actor }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          run_url="https://github.com/$REPOSITORY/actions/runs/$RUN_ID"
          body="$(cat <<EOF
<!-- agent-event-router:v1 -->
AX/EVENT
EVENT_KIND: $EVENT_NAME
ACTION: $EVENT_ACTION
SOURCE_REF: $SOURCE_REF
SOURCE_NUMBER: $SOURCE_NUMBER
SOURCE_URL: $SOURCE_URL
ACTOR: $ACTOR
HEAD_SHA: $HEAD_SHA
TARGETS: $TARGETS
AUTHORITY: wake-only
ROUTER_RUN: $run_url
ROUTER_ATTEMPT: $RUN_ATTEMPT
EOF
)"
          gh api "repos/$REPOSITORY/issues/139/comments" -f body="$body" >/dev/null
