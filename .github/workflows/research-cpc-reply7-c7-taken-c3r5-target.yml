name: Research CPC reply7 c7-taken c3r5 target

on:
  push:
    branches:
      - research/universal-structural-policy-20260930
    paths:
      - .github/workflows/research-cpc-reply7-c7-taken-c3r5-target.yml
      - research/isograph/discovery/2026-09-30-universal-structural-policy/run-cpc-rank24-reply7-c7-taken-c3r5-target.mjs

permissions:
  contents: write

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact pushed revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Pin Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26.7.0
      - name: Fetch pinned JSMinSys authority
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/iteathen/JSMinSys.git jsminsys
          git -C jsminsys checkout bf23d3a67652cd42e1975f29c7dc4eed54f7eb42
          test -z "$(git -C jsminsys status --porcelain)"
      - name: Qualify c3r5 truncated target certificate
        shell: bash
        run: |
          set -euo pipefail
          DIR=research/isograph/discovery/2026-09-30-universal-structural-policy
          OUT="$DIR/CPC_RANK24_REPLY7_C7_TAKEN_C3R5_TARGET_0_1.json"
          node "$DIR/run-cpc-rank24-reply7-c7-taken-c3r5-target.mjs" ./jsminsys > "$OUT"
          node - "$OUT" <<'NODE'
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          if(r.oracleUsed!==false||r.solvedInputsUsed!==false)throw new Error('forbidden solved input flag');
          if(r.accept!==true)throw new Error('c3r5 target certificate rejected');
          if(!r.target.activeP1Singleton||r.target.projectedOwner!==1)throw new Error('target premise failed');
          if(r.defenderPlayableSingletons.length)throw new Error('defender has immediate terminal');
          if(!r.template?.targetIsResponse||!r.validation?.pass)throw new Error('pairing certificate failed');
          console.log(JSON.stringify({
            accept:r.accept,
            state:r.state,
            target:r.target,
            pairs:r.template.synchronizedPairs,
            defenderResidualCount:r.template.defenderResidualCount,
            validation:r.validation
          }));
          NODE
      - name: Commit durable qualification evidence
        shell: bash
        run: |
          set -euo pipefail
          BRANCH=research/universal-structural-policy-20260930
          FILE=research/isograph/discovery/2026-09-30-universal-structural-policy/CPC_RANK24_REPLY7_C7_TAKEN_C3R5_TARGET_0_1.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$FILE"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research: record reply7 c7-taken c3r5 target qualification"
          for attempt in 1 2 3; do
            git fetch origin "$BRANCH"
            git rebase --autostash "origin/$BRANCH"
            if git push origin HEAD:"$BRANCH"; then exit 0; fi
            sleep 1
          done
          exit 1
