name: Research CPCX center-spine cofactor equivalence

on:
  push:
    branches:
      - experiment/cpcx-20261002
    paths:
      - research/isograph/discovery/2026-10-02-cpcx/run-uc4a-cpcx-turn6-center-spine-cofactor-equivalence.mjs
      - research/isograph/discovery/2026-10-02-cpcx/cpcx-saturated-column-cofactor.mjs
      - research/isograph/discovery/2026-10-02-cpcx/cpcx-saturated-column-cofactor.test.mjs
      - research/isograph/discovery/2026-10-02-cpcx/CPCX_SATURATED_COLUMN_COFACTOR_HOMOMORPHISM_0_1.md
      - research/isograph/discovery/2026-10-02-cpcx/cpcx-residual-defect-transport.mjs
      - research/isograph/discovery/2026-10-02-cpcx/cpcx-residual-defect-transport.test.mjs
      - research/isograph/discovery/2026-10-02-cpcx/CPCX_BOUNDED_RESIDUAL_DEFECT_TRANSPORT_0_1.md
      - research/isograph/discovery/2026-10-02-cpcx/run-uc4a-cpcx-turn6-defect-pair-rlc-response-intersection.mjs
      - .github/workflows/research-cpcx-center-spine-cofactor.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "26.7.0"
      - run: node --test research/isograph/discovery/2026-10-02-cpcx/cpcx-saturated-column-cofactor.test.mjs
      - run: node --test research/isograph/discovery/2026-10-02-cpcx/cpcx-residual-defect-transport.test.mjs
      - run: node research/isograph/discovery/2026-10-02-cpcx/run-uc4a-cpcx-turn6-center-spine-cofactor-equivalence.mjs > center-spine-cofactor-equivalence.json
      - run: node research/isograph/discovery/2026-10-02-cpcx/run-uc4a-cpcx-turn6-defect-pair-rlc-response-intersection.mjs > defect-pair-rlc-response-intersection.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: center-spine-cofactor-equivalence
          path: |
            center-spine-cofactor-equivalence.json
            defect-pair-rlc-response-intersection.json
          if-no-files-found: error
