name: Research CPC rank20 c5 reply5 post contraction CPC reentry diagnostic

concurrency:
  group: rank20-c5-reply5-post-contraction-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - research/universal-structural-policy-20260930
    paths:
      - .github/workflows/research-cpc-rank20-c5-reply5-post-contraction-reentry.yml
      - research/isograph/discovery/2026-09-30-universal-structural-policy/CPC_RANK20_C5_REPLY5_POST_CONTRACTION_CPC_REENTRY_DIAGNOSTIC_DESIGN_0_1.md
      - research/isograph/discovery/2026-09-30-universal-structural-policy/test-cpc-rank20-c5-reply5-post-contraction-cpc-reentry-diagnostic.mjs
      - research/isograph/discovery/2026-09-30-universal-structural-policy/run-cpc-rank20-c5-reply5-post-contraction-cpc-reentry-diagnostic.mjs
      - research/isograph/discovery/2026-09-30-universal-structural-policy/CPC_RANK20_C5_REPLY5_DUAL_PAIR_CHOICE_ELIMINATION_PROBE_0_1.json

permissions:
  contents: write

jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26.7.0
      - name: Fetch pinned JSMinSys authority
        shell: bash
        run: |
          set -euo pipefail
          git clone -q https://github.com/iteathen/JSMinSys.git jsminsys
          git -C jsminsys checkout -q bf23d3a67652cd42e1975f29c7dc4eed54f7eb42
      - name: Verify frozen reentry diagnostic contract
        run: node research/isograph/discovery/2026-09-30-universal-structural-policy/test-cpc-rank20-c5-reply5-post-contraction-cpc-reentry-diagnostic.mjs ./jsminsys
      - name: Generate durable reentry diagnostic evidence
        shell: bash
        run: |
          set -euo pipefail
          DIR=research/isograph/discovery/2026-09-30-universal-structural-policy
          OUT="$DIR/CPC_RANK20_C5_REPLY5_POST_CONTRACTION_CPC_REENTRY_DIAGNOSTIC_0_1.json"
          node "$DIR/run-cpc-rank20-c5-reply5-post-contraction-cpc-reentry-diagnostic.mjs" ./jsminsys > "$OUT"
          node - "$OUT" <<'NODE'
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          console.log(JSON.stringify({
            states:r.states.map(x=>({id:x.id,cpc:x.cpcAgreement,promising:x.cpcReentryPromising})),
            promisingCount:r.summary.promisingCount
          }));
          NODE
      - name: Commit durable reentry diagnostic evidence
        shell: bash
        run: |
          set -euo pipefail
          BRANCH=research/universal-structural-policy-20260930
          FILE=research/isograph/discovery/2026-09-30-universal-structural-policy/CPC_RANK20_C5_REPLY5_POST_CONTRACTION_CPC_REENTRY_DIAGNOSTIC_0_1.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$FILE"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research: record post-contraction CPC reentry diagnostic"
          git pull --rebase origin "$BRANCH"
          git push origin HEAD:"$BRANCH"
