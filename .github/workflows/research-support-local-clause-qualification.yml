name: Canonical research support-local clause qualification

on:
  push:
    branches:
      - research/semantic-quotient
    paths:
      - research/experiments/bsfp-support-local-clause-coverage/**
      - .github/workflows/research-support-local-clause-qualification.yml

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26.7.0
      - name: Assert exact Node runtime
        run: node -e "if (process.version !== 'v26.7.0') throw new Error('expected Node v26.7.0, got ' + process.version)"
      - name: Run maintained verification boundary
        run: npm test
      - name: Qualify support-local coverage and cofactor maps
        run: node research/experiments/bsfp-support-local-clause-coverage/reference-coverage-cofactor.mjs
