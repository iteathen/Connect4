name: Research native CPC v4 boundary probe

on:
  push:
    branches:
      - research/universal-structural-policy-20260930
    paths:
      - .github/workflows/research-native-cpc-v4-boundary-probe.yml
      - research/isograph/discovery/2026-09-30-universal-structural-policy/run-native-cpc-v4-boundary-probe.mjs

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact Connect4 revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Pin Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26.7.0

      - name: Assert exact Node runtime
        run: node -e "if (process.version !== 'v26.7.0') throw new Error('expected Node v26.7.0, got ' + process.version)"

      - name: Clone pinned JSMinSys CPC authority
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/iteathen/JSMinSys.git jsminsys
          cd jsminsys
          git checkout 6bbba7c71c60afb1018a22b6d5c03f495f5d2c9e
          test "$(git rev-parse HEAD)" = "6bbba7c71c60afb1018a22b6d5c03f495f5d2c9e"
          test -z "$(git status --porcelain)"

      - name: Run one-pass native CPC probe
        shell: bash
        run: |
          set -euo pipefail
          OUT=research/isograph/discovery/2026-09-30-universal-structural-policy/NATIVE_CPC_V4_BOUNDARY_PROBE_0_1.json
          node research/isograph/discovery/2026-09-30-universal-structural-policy/run-native-cpc-v4-boundary-probe.mjs ./jsminsys > "$OUT"
          node - "$OUT" <<'NODE'
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          for(const row of r.rows){
            console.log(row.label,JSON.stringify(row.policies.map(p=>({
              frontierResponse:p.frontierResponse,
              kind:p.kindName,
              interval:p.absoluteInterval,
              forced:p.forcedColumn,
              preemption:p.preemptionColumns,
              projected:p.projected
            }))));
          }
          NODE

      - name: Commit durable CPC evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/isograph/discovery/2026-09-30-universal-structural-policy/NATIVE_CPC_V4_BOUNDARY_PROBE_0_1.json
          if git diff --cached --quiet; then
            echo "CPC evidence unchanged"
            exit 0
          fi
          git commit -m "research: verify native CPC v4-boundary probe"
          git push origin HEAD:research/universal-structural-policy-20260930
