name: Frontier G3 mu16 target-support handoff

on:
  push:
    branches:
      - research/frontier-negamax-conformance
    paths:
      - research/semantic-quotient/state-identity-unification/src/quotient-standard7x6-g3-mu16-target-support-handoff.mjs
      - .github/workflows/frontier-g3-mu16-target-support-handoff.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  handoff:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      roots: ${{ steps.run.outputs.roots }}
      forced: ${{ steps.run.outputs.forced }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26.7.0
      - name: Qualify exact G3 target-support handoff
        id: run
        shell: bash
        run: |
          set -euo pipefail
          f="$RUNNER_TEMP/g3-mu16-target-support.txt"
          timeout 270s node research/semantic-quotient/state-identity-unification/src/quotient-standard7x6-g3-mu16-target-support-handoff.mjs | tee "$f"
          RESULT_FILE="$f" node <<'NODE'
          const fs=require('node:fs');
          const line=fs.readFileSync(process.env.RESULT_FILE,'utf8').split(/\r?\n/).find(x=>x.startsWith('G3_MU16_TARGET_SUPPORT_HANDOFF='));
          if(!line) throw new Error('G3 target-support handoff summary missing');
          const x=JSON.parse(line.slice(line.indexOf('=')+1));
          if(x.exactFalsifierRoots!==2) throw new Error(`falsifier root drift ${x.exactFalsifierRoots}`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT,[
            `roots=${x.exactFalsifierRoots}`,
            `forced=${x.rootsWithForcedG3Block}`,
          ].join('\n')+'\n');
          NODE

  summary:
    needs: handoff
    name: target-support-r${{ needs.handoff.outputs.roots }}-f${{ needs.handoff.outputs.forced }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - run: echo "G3 target-support handoff counts encoded in job name"
