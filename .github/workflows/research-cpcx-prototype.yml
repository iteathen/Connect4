name: Research CPCX prototype

on:
  push:
    branches:
      - experiment/cpcx-20261002
    paths:
      - research/isograph/discovery/2026-10-02-cpcx/**
      - .github/workflows/research-cpcx-prototype.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "26.7.0"

      - name: Test CPCX
        run: node --test research/isograph/discovery/2026-10-02-cpcx/*.test.mjs

      - name: Inspect 44444
        run: |
          node research/isograph/discovery/2026-10-02-cpcx/run-cpcx.mjs > cpcx-44444.json
          node research/isograph/discovery/2026-10-02-cpcx/run-cpcx-closure.mjs > cpcx-closure-44444.json
          node research/isograph/discovery/2026-10-02-cpcx/run-cpcx-move6.mjs > cpcx-move6.json
          node research/isograph/discovery/2026-10-02-cpcx/run-cpcx-move6-seams.mjs > cpcx-move6-seams.json
          node research/isograph/discovery/2026-10-02-cpcx/run-cpcx-move6-carriers.mjs > cpcx-move6-carriers.json
          node research/isograph/discovery/2026-10-02-cpcx/run-cpcx-move6-components.mjs > cpcx-move6-components.json
          node research/isograph/discovery/2026-10-02-cpcx/run-cpcx-move6-vertical-resolutions.mjs > cpcx-move6-vertical-resolutions.json
          node research/isograph/discovery/2026-10-02-cpcx/run-cpcx-move6-unresolved-classes.mjs > cpcx-move6-unresolved-classes.json
          node research/isograph/discovery/2026-10-02-cpcx/run-cpcx-move6-event-commutator.mjs > cpcx-move6-event-commutator.json
          node research/isograph/discovery/2026-10-02-cpcx/run-cpcx-move6-center-ac-proof-cone.mjs > cpcx-move6-center-ac-proof-cone.json
          node research/isograph/discovery/2026-10-02-cpcx/run-cpcx-move6-support-release-hazards.mjs > cpcx-move6-support-release-hazards.json
          node research/isograph/discovery/2026-10-02-cpcx/run-cpcx-move6-collapse-component-horizons.mjs > cpcx-move6-collapse-component-horizons.json
          node research/isograph/discovery/2026-10-02-cpcx/run-uc4a-cpcx-center-direct-wing-renewal.mjs > uc4a-cpcx-center-direct-wing-renewal.json
          node research/isograph/discovery/2026-10-02-cpcx/run-uc4a-cpcx-final-trigger-theft-renewal.mjs > uc4a-cpcx-final-trigger-theft-renewal.json
          node research/isograph/discovery/2026-10-02-cpcx/run-uc4a-cpcx-one-support-short-role-census.mjs > uc4a-cpcx-one-support-short-role-census.json
          node research/isograph/discovery/2026-10-02-cpcx/run-uc4a-cpcx-diagonal-defect-transport.mjs > uc4a-cpcx-diagonal-defect-transport.json
          node research/isograph/discovery/2026-10-02-cpcx/run-uc4a-cpcx-b3-defect-transport-role-census.mjs > uc4a-cpcx-b3-defect-transport-role-census.json
          node research/isograph/discovery/2026-10-02-cpcx/run-uc4a-cpcx-b5-block-transfer.mjs > uc4a-cpcx-b5-block-transfer.json
          node research/isograph/discovery/2026-10-02-cpcx/run-uc4a-cpcx-b5-block-right-diagonal-reservoir.mjs > uc4a-cpcx-b5-block-right-diagonal-reservoir.json
          node research/isograph/discovery/2026-10-02-cpcx/run-uc4a-cpcx-u13-shared-discharge-neutralization.mjs > uc4a-cpcx-u13-shared-discharge-neutralization.json
          node research/isograph/discovery/2026-10-02-cpcx/run-uc4a-cpcx-transferred-defect-rcic.mjs > uc4a-cpcx-transferred-defect-rcic.json
          node research/isograph/discovery/2026-10-02-cpcx/run-uc4a-cpcx-b3-support-release-acquisition.mjs > uc4a-cpcx-b3-support-release-acquisition.json
          node research/isograph/discovery/2026-10-02-cpcx/run-cpcx-move6-shared-deviation-substrate.mjs > cpcx-move6-shared-deviation-substrate.json
          node research/isograph/discovery/2026-10-02-cpcx/run-cpcx-move6-adaptive-replies.mjs > cpcx-move6-adaptive-replies.json
          node research/isograph/discovery/2026-10-02-cpcx/run-cpcx-move6-forward-wing.mjs > cpcx-move6-forward-wing.json
          node research/isograph/discovery/2026-10-02-cpcx/run-cpcx-move6-forward-classes.mjs > cpcx-move6-forward-classes.json
          node research/isograph/discovery/2026-10-02-cpcx/run-cpcx-move6-theft-setups.mjs > cpcx-move6-theft-setups.json

      - name: Verify CPCX dependency isolation
        run: node research/isograph/discovery/2026-10-02-cpcx/verify-cpcx-isolation.mjs

      - name: Verify production CPC unchanged
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin research/universal-structural-policy-20260930
          CHANGED="$(git diff --name-only origin/research/universal-structural-policy-20260930...HEAD)"
          printf '%s\n' "$CHANGED"
          if printf '%s\n' "$CHANGED" | grep -E '(^|/)(cpc-connect4\.mjs|cpc-connect4\.test\.mjs)$'; then
            echo "production CPC changed"
            exit 1
          fi
          if printf '%s\n' "$CHANGED" | grep -E '^addons/cpc-|^src/cpc-'; then
            echo "production CPC path changed"
            exit 1
          fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: cpcx-44444
          path: |
            cpcx-44444.json
            cpcx-closure-44444.json
            cpcx-move6.json
            cpcx-move6-seams.json
            cpcx-move6-carriers.json
            cpcx-move6-components.json
            cpcx-move6-vertical-resolutions.json
            cpcx-move6-unresolved-classes.json
            cpcx-move6-event-commutator.json
            cpcx-move6-center-ac-proof-cone.json
            cpcx-move6-support-release-hazards.json
            cpcx-move6-collapse-component-horizons.json
            uc4a-cpcx-center-direct-wing-renewal.json
            uc4a-cpcx-final-trigger-theft-renewal.json
            uc4a-cpcx-one-support-short-role-census.json
            uc4a-cpcx-diagonal-defect-transport.json
            uc4a-cpcx-b3-defect-transport-role-census.json
            uc4a-cpcx-b5-block-transfer.json
            uc4a-cpcx-b5-block-right-diagonal-reservoir.json
            uc4a-cpcx-u13-shared-discharge-neutralization.json
            uc4a-cpcx-transferred-defect-rcic.json
            uc4a-cpcx-b3-support-release-acquisition.json
            cpcx-move6-shared-deviation-substrate.json
            cpcx-move6-adaptive-replies.json
            cpcx-move6-forward-wing.json
            cpcx-move6-forward-classes.json
            cpcx-move6-theft-setups.json
          if-no-files-found: error
