name: Research NEES CPC guard survival kernel

on:
  push:
    branches:
      - research/universal-structural-policy-20260930
    paths:
      - .github/workflows/research-cpc-nees-guard-kernel.yml
      - research/isograph/discovery/2026-09-30-universal-structural-policy/run-cpc-guard-survival-nees-kernel.mjs

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out exact pushed revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Pin Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26.7.0
      - name: Fetch NEES JSMinSys kernel revision
        shell: bash
        run: |
          set -euo pipefail
          git clone --branch research/cpc-guard-proof-memo-nees-v1 --single-branch https://github.com/iteathen/JSMinSys.git jsminsys-nees
          git -C jsminsys-nees checkout db9cda32fc814a7f982816556cb59ab82a7a4782
      - name: Run NEES kernel D19
        shell: bash
        env:
          NODE_OPTIONS: --max-old-space-size=2048
        run: |
          set -euo pipefail
          DIR=research/isograph/discovery/2026-09-30-universal-structural-policy
          OUT="$DIR/CPC_NEES_GUARD_KERNEL_D19_0_1.json"
          /usr/bin/time -f 'NEES_KERNEL_D19 wall=%e maxrss_kb=%M user=%U sys=%S' \
            node "$DIR/run-cpc-guard-survival-nees-kernel.mjs" ./jsminsys-nees 19 4194304 > "$OUT"
          node - "$OUT" <<'NODE'
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          if(!r.result.accept)throw new Error('NEES kernel failed established D19');
          console.log('D19='+JSON.stringify({result:r.result,runtime:r.runtime}));
          NODE
      - name: Run NEES kernel D25
        shell: bash
        env:
          NODE_OPTIONS: --max-old-space-size=2048
        run: |
          set -euo pipefail
          DIR=research/isograph/discovery/2026-09-30-universal-structural-policy
          OUT="$DIR/CPC_NEES_GUARD_KERNEL_D25_0_1.json"
          /usr/bin/time -f 'NEES_KERNEL_D25 wall=%e maxrss_kb=%M user=%U sys=%S' \
            timeout 900 node "$DIR/run-cpc-guard-survival-nees-kernel.mjs" ./jsminsys-nees 25 4194304 > "$OUT"
          node - "$OUT" <<'NODE'
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          if(!r.result.accept)throw new Error('NEES kernel failed established D25');
          console.log('D25='+JSON.stringify({result:r.result,runtime:r.runtime}));
          NODE
      - name: Commit durable NEES kernel evidence
        shell: bash
        run: |
          set -euo pipefail
          BRANCH=research/universal-structural-policy-20260930
          DIR=research/isograph/discovery/2026-09-30-universal-structural-policy
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$DIR/CPC_NEES_GUARD_KERNEL_D19_0_1.json" "$DIR/CPC_NEES_GUARD_KERNEL_D25_0_1.json"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research: qualify NEES CPC guard kernel"
          for attempt in 1 2 3; do
            git fetch origin "$BRANCH"
            git rebase --autostash "origin/$BRANCH"
            if git push origin HEAD:"$BRANCH"; then exit 0; fi
            sleep 1
          done
          exit 1
