name: Research CPC candidate6 bottom-response guard D11

on:
  push:
    branches:
      - research/universal-structural-policy-20260930
    paths:
      - .github/workflows/research-cpc-c6-bottom-response-guard-d11.yml
      - research/isograph/discovery/2026-09-30-universal-structural-policy/run-cpc-bottom-response-guard-c6-target.mjs
      - research/isograph/discovery/2026-09-30-universal-structural-policy/CPC_BOTTOM_RESPONSE_GUARD_ESTABLISHMENT_COROLLARY.md

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Check out exact pushed revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Pin Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26.7.0
      - name: Fetch pinned JSMinSys authority
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/iteathen/JSMinSys.git jsminsys
          git -C jsminsys checkout 0899c5811918e68c22dc1b0e4dd8af97d9b4bbcb
      - name: Prove candidate6 D11 target
        shell: bash
        run: |
          set -euo pipefail
          OUT=research/isograph/discovery/2026-09-30-universal-structural-policy/CPC_C6_BOTTOM_RESPONSE_GUARD_D11_0_1.json
          node research/isograph/discovery/2026-09-30-universal-structural-policy/run-cpc-bottom-response-guard-c6-target.mjs ./jsminsys 11 > "$OUT"
          node - "$OUT" <<'NODE'
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          const x=r.rows[0],m=x.membership[0];
          console.log('C6_D11='+JSON.stringify({accept:m.accept,class:m.class,failedTrigger:m.failedTrigger??null,witnessByTrigger:m.witnessByTrigger??null}));
          console.log('WORK='+JSON.stringify(r.work));
          if(!m.accept) process.exit(3);
          NODE
      - name: Commit durable candidate6 D11 evidence
        shell: bash
        run: |
          set -euo pipefail
          BRANCH=research/universal-structural-policy-20260930
          FILE=research/isograph/discovery/2026-09-30-universal-structural-policy/CPC_C6_BOTTOM_RESPONSE_GUARD_D11_0_1.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$FILE"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research: verify candidate6 bottom-guard D11"
          for attempt in 1 2 3; do
            git fetch origin "$BRANCH"
            git rebase "origin/$BRANCH"
            if git push origin HEAD:"$BRANCH"; then exit 0; fi
            sleep 1
          done
          exit 1
