name: Solver namespace literal audit

on:
  push:
    branches:
      - solver/isometric
      - solver/sut
    paths:
      - .github/workflows/solver-namespace-literal-audit.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Find superseded root solver branch literals
        shell: bash
        run: |
          set +e
          grep -RInE --exclude-dir=.git --exclude-dir=node_modules '(^|[^A-Za-z0-9_/])(isometric|sut)([^A-Za-z0-9_-]|$)' .             | grep -v 'docs/decisions/2026-09-17-closed-durable-lane-topology.md'             | grep -v 'docs/decisions/2026-09-17-solver-namespace-normalization.md'             | tee /tmp/solver-namespace-matches.txt
          echo "match_count=$(wc -l < /tmp/solver-namespace-matches.txt)"
          exit 0
