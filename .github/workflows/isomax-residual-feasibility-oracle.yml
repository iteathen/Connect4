name: IsoMax residual feasibility oracle 4x4

on:
  push:
    branches:
      - experiment/isomax-residual-feasibility-oracle-20260929
    paths:
      - '.github/workflows/isomax-residual-feasibility-oracle.yml'
      - 'research/isograph/discovery/2026-09-29-isomax-residual-feasibility-oracle/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 0}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with: {node-version: '26'}
      - name: Run exact residual feasibility oracle
        run: node research/isograph/discovery/2026-09-29-isomax-residual-feasibility-oracle/run-residual-feasibility-oracle-4x4.mjs
      - name: Research integrity
        run: node tools/verify-research-integrity.mjs
      - name: Commit oracle evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/isograph/discovery/2026-09-29-isomax-residual-feasibility-oracle/RESIDUAL_FEASIBILITY_ORACLE_4X4_0_1.json
          if git diff --cached --quiet; then echo "No generated changes."; else
            git commit -m "research(isomax): freeze residual feasibility oracle evidence"
            git push origin HEAD:experiment/isomax-residual-feasibility-oracle-20260929
          fi
