name: Research CPC marked two-ply image census

on:
  push:
    branches:
      - research/universal-structural-policy-20260930
    paths:
      - .github/workflows/research-cpc-marked-two-ply-image-census.yml
      - research/isograph/discovery/2026-09-30-universal-structural-policy/run-cpc-marked-two-ply-image-census.mjs

permissions:
  contents: write

jobs:
  census:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact pushed revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Pin Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26.7.0

      - name: Fetch pinned JSMinSys CPC authority
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/iteathen/JSMinSys.git jsminsys
          git -C jsminsys checkout 0899c5811918e68c22dc1b0e4dd8af97d9b4bbcb

      - name: Run theorem-discovery census
        shell: bash
        run: |
          set -euo pipefail
          OUT=research/isograph/discovery/2026-09-30-universal-structural-policy/CPC_MARKED_TWO_PLY_IMAGE_CENSUS_0_1.json
          node research/isograph/discovery/2026-09-30-universal-structural-policy/run-cpc-marked-two-ply-image-census.mjs ./jsminsys > "$OUT"
          node - "$OUT" <<'NODE'
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          for(const root of r.rows){
            console.log('ROOT='+root.id);
            for(const s of root.setups){
              console.log(JSON.stringify({
                setup:s.setupColumn,
                postKind:s.postSetup.kind,
                forced:s.postSetup.forcedColumn,
                replies:s.admissibleDefenderReplyColumns,
                branch:s.branchSummary
              }));
            }
          }
          NODE

      - name: Commit durable discovery evidence
        shell: bash
        run: |
          set -euo pipefail
          BRANCH=research/universal-structural-policy-20260930
          FILE=research/isograph/discovery/2026-09-30-universal-structural-policy/CPC_MARKED_TWO_PLY_IMAGE_CENSUS_0_1.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$FILE"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research: record CPC marked two-ply image census"
          git fetch origin "$BRANCH"
          git rebase "origin/$BRANCH"
          git push origin HEAD:"$BRANCH"
