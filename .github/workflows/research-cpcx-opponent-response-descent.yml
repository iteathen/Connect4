name: Research CPCX opponent response descent

on:
  push:
    branches:
      - experiment/cpcx-20261002
    paths:
      - research/isograph/discovery/2026-10-02-cpcx/CPCX_PROTECTED_DIAGONAL_OPPONENT_RESPONSE_DESCENT_0_1.md
      - research/isograph/discovery/2026-10-02-cpcx/cpcx-opponent-response-descent.mjs
      - research/isograph/discovery/2026-10-02-cpcx/cpcx-opponent-response-descent.test.mjs
      - research/isograph/discovery/2026-10-02-cpcx/run-cpcx-move6-opponent-response-descent.mjs
      - .github/workflows/research-cpcx-opponent-response-descent.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "26.7.0"
      - name: Qualify opponent response descent
        run: node --test research/isograph/discovery/2026-10-02-cpcx/cpcx-opponent-response-descent.test.mjs
      - name: Apply theorem to turn6 P1 band
        run: node research/isograph/discovery/2026-10-02-cpcx/run-cpcx-move6-opponent-response-descent.mjs > cpcx-move6-opponent-response-descent.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: cpcx-opponent-response-descent
          path: cpcx-move6-opponent-response-descent.json
          if-no-files-found: error
