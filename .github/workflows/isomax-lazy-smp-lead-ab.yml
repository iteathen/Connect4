name: IsoMax Lazy SMP Lead A-B

on:
  push:
    branches:
      - work/isomax-jsminsys-boundary-cleanup
    paths:
      - '.github/workflows/isomax-lazy-smp-lead-ab.yml'
  workflow_dispatch:

jobs:
  ab:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backfill
            candidate: a08f47601c467f82bd6663d5457eb4feea56e963
          - name: root-diversity
            candidate: edacf7d8f188e4961893489d3fd33cd19d645c92
          - name: wake-wait
            candidate: adcc8a0d5eb565218bc69e1089bf3620e1a81d0a
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          submodules: recursive
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '26.7.0'
          cache: npm
      - run: npm ci
      - name: Same-runner B-C-C-B
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $baseline='04d37498607ace16dae33c79462ddfe1503c8a0d'
          $candidate='${{ matrix.candidate }}'
          function Use-JSMinSys([string]$sha) {
            git -C vendor/jsminsys cat-file -e "$sha^{commit}" 2>$null
            if ($LASTEXITCODE -ne 0) {
              git -C vendor/jsminsys fetch --no-tags origin $sha
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            }
            git -C vendor/jsminsys checkout --detach $sha
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

          Write-Host "LEAD_AB ${{ matrix.name }} baseline-1 $baseline"
          Use-JSMinSys $baseline
          node --experimental-ffi tools/bench-lazy-smp-control.mjs 7
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          Write-Host "LEAD_AB ${{ matrix.name }} candidate-1 $candidate"
          Use-JSMinSys $candidate
          node --experimental-ffi tools/bench-lazy-smp-control.mjs 7
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          Write-Host "LEAD_AB ${{ matrix.name }} candidate-2 $candidate"
          Use-JSMinSys $candidate
          node --experimental-ffi tools/bench-lazy-smp-control.mjs 7
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          Write-Host "LEAD_AB ${{ matrix.name }} baseline-2 $baseline"
          Use-JSMinSys $baseline
          node --experimental-ffi tools/bench-lazy-smp-control.mjs 7
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
