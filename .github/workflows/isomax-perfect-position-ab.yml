name: IsoMax Add-on Optimized Position Code A-B

on:
  push:
    branches:
      - experiment/isomax-addon-optimized-position-code-v1
    paths:
      - '.github/workflows/isomax-perfect-position-ab.yml'
      - 'components/isometric/solve.mjs'
      - 'vendor/jsminsys'
  workflow_dispatch:

jobs:
  ab:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          submodules: recursive
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '26.7.0'
          cache: npm
      - run: npm ci
      - name: Candidate integration gate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $candidate='810809cb23ccd64fcf527c77d2a9a4fe110e5ac8'
          git -C vendor/jsminsys checkout --detach $candidate
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $actual=(git -C vendor/jsminsys rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($actual -ne $candidate) { throw "JSMinSys HEAD mismatch: $actual != $candidate" }
          Write-Host "JSMS_HEAD $actual"
          npm test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test vendor/jsminsys/test/*.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Same-runner baseline-candidate-candidate-baseline
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          function Use-JSMinSys([string]$sha) {
            git -C vendor/jsminsys cat-file -e "$sha^{commit}" 2>$null
            if ($LASTEXITCODE -ne 0) {
              git -C vendor/jsminsys fetch --no-tags origin $sha
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            }
            git -C vendor/jsminsys checkout --detach $sha
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $actual=(git -C vendor/jsminsys rev-parse HEAD).Trim()
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            if ($actual -ne $sha) { throw "JSMinSys HEAD mismatch: $actual != $sha" }
            Write-Host "JSMS_HEAD $actual"
          }
          $baseline='01026e1efcb6019248fa15860ba3c0c32e9b5be9'
          $candidate='810809cb23ccd64fcf527c77d2a9a4fe110e5ac8'
          Write-Host "AB_PHASE baseline-1 $baseline"
          Use-JSMinSys $baseline
          node --experimental-ffi tools/bench-isomax-branch-manager.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Host "AB_PHASE candidate-1 $candidate"
          Use-JSMinSys $candidate
          node --experimental-ffi tools/bench-isomax-branch-manager.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Host "AB_PHASE candidate-2 $candidate"
          Use-JSMinSys $candidate
          node --experimental-ffi tools/bench-isomax-branch-manager.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Host "AB_PHASE baseline-2 $baseline"
          Use-JSMinSys $baseline
          node --experimental-ffi tools/bench-isomax-branch-manager.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
