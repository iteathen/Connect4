name: IsoMax Perfect Position Code A-B

on:
  push:
    branches:
      - experiment/isomax-perfect-position-code-v1
    paths:
      - '.github/workflows/isomax-perfect-position-ab.yml'
      - 'components/isometric/solve.mjs'
      - 'vendor/jsminsys'
  workflow_dispatch:

jobs:
  ab:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          submodules: recursive
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '26.7.0'
          cache: npm
      - run: npm ci
      - name: Candidate integration gate
        shell: pwsh
        run: |
          git -C vendor/jsminsys checkout 414e6bf796fac300d18bc9495aa18270473f0ffe
          npm test
          node --test vendor/jsminsys/test/*.test.mjs
      - name: Same-runner baseline-candidate-candidate-baseline
        shell: pwsh
        run: |
          Write-Host 'AB_PHASE baseline-1 01026e1efcb6019248fa15860ba3c0c32e9b5be9'
          git -C vendor/jsminsys checkout 01026e1efcb6019248fa15860ba3c0c32e9b5be9
          node --experimental-ffi tools/bench-isomax-branch-manager.mjs
          Write-Host 'AB_PHASE candidate-1 414e6bf796fac300d18bc9495aa18270473f0ffe'
          git -C vendor/jsminsys checkout 414e6bf796fac300d18bc9495aa18270473f0ffe
          node --experimental-ffi tools/bench-isomax-branch-manager.mjs
          Write-Host 'AB_PHASE candidate-2 414e6bf796fac300d18bc9495aa18270473f0ffe'
          node --experimental-ffi tools/bench-isomax-branch-manager.mjs
          Write-Host 'AB_PHASE baseline-2 01026e1efcb6019248fa15860ba3c0c32e9b5be9'
          git -C vendor/jsminsys checkout 01026e1efcb6019248fa15860ba3c0c32e9b5be9
          node --experimental-ffi tools/bench-isomax-branch-manager.mjs
