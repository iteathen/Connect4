name: IsoMax Compact Basis A-B

on:
  push:
    branches:
      - experiment/isomax-assertion-basis-bitset-v1
    paths:
      - '.github/workflows/isomax-perfect-position-ab.yml'
      - 'components/isometric/solve.mjs'
      - 'test/rba-solver.test.mjs'
      - 'vendor/jsminsys'
  workflow_dispatch:

jobs:
  ab:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          submodules: recursive
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '26.7.0'
          cache: npm
      - run: npm ci
      - name: Candidate integration gate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $candidate='c5643ef6c06f7e9d95b7b4bce44c85012c02e174'
          git -C vendor/jsminsys checkout --detach $candidate
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $actual=(git -C vendor/jsminsys rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($actual -ne $candidate) { throw "JSMinSys HEAD mismatch: $actual != $candidate" }
          Write-Host "JSMS_HEAD $actual"
          npm test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test vendor/jsminsys/test/*.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Same-runner baseline-candidate-candidate-baseline
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          function Use-JSMinSys([string]$sha) {
            git -C vendor/jsminsys cat-file -e "$sha^{commit}" 2>$null
            if ($LASTEXITCODE -ne 0) {
              git -C vendor/jsminsys fetch --no-tags origin $sha
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            }
            git -C vendor/jsminsys checkout --detach $sha
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $actual=(git -C vendor/jsminsys rev-parse HEAD).Trim()
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            if ($actual -ne $sha) { throw "JSMinSys HEAD mismatch: $actual != $sha" }
            Write-Host "JSMS_HEAD $actual"
          }
          $baseline='c5643ef6c06f7e9d95b7b4bce44c85012c02e174'
          $candidate='c5643ef6c06f7e9d95b7b4bce44c85012c02e174'
          Use-JSMinSys $candidate
          Write-Host "AB_PHASE baseline-1 stored-basis"
          $env:ISOMAX_BASIS_SET_WORDS='0'
          node --experimental-ffi tools/bench-isomax-branch-manager.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Host "AB_PHASE candidate-1 compact-basis"
          $env:ISOMAX_BASIS_SET_WORDS='20'
          node --experimental-ffi tools/bench-isomax-branch-manager.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Host "AB_PHASE candidate-2 compact-basis"
          $env:ISOMAX_BASIS_SET_WORDS='20'
          node --experimental-ffi tools/bench-isomax-branch-manager.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Host "AB_PHASE baseline-2 stored-basis"
          $env:ISOMAX_BASIS_SET_WORDS='0'
          node --experimental-ffi tools/bench-isomax-branch-manager.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
