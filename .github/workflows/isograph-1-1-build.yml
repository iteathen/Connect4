name: Build IsoGraph authority 1.1 candidate

on:
  push:
    branches:
      - work/isograph-logic-authority-1-1-rebuild-20260918
    paths:
      - research/isograph/successor/RUN_BUILD_1_1.request

permissions:
  contents: write

concurrency:
  group: connect4-isograph-build-1-1
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26.7.0
      - name: Build deterministic successor corpus
        run: node research/isograph/successor/tools/build-authority-1-1.mjs
      - name: Commit generated candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "iteathen"
          git config user.email "josh.oshiro@gmail.com"
          git add research/isograph/successor/generated
          if git diff --cached --quiet; then
            echo "Generated corpus already current"
            exit 0
          fi
          git commit -m "research: build dependency-closed IsoGraph authority 1.1 candidate"
          git push origin HEAD:work/isograph-logic-authority-1-1-rebuild-20260918
