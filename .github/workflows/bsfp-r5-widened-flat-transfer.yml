name: BSFP R5 widened flat transfer

on:
  push:
    branches:
      - research/zdd-transfer-20260910
    paths:
      - '.github/workflows/bsfp-r5-widened-flat-transfer.yml'
      - 'reference/research-prototypes/2026-09-10-r5-scope/widened-flat-transfer.mjs'

permissions:
  contents: read

jobs:
  r5-widened-flat-transfer:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '26.7.0'
      - name: Widen R3/R4 support scope and profile compiler phases
        run: node --expose-gc reference/research-prototypes/2026-09-10-r5-scope/widened-flat-transfer.mjs
