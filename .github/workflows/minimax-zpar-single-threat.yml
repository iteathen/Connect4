name: Minimax ZPAR single-threat differential

on:
  push:
    branches:
      - work/minimax-zpar-single-threat-20260911
    paths:
      - 'research/minimax/composition-campaign/zpar_single_threat_exact.mjs'
      - '.github/workflows/minimax-zpar-single-threat.yml'
  workflow_dispatch:

jobs:
  zpar-single-threat:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26.7.0
      - name: Run ZPAR single-threat exact differential
        run: node --max-old-space-size=6144 research/minimax/composition-campaign/zpar_single_threat_exact.mjs | tee /tmp/zpar-single-threat.json
      - name: Preserve ZPAR evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: minimax-zpar-single-threat
          path: /tmp/zpar-single-threat.json
          if-no-files-found: error
