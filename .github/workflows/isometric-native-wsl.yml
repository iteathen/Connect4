name: Isometric native WSL

on:
  push:
    branches: [isometric]
    paths:
      - 'components/isometric/**'
      - 'components/domain/**'
      - 'package.json'
      - '.github/workflows/isometric-native-wsl.yml'
  pull_request:
    paths:
      - 'components/isometric/**'
      - 'components/domain/**'
      - 'package.json'
      - '.github/workflows/isometric-native-wsl.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.7.0
      - name: Assert exact Node runtime
        run: node -e "if (process.version !== 'v26.7.0') throw new Error('expected Node v26.7.0, got ' + process.version)"
      - name: Domain and native WSL qualification
        run: node --test components/domain/test/domain.test.mjs components/isometric/test/state.test.mjs
