name: IsoMax Lazy SMP Optimization A-B

on:
  push:
    branches:
      - work/isomax-jsminsys-boundary-cleanup
    paths:
      - '.github/workflows/isomax-lazy-smp-ab.yml'
      - 'tools/bench-lazy-smp-control.mjs'
  workflow_dispatch:

jobs:
  ab:
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          submodules: recursive
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '26.7.0'
          cache: npm
      - run: npm ci
      - name: Same-runner four-worker Lazy SMP B-C-C-B
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          function Use-JSMinSys([string]$sha) {
            git -C vendor/jsminsys cat-file -e "$sha^{commit}" 2>$null
            if ($LASTEXITCODE -ne 0) {
              git -C vendor/jsminsys fetch --no-tags origin $sha
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            }
            git -C vendor/jsminsys checkout --detach $sha
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $actual=(git -C vendor/jsminsys rev-parse HEAD).Trim()
            if ($actual -ne $sha) { throw "JSMinSys HEAD mismatch: $actual != $sha" }
            Write-Host "JSMS_HEAD $actual"
          }
          $baseline='19a96823cad46c7e5e9e70e0d68079d5574f92a3'
          $candidate='bd0c492a1464839c6f18d3570f72e48141e79100'

          Write-Host "AB_PHASE baseline-1 $baseline"
          Use-JSMinSys $baseline
          node --experimental-ffi tools/bench-lazy-smp-control.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          Write-Host "AB_PHASE candidate-1 $candidate"
          Use-JSMinSys $candidate
          node --experimental-ffi tools/bench-lazy-smp-control.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          Write-Host "AB_PHASE candidate-2 $candidate"
          Use-JSMinSys $candidate
          node --experimental-ffi tools/bench-lazy-smp-control.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          Write-Host "AB_PHASE baseline-2 $baseline"
          Use-JSMinSys $baseline
          node --experimental-ffi tools/bench-lazy-smp-control.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
