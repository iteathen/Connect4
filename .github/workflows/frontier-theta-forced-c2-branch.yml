name: Frontier theta forced C2 branch

on:
  push:
    branches:
      - research/frontier-negamax-conformance
    paths:
      - 'research/semantic-quotient/state-identity-unification/src/quotient-standard7x6-theta-root-branch-probe.mjs'
      - 'research/semantic-quotient/state-identity-unification/src/quotient-standard7x6-theta-sequence-probe.mjs'
      - 'research/semantic-quotient/state-identity-unification/src/quotient-standard7x6-generic-target-aux-lex-proof-lib.mjs'
      - '.github/workflows/frontier-theta-forced-c2-branch.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26.7.0
      - name: Qualify forced C2 theta branch
        env:
          SEQUENCE: '4665655366447475'
          TARGET: G5
          MAX_TARGET_DISTANCE: '4'
          ACTION: C
        run: |
          set -euo pipefail
          f="$RUNNER_TEMP/theta-c2.txt"
          timeout 300s node research/semantic-quotient/state-identity-unification/src/quotient-standard7x6-theta-root-branch-probe.mjs | tee "$f"
          RESULT_FILE="$f" node <<'NODE'
          const fs=require('node:fs');
          const line=fs.readFileSync(process.env.RESULT_FILE,'utf8').split(/\r?\n/).find(x=>x.startsWith('THETA_ROOT_BRANCH_PROBE='));
          if(!line) throw new Error('theta branch output missing');
          const x=JSON.parse(line.slice(line.indexOf('=')+1));
          if(x.sequence!=='4665655366447475'||x.target!=='G5'||x.rootAction!=='C') throw new Error('theta C2 identity drift');
          if(x.proved!==true) throw new Error(`theta forced C2 unproved: ${x.proofKind}`);
          NODE
