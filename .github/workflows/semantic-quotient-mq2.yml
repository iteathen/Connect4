name: Semantic quotient MQ2 behavioral partition

on:
  push:
    branches:
      - research/semantic-quotient
    paths:
      - 'research/semantic-quotient/mq2-behavioral-partition.mjs'
      - '.github/workflows/semantic-quotient-mq2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mq2:
    name: MQ2 behavioral partition
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.7.0
      - name: Compute exact action-labelled behavioral partition
        run: node --expose-gc --max-old-space-size=4096 research/semantic-quotient/mq2-behavioral-partition.mjs
