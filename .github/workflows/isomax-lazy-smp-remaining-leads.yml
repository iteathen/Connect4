name: IsoMax Lazy SMP Remaining Leads

on:
  push:
    branches:
      - work/isomax-jsminsys-boundary-cleanup
    paths:
      - '.github/workflows/isomax-lazy-smp-remaining-leads.yml'
      - 'tools/bench-lazy-smp-persistence.mjs'
      - 'tools/test-lazy-smp-postdone-fault.mjs'
  workflow_dispatch:

jobs:
  candidate-ab:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: spread-offset
            candidate: 2dcd6ab2a4b4c456cdd0985bf039713c4b1c905f
          - name: shifted-shared-slot
            candidate: cb93c196b458b1a249f8dc5dfda1b1bd26ef3bc9
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          submodules: recursive
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '26.7.0'
          cache: npm
      - run: npm ci
      - name: B-C-C-B
        shell: pwsh
        run: |
          $baseline='04d37498607ace16dae33c79462ddfe1503c8a0d'
          $candidate='${{ matrix.candidate }}'
          function Use-JSMinSys([string]$sha) {
            git -C vendor/jsminsys cat-file -e "$sha^{commit}" 2>$null
            if ($LASTEXITCODE -ne 0) {
              git -C vendor/jsminsys fetch --no-tags origin $sha
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            }
            git -C vendor/jsminsys checkout --detach $sha
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          Write-Host "REMAINING_AB ${{ matrix.name }} baseline-1"
          Use-JSMinSys $baseline
          node --experimental-ffi tools/bench-lazy-smp-control.mjs 7
          Write-Host "REMAINING_AB ${{ matrix.name }} candidate-1"
          Use-JSMinSys $candidate
          node --experimental-ffi tools/bench-lazy-smp-control.mjs 7
          Write-Host "REMAINING_AB ${{ matrix.name }} candidate-2"
          node --experimental-ffi tools/bench-lazy-smp-control.mjs 7
          Write-Host "REMAINING_AB ${{ matrix.name }} baseline-2"
          Use-JSMinSys $baseline
          node --experimental-ffi tools/bench-lazy-smp-control.mjs 7

  persistence:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          submodules: recursive
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '26.7.0'
          cache: npm
      - run: npm ci
      - name: Repeated-solve B-C-C-B
        shell: pwsh
        run: |
          $baseline='04d37498607ace16dae33c79462ddfe1503c8a0d'
          $candidate='2a63ee02026d1f3394e00d5f6f4dd1412ca35594'
          function Use-JSMinSys([string]$sha) {
            git -C vendor/jsminsys cat-file -e "$sha^{commit}" 2>$null
            if ($LASTEXITCODE -ne 0) {
              git -C vendor/jsminsys fetch --no-tags origin $sha
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            }
            git -C vendor/jsminsys checkout --detach $sha
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          Write-Host "PERSISTENCE baseline-1"
          Use-JSMinSys $baseline
          node --experimental-ffi tools/bench-lazy-smp-persistence.mjs
          Write-Host "PERSISTENCE candidate-1"
          Use-JSMinSys $candidate
          node --experimental-ffi tools/bench-lazy-smp-persistence.mjs
          Write-Host "PERSISTENCE candidate-2"
          node --experimental-ffi tools/bench-lazy-smp-persistence.mjs
          Write-Host "PERSISTENCE baseline-2"
          Use-JSMinSys $baseline
          node --experimental-ffi tools/bench-lazy-smp-persistence.mjs

  postdone-fault:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          submodules: recursive
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '26.7.0'
      - name: Use baseline JSMinSys
        run: git -C vendor/jsminsys checkout --detach 04d37498607ace16dae33c79462ddfe1503c8a0d
      - run: node tools/test-lazy-smp-postdone-fault.mjs
