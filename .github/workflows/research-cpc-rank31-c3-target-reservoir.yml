name: Research CPC rank31 c3 target-reservoir qualification

on:
  push:
    branches:
      - research/universal-structural-policy-20260930
    paths:
      - .github/workflows/research-cpc-rank31-c3-target-reservoir.yml
      - research/isograph/discovery/2026-09-30-universal-structural-policy/CPC_RANK31_C3_TARGET_RESERVOIR_QUALIFICATION_0_1.md
      - research/isograph/discovery/2026-09-30-universal-structural-policy/test-cpc-rank31-c3-target-reservoir-qualification.mjs
      - research/isograph/discovery/2026-09-30-universal-structural-policy/run-cpc-rank31-c3-target-reservoir-qualification.mjs

permissions:
  contents: write

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact pushed revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Pin Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26.7.0
      - name: Fetch pinned JSMinSys authority
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/iteathen/JSMinSys.git jsminsys
          git -C jsminsys checkout bf23d3a67652cd42e1975f29c7dc4eed54f7eb42
          test -z "$(git -C jsminsys status --porcelain)"
      - name: Verify frozen qualification contract
        run: node research/isograph/discovery/2026-09-30-universal-structural-policy/test-cpc-rank31-c3-target-reservoir-qualification.mjs ./jsminsys
      - name: Generate durable qualification evidence
        shell: bash
        run: |
          set -euo pipefail
          DIR=research/isograph/discovery/2026-09-30-universal-structural-policy
          OUT="$DIR/CPC_RANK31_C3_TARGET_RESERVOIR_QUALIFICATION_0_1.json"
          node "$DIR/run-cpc-rank31-c3-target-reservoir-qualification.mjs" ./jsminsys > "$OUT"
          node - "$OUT" <<'NODE'
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          if(r.oracleUsed!==false||r.solvedInputsUsed!==false||r.ordinaryGameTreeSearchUsed!==false)throw new Error('structural boundary violated');
          console.log(JSON.stringify({
            accept:r.accept,
            guards:r.guards,
            template:r.template&&{
              capacity:r.template.capacity,
              oddColumns:r.template.oddColumns,
              synchronizedPairs:r.template.synchronizedPairs,
              defenderResidualCount:r.template.defenderResidualCount
            },
            validation:r.validation,
            rejectionReason:r.rejectionReason
          }));
          NODE
      - name: Commit durable qualification evidence
        shell: bash
        run: |
          set -euo pipefail
          BRANCH=research/universal-structural-policy-20260930
          FILE=research/isograph/discovery/2026-09-30-universal-structural-policy/CPC_RANK31_C3_TARGET_RESERVOIR_QUALIFICATION_0_1.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$FILE"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research: record rank31 c3 target-reservoir qualification"
          for attempt in 1 2 3; do
            git fetch origin "$BRANCH"
            git rebase --autostash "origin/$BRANCH"
            if git push origin HEAD:"$BRANCH"; then exit 0; fi
            sleep 1
          done
          exit 1
