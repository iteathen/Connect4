name: IsoMax direct structural growth

on:
  push:
    branches:
      - research/nim-control-parity-algebra-20260929
    paths:
      - '.github/workflows/isomax-direct-structural-growth.yml'
      - 'research/isograph/discovery/2026-09-29-center-proof-cycle/run-direct-residual-growth.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  direct-growth:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '26'
      - name: Direct residual growth
        env:
          C4_WIDTH: '4'
          C4_HEIGHT: '6'
          C4_K: '4'
        run: node --max-old-space-size=4096 research/isograph/discovery/2026-09-29-center-proof-cycle/run-direct-residual-growth.mjs
      - name: Research integrity
        run: node tools/verify-research-integrity.mjs
