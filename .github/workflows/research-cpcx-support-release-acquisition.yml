name: Research CPCX support-release acquisition

on:
  push:
    branches:
      - experiment/cpcx-20261002
    paths:
      - 'research/isograph/discovery/2026-10-02-cpcx/cpcx-support-release-acquisition.mjs'
      - 'research/isograph/discovery/2026-10-02-cpcx/cpcx-support-release-acquisition.test.mjs'
      - '.github/workflows/research-cpcx-support-release-acquisition.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - name: Qualify support-release acquisition theorem
        run: |
          node --test research/isograph/discovery/2026-10-02-cpcx/cpcx-support-release-acquisition.test.mjs
