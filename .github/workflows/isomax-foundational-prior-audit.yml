name: IsoMax foundational prior audit

on:
  push:
    branches:
      - research/isomax-foundational-prior-audit-20260929
    paths:
      - '.github/workflows/isomax-foundational-prior-audit.yml'
      - 'research/isograph/discovery/2026-09-29-isomax-foundational-prior-audit/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  witness-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 0}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with: {node-version: '26'}
      - name: Run independent witness prior audit
        run: node research/isograph/discovery/2026-09-29-isomax-foundational-prior-audit/run-witness-prior-audit.mjs
      - name: Validate generated audit JSON
        run: node -e "JSON.parse(require('fs').readFileSync('research/isograph/discovery/2026-09-29-isomax-foundational-prior-audit/WITNESS_PRIOR_AUDIT_0_1.json','utf8'))"
      - name: Research integrity
        run: node tools/verify-research-integrity.mjs
      - name: Commit witness audit evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/isograph/discovery/2026-09-29-isomax-foundational-prior-audit/WITNESS_PRIOR_AUDIT_0_1.json
          if git diff --cached --quiet; then
            echo "No generated audit changes."
          else
            git commit -m "research(isomax): freeze independent witness prior audit"
            git push origin HEAD:research/isomax-foundational-prior-audit-20260929
          fi
