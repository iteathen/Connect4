name: Research forced-singleton grammar closure

on:
  push:
    branches:
      - research/universal-structural-policy-20260930
    paths:
      - .github/workflows/research-forced-singleton-grammar-closure.yml
      - research/isograph/discovery/2026-09-30-universal-structural-policy/FORCED_SINGLETON_UPPER_GRAMMAR_CLOSURE_BOUNDARY.md
      - research/isograph/discovery/2026-09-30-universal-structural-policy/run-forced-singleton-upper-grammar-closure.mjs

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact pushed revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Pin Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26.7.0

      - name: Assert exact Node runtime
        run: node -e "if (process.version !== 'v26.7.0') throw new Error('expected Node v26.7.0, got ' + process.version)"

      - name: Close current upper-bound grammar
        shell: bash
        run: |
          set -euo pipefail
          OUT=research/isograph/discovery/2026-09-30-universal-structural-policy/FORCED_SINGLETON_UPPER_GRAMMAR_CLOSURE_CONTROL_0_1.json
          node research/isograph/discovery/2026-09-30-universal-structural-policy/run-forced-singleton-upper-grammar-closure.mjs > "$OUT"
          node - "$OUT" <<'NODE'
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          console.log('ORACLE_USED='+r.oracleUsed);
          console.log('BOUNDARY='+JSON.stringify(r.children.map(x=>({
            candidate:x.candidate,
            lower:x.lowerFromBoundedResponseHorizon,
            upper:x.upperFromCompleteCurrentGrammar,
            reachableStates:x.closure.reachableStates,
            liftEdges:x.closure.liftEdges,
            maxLiftDepth:x.closure.maxLiftDepth,
            baseStates:x.closure.baseStates,
            unprovedLeaves:x.closure.unprovedLeaves,
            rootEdges:x.closure.rootEdges.map(e=>[e.setupColumn,e.forcedBlockColumn])
          }))));
          NODE

      - name: Commit durable closure evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/isograph/discovery/2026-09-30-universal-structural-policy/FORCED_SINGLETON_UPPER_GRAMMAR_CLOSURE_CONTROL_0_1.json
          if git diff --cached --quiet; then
            echo "closure evidence unchanged"
            exit 0
          fi
          git commit -m "research: verify forced-singleton grammar closure"
          git push origin HEAD:research/universal-structural-policy-20260930
