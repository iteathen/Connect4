name: Frontier rank9 reply family control

on:
  push:
    branches: [research/frontier-negamax-conformance]
    paths:
      - '.github/workflows/frontier-rank9-reply-family-control.yml'
      - 'research/semantic-quotient/state-identity-unification/src/quotient-standard7x6-rank9-reply-family-control.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  family:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26.7.0
      - name: Qualify easy replies and isolate C block child
        shell: bash
        run: |
          set -euo pipefail
          timeout 300s node research/semantic-quotient/state-identity-unification/src/quotient-standard7x6-rank9-reply-family-control.mjs
