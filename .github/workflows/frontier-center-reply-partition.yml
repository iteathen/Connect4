name: Frontier center reply partition

on:
  push:
    branches:
      - research/center-reply-partition
    paths:
      - research/semantic-quotient/state-identity-unification/src/quotient-standard7x6-center-high-refusal-root-action.mjs
      - .github/workflows/frontier-center-reply-partition.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  structural-root-action:
    name: action-${{ matrix.refusal }}-${{ matrix.action }}
    strategy:
      fail-fast: false
      matrix:
        refusal: [E, F]
        action: [A, B, D, E, F, G]
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26.7.0
      - name: Qualify declared structural action
        run: timeout 450s node research/semantic-quotient/state-identity-unification/src/quotient-standard7x6-center-high-refusal-root-action.mjs "${{ matrix.refusal }}" "${{ matrix.action }}"
