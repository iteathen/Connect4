name: Frontier center reply partition

on:
  push:
    branches:
      - research/center-reply-partition
    paths:
      - research/semantic-quotient/state-identity-unification/src/quotient-standard7x6-center-reply-partition.mjs
      - research/semantic-quotient/state-identity-unification/src/quotient-standard7x6-center-high-refusal-diagnostic.mjs
      - research/semantic-quotient/state-identity-unification/src/quotient-standard7x6-center-high-refusal-rho-leaf.mjs
      - .github/workflows/frontier-center-reply-partition.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  high-rho-leaf:
    name: rho-${{ matrix.refusal }}-${{ matrix.response }}
    strategy:
      fail-fast: false
      matrix:
        refusal: [D, E, F]
        response: [A, B, D, E, F]
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26.7.0
      - name: Qualify rho leaf
        run: timeout 450s node research/semantic-quotient/state-identity-unification/src/quotient-standard7x6-center-high-refusal-rho-leaf.mjs "${{ matrix.refusal }}" "${{ matrix.response }}"
