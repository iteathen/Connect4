name: Frontier center reply partition

on:
  push:
    branches:
      - research/center-reply-partition
    paths:
      - research/semantic-quotient/state-identity-unification/src/quotient-standard7x6-center-reply-partition.mjs
      - .github/workflows/frontier-center-reply-partition.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  classify-reply:
    name: reply-${{ matrix.reply }}
    strategy:
      fail-fast: false
      matrix:
        reply: [A, B, C, D, E, F, G]
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26.7.0
      - name: Qualify reply ${{ matrix.reply }}
        shell: bash
        run: |
          set -euo pipefail
          timeout 450s node research/semantic-quotient/state-identity-unification/src/quotient-standard7x6-center-reply-partition.mjs "${{ matrix.reply }}"
