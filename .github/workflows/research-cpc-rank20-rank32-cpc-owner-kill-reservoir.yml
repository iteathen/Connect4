name: Research CPC rank20 rank32 CPC owner-kill reservoir completion

concurrency:
  group: rank20-rank32-cpc-owner-kill-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [research/universal-structural-policy-20260930]
    paths:
      - .github/workflows/research-cpc-rank20-rank32-cpc-owner-kill-reservoir.yml
      - research/isograph/discovery/2026-09-30-universal-structural-policy/CPC_RANK20_RANK32_CPC_OWNER_KILL_RESERVOIR_COMPLETION_PROBE_DESIGN_0_1.md
      - research/isograph/discovery/2026-09-30-universal-structural-policy/test-cpc-rank20-rank32-cpc-owner-kill-reservoir-completion-probe.mjs
      - research/isograph/discovery/2026-09-30-universal-structural-policy/run-cpc-rank20-rank32-cpc-owner-kill-reservoir-completion-probe.mjs
      - research/isograph/discovery/2026-09-30-universal-structural-policy/CPC_RANK20_RANK32_TARGET_RESERVOIR_REJECTION_LOCALIZATION_0_1.json
      - research/isograph/discovery/2026-09-30-universal-structural-policy/CPC_RANK20_RANK32_RECURRING_Q_GENERIC_RCIC_AUDIT_0_1.json

permissions:
  contents: write

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {fetch-depth: 0}
      - name: Check out pinned JSMinSys authority
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: iteathen/JSMinSys
          ref: bf23d3a67652cd42e1975f29c7dc4eed54f7eb42
          path: .jsminsys
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: {node-version: 26.7.0}
      - name: Verify frozen owner-kill contract
        run: node research/isograph/discovery/2026-09-30-universal-structural-policy/test-cpc-rank20-rank32-cpc-owner-kill-reservoir-completion-probe.mjs "$GITHUB_WORKSPACE/.jsminsys"
      - name: Generate durable owner-kill evidence
        shell: bash
        run: |
          set -euo pipefail
          DIR=research/isograph/discovery/2026-09-30-universal-structural-policy
          OUT="$DIR/CPC_RANK20_RANK32_CPC_OWNER_KILL_RESERVOIR_COMPLETION_PROBE_0_1.json"
          node "$DIR/run-cpc-rank20-rank32-cpc-owner-kill-reservoir-completion-probe.mjs" "$GITHUB_WORKSPACE/.jsminsys" > "$OUT"
          node - "$OUT" <<'NODE'
          const fs=require('fs');const r=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          console.log(JSON.stringify({
            summary:r.summary,
            newlyClosedQClasses:r.newlyClosedQClasses,
            firstValidationFailures:r.attempts.flatMap(a=>a.candidates.filter(c=>c.ownerKillEligible&&c.validation&&!c.validation.pass).map(c=>({q:a.exactQClass,setup:a.setupColumn,signature:c.signature,failures:c.validation.failures}))).slice(0,10)
          }));
          NODE
      - name: Commit durable owner-kill evidence
        shell: bash
        run: |
          set -euo pipefail
          BRANCH=research/universal-structural-policy-20260930
          FILE=research/isograph/discovery/2026-09-30-universal-structural-policy/CPC_RANK20_RANK32_CPC_OWNER_KILL_RESERVOIR_COMPLETION_PROBE_0_1.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$FILE"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research: record rank32 CPC owner-kill reservoir completion"
          git pull --rebase origin "$BRANCH"
          git push origin HEAD:"$BRANCH"
