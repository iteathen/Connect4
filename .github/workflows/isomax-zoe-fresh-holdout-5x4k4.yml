name: IsoMax fresh ZOE holdout 5x4-k4

on:
  push:
    branches:
      - experiment/isomax-late-xor-components-20260929
    paths:
      - '.github/workflows/isomax-zoe-fresh-holdout-5x4k4.yml'
      - 'research/isograph/discovery/2026-09-29-isomax-late-xor-components/run-zoe-fresh-nonaffine-holdout-5x4k4.mjs'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 0}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with: {node-version: '26'}
      - name: Qualify frozen ZOE on fresh 5x4-k4
        run: node research/isograph/discovery/2026-09-29-isomax-late-xor-components/run-zoe-fresh-nonaffine-holdout-5x4k4.mjs
      - name: Research integrity
        run: node tools/verify-research-integrity.mjs
      - name: Commit fresh ZOE evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/isograph/discovery/2026-09-29-isomax-late-xor-components/ZOE_FRESH_NONAFFINE_HOLDOUT_5X4K4_0_1.json
          if git diff --cached --quiet; then
            echo "No generated changes."
          else
            git commit -m "research(isomax): freeze 5x4 fresh ZOE holdout evidence"
            git push origin HEAD:experiment/isomax-late-xor-components-20260929
          fi
