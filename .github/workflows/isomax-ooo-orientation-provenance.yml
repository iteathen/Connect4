name: IsoMax OOO orientation provenance

on:
  push:
    branches:
      - experiment/isomax-late-xor-components-20260929
    paths:
      - '.github/workflows/isomax-ooo-orientation-provenance.yml'
      - 'research/isograph/discovery/2026-09-29-isomax-late-xor-components/EXPERIMENTAL_WARRANT_RS_071.json'
      - 'research/isograph/discovery/2026-09-29-isomax-late-xor-components/OOO_ORIENTATION_PROVENANCE_SPEC_0_1.md'
      - 'research/isograph/discovery/2026-09-29-isomax-late-xor-components/OOO_ORIENTATION_PROVENANCE_VOCAB_0_1.json'
      - 'research/isograph/discovery/2026-09-29-isomax-late-xor-components/OOO_ORIENTATION_PROVENANCE_0_1.isg'
      - 'research/isograph/discovery/2026-09-29-isomax-late-xor-components/ooo-orientation-provenance-lib.mjs'
      - 'research/isograph/discovery/2026-09-29-isomax-late-xor-components/ooo-orientation-provenance-lib.test.mjs'
      - 'research/isograph/discovery/2026-09-29-isomax-late-xor-components/verify-ooo-orientation-provenance.mjs'
      - 'research/isograph/discovery/2026-09-29-isomax-late-xor-components/run-ooo-orientation-provenance.mjs'
      - 'research/isograph/discovery/2026-09-29-isomax-late-xor-components/verify-ooo-orientation-result.mjs'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 0}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with: {node-version: '26'}
      - name: Unit-test orientation provenance semantics
        run: node --test research/isograph/discovery/2026-09-29-isomax-late-xor-components/ooo-orientation-provenance-lib.test.mjs
      - name: Verify orientation provenance specification
        run: node research/isograph/discovery/2026-09-29-isomax-late-xor-components/verify-ooo-orientation-provenance.mjs
      - name: Run OOO orientation provenance audit
        run: node --max-old-space-size=6144 research/isograph/discovery/2026-09-29-isomax-late-xor-components/run-ooo-orientation-provenance.mjs
      - name: Verify OOO orientation result
        run: node research/isograph/discovery/2026-09-29-isomax-late-xor-components/verify-ooo-orientation-result.mjs
      - name: Research integrity
        run: node tools/verify-research-integrity.mjs
      - name: Commit orientation evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            research/isograph/discovery/2026-09-29-isomax-late-xor-components/OOO_ORIENTATION_PROVENANCE_SPEC_VERIFY_0_1.json \
            research/isograph/discovery/2026-09-29-isomax-late-xor-components/OOO_ORIENTATION_PROVENANCE_0_1.json \
            research/isograph/discovery/2026-09-29-isomax-late-xor-components/OOO_ORIENTATION_PROVENANCE_RESULT_VERIFY_0_1.json
          if git diff --cached --quiet; then
            echo "No generated changes."
          else
            git commit -m "research(isomax): freeze OOO orientation provenance"
            git pull --rebase origin experiment/isomax-late-xor-components-20260929
            git push origin HEAD:experiment/isomax-late-xor-components-20260929
          fi
