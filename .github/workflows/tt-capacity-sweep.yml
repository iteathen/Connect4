name: tt-capacity-sweep

on:
  pull_request:
    branches:
      - research/frontier-negamax-conformance
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tt-capacity-sweep:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.7.0
          check-latest: false
      - name: Assert exact Node runtime
        run: node -e "if (process.version !== 'v26.7.0') throw new Error('expected Node v26.7.0, got ' + process.version)"
      - name: Capture deterministic capacity sweep
        shell: bash
        env:
          C4_BENCH_REPETITIONS: "3"
          C4_BENCH_WALL_REPETITIONS: "3"
        run: |
          set -euo pipefail
          for cap in 8192 32768 131072 262144 524288 1048576; do
            C4_BENCH_TT_CAPACITY="$cap" \
              C4_SOURCE_REVISION="${{ github.event.pull_request.head.sha || github.sha }}-tt-cap-$cap" \
              node --expose-gc benchmarks/incumbent.mjs > "tt-$cap.json"
          done
      - name: Upload capacity evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tt-capacity-sweep-${{ github.event.pull_request.head.sha || github.sha }}
          path: tt-*.json
          if-no-files-found: error
          retention-days: 3
