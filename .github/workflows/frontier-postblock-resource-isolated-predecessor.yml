name: Frontier post-block resource-isolated predecessor

on:
  push:
    branches:
      - research/frontier-negamax-conformance
    paths:
      - research/semantic-quotient/state-identity-unification/src/quotient-standard7x6-postblock-resource-isolated-predecessor.mjs
      - research/semantic-quotient/state-identity-unification/src/quotient-standard7x6-resolved-tail-lexicographic-proof-lib.mjs
      - .github/workflows/frontier-postblock-resource-isolated-predecessor.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      roots: ${{ steps.run.outputs.roots }}
      closed: ${{ steps.run.outputs.closed }}
      failed: ${{ steps.run.outputs.failed }}
      resource: ${{ steps.run.outputs.resource }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26.7.0
      - name: Qualify resource-hidden post-block roots in isolated proof arenas
        id: run
        shell: bash
        run: |
          set -euo pipefail
          f="$RUNNER_TEMP/postblock-resource-isolated.txt"
          timeout 270s node --expose-gc research/semantic-quotient/state-identity-unification/src/quotient-standard7x6-postblock-resource-isolated-predecessor.mjs | tee "$f"
          RESULT_FILE="$f" node <<'NODE'
          const fs=require('node:fs');
          const line=fs.readFileSync(process.env.RESULT_FILE,'utf8').split(/\r?\n/).find(x=>x.startsWith('POSTBLOCK_RESOURCE_ISOLATED_PREDECESSOR='));
          if(!line) throw new Error('resource-isolated predecessor summary missing');
          const x=JSON.parse(line.slice(line.indexOf('=')+1));
          if(x.exactResourceShardRoots!==17) throw new Error(`resource root drift ${x.exactResourceShardRoots}`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT,[
            `roots=${x.exactResourceShardRoots}`,
            `closed=${x.closedRoots}`,
            `failed=${x.failedRoots}`,
            `resource=${x.resourceReplyCount}`,
          ].join('\n')+'\n');
          NODE

  summary:
    needs: isolate
    name: postiso-r${{ needs.isolate.outputs.roots }}-c${{ needs.isolate.outputs.closed }}-f${{ needs.isolate.outputs.failed }}-x${{ needs.isolate.outputs.resource }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - run: echo "isolated post-block resource-shard root counts encoded in job name"
