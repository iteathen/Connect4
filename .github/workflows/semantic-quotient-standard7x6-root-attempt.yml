name: Quotient standard 7x6 frontier root attempt

on:
  push:
    branches:
      - research/frontier-negamax-conformance
    paths:
      - 'research/semantic-quotient/state-identity-unification/src/quotient-standard7x6-root-attempt.mjs'
      - 'research/semantic-quotient/state-identity-unification/src/quotient-online-dependency-coordinator.mjs'
      - 'research/semantic-quotient/state-identity-unification/src/quotient-online-semantic-*.mjs'
      - 'research/semantic-quotient/state-identity-unification/src/quotient-branch-manager-worker.mjs'
      - 'research/semantic-quotient/state-identity-unification/src/quotient-proof-resource-service.mjs'
      - 'research/semantic-quotient/state-identity-unification/src/quotient-semantic-shared-tt.mjs'
      - 'research/semantic-quotient/state-identity-unification/src/quotient-packed-proof-store.mjs'
      - 'research/semantic-quotient/state-identity-unification/src/quotient-negamax-*.mjs'
      - 'research/semantic-quotient/state-identity-unification/src/quotient-live-line-move-order.mjs'
      - '.github/workflows/semantic-quotient-standard7x6-root-attempt.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  SEARCH_WORKERS: '3'
  SPLIT_DEPTH: '8'
  PRIORITY_PROBE_DEPTH: '0'
  PREFIX_CLASSES: '4096'
  TT_ENTRY_CAPACITY: '8388608'
  TT_TERM_CAPACITY: '460000000'
  PROGRESS_MS: '15000'

jobs:
  solve:
    name: Attempt exact standard 7x6 frontier root WDL
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26.7.0
      - name: Run frontier root with bounded generation-safe proof replacement
        run: >-
          node --expose-gc --max-old-space-size=6144
          research/semantic-quotient/state-identity-unification/src/quotient-standard7x6-root-attempt.mjs
