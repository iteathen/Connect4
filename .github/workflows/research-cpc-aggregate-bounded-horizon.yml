name: Research CPC aggregate bounded horizon

on:
  push:
    branches:
      - research/universal-structural-policy-20260930
    paths:
      - .github/workflows/research-cpc-aggregate-bounded-horizon.yml
      - research/isograph/discovery/2026-09-30-universal-structural-policy/CPC_AGGREGATE_BOUNDED_RESPONSE_HORIZON_INTEGRATION.md
      - research/isograph/discovery/2026-09-30-universal-structural-policy/run-cpc-aggregate-bounded-response-horizon.mjs

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact pushed revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Pin Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26.7.0

      - name: Assert exact Node runtime
        run: node -e "if (process.version !== 'v26.7.0') throw new Error('expected Node v26.7.0, got ' + process.version)"

      - name: Fetch pinned JSMinSys CPC/RBA authority
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/iteathen/JSMinSys.git jsminsys
          git -C jsminsys checkout 0899c5811918e68c22dc1b0e4dd8af97d9b4bbcb
          test "$(git -C jsminsys rev-parse HEAD)" = "0899c5811918e68c22dc1b0e4dd8af97d9b4bbcb"

      - name: Verify aggregate CPC bounded horizon
        shell: bash
        run: |
          set -euo pipefail
          OUT=research/isograph/discovery/2026-09-30-universal-structural-policy/CPC_AGGREGATE_BOUNDED_RESPONSE_HORIZON_CONTROL_0_1.json
          node research/isograph/discovery/2026-09-30-universal-structural-policy/run-cpc-aggregate-bounded-response-horizon.mjs ./jsminsys > "$OUT"
          node - "$OUT" <<'NODE'
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          console.log('ORACLE_USED='+r.oracleUsed);
          console.log('HORIZONS='+JSON.stringify(r.rows.map(x=>[x.candidate,x.result.horizon])));
          for(const row of r.rows) console.log('CANDIDATE_'+row.candidate+'='+JSON.stringify({
            activeResidualCount:row.result.activeResidualCount,
            horizon:row.result.horizon,
            templatePairs:row.result.templatePairs,
            firstUncovered:row.result.firstUncovered
          }));
          NODE

      - name: Commit durable evidence with branch-race recovery
        shell: bash
        run: |
          set -euo pipefail
          BRANCH=research/universal-structural-policy-20260930
          FILE=research/isograph/discovery/2026-09-30-universal-structural-policy/CPC_AGGREGATE_BOUNDED_RESPONSE_HORIZON_CONTROL_0_1.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$FILE"
          if git diff --cached --quiet; then
            echo "evidence unchanged"
            exit 0
          fi
          git commit -m "research: verify CPC aggregate bounded horizon"
          git fetch origin "$BRANCH"
          git rebase "origin/$BRANCH"
          git push origin HEAD:"$BRANCH"
