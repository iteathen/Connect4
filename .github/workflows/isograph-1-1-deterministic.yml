name: Qualify IsoGraph authority 1.1 deterministic corpus

on:
  push:
    branches:
      - work/isograph-logic-authority-1-1-rebuild-20260918
    paths:
      - research/isograph/successor/RUN_DETERMINISTIC_QUALIFICATION.request

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26.7.0
      - name: Verify dependency-closed native corpus and evidence lineages
        run: node research/isograph/successor/tools/verify-authority-1-1.mjs
      - name: Emit deterministic evidence
        if: always()
        run: cat out/isograph-1-1/DETERMINISTIC_QUALIFICATION.json
