name: Frontier mu15 positive-negative differential

on:
  push:
    branches:
      - research/frontier-negamax-conformance
    paths:
      - research/semantic-quotient/state-identity-unification/src/quotient-standard7x6-mu15-positive-negative-differential.mjs
      - .github/workflows/frontier-mu15-positive-negative-differential.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  differential:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      positive: ${{ steps.run.outputs.positive }}
      candidates: ${{ steps.run.outputs.candidates }}
      samples: ${{ steps.run.outputs.samples }}
      proved: ${{ steps.run.outputs.proved }}
      unproved: ${{ steps.run.outputs.unproved }}
      matched: ${{ steps.run.outputs.matched }}
      tier: ${{ steps.run.outputs.tier }}
      resource: ${{ steps.run.outputs.resource }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26.7.0
      - name: Qualify mu15 positive-negative differential
        id: run
        shell: bash
        run: |
          set -euo pipefail
          f="$RUNNER_TEMP/mu15-differential.txt"
          timeout 270s node --expose-gc research/semantic-quotient/state-identity-unification/src/quotient-standard7x6-mu15-positive-negative-differential.mjs | tee "$f"
          RESULT_FILE="$f" node <<'NODE'
          const fs=require('node:fs');
          const line=fs.readFileSync(process.env.RESULT_FILE,'utf8').split(/\r?\n/).find(x=>x.startsWith('MU15_POSITIVE_NEGATIVE_DIFFERENTIAL='));
          if(!line) throw new Error('mu15 differential summary missing');
          const x=JSON.parse(line.slice(line.indexOf('=')+1));
          if(x.qualifiedPositiveStarts!==16) throw new Error('qualified positive start drift');
          if(x.sampledUnproved<1) throw new Error('no directly unproved comparator');
          if(x.matchedPairCount<1) throw new Error('no matched positive-negative pair');
          fs.appendFileSync(process.env.GITHUB_OUTPUT,[
            `positive=${x.qualifiedPositiveStarts}`,
            `candidates=${x.exactMu15CleanCandidateStates}`,
            `samples=${x.targetedDirectSamples}`,
            `proved=${x.sampledProved}`,
            `unproved=${x.sampledUnproved}`,
            `matched=${x.matchedPairCount}`,
            `tier=${x.selectedMatchingTier}`,
            `resource=${x.resourceFailures}`,
          ].join('\n')+'\n');
          NODE

  summary:
    needs: differential
    name: mu15-pos${{ needs.differential.outputs.positive }}-c${{ needs.differential.outputs.candidates }}-s${{ needs.differential.outputs.samples }}-p${{ needs.differential.outputs.proved }}-u${{ needs.differential.outputs.unproved }}-m${{ needs.differential.outputs.matched }}-t${{ needs.differential.outputs.tier }}-r${{ needs.differential.outputs.resource }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - run: echo "mu15 matched differential counts encoded in job name"
