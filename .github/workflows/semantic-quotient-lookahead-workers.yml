name: Quotient lookahead workers

on:
  push:
    branches:
      - research/semantic-quotient
    paths:
      - 'research/semantic-quotient/state-identity-unification/src/quotient-lookahead-work-dag.mjs'
      - 'research/semantic-quotient/state-identity-unification/src/quotient-lookahead-worker-campaign.mjs'
      - 'research/semantic-quotient/state-identity-unification/src/quotient-shared-dedup-worker.mjs'
      - 'research/semantic-quotient/state-identity-unification/src/quotient-shared-search-worker.mjs'
      - 'research/semantic-quotient/state-identity-unification/src/quotient-shared-worker-pool.mjs'
      - 'research/semantic-quotient/state-identity-unification/src/quotient-shared-tt-search-lib.mjs'
      - '.github/workflows/semantic-quotient-lookahead-workers.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  REPEATS: '7'
  LOOKAHEAD_DEPTHS: '3,4,2,5'
  WORKER_COUNTS: '1,2,3,4'
  PROBE_DEPTH: '2'
  PREFIX_CLASSES: '4096'

jobs:
  tournament:
    name: Qualify lookahead work-DAG scheduling
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26.7.0
      - name: Run exact lookahead depth and worker tournament
        run: >-
          node --expose-gc --max-old-space-size=6144
          research/semantic-quotient/state-identity-unification/src/quotient-lookahead-worker-campaign.mjs
