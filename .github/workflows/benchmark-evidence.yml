name: benchmark-evidence
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark-evidence:
    name: benchmark-evidence
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.7.0
      - name: Assert exact Node runtime
        run: node -e "if (process.version !== 'v26.7.0') throw new Error('expected Node v26.7.0, got ' + process.version)"
      - name: Capture incumbent benchmark evidence
        env:
          C4_SOURCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node --expose-gc benchmarks/incumbent.mjs | tee benchmark-evidence.json
      - name: Capture BSFP representation performance evidence
        env:
          C4_SOURCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
          BSFP_BENCH_REPS: "5"
          BSFP_BENCH_WARMUPS: "1"
        run: node --expose-gc benchmarks/bsfp-performance.mjs | tee bsfp-performance-evidence.json
