name: IsoMax Hashless Surplus A-B

on:
  push:
    branches:
      - experiment/isomax-hashless-surplus-scan-v1
    paths:
      - '.github/workflows/isomax-hashless-surplus-ab.yml'
      - 'vendor/jsminsys'
  workflow_dispatch:

jobs:
  ab:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          submodules: recursive
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '26.7.0'
          cache: npm
      - run: npm ci
      - name: Candidate integration gate
        shell: pwsh
        run: |
          git -C vendor/jsminsys checkout 97989e4a43f3a30d4ccdcd46bfb4346c05a9da2e
          npm test
          node --test vendor/jsminsys/test/*.test.mjs
      - name: Same-runner baseline-candidate-candidate-baseline
        shell: pwsh
        run: |
          Write-Host 'AB_PHASE baseline-1 01026e1efcb6019248fa15860ba3c0c32e9b5be9'
          git -C vendor/jsminsys checkout 01026e1efcb6019248fa15860ba3c0c32e9b5be9
          node --experimental-ffi tools/bench-isomax-branch-manager.mjs
          Write-Host 'AB_PHASE candidate-1 97989e4a43f3a30d4ccdcd46bfb4346c05a9da2e'
          git -C vendor/jsminsys checkout 97989e4a43f3a30d4ccdcd46bfb4346c05a9da2e
          node --experimental-ffi tools/bench-isomax-branch-manager.mjs
          Write-Host 'AB_PHASE candidate-2 97989e4a43f3a30d4ccdcd46bfb4346c05a9da2e'
          node --experimental-ffi tools/bench-isomax-branch-manager.mjs
          Write-Host 'AB_PHASE baseline-2 01026e1efcb6019248fa15860ba3c0c32e9b5be9'
          git -C vendor/jsminsys checkout 01026e1efcb6019248fa15860ba3c0c32e9b5be9
          node --experimental-ffi tools/bench-isomax-branch-manager.mjs
