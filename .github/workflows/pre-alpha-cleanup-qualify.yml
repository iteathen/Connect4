name: Pre-alpha cleanup qualification

on:
  push:
    branches:
      - research/frontier-negamax-conformance
    paths:
      - '.github/workflows/pre-alpha-cleanup-qualify.yml'
      - 'research/semantic-quotient/state-identity-unification/src/**'
      - 'package.json'

permissions:
  contents: read

jobs:
  qualify:
    name: qualify-cleanup
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26.7.0
      - name: Assert exact Node runtime
        run: node -e "if (process.version !== 'v26.7.0') throw new Error('expected Node v26.7.0, got ' + process.version)"
      - name: Run repository tests
        run: npm test
      - name: Qualify slot64 residual path
        run: node --expose-gc --max-old-space-size=6144 research/semantic-quotient/state-identity-unification/src/quotient-slot64-residual-campaign.mjs
      - name: Qualify semantic proof replacement path
        run: node research/semantic-quotient/state-identity-unification/src/quotient-semantic-tt-replacement-campaign.mjs
      - name: Qualify Branch Manager exploration path
        run: node research/semantic-quotient/state-identity-unification/src/quotient-explore-hint-campaign.mjs
      - name: Qualify dependency-parallel frontier path
        run: node research/semantic-quotient/state-identity-unification/src/quotient-online-dependency-parallel-campaign.mjs
