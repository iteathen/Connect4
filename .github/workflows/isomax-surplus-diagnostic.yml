name: isomax-surplus-diagnostic

on:
  pull_request:
    paths:
      - '.github/workflows/isomax-surplus-diagnostic.yml'
      - 'components/isometric/execution/surplus-*.mjs'
      - 'components/isometric/test/surplus-execution.test.mjs'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  contradictory-path-oracle:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26.7.0
      - name: Serial-solve captured contradictory child
        run: |
          node --input-type=module <<'NODE'
          import { IsoMaxSolver } from './components/isometric/solver.mjs';
          const text='46653732765727722455536261413';
          const moves=Array.from(text,c=>Number(c)-1);
          const solver=new IsoMaxSolver();
          const state=solver.createState(moves);
          const key=Array.from(state.gameplayKey());
          const solved=solver.solve(state);
          console.log('TRACE_ORACLE',JSON.stringify({
            text,ply:moves.length,key,value:solved.value,move:solved.move,metrics:solved.metrics,
          }));
          NODE
