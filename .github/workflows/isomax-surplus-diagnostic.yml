name: isomax-surplus-diagnostic

on:
  pull_request:
    paths:
      - '.github/workflows/isomax-surplus-diagnostic.yml'
      - 'components/isometric/execution/surplus-*.mjs'
      - 'components/isometric/test/surplus-execution.test.mjs'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  occurrence-capacity-trace:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26.7.0
      - name: Trace occurrence-capacity failure lifecycle
        run: |
          timeout 30s node --input-type=module <<'NODE'
          import { IsoMaxSurplusBranchManager } from './components/isometric/execution/surplus-manager.mjs';

          const moves=[
            6,6,0,0, 2,1,4,5, 3,2,3,4, 6,3,0,3,
            5,0,1,6, 2,6,4,0, 1,1,5,5, 2,2,4,4,
          ];
          const manager=new IsoMaxSurplusBranchManager({
            workers:1,maxQ:64,workCapacity:64,occurrenceCapacity:1,
            queueCapacity:64,publicationCapacity:64,
          });
          await manager.start();
          manager.reconciler.on('message',m=>{
            if(m?.type!=='surplus-progress')
              console.log('TRACE_REC',JSON.stringify({type:m?.type,message:m?.message}));
          });
          manager.workers[0].on('message',m=>{
            console.log('TRACE_WORKER',JSON.stringify({type:m?.type,message:m?.message,workerId:m?.workerId}));
          });

          let settled=false;
          const solve=manager.solveMoves(moves,{timeoutMs:5000,progressIntervalMs:100})
            .then(v=>{settled=true;return {kind:'resolved',value:v.value,move:v.move};},
              e=>{settled=true;return {kind:'rejected',message:e?.message??String(e)};});

          const ticker=setInterval(()=>{
            const s=manager.session;
            console.log('TRACE_STATE',JSON.stringify({
              settled,
              session:!!s,
              failure:s?.failure?.message??null,
              done:s?Array.from(s.done):null,
              control:s?Array.from(s.shared.control):null,
            }));
          },250);

          const outcome=await Promise.race([
            solve,
            new Promise(resolve=>setTimeout(()=>resolve({kind:'host-timeout'}),8000)),
          ]);
          clearInterval(ticker);
          console.log('TRACE_OUTCOME',JSON.stringify(outcome));
          await manager.close();
          console.log('TRACE_CLOSED');
          NODE
