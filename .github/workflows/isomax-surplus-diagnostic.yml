name: isomax-surplus-diagnostic

on:
  pull_request:
    paths:
      - '.github/workflows/isomax-surplus-diagnostic.yml'
      - 'components/isometric/execution/surplus-*.mjs'
      - 'components/isometric/test/surplus-execution.test.mjs'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  draw-class-trace:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26.7.0
      - name: Trace draw-root class capacity owner
        run: |
          timeout 60s node --input-type=module <<'NODE'
          import { IsoMaxSurplusBranchManager } from './components/isometric/execution/surplus-manager.mjs';

          const moves=Array.from('466537327657277224',c=>Number(c)-1);
          const manager=new IsoMaxSurplusBranchManager({workers:1});
          await manager.start();
          manager.reconciler.on('message',m=>{
            if(m?.type!=='surplus-progress'){
              console.log('TRACE_REC',JSON.stringify({type:m?.type,message:m?.message,snapshot:m?.snapshot??null}));
            }
          });
          manager.workers[0].on('message',m=>{
            console.log('TRACE_WORKER',JSON.stringify({
              type:m?.type,message:m?.message,workerId:m?.workerId,
              localClasses:m?.localClasses,localEntries:m?.localEntries,
            }));
          });
          let lastProgress=null;
          try{
            const result=await manager.solveMoves(moves,{
              timeoutMs:30000,
              progressIntervalMs:500,
              onProgress:p=>{
                lastProgress=p;
                console.log('TRACE_PROGRESS',JSON.stringify({
                  qCount:p?.qCount,qHighWater:p?.qHighWater,
                  workAllocated:p?.workAllocated,occurrenceAllocated:p?.occurrenceAllocated,
                  metrics:p?.metrics,
                }));
              },
            });
            console.log('TRACE_OUTCOME',JSON.stringify({
              kind:'resolved',value:result.value,move:result.move,
              worker:result.metrics?.worker,metrics:result.metrics,
            }));
          }catch(error){
            console.log('TRACE_OUTCOME',JSON.stringify({
              kind:'rejected',message:error?.message??String(error),
              lastStats:manager.lastStats,lastProgress,
            }));
          }finally{
            await manager.close();
            console.log('TRACE_CLOSED');
          }
          NODE
