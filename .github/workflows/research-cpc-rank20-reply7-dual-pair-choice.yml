name: Research CPC rank20 reply7 dual pair choice elimination probe

on:
  push:
    branches:
      - research/universal-structural-policy-20260930
    paths:
      - .github/workflows/research-cpc-rank20-reply7-dual-pair-choice.yml
      - research/isograph/discovery/2026-09-30-universal-structural-policy/CPC_RANK20_REPLY7_DUAL_PAIR_CHOICE_ELIMINATION_PROBE_DESIGN_0_1.md
      - research/isograph/discovery/2026-09-30-universal-structural-policy/test-cpc-rank20-reply7-dual-pair-choice-elimination-probe.mjs
      - research/isograph/discovery/2026-09-30-universal-structural-policy/run-cpc-rank20-reply7-dual-pair-choice-elimination-probe.mjs

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26.7.0
      - name: Fetch pinned JSMinSys authority
        shell: bash
        run: |
          set -euo pipefail
          git clone -q https://github.com/iteathen/JSMinSys.git jsminsys
          git -C jsminsys checkout -q bf23d3a67652cd42e1975f29c7dc4eed54f7eb42
      - name: Verify frozen choice-elimination contract
        run: node research/isograph/discovery/2026-09-30-universal-structural-policy/test-cpc-rank20-reply7-dual-pair-choice-elimination-probe.mjs ./jsminsys
      - name: Generate durable choice-elimination evidence
        shell: bash
        run: |
          set -euo pipefail
          DIR=research/isograph/discovery/2026-09-30-universal-structural-policy
          node "$DIR/run-cpc-rank20-reply7-dual-pair-choice-elimination-probe.mjs" ./jsminsys > "$DIR/CPC_RANK20_REPLY7_DUAL_PAIR_CHOICE_ELIMINATION_PROBE_0_1.json"
      - name: Commit durable choice-elimination evidence
        shell: bash
        run: |
          set -euo pipefail
          BRANCH=research/universal-structural-policy-20260930
          FILE=research/isograph/discovery/2026-09-30-universal-structural-policy/CPC_RANK20_REPLY7_DUAL_PAIR_CHOICE_ELIMINATION_PROBE_0_1.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$FILE"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research: record rank20 reply7 dual-pair choice probe"
          git pull --rebase origin "$BRANCH"
          git push origin HEAD:"$BRANCH"
