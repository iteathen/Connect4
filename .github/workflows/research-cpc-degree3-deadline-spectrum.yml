name: Research CPC degree-3 deadline spectrum

on:
  push:
    branches:
      - research/universal-structural-policy-20260930
    paths:
      - .github/workflows/research-cpc-degree3-deadline-spectrum.yml
      - research/isograph/discovery/2026-09-30-universal-structural-policy/run-cpc-degree3-deadline-spectrum.mjs

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Pin Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26.7.0

      - name: Fetch pinned JSMinSys CPC/RBA authority
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/iteathen/JSMinSys.git jsminsys
          git -C jsminsys checkout 0899c5811918e68c22dc1b0e4dd8af97d9b4bbcb

      - name: Run aggregate degree-3 CPC diagnostic
        shell: bash
        run: |
          set -euo pipefail
          OUT=research/isograph/discovery/2026-09-30-universal-structural-policy/CPC_DEGREE3_DEADLINE_SPECTRUM_0_1.json
          node research/isograph/discovery/2026-09-30-universal-structural-policy/run-cpc-degree3-deadline-spectrum.mjs ./jsminsys > "$OUT"
          node - "$OUT" <<'NODE'
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          for(const row of r.rows) console.log(row.id,JSON.stringify({
            firstDeadline:row.earliestTripleDeadline,
            earliest:row.earliestTriples.map(x=>({
              shape:x.shape,
              q:x.cpcResidualParity,
              closure:x.supportClosureSize,
              cells:x.cells,
              topology:[...new Set(x.deletionTopologies.map(t=>t.connected?'connected':'split'))]
            }))
          }));
          NODE

      - name: Commit durable diagnostic
        shell: bash
        run: |
          set -euo pipefail
          BRANCH=research/universal-structural-policy-20260930
          FILE=research/isograph/discovery/2026-09-30-universal-structural-policy/CPC_DEGREE3_DEADLINE_SPECTRUM_0_1.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$FILE"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research: record CPC degree-3 deadline spectrum"
          git fetch origin "$BRANCH"
          git rebase "origin/$BRANCH"
          git push origin HEAD:"$BRANCH"
