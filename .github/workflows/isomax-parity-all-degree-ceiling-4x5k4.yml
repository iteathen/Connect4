name: IsoMax parity all-degree ceiling 4x5-k4

on:
  push:
    branches:
      - experiment/isomax-late-xor-components-20260929
    paths:
      - '.github/workflows/isomax-parity-all-degree-ceiling-4x5k4.yml'
      - 'research/isograph/discovery/2026-09-29-isomax-late-xor-components/run-parity-all-degree-ceiling-4x5k4.mjs'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 0}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with: {node-version: '26'}
      - name: Audit parity all-degree ceiling and count residues on 4x5-k4
        run: node research/isograph/discovery/2026-09-29-isomax-late-xor-components/run-parity-all-degree-ceiling-4x5k4.mjs
      - name: Research integrity
        run: node tools/verify-research-integrity.mjs
      - name: Commit parity-ceiling evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/isograph/discovery/2026-09-29-isomax-late-xor-components/PARITY_ALL_DEGREE_CEILING_4X5K4_0_1.json
          if git diff --cached --quiet; then
            echo "No generated changes."
          else
            git commit -m "research(isomax): freeze parity all-degree ceiling evidence"
            git push origin HEAD:experiment/isomax-late-xor-components-20260929
          fi
