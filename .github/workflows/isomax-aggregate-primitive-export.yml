name: IsoMax aggregate primitive witness export

on:
  push:
    branches:
      - research/isomax-core020-ia-closure-20260929
    paths:
      - '.github/workflows/isomax-aggregate-primitive-export.yml'
      - 'research/isograph/discovery/2026-09-29-isomax-core020-ia-closure/export-aggregate-witness.mjs'
      - 'research/isograph/discovery/2026-09-29-center-proof-cycle/control-algebra-dimensions.mjs'
      - 'research/isograph/discovery/2026-09-29-center-proof-cycle/control-algebra.mjs'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '26'
      - name: Generate complete finite witness carrier
        run: node research/isograph/discovery/2026-09-29-isomax-core020-ia-closure/export-aggregate-witness.mjs
      - name: Commit generated witness carrier
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            research/isograph/discovery/2026-09-29-isomax-core020-ia-closure/AGGREGATE_WITNESS_DATA_0_1.json \
            research/isograph/discovery/2026-09-29-isomax-core020-ia-closure/PARTIAL2_PHYSICAL_CARRIER_0_1_*.json
          if git diff --cached --quiet; then
            echo "No generated witness changes."
          else
            git commit -m "research(isomax): freeze aggregate primitive witness data"
            git push origin HEAD:research/isomax-core020-ia-closure-20260929
          fi
