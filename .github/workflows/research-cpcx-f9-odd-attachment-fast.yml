name: Research CPCX F9 odd attachment fast

on:
  push:
    branches:
      - experiment/cpcx-20261002
    paths:
      - research/isograph/discovery/2026-10-02-cpcx/cpcx-one-defect-attachment-rcic.mjs
      - research/isograph/discovery/2026-10-02-cpcx/run-cpcx-f9-one-defect-attachment-fast.mjs
      - .github/workflows/research-cpcx-f9-odd-attachment-fast.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "26.7.0"
      - name: Run bounded F9 odd attachment probe
        run: |
          node research/isograph/discovery/2026-10-02-cpcx/run-cpcx-f9-one-defect-attachment-fast.mjs > cpcx-f9-one-defect-attachment-fast.json
          cat cpcx-f9-one-defect-attachment-fast.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: cpcx-f9-odd-attachment-fast
          path: cpcx-f9-one-defect-attachment-fast.json
          if-no-files-found: error
