name: BSFP OQS incremental qualification

on:
  push:
    branches:
      - research/zdd-transfer-20260910
    paths:
      - 'reference/research-prototypes/2026-09-10-oqs/incremental-oqs.mjs'
      - '.github/workflows/bsfp-oqs-incremental.yml'
      - 'components/bsfp/ownership-antichain-solver.mjs'
      - 'components/bsfp/geometry.mjs'
      - 'reference/research-prototypes/2026-09-10-zdd-transfer/residual-class-transition.mjs'
      - 'reference/research-prototypes/2026-09-10-zdd-transfer/separator-history-classes.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  oqs-incremental:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26.7.0
      - name: Qualify incremental OQS transition synthesis
        shell: bash
        run: |
          set -o pipefail
          node --expose-gc reference/research-prototypes/2026-09-10-oqs/incremental-oqs.mjs | tee oqs-r6-result.json
      - name: Preserve compact R6 evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: oqs-r6-result
          path: oqs-r6-result.json
          if-no-files-found: error
          retention-days: 7
