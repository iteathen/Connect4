name: Packed quotient support layout

on:
  push:
    branches:
      - research/semantic-quotient
    paths:
      - 'research/semantic-quotient/state-identity-unification/src/quotient-packed-support-layout-campaign.mjs'
      - '.github/workflows/semantic-quotient-packed-support-layout.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    name: Qualify packed support layout
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26.7.0
      - name: Run packed support-layout campaign
        run: node --max-old-space-size=6144 research/semantic-quotient/state-identity-unification/src/quotient-packed-support-layout-campaign.mjs
