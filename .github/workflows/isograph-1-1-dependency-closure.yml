name: IsoGraph 1.1 dependency-closure audit

on:
  push:
    branches:
      - work/isograph-logic-authority-1-1-rebuild-20260918
    paths:
      - research/isograph/successor/RUN_DEPENDENCY_CLOSURE_AUDIT.request

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26.7.0
      - name: Run dependency closure audit
        id: audit
        continue-on-error: true
        run: node research/isograph/successor/tools/audit-corpus-dependency-closure.mjs
      - name: Emit audit
        if: always()
        run: |
          cat out/isograph-1-1/DEPENDENCY_CLOSURE_AUDIT.json
      - name: Enforce closure
        if: always()
        shell: bash
        run: |
          if [ "${{ steps.audit.outcome }}" != "success" ]; then
            echo "Dependency closure is not complete yet; this is expected during successor construction." >&2
            exit 1
          fi
