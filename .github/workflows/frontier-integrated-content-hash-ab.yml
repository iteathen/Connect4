name: Frontier integrated content hash A-B

on:
  push:
    branches:
      - research/frontier-negamax-conformance
    paths:
      - '.github/workflows/frontier-integrated-content-hash-ab.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26.7.0
      - name: Build qualify and pair candidate
        shell: bash
        run: |
          set -euo pipefail
          baseline="$RUNNER_TEMP/baseline"
          candidate="$RUNNER_TEMP/candidate"
          base=0c0e6f0eae896540cdfbc1991307d90d105606fd
          git worktree add --detach "$baseline" "$base"
          git worktree add --detach "$candidate" "$base"

          cat > "$RUNNER_TEMP/patch-candidate.mjs" <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          const root = process.argv[2];
          function replaceExact(relative, before, after) {
            const file = path.join(root, relative);
            const source = fs.readFileSync(file, 'utf8');
            const first = source.indexOf(before);
            if (first < 0) throw new Error(`missing source seam: ${relative}`);
            if (source.indexOf(before, first + 1) >= 0) throw new Error(`non-unique source seam: ${relative}`);
            fs.writeFileSync(file, source.slice(0, first) + after + source.slice(first + before.length));
          }

          const residual = 'research/semantic-quotient/state-identity-unification/src/quotient-slot64-residual-pool-v2.mjs';
          replaceExact(residual,
          `  pool.termCount = function slot64TermCount(id) {
            assertClassId(id);
            metrics.termCountReads += 1;
            return classTermCounts[id];
          };

          pool.writeTermIds = function slot64WriteTermIds(id, target, offset = 0) {`,
          `  pool.termCount = function slot64TermCount(id) {
            assertClassId(id);
            metrics.termCountReads += 1;
            return classTermCounts[id];
          };

          // The canonical packed chunks already contain the exact ordered term set.
          // Fold directly from those DWORDs so semantic hashing does not first
          // materialize an intermediate Uint16 term sequence. Hash remains only an
          // address filter; exact shared identity still compares canonical terms.
          pool.writeSemanticMetadata = function slot64WriteSemanticMetadata(id, target) {
            assertClassId(id);
            if (!target || typeof target !== 'object' || Array.isArray(target) || Object.isFrozen(target)) {
              throw new TypeError('slot64 semantic metadata target must be mutable');
            }
            let hashLo = 0x811c9dc5;
            let hashHi = 0x9e3779b9;
            let index = 0;
            for (let slot = 0; slot < CHUNKS_PER_CLASS; slot += 1) {
              const chunkId = classSlotIds[slot][id];
              const words = slotPools[slot].words;
              const base = chunkId * CHUNK_WORDS;
              const termBase = slot << 6;
              let active = words[base] | 0;
              while (active !== 0) {
                const termId = termBase + 31 - Math.clz32(active & -active);
                if (termId >= vocabulary.count) throw new Error(\`slot64 semantic term \${termId} exceeds vocabulary\`);
                const term = (termId + 1) >>> 0;
                hashLo = Math.imul(hashLo ^ term, 0x01000193) >>> 0;
                hashLo = mix32(hashLo ^ index);
                hashHi = Math.imul(hashHi ^ term, 0x85ebca6b) >>> 0;
                hashHi = mix32(hashHi ^ index);
                index += 1;
                active &= active - 1;
              }
              active = words[base + 1] | 0;
              while (active !== 0) {
                const termId = termBase + 63 - Math.clz32(active & -active);
                if (termId >= vocabulary.count) throw new Error(\`slot64 semantic term \${termId} exceeds vocabulary\`);
                const term = (termId + 1) >>> 0;
                hashLo = Math.imul(hashLo ^ term, 0x01000193) >>> 0;
                hashLo = mix32(hashLo ^ index);
                hashHi = Math.imul(hashHi ^ term, 0x85ebca6b) >>> 0;
                hashHi = mix32(hashHi ^ index);
                index += 1;
                active &= active - 1;
              }
            }
            if (index !== classTermCounts[id]) {
              throw new Error(\`slot64 semantic term count drift: expected \${classTermCounts[id]}, hashed \${index}\`);
            }
            target.length = index;
            target.hashLo = mix32(hashLo ^ index);
            target.hashHi = mix32(hashHi ^ index);
            return target;
          };

          pool.writeTermIds = function slot64WriteTermIds(id, target, offset = 0) {`);

          const descriptor = 'research/semantic-quotient/state-identity-unification/src/quotient-local-semantic-descriptor.mjs';
          replaceExact(descriptor,
          `  const termScratch = new Uint16Array(vocabularyCount);
            const classHashScratch = { lo: 0, hi: 0 };
            const stateHashScratch = { lo: 0, hi: 0 };`,
          `  const termScratch = new Uint16Array(vocabularyCount);
            const classHashScratch = { lo: 0, hi: 0 };
            const directClassMetadata = typeof kernel.classes.writeSemanticMetadata === 'function';
            const directClassScratch = { length: 0, hashLo: 0, hashHi: 0 };
            const stateHashScratch = { lo: 0, hi: 0 };`);

          replaceExact(descriptor,
          `    writeClassTerms(classId, termScratch, 0, length);
              hashResidualTermIds(termScratch, length, classHashScratch);
              classHashLo[classId] = classHashScratch.lo;
              classHashHi[classId] = classHashScratch.hi;
              classHashReady[word] |= bit;`,
          `    if (directClassMetadata) {
                kernel.classes.writeSemanticMetadata(classId, directClassScratch);
                if (directClassScratch.length !== length) {
                  throw new Error(\`semantic class \${classId} direct length drift: expected \${length}, got \${directClassScratch.length}\`);
                }
                classHashLo[classId] = directClassScratch.hashLo;
                classHashHi[classId] = directClassScratch.hashHi;
              } else {
                writeClassTerms(classId, termScratch, 0, length);
                hashResidualTermIds(termScratch, length, classHashScratch);
                classHashLo[classId] = classHashScratch.lo;
                classHashHi[classId] = classHashScratch.hi;
              }
              classHashReady[word] |= bit;`);
          NODE

          node "$RUNNER_TEMP/patch-candidate.mjs" "$candidate"
          git -C "$candidate" diff --check

          node --test "$candidate/research/semantic-quotient/state-identity-unification/src/quotient-storage-contract.test.mjs"
          node --test "$candidate/research/semantic-quotient/state-identity-unification/src/quotient-packed-state-pool.test.mjs"
          node --test "$candidate/research/semantic-quotient/state-identity-unification/src/quotient-semantic-arena-contract.test.mjs"
          node "$candidate/research/semantic-quotient/state-identity-unification/src/quotient-slot64-residual-campaign.mjs"
          node "$candidate/research/semantic-quotient/state-identity-unification/src/quotient-semantic-tt-replacement-campaign.mjs"

          cat > "$RUNNER_TEMP/case.mjs" <<'NODE'
          import { performance } from 'node:perf_hooks';
          import { resolve } from 'node:path';
          import { pathToFileURL } from 'node:url';
          const tree = process.argv[2], variant = process.argv[3];
          const src = resolve(tree, 'research/semantic-quotient/state-identity-unification/src');
          const load = async name => import(pathToFileURL(resolve(src, name)).href);
          const { createSlot64ResidualQuotientKernel } = await load('quotient-native-negamax-slot64-residual-kernel.mjs');
          const { createSemanticSharedTtArena } = await load('quotient-semantic-shared-tt.mjs');
          const { createOnlineSemanticQuotientSearcher } = await load('quotient-online-semantic-search-lib.mjs');
          const { createBoundedStoragePlan } = await load('quotient-bounded-storage-plan.mjs');
          const domain = { columns: 7, rows: 6, connect: 4 };
          const { kernel } = createSlot64ResidualQuotientKernel(domain, { cacheEdges: true, prefixClasses: 4096 });
          const plan = createBoundedStoragePlan(kernel, 8, 2048 * 1048576);
          kernel.prepareSearchStorage(plan.searchStorage);
          const arena = createSemanticSharedTtArena({ ...plan.arena, domainSpec: domain });
          const searcher = createOnlineSemanticQuotientSearcher(kernel, arena, { etc: false });
          const before = kernel.storageGrowthStats();
          const cpuStart = process.cpuUsage();
          const start = performance.now();
          const result = searcher.searchBounded(kernel.rootId, -2, 2, 8);
          const searchMs = performance.now() - start;
          const cpu = process.cpuUsage(cpuStart);
          const after = kernel.storageGrowthStats();
          if (JSON.stringify(before) !== JSON.stringify(after)) throw new Error('storage grew during search');
          const stats = searcher.stats();
          const invariant = {
            result,
            search: stats.search,
            proofStore: stats.proofStore,
            localStates: stats.localStates,
            localClasses: stats.localClasses,
            transitionMetrics: kernel.transitionMetrics,
            stateMetrics: kernel.states.metrics,
            growth: after,
          };
          console.log(JSON.stringify({
            variant,
            searchMs,
            cpuMs: (cpu.user + cpu.system) / 1000,
            kernelBytes: kernel.memoryStats().totalTypedBytes,
            descriptorBytes: stats.descriptorCache.retainedTypedBytes + stats.descriptorCache.scratchBytes,
            rss: process.memoryUsage().rss,
            semanticTt: stats.semanticTt,
            descriptorCache: stats.descriptorCache,
            invariant,
          }));
          NODE

          run_case() {
            label="$1"; tree="$2"; sequence="$3"; out="$RUNNER_TEMP/integrated-$sequence.json"
            node --expose-gc "$RUNNER_TEMP/case.mjs" "$tree" "$label" > "$out"
            LABEL="$label" SEQUENCE="$sequence" OUT="$out" node - <<'NODE'
          const fs = require('node:fs');
          const d = JSON.parse(fs.readFileSync(process.env.OUT, 'utf8'));
          console.log('PAIR_RESULT=' + JSON.stringify({
            label: process.env.LABEL,
            sequence: Number(process.env.SEQUENCE),
            searchMs: d.searchMs,
            cpuMs: d.cpuMs,
            kernelBytes: d.kernelBytes,
            descriptorBytes: d.descriptorBytes,
            rss: d.rss,
            calls: d.invariant.search.calls,
            expanded: d.invariant.search.expanded,
            transitionsRequested: d.invariant.search.transitionsRequested,
            proofProbeMisses: d.invariant.search.proofProbeMisses,
            proofAdmissions: d.invariant.search.proofAdmissions,
            localStates: d.invariant.localStates,
            localClasses: d.invariant.localClasses,
            maxBucketScan: d.semanticTt.maxBucketScan,
            classBuilds: d.descriptorCache.classBuilds,
            directTermWrites: d.descriptorCache.directTermWrites,
            directTermIdsWritten: d.descriptorCache.directTermIdsWritten,
          }));
          NODE
          }

          # Symmetric warm-up, then ABBA/BAAB measured order.
          node --expose-gc "$RUNNER_TEMP/case.mjs" "$candidate" candidate >/dev/null
          node --expose-gc "$RUNNER_TEMP/case.mjs" "$baseline" baseline >/dev/null
          node --expose-gc "$RUNNER_TEMP/case.mjs" "$baseline" baseline >/dev/null
          node --expose-gc "$RUNNER_TEMP/case.mjs" "$candidate" candidate >/dev/null
          run_case baseline "$baseline" 1
          run_case candidate "$candidate" 2
          run_case candidate "$candidate" 3
          run_case baseline "$baseline" 4
          run_case candidate "$candidate" 5
          run_case baseline "$baseline" 6
          run_case baseline "$baseline" 7
          run_case candidate "$candidate" 8

          RUNNER_TEMP="$RUNNER_TEMP" node - <<'NODE'
          const fs = require('node:fs'), path = require('node:path');
          const rows = [];
          for (let i = 1; i <= 8; i++) rows.push(JSON.parse(fs.readFileSync(path.join(process.env.RUNNER_TEMP, `integrated-${i}.json`), 'utf8')));
          const baseline = rows.filter(x => x.variant === 'baseline');
          const candidate = rows.filter(x => x.variant === 'candidate');
          const stable = x => JSON.stringify(x.invariant);
          const reference = stable(baseline[0]);
          for (const row of rows) if (stable(row) !== reference) throw new Error(`semantic/work invariant mismatch in ${row.variant}`);
          const mean = (xs, key) => xs.reduce((n, x) => n + x[key], 0) / xs.length;
          const median = (xs, key) => { const a = xs.map(x => x[key]).sort((a,b) => a-b); return (a[1] + a[2]) / 2; };
          console.log('PAIR_SUMMARY=' + JSON.stringify({
            baselineSearchMeanMs: mean(baseline, 'searchMs'),
            candidateSearchMeanMs: mean(candidate, 'searchMs'),
            searchMeanRatio: mean(candidate, 'searchMs') / mean(baseline, 'searchMs'),
            baselineSearchMedianMs: median(baseline, 'searchMs'),
            candidateSearchMedianMs: median(candidate, 'searchMs'),
            searchMedianRatio: median(candidate, 'searchMs') / median(baseline, 'searchMs'),
            baselineCpuMeanMs: mean(baseline, 'cpuMs'),
            candidateCpuMeanMs: mean(candidate, 'cpuMs'),
            cpuMeanRatio: mean(candidate, 'cpuMs') / mean(baseline, 'cpuMs'),
            baselineKernelBytes: baseline[0].kernelBytes,
            candidateKernelBytes: candidate[0].kernelBytes,
            baselineDescriptorBytes: baseline[0].descriptorBytes,
            candidateDescriptorBytes: candidate[0].descriptorBytes,
            baselineMaxBucketScan: Math.max(...baseline.map(x => x.semanticTt.maxBucketScan)),
            candidateMaxBucketScan: Math.max(...candidate.map(x => x.semanticTt.maxBucketScan)),
            baselineDirectTermWrites: baseline[0].descriptorCache.directTermWrites,
            candidateDirectTermWrites: candidate[0].descriptorCache.directTermWrites,
            baselineDirectTermIdsWritten: baseline[0].descriptorCache.directTermIdsWritten,
            candidateDirectTermIdsWritten: candidate[0].descriptorCache.directTermIdsWritten,
            invariantMatch: true,
          }));
          NODE
