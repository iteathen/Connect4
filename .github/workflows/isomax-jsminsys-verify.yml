name: IsoMax Package Verify

on:
  push:
    branches:
      - work/isomax-jsminsys-rebuild
  pull_request:
    paths:
      - 'components/isometric/**'
      - 'isomax/**'
      - 'test/**'
      - 'tools/**'
      - 'vendor/jsminsys'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/isomax-jsminsys-verify.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '26.7.0'
      - run: node isomax/verify.mjs
      - run: npm test
      - run: npm run test:package
