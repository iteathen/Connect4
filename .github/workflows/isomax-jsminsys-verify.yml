name: IsoMax JSMinSys Verify

on:
  push:
    branches:
      - work/isomax-jsminsys-boundary-cleanup
  pull_request:
    paths:
      - 'components/isometric/**'
      - 'test/**'
      - 'tools/**'
      - 'vendor/jsminsys'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/isomax-jsminsys-verify.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          submodules: recursive
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '26.7.0'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: node --test vendor/jsminsys/test/*.test.mjs
