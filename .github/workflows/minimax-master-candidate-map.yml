name: Minimax master candidate map

on:
  push:
    branches:
      - work/minimax-candidate-composition-20260911
    paths:
      - 'docs/research/2026-09-09-historical-107-theory-ledger.md'
      - 'docs/research/evidence/2026-09-09-signed-interaction-graph-terminalization-v2.json'
      - 'research/minimax/candidate-map/**'
      - 'research/minimax/composition-campaign/**'
      - '.github/workflows/minimax-master-candidate-map.yml'
  workflow_dispatch:

jobs:
  candidate-map:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26.7.0
      - name: Validate and materialize map
        env:
          CANDIDATE_MAP_OUT: /tmp/minimax-candidate-map
        run: node research/minimax/candidate-map/build-master-map.mjs --write | tee /tmp/minimax-candidate-map-summary.json
      - name: Audit active campaign source coverage
        run: node research/minimax/candidate-map/audit-campaign-coverage.mjs | tee /tmp/minimax-candidate-map-campaign-coverage.json
      - name: Upload complete map evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: minimax-master-candidate-map
          path: |
            /tmp/minimax-candidate-map/master-candidate-map.json
            /tmp/minimax-candidate-map/coverage-report.json
            /tmp/minimax-candidate-map-summary.json
            /tmp/minimax-candidate-map-campaign-coverage.json
          if-no-files-found: error
