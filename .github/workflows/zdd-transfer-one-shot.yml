name: ZDD transfer one-shot

on:
  push:
    branches:
      - research/zdd-transfer-20260910

jobs:
  frontier-census:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26.7.0'
      - name: Run 7x6 incidence frontier census
        run: node reference/research-prototypes/2026-09-10-zdd-transfer/frontier-width.mjs
