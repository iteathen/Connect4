name: ZDD transfer one-shot

on:
  push:
    branches:
      - research/zdd-transfer-20260910

permissions:
  contents: read

jobs:
  zdd-transfer-research:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '26.7.0'
      - name: Run 7x6 incidence frontier census
        run: node reference/research-prototypes/2026-09-10-zdd-transfer/frontier-width.mjs
      - name: Run fused MinJoin exact reference probe
        run: node reference/research-prototypes/2026-09-10-zdd-transfer/fused-minjoin.mjs
