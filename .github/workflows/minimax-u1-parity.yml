name: Minimax U1 event parity

on:
  push:
    branches:
      - work/minimax-candidate-composition-20260911
    paths:
      - 'research/minimax/composition-campaign/u1_event_parity.mjs'
      - '.github/workflows/minimax-u1-parity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  event-parity:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.7.0
      - name: Run U1 event-rank differential
        run: node research/minimax/composition-campaign/u1_event_parity.mjs
