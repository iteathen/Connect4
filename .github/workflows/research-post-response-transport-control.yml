name: Research post-response transport control

on:
  push:
    branches:
      - research/universal-structural-policy-20260930
    paths:
      - .github/workflows/research-post-response-transport-control.yml
      - research/isograph/discovery/2026-09-30-universal-structural-policy/run-post-response-transport-control.mjs

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact pushed revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Pin Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26.7.0

      - name: Assert exact Node runtime
        run: node -e "if (process.version !== 'v26.7.0') throw new Error('expected Node v26.7.0, got ' + process.version)"

      - name: Run oracle-free transport control
        shell: bash
        run: |
          set -euo pipefail
          OUT=research/isograph/discovery/2026-09-30-universal-structural-policy/POST_RESPONSE_TRANSPORT_CONTROL_0_1.json
          node research/isograph/discovery/2026-09-30-universal-structural-policy/run-post-response-transport-control.mjs > "$OUT"
          node - "$OUT" <<'NODE'
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          console.log('ORACLE_USED='+r.oracleUsed);
          console.log('C6_SPLIT_COMPARISON='+JSON.stringify(r.candidate6ForcedSplit.branchComparison));
          for(const [candidate,s] of Object.entries(r.directChildren)){
            console.log('CHILD_'+candidate+'='+JSON.stringify({
              heights:s.heights,
              attackerEarliest:s.attackerResiduals.earliest,
              defenderEarliest:s.defenderResiduals.earliest,
              attackerBySize:s.attackerResiduals.bySize,
              oneSetupForks:s.currentUpperGrammar.oneSetupForks.length,
              forcedSingletonEdges:s.currentUpperGrammar.forcedSingletonEdges.length
            }));
          }
          NODE

      - name: Commit durable evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/isograph/discovery/2026-09-30-universal-structural-policy/POST_RESPONSE_TRANSPORT_CONTROL_0_1.json
          if git diff --cached --quiet; then
            echo "transport evidence unchanged"
            exit 0
          fi
          git commit -m "research: verify post-response transport control"
          git push origin HEAD:research/universal-structural-policy-20260930
