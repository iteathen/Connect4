name: Research G2 fiber canonicalizer

on:
  push:
    branches:
      - research/semantic-quotient
    paths:
      - '.github/workflows/research-g2-fiber-canonicalizer.yml'
      - 'research/isograph/discovery/2026-10-16-oracle-compiled-frontier/g2-fiber-canonicalizer-control.mjs'

permissions:
  contents: read

jobs:
  census:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26.7.0
      - name: Assert exact Node runtime
        run: node -e "if (process.version !== 'v26.7.0') throw new Error('expected Node v26.7.0, got ' + process.version)"
      - name: Reconstruct exact G2 census
        run: node research/isograph/discovery/2026-10-16-oracle-compiled-frontier/g2-fiber-canonicalizer-control.mjs
