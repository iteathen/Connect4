name: Research CPC rank20 rank32 target reservoir rejection localization

concurrency:
  group: rank20-rank32-reservoir-rejection-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [research/universal-structural-policy-20260930]
    paths:
      - .github/workflows/research-cpc-rank20-rank32-reservoir-rejection.yml
      - research/isograph/discovery/2026-09-30-universal-structural-policy/CPC_RANK20_RANK32_TARGET_RESERVOIR_REJECTION_LOCALIZATION_DESIGN_0_1.md
      - research/isograph/discovery/2026-09-30-universal-structural-policy/test-cpc-rank20-rank32-target-reservoir-rejection-localization.mjs
      - research/isograph/discovery/2026-09-30-universal-structural-policy/run-cpc-rank20-rank32-target-reservoir-rejection-localization.mjs
      - research/isograph/discovery/2026-09-30-universal-structural-policy/CPC_RANK20_RANK32_RECURRING_Q_GENERIC_RCIC_AUDIT_0_1.json

permissions:
  contents: write

jobs:
  localize:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {fetch-depth: 0}
      - name: Check out pinned JSMinSys authority
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: iteathen/JSMinSys
          ref: bf23d3a67652cd42e1975f29c7dc4eed54f7eb42
          path: .jsminsys
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: {node-version: 26.7.0}
      - name: Verify reservoir rejection contract
        run: node research/isograph/discovery/2026-09-30-universal-structural-policy/test-cpc-rank20-rank32-target-reservoir-rejection-localization.mjs "$GITHUB_WORKSPACE/.jsminsys"
      - name: Generate durable rejection localization
        shell: bash
        run: |
          set -euo pipefail
          DIR=research/isograph/discovery/2026-09-30-universal-structural-policy
          OUT="$DIR/CPC_RANK20_RANK32_TARGET_RESERVOIR_REJECTION_LOCALIZATION_0_1.json"
          node "$DIR/run-cpc-rank20-rank32-target-reservoir-rejection-localization.mjs" "$GITHUB_WORKSPACE/.jsminsys" > "$OUT"
          node - "$OUT" <<'NODE'
          const fs=require('fs');const r=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          console.log(JSON.stringify({summary:r.summary,topResiduals:r.residualRecurrence.slice(0,10),topSets:r.uncoveredSetRecurrence.slice(0,10)}));
          NODE
      - name: Commit durable rejection localization
        shell: bash
        run: |
          set -euo pipefail
          BRANCH=research/universal-structural-policy-20260930
          FILE=research/isograph/discovery/2026-09-30-universal-structural-policy/CPC_RANK20_RANK32_TARGET_RESERVOIR_REJECTION_LOCALIZATION_0_1.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$FILE"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research: record rank32 reservoir rejection localization"
          git pull --rebase origin "$BRANCH"
          git push origin HEAD:"$BRANCH"
