name: IsoMax Lazy SMP CPU Census

on:
  push:
    branches:
      - work/isomax-jsminsys-boundary-cleanup
    paths:
      - '.github/workflows/isomax-lazy-smp-cpu-census.yml'
      - 'tools/summarize-isomax-cpu-profiles.mjs'
  workflow_dispatch:

jobs:
  census:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          submodules: recursive
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '26.7.0'
          cache: npm
      - run: npm ci
      - name: Four-worker V8 CPU census
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force cpu-profiles | Out-Null
          1..4 | ForEach-Object {
            $run=$_
            Write-Host "CPU_CENSUS_RUN $run"
            node --experimental-ffi --cpu-prof --cpu-prof-interval=100 --cpu-prof-dir=cpu-profiles tools/bench-lazy-smp-control.mjs 7 2>&1 |
              Tee-Object -FilePath "cpu-profiles/run-$run.log"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          Write-Host "CPU_PROFILE_FILES"
          Get-ChildItem cpu-profiles
          node tools/summarize-isomax-cpu-profiles.mjs cpu-profiles
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
