name: Semantic quotient MQ4 materialized flat replay

on:
  push:
    branches:
      - research/semantic-quotient
    paths:
      - 'research/semantic-quotient/mq4-flat-replay.mjs'
      - '.github/workflows/semantic-quotient-mq4-flat-replay.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mq4-flat:
    name: MQ4 materialized flat replay
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.7.0
      - name: Qualify serialized flat residual transition table
        run: node --expose-gc --max-old-space-size=4096 research/semantic-quotient/mq4-flat-replay.mjs
