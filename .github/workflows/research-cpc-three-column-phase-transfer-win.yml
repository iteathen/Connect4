name: Research CPC three-column phase-transfer win

on:
  push:
    branches:
      - research/universal-structural-policy-20260930
    paths:
      - .github/workflows/research-cpc-three-column-phase-transfer-win.yml
      - research/isograph/discovery/2026-09-30-universal-structural-policy/run-cpc-three-column-phase-transfer-win.mjs
      - research/isograph/discovery/2026-09-30-universal-structural-policy/CPC_THREE_COLUMN_PHASE_TRANSFER_WIN_THEOREM.md

permissions:
  contents: write

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact pushed revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Pin Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26.7.0
      - name: Fetch pinned JSMinSys authority
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/iteathen/JSMinSys.git jsminsys
          git -C jsminsys checkout bf23d3a67652cd42e1975f29c7dc4eed54f7eb42
          test -z "$(git -C jsminsys status --porcelain)"
      - name: Qualify finite phase-transfer theorem
        shell: bash
        run: |
          set -euo pipefail
          DIR=research/isograph/discovery/2026-09-30-universal-structural-policy
          OUT="$DIR/CPC_THREE_COLUMN_PHASE_TRANSFER_WIN_0_1.json"
          node "$DIR/run-cpc-three-column-phase-transfer-win.mjs" ./jsminsys > "$OUT"
          node - "$OUT" <<'NODE'
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          if(r.oracleUsed!==false||r.solvedInputsUsed!==false)throw new Error('forbidden solved evidence flag');
          if(r.jsMinSysSha!=='bf23d3a67652cd42e1975f29c7dc4eed54f7eb42')throw new Error('JSMinSys authority drift');
          if(r.accept!==true)throw new Error('three-column phase-transfer theorem rejected');
          if(JSON.stringify(r.root.legalColumns)!==JSON.stringify([3,5,7]))throw new Error('root legal-column mismatch');
          for(const s of Object.values(r.sinkEquality))if(typeof s!=='boolean')throw new Error('sink equality not recorded');
          console.log(JSON.stringify({
            accept:r.accept,
            root:r.root,
            sinkEquality:r.sinkEquality,
            conclusion:r.conclusion
          }));
          NODE
      - name: Commit durable theorem evidence
        shell: bash
        run: |
          set -euo pipefail
          BRANCH=research/universal-structural-policy-20260930
          FILE=research/isograph/discovery/2026-09-30-universal-structural-policy/CPC_THREE_COLUMN_PHASE_TRANSFER_WIN_0_1.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$FILE"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research: record three-column phase-transfer win qualification"
          for attempt in 1 2 3; do
            git fetch origin "$BRANCH"
            git rebase --autostash "origin/$BRANCH"
            if git push origin HEAD:"$BRANCH"; then exit 0; fi
            sleep 1
          done
          exit 1
