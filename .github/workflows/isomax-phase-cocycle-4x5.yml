name: IsoMax 4x5 phase cocycle research

on:
  push:
    branches:
      - research/nim-control-parity-algebra-20260929
    paths:
      - '.github/workflows/isomax-phase-cocycle-4x5.yml'
      - 'research/isograph/discovery/2026-09-29-center-proof-cycle/run-phase-cocycle-4x5.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phase-cocycle-4x5:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '26'
      - name: Cocycle audit invariant preflight
        run: node --test --test-name-pattern="binary deeper continuation phase exposes a gauge-invariant GF2 cocycle audit" research/isograph/discovery/2026-09-29-center-proof-cycle/control-algebra-dimensions.test.mjs
      - name: 4x5 Connect-4 phase cocycle
        run: node --max-old-space-size=4096 research/isograph/discovery/2026-09-29-center-proof-cycle/run-phase-cocycle-4x5.mjs
      - name: Research integrity
        run: node tools/verify-research-integrity.mjs
