name: Retire consolidated support-local research experiment

on:
  push:
    branches:
      - research/semantic-quotient
    paths:
      - research/provenance/SUPPORT_LOCAL_EXPERIMENT_RETIRE_TRIGGER_2026-09-18.json

permissions:
  contents: write

concurrency:
  group: retire-support-local-research-experiment
  cancel-in-progress: false

jobs:
  retire:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: research/semantic-quotient
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26.7.0
      - name: Verify canonical research graph
        run: node tools/verify-research-integrity.mjs
      - name: Archive and delete exact experiment ref
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const req=JSON.parse(fs.readFileSync('research/provenance/SUPPORT_LOCAL_EXPERIMENT_RETIRE_TRIGGER_2026-09-18.json','utf8'));
          if(process.env.REPOSITORY!=='iteathen/Connect4'||req.repository!==process.env.REPOSITORY) throw new Error('repository mismatch');
          if(req.owner_branch!=='research/semantic-quotient') throw new Error('owner branch mismatch');

          const [owner,repo]=process.env.REPOSITORY.split('/');
          const api='https://api.github.com';
          const headers={
            Authorization:`Bearer ${process.env.GH_TOKEN}`,
            Accept:'application/vnd.github+json',
            'X-GitHub-Api-Version':'2022-11-28',
            'Content-Type':'application/json'
          };
          const enc=s=>s.split('/').map(encodeURIComponent).join('/');
          async function gh(path,{method='GET',body,ok=[200]}={}){
            const r=await fetch(api+path,{method,headers,body:body===undefined?undefined:JSON.stringify(body)});
            const text=await r.text();
            if(!ok.includes(r.status)) throw new Error(`${method} ${path} -> ${r.status}: ${text.slice(0,1000)}`);
            return text?JSON.parse(text):null;
          }
          async function refSha(branch){
            return (await gh(`/repos/${owner}/${repo}/git/ref/heads/${enc(branch)}`)).object.sha;
          }
          async function activeRunCount(branch,status){
            const q=new URLSearchParams({branch,status,per_page:'1'});
            return (await gh(`/repos/${owner}/${repo}/actions/runs?${q}`)).total_count;
          }
          async function file(ref,path){
            return gh(`/repos/${owner}/${repo}/contents/${enc(path)}?ref=${enc(ref)}`);
          }
          async function tagTarget(tag){
            try{
              const r=await gh(`/repos/${owner}/${repo}/git/ref/tags/${enc(tag)}`);
              if(r.object.type==='commit') return r.object.sha;
              return (await gh(`/repos/${owner}/${repo}/git/tags/${r.object.sha}`)).object.sha;
            }catch(e){
              if(String(e).includes('-> 404:')) return null;
              throw e;
            }
          }
          async function ensureTag(tag,branch,sha){
            const existing=await tagTarget(tag);
            if(existing!==null){
              if(existing!==sha) throw new Error(`archive tag mismatch: ${tag}`);
              return;
            }
            const t=await gh(`/repos/${owner}/${repo}/git/tags`,{
              method:'POST',ok:[201],
              body:{tag,message:`Archive ${branch} after canonical research consolidation`,object:sha,type:'commit'}
            });
            await gh(`/repos/${owner}/${repo}/git/refs`,{
              method:'POST',ok:[201],
              body:{ref:`refs/tags/${tag}`,sha:t.sha}
            });
            if(await tagTarget(tag)!==sha) throw new Error('archive tag verification failed');
          }

          const pr=await gh(`/repos/${owner}/${repo}/pulls/47`);
          if(pr.state!=='closed'||pr.merged||pr.head.sha!==req.experiment_head||pr.base.ref!=='research/semantic-quotient'){
            throw new Error('PR47 disposition mismatch');
          }

          const actual=await refSha(req.experiment_branch);
          if(actual!==req.experiment_head) throw new Error(`experiment branch moved: ${actual}`);
          if(await activeRunCount(req.experiment_branch,'queued')||await activeRunCount(req.experiment_branch,'in_progress')){
            throw new Error('active workflow still depends on experiment branch');
          }

          const sourceScript=await file(req.experiment_head,'research/experiments/bsfp-support-local-clause-coverage/reference-coverage-cofactor.mjs');
          const canonicalScript=await file(req.owner_branch,'research/experiments/bsfp-support-local-clause-coverage/reference-coverage-cofactor.mjs');
          if(sourceScript.sha!==canonicalScript.sha) throw new Error('qualifier script not preserved exactly');

          const result=await file(req.owner_branch,'research/experiments/bsfp-support-local-clause-coverage/RESULT.md');
          const resultText=Buffer.from(result.content,'base64').toString('utf8');
          if(!resultText.includes('C4-R0073')||!resultText.includes('C4-R0074')||!resultText.includes('35332181198')){
            throw new Error('canonical result disposition incomplete');
          }

          const registry=await file(req.owner_branch,'research/canonical/CLAIM_REGISTRY_BSFP.json');
          const rd=JSON.parse(Buffer.from(registry.content,'base64').toString('utf8'));
          const r73=rd.claims.find(x=>x.id==='C4-R0073');
          const r74=rd.claims.find(x=>x.id==='C4-R0074');
          if(r73?.status!=='deductive_exact'||r74?.status!=='empirically_supported') throw new Error('canonical claim split missing');

          await file(req.owner_branch,'research/evidence/bsfp/support-local-clause-coverage.json');

          await ensureTag(req.archive_tag,req.experiment_branch,actual);
          await gh(`/repos/${owner}/${repo}/git/refs/heads/${enc(req.experiment_branch)}`,{method:'DELETE',ok:[204]});
          console.log(`archived+deleted ${req.experiment_branch} @ ${actual}`);
          NODE
