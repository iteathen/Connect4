name: Minimax MQ5 residual alpha-beta

on:
  push:
    branches:
      - solver/minimax-alpha-beta
    paths:
      - 'research/minimax/semantic-residual-mq5/**'
      - '.github/workflows/minimax-mq5-residual.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mq5-anchors:
    name: MQ5 factored residual frozen anchors
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.7.0
      - name: Compare factored residual and fixed-width exact search on frozen anchors
        run: node --max-old-space-size=6144 research/minimax/semantic-residual-mq5/run_factored.mjs anchor-loss anchor-win
