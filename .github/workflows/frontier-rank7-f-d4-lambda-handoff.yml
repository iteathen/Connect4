name: Frontier rank7 F D4 lambda handoff

on:
  push:
    branches:
      - research/frontier-negamax-conformance
    paths:
      - 'research/semantic-quotient/state-identity-unification/src/quotient-standard7x6-rank7-f-d4-lambda-handoff.mjs'
      - 'research/semantic-quotient/state-identity-unification/src/quotient-standard7x6-generic-target-distance-sequence-probe.mjs'
      - 'research/semantic-quotient/state-identity-unification/src/quotient-standard7x6-generic-target-distance-mu-proof-lib.mjs'
      - '.github/workflows/frontier-rank7-f-d4-lambda-handoff.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26.7.0
      - name: Qualify F D4 lambda handoff
        run: |
          set -euo pipefail
          f="$RUNNER_TEMP/rank7-f-d4-lambda.txt"
          timeout 300s node research/semantic-quotient/state-identity-unification/src/quotient-standard7x6-rank7-f-d4-lambda-handoff.mjs | tee "$f"
          RESULT_FILE="$f" node <<'NODE'
          const fs=require('node:fs');
          const line=fs.readFileSync(process.env.RESULT_FILE,'utf8').split(/\r?\n/).find(x=>x.startsWith('RANK7_F_D4_LAMBDA_HANDOFF='));
          if(!line) throw new Error('rank7 F D4 lambda summary missing');
          const x=JSON.parse(line.slice(line.indexOf('=')+1));
          if(x.startSequence!=='46656556'||x.witness!=='G1'||x.createdTarget!=='D4') throw new Error('rank7 F D4 lambda identity drift');
          if(x.proved!==true) throw new Error('rank7 F D4 lambda handoff unproved');
          NODE
