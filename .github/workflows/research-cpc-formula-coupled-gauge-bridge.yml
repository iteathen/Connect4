name: Research CPC formula coupled gauge bridge

on:
  push:
    branches:
      - research/universal-structural-policy-20260930
    paths:
      - .github/workflows/research-cpc-formula-coupled-gauge-bridge.yml
      - research/isograph/discovery/2026-09-30-universal-structural-policy/run-cpc-formula-coupled-gauge-equation-bridge.mjs
      - research/isograph/discovery/2026-09-30-universal-structural-policy/CPC_FORMULA_COUPLED_GAUGE_EQUATION_BRIDGE_HYPOTHESIS.md

permissions:
  contents: write

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact pushed revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Pin Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26.7.0
      - name: Fetch pinned JSMinSys authority
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/iteathen/JSMinSys.git jsminsys
          git -C jsminsys checkout bf23d3a67652cd42e1975f29c7dc4eed54f7eb42
          test -z "$(git -C jsminsys status --porcelain)"
      - name: Run coupled gauge equation bridge
        shell: bash
        run: |
          set -euo pipefail
          DIR=research/isograph/discovery/2026-09-30-universal-structural-policy
          OUT="$DIR/CPC_FORMULA_COUPLED_GAUGE_EQUATION_BRIDGE_0_1.json"
          node "$DIR/run-cpc-formula-coupled-gauge-equation-bridge.mjs" ./jsminsys > "$OUT"
          node - "$OUT" <<'NODE'
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          if(r.oracleUsed!==false||r.solvedInputsUsed!==false||r.formulaOutcomesUsed!==false)throw new Error('forbidden solved/value input');
          if(r.sealedHoldoutsAccessed!==false)throw new Error('sealed holdout boundary violated');
          if(r.jsMinSysSha!=='bf23d3a67652cd42e1975f29c7dc4eed54f7eb42')throw new Error('JSMinSys authority drift');
          if(r.formulaFrameworkSha!=='f6bfce75ebf6aeafef08b9102ce20e0bfade2bdb')throw new Error('formula framework authority drift');
          if(r.structuralChecks.allPairDeltaCircuitsClose!==true)throw new Error('pair-delta circuit failed');
          console.log(JSON.stringify({
            collisions:Object.fromEntries(Object.entries(r.collisions).map(([k,v])=>[k,{classes:v.classes,conflictingClasses:v.conflictingClasses}])),
            systems:r.systems,
            structuralChecks:r.structuralChecks
          }));
          NODE
      - name: Commit durable bridge evidence
        shell: bash
        run: |
          set -euo pipefail
          BRANCH=research/universal-structural-policy-20260930
          FILE=research/isograph/discovery/2026-09-30-universal-structural-policy/CPC_FORMULA_COUPLED_GAUGE_EQUATION_BRIDGE_0_1.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$FILE"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research: record coupled gauge equation bridge"
          for attempt in 1 2 3; do
            git fetch origin "$BRANCH"
            git rebase --autostash "origin/$BRANCH"
            if git push origin HEAD:"$BRANCH"; then exit 0; fi
            sleep 1
          done
          exit 1
