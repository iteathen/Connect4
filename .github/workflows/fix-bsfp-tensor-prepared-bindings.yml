name: fix-bsfp-tensor-prepared-bindings

on:
  push:
    branches:
      - research/bsfp-tensor-overflow-dominance

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, 'bind prepared Tensor resources') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: research/bsfp-tensor-overflow-dominance
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26.7.0
      - name: Apply prepared binding correction
        run: python3 tools/fix-bsfp-tensor-prepared-bindings.py
      - name: Verify repository
        run: node --test
      - name: Checkout exact CUDA-JS pair
        shell: bash
        run: |
          git clone https://github.com/iteathen/CUDA-JS.git ../CUDA-JS
          git -C ../CUDA-JS checkout 98e2ebc942c14d63acf4dd82e912dd548c363a05
          npm --prefix ../CUDA-JS ci --no-audit --no-fund
          git clone https://github.com/iteathen/CUDA-JS-Tensor.git ../CUDA-JS-Tensor
          git -C ../CUDA-JS-Tensor checkout 9df9324b0ca7606f9dd2af2e89aed118839896a5
      - name: Wire exact sibling packages
        shell: bash
        run: |
          mkdir -p node_modules ../CUDA-JS-Tensor/node_modules
          ln -sfn "$(realpath ../CUDA-JS)" node_modules/cuda-js
          ln -sfn "$(realpath ../CUDA-JS-Tensor)" node_modules/cuda-js-tensor
          ln -sfn "$(realpath ../CUDA-JS)" ../CUDA-JS-Tensor/node_modules/cuda-js
      - name: Qualify corrected prepared DAG on portable runtime
        run: node research/experiments/cuda-bsfp-tensor-dominance/run.mjs portable
      - name: Commit correction and remove one-shot files
        shell: bash
        run: |
          git config user.name iteathen
          git config user.email josh.oshiro@gmail.com
          git add research/experiments/cuda-bsfp-tensor-dominance/run.mjs .github/workflows/bsfp-tensor-overflow-portable.yml
          git rm tools/fix-bsfp-tensor-prepared-bindings.mjs tools/fix-bsfp-tensor-prepared-bindings.py .github/workflows/fix-bsfp-tensor-prepared-bindings.yml
          git commit -m 'research: bind prepared Tensor resources'
          git push origin HEAD:research/bsfp-tensor-overflow-dominance
