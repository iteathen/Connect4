name: Quotient one-sided exhaustion bounds

on:
  push:
    branches:
      - research/semantic-quotient
    paths:
      - 'research/semantic-quotient/state-identity-unification/src/quotient-exhaustion-bounds-campaign.mjs'
      - 'research/semantic-quotient/state-identity-unification/src/quotient-native-negamax-fast-kernel.mjs'
      - '.github/workflows/semantic-quotient-exhaustion-bounds.yml'
      - 'components/bsfp/ownership-antichain-solver.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exhaustion-bounds:
    name: Qualify one-sided exhaustion bounds
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.7.0
      - name: Run one-sided exhaustion bounds campaign
        run: node --expose-gc --max-old-space-size=6144 research/semantic-quotient/state-identity-unification/src/quotient-exhaustion-bounds-campaign.mjs
