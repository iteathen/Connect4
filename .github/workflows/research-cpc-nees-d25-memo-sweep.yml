name: Research NEES CPC D25 memo capacity sweep

on:
  push:
    branches:
      - research/universal-structural-policy-20260930
    paths:
      - .github/workflows/research-cpc-nees-d25-memo-sweep.yml
      - research/isograph/discovery/2026-09-30-universal-structural-policy/run-cpc-guard-survival-nees-kernel.mjs

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out exact pushed revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Pin Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26.7.0
      - name: Fetch NEES JSMinSys kernel revision
        shell: bash
        run: |
          set -euo pipefail
          git clone --branch research/cpc-guard-proof-memo-nees-v1 --single-branch https://github.com/iteathen/JSMinSys.git jsminsys-nees
          git -C jsminsys-nees checkout db9cda32fc814a7f982816556cb59ab82a7a4782
      - name: Sweep D25 memo capacities
        shell: bash
        env:
          NODE_OPTIONS: --max-old-space-size=2048
        run: |
          set -euo pipefail
          DIR=research/isograph/discovery/2026-09-30-universal-structural-policy
          OUT="$DIR/CPC_NEES_GUARD_KERNEL_MEMO_SWEEP_D25_0_1.json"
          for C in 4194304 8388608 16777216; do
            echo "CAPACITY=$C"
            node "$DIR/run-cpc-guard-survival-nees-kernel.mjs" ./jsminsys-nees 25 "$C" > "/tmp/d25-$C.json"
          done
          node - "$OUT" <<'NODE'
          const fs=require('fs');
          const caps=[4194304,8388608,16777216];
          const rows=caps.map(capacity=>{
            const r=JSON.parse(fs.readFileSync('/tmp/d25-'+capacity+'.json','utf8'));
            if(!r.result.accept)throw new Error('D25 regression at '+capacity);
            return {capacity,elapsedNs:Number(r.runtime.elapsedNs),elapsedMs:Number(r.runtime.elapsedNs)/1e6,storedKeyWords:r.runtime.memoStoredKeyWords};
          });
          const best=rows.reduce((a,b)=>a.elapsedNs<=b.elapsedNs?a:b);
          const result={schema:'connect4.cpc_nees_guard_kernel_memo_sweep_d25.v1',horizon:25,rows,bestCapacity:best.capacity,
            boundary:[
              'Same exact NEES kernel and proof grammar; only direct-map proof-memo capacity changes.',
              'Kernel elapsed time excludes cold ingress/preparation.',
              'Capacity selection is a performance tradeoff only and cannot change proof semantics.'
            ]};
          fs.writeFileSync(process.argv[2],JSON.stringify(result,null,2)+'\n');
          console.log(JSON.stringify(result,null,2));
          NODE
      - name: Commit durable D25 capacity evidence
        shell: bash
        run: |
          set -euo pipefail
          BRANCH=research/universal-structural-policy-20260930
          FILE=research/isograph/discovery/2026-09-30-universal-structural-policy/CPC_NEES_GUARD_KERNEL_MEMO_SWEEP_D25_0_1.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$FILE"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research: tune NEES D25 proof memo capacity"
          for attempt in 1 2 3; do
            git fetch origin "$BRANCH"
            git rebase --autostash "origin/$BRANCH"
            if git push origin HEAD:"$BRANCH"; then exit 0; fi
            sleep 1
          done
          exit 1
