name: IsoMax signed exchange role-depth quotient

on:
  push:
    branches:
      - experiment/isomax-late-xor-components-20260929
    paths:
      - '.github/workflows/isomax-signed-exchange-role-depth-quotient.yml'
      - 'research/isograph/discovery/2026-09-29-isomax-late-xor-components/ooo-pair-delta-index-lib.mjs'
      - 'research/isograph/discovery/2026-09-29-isomax-late-xor-components/ooo-pair-delta-index-lib.test.mjs'
      - 'research/isograph/discovery/2026-09-29-isomax-late-xor-components/run-ooo-signed-exchange-role-depth-quotient.mjs'
      - 'research/isograph/discovery/2026-09-29-isomax-late-xor-components/verify-ooo-signed-exchange-role-depth-quotient.mjs'
  workflow_dispatch:

concurrency:
  group: isomax-signed-exchange-role-depth-quotient
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 0}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with: {node-version: '26'}
      - name: Check RS-073 runner syntax
        run: node --check research/isograph/discovery/2026-09-29-isomax-late-xor-components/run-ooo-signed-exchange-role-depth-quotient.mjs
      - name: Test role-depth quotient semantics
        run: node --test research/isograph/discovery/2026-09-29-isomax-late-xor-components/ooo-pair-delta-index-lib.test.mjs
      - name: Run signed exchange role-depth quotient
        run: node --max-old-space-size=6144 research/isograph/discovery/2026-09-29-isomax-late-xor-components/run-ooo-signed-exchange-role-depth-quotient.mjs
      - name: Verify role-depth quotient result
        run: node research/isograph/discovery/2026-09-29-isomax-late-xor-components/verify-ooo-signed-exchange-role-depth-quotient.mjs
      - name: Research integrity
        run: node tools/verify-research-integrity.mjs
      - name: Commit role-depth quotient evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             research/isograph/discovery/2026-09-29-isomax-late-xor-components/OOO_SIGNED_EXCHANGE_ROLE_DEPTH_QUOTIENT_0_1.json             research/isograph/discovery/2026-09-29-isomax-late-xor-components/OOO_SIGNED_EXCHANGE_ROLE_DEPTH_QUOTIENT_RESULT_VERIFY_0_1.json
          if git diff --cached --quiet; then
            echo "No generated changes."
          else
            git commit -m "research(isomax): freeze signed exchange role-depth quotient"
            git pull --rebase origin experiment/isomax-late-xor-components-20260929
            git push origin HEAD:experiment/isomax-late-xor-components-20260929
          fi
