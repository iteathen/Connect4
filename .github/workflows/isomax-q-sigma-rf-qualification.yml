name: IsoMax q_sigmaRF qualification controls

on:
  push:
    branches:
      - qualification/isomax-q-sigma-rf-20260929
    paths:
      - '.github/workflows/isomax-q-sigma-rf-qualification.yml'
      - 'research/isograph/discovery/2026-09-29-isomax-q-sigma-rf-qualification/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 0}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with: {node-version: '26'}
      - name: Run independent q_sigmaRF cross-case audit
        run: node research/isograph/discovery/2026-09-29-isomax-q-sigma-rf-qualification/run-q-sigma-rf-cross-case-audit.mjs
      - name: Research integrity
        run: node tools/verify-research-integrity.mjs
      - name: Commit qualification evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/isograph/discovery/2026-09-29-isomax-q-sigma-rf-qualification/Q_SIGMA_RF_CROSS_CASE_AUDIT_0_1.json
          if git diff --cached --quiet; then echo "No generated changes."; else
            git commit -m "research(isomax): freeze q_sigmaRF qualification controls"
            git push origin HEAD:qualification/isomax-q-sigma-rf-20260929
          fi
