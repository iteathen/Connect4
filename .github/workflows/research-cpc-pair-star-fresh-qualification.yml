name: Research CPC pair-star fresh qualification

on:
  push:
    branches:
      - research/universal-structural-policy-20260930
    paths:
      - .github/workflows/research-cpc-pair-star-fresh-qualification.yml
      - research/isograph/discovery/2026-09-30-universal-structural-policy/CPC_PAIR_STAR_HUB_LADDER_THEOREM.md
      - research/isograph/discovery/2026-09-30-universal-structural-policy/run-cpc-pair-star-fresh-qualification.mjs

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact pushed revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Pin Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26.7.0

      - name: Verify frozen theorem on fresh structural controls
        shell: bash
        run: |
          set -euo pipefail
          OUT=research/isograph/discovery/2026-09-30-universal-structural-policy/CPC_PAIR_STAR_FRESH_QUALIFICATION_0_1.json
          node research/isograph/discovery/2026-09-30-universal-structural-policy/run-cpc-pair-star-fresh-qualification.mjs > "$OUT"
          node - "$OUT" <<'NODE'
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          console.log('CONTROLS='+r.controls.length);
          console.log('CORPUS='+JSON.stringify(r.corpus));
          console.log('GUARD_FAILURES='+JSON.stringify(r.retainedGuardFailures.map(x=>({
            sequence:x.sequence,
            hub:x.hub,
            columns:x.guard.defenderImmediateWinColumns
          }))));
          console.log('SAMPLE='+JSON.stringify(r.controls.slice(0,5).map(x=>({
            sequence:x.sequence,
            rank:x.rank,
            hub:x.hub,
            upperHub:x.upperHub,
            depth:x.depth,
            branchCount:x.branches.length
          }))));
          NODE

      - name: Commit durable fresh qualification
        shell: bash
        run: |
          set -euo pipefail
          BRANCH=research/universal-structural-policy-20260930
          FILE=research/isograph/discovery/2026-09-30-universal-structural-policy/CPC_PAIR_STAR_FRESH_QUALIFICATION_0_1.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$FILE"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research: qualify guarded CPC pair-star theorem"
          for attempt in 1 2 3; do
            git fetch origin "$BRANCH"
            git rebase "origin/$BRANCH"
            if git push origin HEAD:"$BRANCH"; then exit 0; fi
            sleep 1
          done
          exit 1
