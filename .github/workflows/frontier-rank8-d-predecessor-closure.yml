name: Frontier rank8 D predecessor closure

on:
  push:
    branches:
      - research/frontier-negamax-conformance
    paths:
      - research/semantic-quotient/state-identity-unification/src/quotient-standard7x6-rank8-d-predecessor-closure.mjs
      - research/semantic-quotient/state-identity-unification/src/quotient-standard7x6-rank9-full-reply-closure.mjs
      - .github/workflows/frontier-rank8-d-predecessor-closure.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26.7.0
      - name: Qualify rank8 D predecessor
        shell: bash
        run: |
          set -euo pipefail
          f="$RUNNER_TEMP/rank8-d.txt"
          timeout 270s node research/semantic-quotient/state-identity-unification/src/quotient-standard7x6-rank8-d-predecessor-closure.mjs | tee "$f"
          RESULT_FILE="$f" node <<'NODE'
          const fs=require('node:fs');
          const line=fs.readFileSync(process.env.RESULT_FILE,'utf8').split(/\r?\n/).find(x=>x.startsWith('RANK8_D_PREDECESSOR_CLOSURE='));
          if(!line) throw new Error('rank8 D predecessor summary missing');
          const x=JSON.parse(line.slice(line.indexOf('=')+1));
          if(x.proved!==true) throw new Error('rank8 D predecessor unproved');
          if(x.predecessor!=='46656555'||x.childSequence!=='466565554') throw new Error('rank8 exact state identity drift');
          if(x.witness!=='D') throw new Error('rank8 D witness drift');
          NODE
