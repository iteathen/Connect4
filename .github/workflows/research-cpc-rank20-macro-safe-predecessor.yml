name: Research rank20 macro-safe predecessor

on:
  push:
    branches:
      - research/universal-structural-policy-20260930
    paths:
      - .github/workflows/research-cpc-rank20-macro-safe-predecessor.yml
      - research/isograph/discovery/2026-09-30-universal-structural-policy/CPC_RANK20_MACRO_SINGLETON_SAFE_PREDECESSOR_DESIGN_0_1.md
      - research/isograph/discovery/2026-09-30-universal-structural-policy/test-cpc-rank20-macro-singleton-safe-predecessor.mjs
      - research/isograph/discovery/2026-09-30-universal-structural-policy/run-cpc-rank20-macro-singleton-safe-predecessor.mjs

permissions:
  contents: write

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact pushed revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Check out pinned JSMinSys authority
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: iteathen/JSMinSys
          ref: bf23d3a67652cd42e1975f29c7dc4eed54f7eb42
          path: .jsminsys
      - name: Pin Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26.7.0
      - name: Verify frozen macro-safe predecessor contract
        run: node research/isograph/discovery/2026-09-30-universal-structural-policy/test-cpc-rank20-macro-singleton-safe-predecessor.mjs "$GITHUB_WORKSPACE/.jsminsys"
      - name: Generate durable macro-safe predecessor evidence
        shell: bash
        run: |
          set -euo pipefail
          DIR=research/isograph/discovery/2026-09-30-universal-structural-policy
          OUT="$DIR/CPC_RANK20_MACRO_SINGLETON_SAFE_PREDECESSOR_0_1.json"
          node "$DIR/run-cpc-rank20-macro-singleton-safe-predecessor.mjs" "$GITHUB_WORKSPACE/.jsminsys" > "$OUT"
          node - "$OUT" <<'NODE'
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          if(r.candidateCount!==13)throw new Error('expected frozen 13-candidate family');
          if(r.oracleUsed!==false||r.solvedInputsUsed!==false||r.ordinaryFreeBranchGameTreeUsed!==false)throw new Error('proof boundary violated');
          if(r.productionCpcModified!==false||r.jsMinSysModified!==false||r.targetReservoirModified!==false||r.bsfpModified!==false)throw new Error('read-only boundary violated');
          console.log(JSON.stringify(r.summary));
          NODE
      - name: Commit durable macro-safe predecessor evidence
        shell: bash
        run: |
          set -euo pipefail
          BRANCH=research/universal-structural-policy-20260930
          FILE=research/isograph/discovery/2026-09-30-universal-structural-policy/CPC_RANK20_MACRO_SINGLETON_SAFE_PREDECESSOR_0_1.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$FILE"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research: record rank20 macro-safe predecessor"
          for attempt in 1 2 3; do
            git fetch origin "$BRANCH"
            git rebase --autostash "origin/$BRANCH"
            if git push origin HEAD:"$BRANCH"; then exit 0; fi
            sleep 1
          done
          exit 1
