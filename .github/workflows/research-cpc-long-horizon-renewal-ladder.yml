name: Research CPC long-horizon renewal ladder

on:
  push:
    branches:
      - research/universal-structural-policy-20260930
    paths:
      - .github/workflows/research-cpc-long-horizon-renewal-ladder.yml
      - research/isograph/discovery/2026-09-30-universal-structural-policy/run-cpc-long-horizon-renewal-ladder.mjs

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact pushed revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Pin Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26.7.0

      - name: Fetch pinned JSMinSys CPC/RBA authority
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/iteathen/JSMinSys.git jsminsys
          git -C jsminsys checkout 0899c5811918e68c22dc1b0e4dd8af97d9b4bbcb
          test "$(git -C jsminsys rev-parse HEAD)" = "0899c5811918e68c22dc1b0e4dd8af97d9b4bbcb"
          test -z "$(git -C jsminsys status --porcelain)"

      - name: Run semantic renewal ladder through horizon 15
        shell: bash
        run: |
          set -euo pipefail
          OUT=research/isograph/discovery/2026-09-30-universal-structural-policy/CPC_LONG_HORIZON_RENEWAL_LADDER_0_1.json
          node research/isograph/discovery/2026-09-30-universal-structural-policy/run-cpc-long-horizon-renewal-ladder.mjs ./jsminsys 15 > "$OUT"
          node - "$OUT" <<'NODE'
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          console.log('ROWS='+JSON.stringify(r.rows.map(x=>({
            id:x.id,
            maxCertified:x.maxCertified,
            ladder:x.ladder.map(y=>[y.horizon,y.accept,y.kind])
          }))));
          console.log('WORK='+JSON.stringify(r.work));
          if(r.work.budgetExceeded)process.exit(2);
          NODE

      - name: Commit durable renewal-ladder evidence
        shell: bash
        run: |
          set -euo pipefail
          BRANCH=research/universal-structural-policy-20260930
          FILE=research/isograph/discovery/2026-09-30-universal-structural-policy/CPC_LONG_HORIZON_RENEWAL_LADDER_0_1.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$FILE"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research: verify long-horizon CPC renewal ladder"
          for attempt in 1 2 3; do
            git fetch origin "$BRANCH"
            git rebase "origin/$BRANCH"
            if git push origin HEAD:"$BRANCH"; then exit 0; fi
            sleep 1
          done
          echo "failed to publish renewal-ladder evidence after retries" >&2
          exit 1
