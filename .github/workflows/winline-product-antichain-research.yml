name: winline-product-antichain-research

on:
  push:
    branches:
      - research/winline-product-antichain-final
    paths:
      - reference/research-prototypes/2026-09-10-identified-winline-quotient/product-antichain.mjs
      - .github/workflows/winline-product-antichain-research.yml

permissions:
  contents: read

jobs:
  exact-product-antichain:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26.7.0
      - run: node --version
      - name: Falsify line-hit product antichain
        run: node --expose-gc reference/research-prototypes/2026-09-10-identified-winline-quotient/product-antichain.mjs | tee winline-product-antichain-evidence.json
