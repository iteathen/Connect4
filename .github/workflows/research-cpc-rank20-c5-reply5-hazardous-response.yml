name: Research CPC rank20 c5 reply5 hazardous response predecessor diagnostic

concurrency:
  group: rank20-c5-reply5-hazardous-response-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - research/universal-structural-policy-20260930
    paths:
      - .github/workflows/research-cpc-rank20-c5-reply5-hazardous-response.yml
      - research/isograph/discovery/2026-09-30-universal-structural-policy/CPC_RANK20_C5_REPLY5_HAZARDOUS_RESPONSE_PREDECESSOR_DIAGNOSTIC_DESIGN_0_1.md
      - research/isograph/discovery/2026-09-30-universal-structural-policy/test-cpc-rank20-c5-reply5-hazardous-response-predecessor-diagnostic.mjs
      - research/isograph/discovery/2026-09-30-universal-structural-policy/run-cpc-rank20-c5-reply5-hazardous-response-predecessor-diagnostic.mjs
      - research/isograph/discovery/2026-09-30-universal-structural-policy/CPC_RANK20_C5_REPLY5_PARTIAL_RESERVOIR_EXACT_VALIDATION_PROBE_0_1.json
      - research/isograph/discovery/2026-09-30-universal-structural-policy/CPC_RANK20_C5_REPLY5_TARGET_RESERVOIR_REJECTION_LOCALIZATION_0_1.json

permissions:
  contents: write

jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26.7.0
      - name: Fetch pinned JSMinSys authority
        shell: bash
        run: |
          set -euo pipefail
          git clone -q https://github.com/iteathen/JSMinSys.git jsminsys
          git -C jsminsys checkout -q bf23d3a67652cd42e1975f29c7dc4eed54f7eb42
      - name: Verify frozen hazardous-response contract
        run: node research/isograph/discovery/2026-09-30-universal-structural-policy/test-cpc-rank20-c5-reply5-hazardous-response-predecessor-diagnostic.mjs ./jsminsys
      - name: Generate durable hazardous-response evidence
        shell: bash
        run: |
          set -euo pipefail
          DIR=research/isograph/discovery/2026-09-30-universal-structural-policy
          OUT="$DIR/CPC_RANK20_C5_REPLY5_HAZARDOUS_RESPONSE_PREDECESSOR_DIAGNOSTIC_0_1.json"
          node "$DIR/run-cpc-rank20-c5-reply5-hazardous-response-predecessor-diagnostic.mjs" ./jsminsys > "$OUT"
          node - "$OUT" <<'NODE'
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          console.log(JSON.stringify({
            candidateCount:r.candidates.length,
            cpcReroutePromisingCount:r.summary.cpcReroutePromisingCount,
            promising:r.summary.cpcReroutePromisingIds,
            recurrence:r.recurrence
          }));
          NODE
      - name: Commit durable hazardous-response evidence
        shell: bash
        run: |
          set -euo pipefail
          BRANCH=research/universal-structural-policy-20260930
          FILE=research/isograph/discovery/2026-09-30-universal-structural-policy/CPC_RANK20_C5_REPLY5_HAZARDOUS_RESPONSE_PREDECESSOR_DIAGNOSTIC_0_1.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$FILE"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research: record hazardous-response predecessor diagnostic"
          git pull --rebase origin "$BRANCH"
          git push origin HEAD:"$BRANCH"
