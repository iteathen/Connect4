name: Quotient standard 7x6 presearch profile

on:
  push:
    branches:
      - research/semantic-quotient
    paths:
      - 'research/semantic-quotient/state-identity-unification/src/quotient-standard7x6-presearch-profile.mjs'
      - '.github/workflows/semantic-quotient-standard7x6-presearch.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  MAX_DEPTH: '6'
  PROBE_DEPTH: '2'
  PREFIX_CLASSES: '4096'
  MAX_PROFILE_WORKERS: '8'

jobs:
  profile:
    name: Profile standard 7x6 shallow quotient work
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26.7.0
      - name: Run standard 7x6 presearch profile
        run: >-
          node --expose-gc --max-old-space-size=6144
          research/semantic-quotient/state-identity-unification/src/quotient-standard7x6-presearch-profile.mjs
