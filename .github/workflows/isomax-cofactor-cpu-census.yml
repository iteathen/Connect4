name: IsoMax Cofactor CPU Census

on:
  push:
    branches:
      - work/isomax-jsminsys-boundary-cleanup
    paths:
      - '.github/workflows/isomax-cofactor-cpu-census.yml'
  workflow_dispatch:

jobs:
  census:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          submodules: recursive
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '26.7.0'
          cache: npm
      - run: npm ci
      - name: Profile fused dense cofactor candidate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $candidate='7f0c47b0e38d37846ff73bcda699b4c8c4040545'
          git -C vendor/jsminsys cat-file -e "$candidate^{commit}" 2>$null
          if ($LASTEXITCODE -ne 0) {
            git -C vendor/jsminsys fetch --no-tags origin $candidate
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          git -C vendor/jsminsys checkout --detach $candidate
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $actual=(git -C vendor/jsminsys rev-parse HEAD).Trim()
          if ($actual -ne $candidate) { throw "JSMinSys HEAD mismatch: $actual != $candidate" }

          New-Item -ItemType Directory -Force cpu-profiles | Out-Null
          1..4 | ForEach-Object {
            $run=$_
            Write-Host "COFACTOR_CPU_CENSUS_RUN $run"
            node --experimental-ffi --cpu-prof --cpu-prof-interval=100 --cpu-prof-dir=cpu-profiles tools/bench-lazy-smp-control.mjs 7 2>&1 |
              Tee-Object -FilePath "cpu-profiles/run-$run.log"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          node tools/summarize-isomax-cpu-profiles.mjs cpu-profiles
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
