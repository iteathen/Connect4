name: Frontier repair-capacity induction

on:
  push:
    branches:
      - research/frontier-negamax-conformance
    paths:
      - research/semantic-quotient/state-identity-unification/src/quotient-standard7x6-repair-capacity-predecessor-induction.mjs
      - research/semantic-quotient/state-identity-unification/src/quotient-standard7x6-latent-contract-backward-composition.mjs
      - research/semantic-quotient/state-identity-unification/src/quotient-standard7x6-latent-winning-contract-closure.mjs
      - research/semantic-quotient/state-identity-unification/src/quotient-standard7x6-resolved-column-obligation-handoff.mjs
      - research/semantic-quotient/state-identity-unification/src/quotient-standard7x6-postblock-predecessor-routing.mjs
      - .github/workflows/frontier-repair-capacity-induction.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repair-capacity-induction:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      starts_proved: ${{ steps.induction.outputs.starts_proved }}
      starts_failed: ${{ steps.induction.outputs.starts_failed }}
      rank16_proved: ${{ steps.latent_closure.outputs.rank16_proved }}
      root_closed: ${{ steps.latent_closure.outputs.root_closed }}
      c_unresolved: ${{ steps.latent_closure.outputs.c_unresolved }}
      g_unresolved: ${{ steps.latent_closure.outputs.g_unresolved }}
      forced_defense: ${{ steps.obligation.outputs.forced_defense }}
      obligation_unresolved: ${{ steps.obligation.outputs.obligation_unresolved }}
      post_closed: ${{ steps.postblock.outputs.post_closed }}
      post_failed: ${{ steps.postblock.outputs.post_failed }}
      post_p1_terminal: ${{ steps.postblock.outputs.post_p1_terminal }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26.7.0
      - name: Qualify restricted repair-capacity predecessor induction
        id: induction
        shell: bash
        run: |
          set -euo pipefail
          f="$RUNNER_TEMP/repair-induction.txt"
          timeout 270s node research/semantic-quotient/state-identity-unification/src/quotient-standard7x6-repair-capacity-predecessor-induction.mjs | tee "$f"
          RESULT_FILE="$f" node <<'NODE'
          const fs=require('node:fs');
          const line=fs.readFileSync(process.env.RESULT_FILE,'utf8').split(/\r?\n/).find(x=>x.startsWith('REPAIR_CAPACITY_PREDECESSOR_INDUCTION='));
          if(!line) throw new Error('repair induction summary missing');
          const x=JSON.parse(line.slice(line.indexOf('=')+1));
          if(x.failedStartStates!==0||x.provedStartStates!==16) throw new Error('repair induction start closure regressed');
          fs.appendFileSync(process.env.GITHUB_OUTPUT,[`starts_proved=${x.provedStartStates}`,`starts_failed=${x.failedStartStates}`].join('\n')+'\n');
          NODE
      - name: Qualify latent-contract backward composition
        shell: bash
        run: timeout 270s node research/semantic-quotient/state-identity-unification/src/quotient-standard7x6-latent-contract-backward-composition.mjs
      - name: Qualify latent winning-contract closure
        id: latent_closure
        shell: bash
        run: |
          set -euo pipefail
          f="$RUNNER_TEMP/latent-winning-contract.txt"
          timeout 270s node research/semantic-quotient/state-identity-unification/src/quotient-standard7x6-latent-winning-contract-closure.mjs | tee "$f"
          RESULT_FILE="$f" node <<'NODE'
          const fs=require('node:fs');
          const line=fs.readFileSync(process.env.RESULT_FILE,'utf8').split(/\r?\n/).find(x=>x.startsWith('LATENT_WINNING_CONTRACT_CLOSURE='));
          if(!line) throw new Error('latent winning-contract summary missing');
          const x=JSON.parse(line.slice(line.indexOf('=')+1)); const c=x.targetMacros.find(m=>m.attack==='C'),g=x.targetMacros.find(m=>m.attack==='G');
          if(x.rank16SchedulerExitCount!==4||!c||!g) throw new Error('latent closure domain drift');
          fs.appendFileSync(process.env.GITHUB_OUTPUT,[`rank16_proved=${x.rank16SchedulerExitsProvedByRepairInduction}`,`root_closed=${x.rootClosedCandidateColumns.length}`,`c_unresolved=${c.unresolvedCount}`,`g_unresolved=${g.unresolvedCount}`].join('\n')+'\n');
          NODE
      - name: Qualify resolved-column obligation handoff
        id: obligation
        shell: bash
        run: |
          set -euo pipefail
          f="$RUNNER_TEMP/resolved-column-obligation.txt"
          timeout 270s node research/semantic-quotient/state-identity-unification/src/quotient-standard7x6-resolved-column-obligation-handoff.mjs | tee "$f"
          RESULT_FILE="$f" node <<'NODE'
          const fs=require('node:fs');
          const line=fs.readFileSync(process.env.RESULT_FILE,'utf8').split(/\r?\n/).find(x=>x.startsWith('RESOLVED_COLUMN_OBLIGATION_HANDOFF='));
          if(!line) throw new Error('resolved-column obligation summary missing');
          const x=JSON.parse(line.slice(line.indexOf('=')+1)); if(x.exactSurvivorStates!==12) throw new Error('obligation domain drift');
          fs.appendFileSync(process.env.GITHUB_OUTPUT,[`forced_defense=${x.forcedDefenseRows}`,`obligation_unresolved=${x.unresolvedCount}`].join('\n')+'\n');
          NODE
      - name: Qualify post-block predecessor routing
        id: postblock
        shell: bash
        run: |
          set -euo pipefail
          f="$RUNNER_TEMP/postblock-routing.txt"
          timeout 270s node research/semantic-quotient/state-identity-unification/src/quotient-standard7x6-postblock-predecessor-routing.mjs | tee "$f"
          RESULT_FILE="$f" node <<'NODE'
          const fs=require('node:fs');
          const line=fs.readFileSync(process.env.RESULT_FILE,'utf8').split(/\r?\n/).find(x=>x.startsWith('POSTBLOCK_PREDECESSOR_ROUTING='));
          if(!line) throw new Error('post-block routing summary missing');
          const x=JSON.parse(line.slice(line.indexOf('=')+1));
          if(x.exactRank18Rows!==84) throw new Error(`post-block domain drift ${x.exactRank18Rows}`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT,[`post_closed=${x.closedRank18Rows}`,`post_failed=${x.failedRank18Rows}`,`post_p1_terminal=${x.p1TerminalBeforeP0}`].join('\n')+'\n');
          NODE

  summary:
    needs: repair-capacity-induction
    name: repair-p${{ needs.repair-capacity-induction.outputs.starts_proved }} latent-r16${{ needs.repair-capacity-induction.outputs.rank16_proved }}-root${{ needs.repair-capacity-induction.outputs.root_closed }}-cu${{ needs.repair-capacity-induction.outputs.c_unresolved }}-gu${{ needs.repair-capacity-induction.outputs.g_unresolved }} obligation-f${{ needs.repair-capacity-induction.outputs.forced_defense }}-u${{ needs.repair-capacity-induction.outputs.obligation_unresolved }} post-c${{ needs.repair-capacity-induction.outputs.post_closed }}-f${{ needs.repair-capacity-induction.outputs.post_failed }}-pt${{ needs.repair-capacity-induction.outputs.post_p1_terminal }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - run: echo "qualified structural composition counts encoded in job name"
