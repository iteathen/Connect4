name: Frontier repair-capacity induction

on:
  push:
    branches:
      - research/frontier-negamax-conformance
    paths:
      - research/semantic-quotient/state-identity-unification/src/quotient-standard7x6-repair-capacity-predecessor-induction.mjs
      - research/semantic-quotient/state-identity-unification/src/quotient-standard7x6-latent-contract-backward-composition.mjs
      - research/semantic-quotient/state-identity-unification/src/quotient-standard7x6-latent-winning-contract-closure.mjs
      - research/semantic-quotient/state-identity-unification/src/quotient-standard7x6-resolved-column-obligation-handoff.mjs
      - research/semantic-quotient/state-identity-unification/src/quotient-standard7x6-postblock-typed-handoffs.mjs
      - research/semantic-quotient/state-identity-unification/src/quotient-standard7x6-repair-capacity-proof-lib.mjs
      - research/semantic-quotient/state-identity-unification/src/quotient-standard7x6-repair-proof-lib-conformance.mjs
      - .github/workflows/frontier-repair-capacity-induction.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repair-capacity-induction:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      starts_proved: ${{ steps.induction.outputs.starts_proved }}
      rank16_proved: ${{ steps.latent_closure.outputs.rank16_proved }}
      root_closed: ${{ steps.latent_closure.outputs.root_closed }}
      forced_defense: ${{ steps.obligation.outputs.forced_defense }}
      typed_closed: ${{ steps.typed.outputs.typed_closed }}
      typed_failed: ${{ steps.typed.outputs.typed_failed }}
      lib16: ${{ steps.lib.outputs.lib16 }}
      lib20: ${{ steps.lib.outputs.lib20 }}
      lib20_unique: ${{ steps.lib.outputs.lib20_unique }}
      lib_certified: ${{ steps.lib.outputs.lib_certified }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26.7.0
      - name: Qualify restricted repair-capacity predecessor induction
        id: induction
        shell: bash
        run: |
          set -euo pipefail
          f="$RUNNER_TEMP/repair-induction.txt"
          timeout 270s node research/semantic-quotient/state-identity-unification/src/quotient-standard7x6-repair-capacity-predecessor-induction.mjs | tee "$f"
          RESULT_FILE="$f" node <<'NODE'
          const fs=require('node:fs');
          const line=fs.readFileSync(process.env.RESULT_FILE,'utf8').split(/\r?\n/).find(x=>x.startsWith('REPAIR_CAPACITY_PREDECESSOR_INDUCTION='));
          if(!line) throw new Error('repair induction summary missing');
          const x=JSON.parse(line.slice(line.indexOf('=')+1));
          if(x.failedStartStates!==0||x.provedStartStates!==16) throw new Error('repair induction start closure regressed');
          fs.appendFileSync(process.env.GITHUB_OUTPUT,`starts_proved=${x.provedStartStates}\n`);
          NODE
      - name: Qualify latent-contract backward composition
        shell: bash
        run: timeout 270s node research/semantic-quotient/state-identity-unification/src/quotient-standard7x6-latent-contract-backward-composition.mjs
      - name: Qualify latent winning-contract closure classifier
        id: latent_closure
        shell: bash
        run: |
          set -euo pipefail
          f="$RUNNER_TEMP/latent-winning-contract.txt"
          timeout 270s node research/semantic-quotient/state-identity-unification/src/quotient-standard7x6-latent-winning-contract-closure.mjs | tee "$f"
          RESULT_FILE="$f" node <<'NODE'
          const fs=require('node:fs');
          const line=fs.readFileSync(process.env.RESULT_FILE,'utf8').split(/\r?\n/).find(x=>x.startsWith('LATENT_WINNING_CONTRACT_CLOSURE='));
          if(!line) throw new Error('latent winning-contract summary missing');
          const x=JSON.parse(line.slice(line.indexOf('=')+1)); if(x.rank16SchedulerExitCount!==4) throw new Error('latent closure domain drift');
          fs.appendFileSync(process.env.GITHUB_OUTPUT,[`rank16_proved=${x.rank16SchedulerExitsProvedByRepairInduction}`,`root_closed=${x.rootClosedCandidateColumns.length}`].join('\n')+'\n');
          NODE
      - name: Qualify resolved-column obligation handoff
        id: obligation
        shell: bash
        run: |
          set -euo pipefail
          f="$RUNNER_TEMP/resolved-column-obligation.txt"
          timeout 270s node research/semantic-quotient/state-identity-unification/src/quotient-standard7x6-resolved-column-obligation-handoff.mjs | tee "$f"
          RESULT_FILE="$f" node <<'NODE'
          const fs=require('node:fs');
          const line=fs.readFileSync(process.env.RESULT_FILE,'utf8').split(/\r?\n/).find(x=>x.startsWith('RESOLVED_COLUMN_OBLIGATION_HANDOFF='));
          if(!line) throw new Error('resolved-column obligation summary missing');
          const x=JSON.parse(line.slice(line.indexOf('=')+1)); if(x.exactSurvivorStates!==12) throw new Error('obligation domain drift');
          fs.appendFileSync(process.env.GITHUB_OUTPUT,`forced_defense=${x.forcedDefenseRows}\n`);
          NODE
      - name: Qualify typed post-block handoff classifier
        id: typed
        shell: bash
        run: |
          set -euo pipefail
          f="$RUNNER_TEMP/postblock-typed.txt"
          timeout 270s node research/semantic-quotient/state-identity-unification/src/quotient-standard7x6-postblock-typed-handoffs.mjs | tee "$f"
          RESULT_FILE="$f" node <<'NODE'
          const fs=require('node:fs');
          const line=fs.readFileSync(process.env.RESULT_FILE,'utf8').split(/\r?\n/).find(x=>x.startsWith('POSTBLOCK_TYPED_HANDOFFS='));
          if(!line) throw new Error('typed post-block summary missing');
          const x=JSON.parse(line.slice(line.indexOf('=')+1)); if(x.exactRank18States!==84) throw new Error('typed post-block domain drift');
          fs.appendFileSync(process.env.GITHUB_OUTPUT,[`typed_closed=${x.closedStates}`,`typed_failed=${x.failedStates}`].join('\n')+'\n');
          NODE
      - name: Qualify reusable repair proof certificate engine
        id: lib
        shell: bash
        run: |
          set -euo pipefail
          f="$RUNNER_TEMP/repair-proof-lib.txt"
          timeout 270s node research/semantic-quotient/state-identity-unification/src/quotient-standard7x6-repair-proof-lib-conformance.mjs | tee "$f"
          RESULT_FILE="$f" node <<'NODE'
          const fs=require('node:fs');
          const line=fs.readFileSync(process.env.RESULT_FILE,'utf8').split(/\r?\n/).find(x=>x.startsWith('REPAIR_PROOF_LIB_CONFORMANCE='));
          if(!line) throw new Error('repair proof lib conformance summary missing');
          const x=JSON.parse(line.slice(line.indexOf('=')+1));
          if(x.original16.proved!==16||x.original16.failed!==0||x.rank20.closed!==20||x.rank20.failed!==0) throw new Error('reusable repair proof engine closure regressed');
          fs.appendFileSync(process.env.GITHUB_OUTPUT,[
            `lib16=${x.original16.proved}`,
            `lib20=${x.rank20.closed}`,
            `lib20_unique=${x.rank20.uniqueRank20Keys}`,
            `lib_certified=${x.rank20.certifiedPairs}`,
          ].join('\n')+'\n');
          NODE

  summary:
    needs: repair-capacity-induction
    name: repair-p${{ needs.repair-capacity-induction.outputs.starts_proved }} old-r16${{ needs.repair-capacity-induction.outputs.rank16_proved }}-root${{ needs.repair-capacity-induction.outputs.root_closed }} obligation-f${{ needs.repair-capacity-induction.outputs.forced_defense }} typed-c${{ needs.repair-capacity-induction.outputs.typed_closed }}-f${{ needs.repair-capacity-induction.outputs.typed_failed }} lib16-${{ needs.repair-capacity-induction.outputs.lib16 }}-lib20-${{ needs.repair-capacity-induction.outputs.lib20 }}-u${{ needs.repair-capacity-induction.outputs.lib20_unique }}-cert${{ needs.repair-capacity-induction.outputs.lib_certified }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - run: echo "qualified reusable structural proof certificate counts encoded in job name"
