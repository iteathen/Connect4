name: Frontier rank9 C-reply kappa child probes

on:
  push:
    branches:
      - research/frontier-negamax-conformance
    paths:
      - research/semantic-quotient/state-identity-unification/src/quotient-standard7x6-rank9-c-reply-kappa-child-probe.mjs
      - .github/workflows/frontier-rank9-c-reply-kappa-child-probes.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        reply: [A, B, C, D, E, F, G]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26.7.0
      - name: Probe isolated post-G1 child
        shell: bash
        env:
          REPLY: ${{ matrix.reply }}
        run: |
          set -euo pipefail
          timeout 270s node research/semantic-quotient/state-identity-unification/src/quotient-standard7x6-rank9-c-reply-kappa-child-probe.mjs
