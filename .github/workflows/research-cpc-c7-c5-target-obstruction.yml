name: Research CPC c7 c5-target obstruction

on:
  push:
    branches:
      - research/universal-structural-policy-20260930
    paths:
      - .github/workflows/research-cpc-c7-c5-target-obstruction.yml
      - research/isograph/discovery/2026-09-30-universal-structural-policy/run-cpc-rank24-reply7-c7-c5-target-obstruction.mjs

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26.7.0
      - name: Fetch pinned JSMinSys authority
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/iteathen/JSMinSys.git jsminsys
          git -C jsminsys checkout bf23d3a67652cd42e1975f29c7dc4eed54f7eb42
          test -z "$(git -C jsminsys status --porcelain)"
      - name: Run c5-target obstruction probe
        shell: bash
        run: |
          set -euo pipefail
          DIR=research/isograph/discovery/2026-09-30-universal-structural-policy
          OUT="$DIR/CPC_RANK24_REPLY7_C7_C5_TARGET_OBSTRUCTION_0_1.json"
          node "$DIR/run-cpc-rank24-reply7-c7-c5-target-obstruction.mjs" ./jsminsys > "$OUT"
          node - "$OUT" <<'NODE'
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          if(r.oracleUsed!==false||r.solvedInputsUsed!==false||r.oracleValuesUsed!==false)
            throw new Error('forbidden solved/oracle evidence');
          console.log(JSON.stringify({
            state:r.state,
            examined:r.search.examinedTemplates,
            targetRoleTemplates:r.search.targetRoleTemplates,
            bestUncoveredCount:r.search.bestUncoveredCount,
            obstructionResidualIds:r.search.obstructionResidualIds,
            best:r.search.bestTemplates.slice(0,3)
          }));
          NODE
      - name: Commit durable obstruction evidence
        shell: bash
        run: |
          set -euo pipefail
          BRANCH=research/universal-structural-policy-20260930
          FILE=research/isograph/discovery/2026-09-30-universal-structural-policy/CPC_RANK24_REPLY7_C7_C5_TARGET_OBSTRUCTION_0_1.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$FILE"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research: record c7 c5-target obstruction"
          for attempt in 1 2 3; do
            git fetch origin "$BRANCH"
            git rebase --autostash "origin/$BRANCH"
            if git push origin HEAD:"$BRANCH"; then exit 0; fi
            sleep 1
          done
          exit 1
