name: Research rank-local post-response transport

on:
  push:
    branches:
      - research/universal-structural-policy-20260930
    paths:
      - .github/workflows/research-rank-local-post-response-transport.yml
      - research/isograph/discovery/2026-09-30-universal-structural-policy/RANK_LOCAL_POST_RESPONSE_TRANSPORT_THEOREM.md
      - research/isograph/discovery/2026-09-30-universal-structural-policy/run-rank-local-post-response-transport.mjs

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact pushed revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Pin Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26.7.0

      - name: Assert exact Node runtime
        run: node -e "if (process.version !== 'v26.7.0') throw new Error('expected Node v26.7.0, got ' + process.version)"

      - name: Verify exact transport and residual regeneration
        shell: bash
        run: |
          set -euo pipefail
          OUT=/tmp/RANK_LOCAL_POST_RESPONSE_TRANSPORT_CONTROL_0_1.json
          node research/isograph/discovery/2026-09-30-universal-structural-policy/run-rank-local-post-response-transport.mjs > "$OUT"
          node - "$OUT" <<'NODE'
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          console.log('ORACLE_USED='+r.oracleUsed);
          console.log('C6_TRANSPORT='+JSON.stringify(r.candidate6.forcedFragments.map(f=>({
            setup:f.setupColumn,
            forced:f.forcedBlockColumn,
            n:f.consumption,
            tau:f.tau,
            d:f.derivativeAfter,
            attackerLive:f.residuals.attacker.fullLiveLines,
            defenderLive:f.residuals.defender.fullLiveLines
          }))));
          console.log('ATTACKER_MIN_DIFF='+JSON.stringify(r.candidate6.attackerMinimalResidualComparison));
          console.log('DEFENDER_MIN_DIFF='+JSON.stringify(r.candidate6.defenderMinimalResidualComparison));
          NODE

      - name: Confirm durable sibling transport evidence exists
        shell: bash
        run: |
          set -euo pipefail
          test -s research/isograph/discovery/2026-09-30-universal-structural-policy/POST_RESPONSE_TRANSPORT_CONTROL_0_1.json
