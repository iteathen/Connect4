name: Research CPC rank24 exchange pair existing route census

concurrency:
  group: rank24-exchange-pair-route-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - research/universal-structural-policy-20260930
    paths:
      - .github/workflows/research-cpc-rank24-exchange-pair-route-census.yml
      - research/isograph/discovery/2026-09-30-universal-structural-policy/CPC_RANK24_EXCHANGE_PAIR_EXISTING_ROUTE_CENSUS_DESIGN_0_1.md
      - research/isograph/discovery/2026-09-30-universal-structural-policy/test-cpc-rank24-exchange-pair-existing-route-census.mjs
      - research/isograph/discovery/2026-09-30-universal-structural-policy/run-cpc-rank24-exchange-pair-existing-route-census.mjs
      - research/isograph/discovery/2026-09-30-universal-structural-policy/CPC_RANK20_C5_REPLY5_FORCED_MACRO_CONVERGENCE_PROBE_0_1.json

permissions:
  contents: write

jobs:
  census:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26.7.0
      - name: Fetch pinned JSMinSys authority
        shell: bash
        run: |
          set -euo pipefail
          git clone -q https://github.com/iteathen/JSMinSys.git jsminsys
          git -C jsminsys checkout -q bf23d3a67652cd42e1975f29c7dc4eed54f7eb42
      - name: Verify frozen exchange-pair census contract
        run: node research/isograph/discovery/2026-09-30-universal-structural-policy/test-cpc-rank24-exchange-pair-existing-route-census.mjs ./jsminsys
      - name: Generate durable exchange-pair route evidence
        shell: bash
        run: |
          set -euo pipefail
          DIR=research/isograph/discovery/2026-09-30-universal-structural-policy
          OUT="$DIR/CPC_RANK24_EXCHANGE_PAIR_EXISTING_ROUTE_CENSUS_0_1.json"
          node "$DIR/run-cpc-rank24-exchange-pair-existing-route-census.mjs" ./jsminsys > "$OUT"
          node - "$OUT" <<'NODE'
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          console.log(JSON.stringify({
            states:r.states.map(x=>({
              name:x.name,
              best:x.summary.bestCandidateColumns,
              bestUnresolvedCount:x.summary.bestUnresolvedCount,
              fullyRouted:x.summary.fullyRoutedCandidateColumns
            })),
            compositionReady:r.compositionReady
          }));
          NODE
      - name: Commit durable exchange-pair route evidence
        shell: bash
        run: |
          set -euo pipefail
          BRANCH=research/universal-structural-policy-20260930
          FILE=research/isograph/discovery/2026-09-30-universal-structural-policy/CPC_RANK24_EXCHANGE_PAIR_EXISTING_ROUTE_CENSUS_0_1.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$FILE"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research: record rank24 exchange-pair route census"
          git pull --rebase origin "$BRANCH"
          git push origin HEAD:"$BRANCH"
