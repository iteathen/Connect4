name: Research CPC rank20 rank32 forced obligation loss census

concurrency:
  group: rank20-rank32-forced-obligation-loss-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [research/universal-structural-policy-20260930]
    paths:
      - .github/workflows/research-cpc-rank20-rank32-forced-obligation-loss.yml
      - research/isograph/discovery/2026-09-30-universal-structural-policy/CPC_RANK20_RANK32_FORCED_OBLIGATION_LOSS_CENSUS_DESIGN_0_1.md
      - research/isograph/discovery/2026-09-30-universal-structural-policy/test-cpc-rank20-rank32-forced-obligation-loss-census.mjs
      - research/isograph/discovery/2026-09-30-universal-structural-policy/run-cpc-rank20-rank32-forced-obligation-loss-census.mjs
      - research/isograph/discovery/2026-09-30-universal-structural-policy/CPC_RANK20_FORCED_C3_RANK5_LOCAL_GRAMMAR_PROBE_0_1.json
      - research/isograph/discovery/2026-09-30-universal-structural-policy/CPC_RANK20_RANK32_CONSEQUENCE_EXCHANGE_CENSUS_0_1.json
      - research/semantic-quotient/state-identity-unification/src/quotient-standard7x6-repair-capacity-proof-lib.mjs

permissions:
  contents: write

jobs:
  census:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {fetch-depth: 0}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: {node-version: 26.7.0}
      - name: Verify forced-obligation loss contract
        run: node research/isograph/discovery/2026-09-30-universal-structural-policy/test-cpc-rank20-rank32-forced-obligation-loss-census.mjs
      - name: Generate durable forced-obligation loss evidence
        shell: bash
        run: |
          set -euo pipefail
          DIR=research/isograph/discovery/2026-09-30-universal-structural-policy
          OUT="$DIR/CPC_RANK20_RANK32_FORCED_OBLIGATION_LOSS_CENSUS_0_1.json"
          node "$DIR/run-cpc-rank20-rank32-forced-obligation-loss-census.mjs" > "$OUT"
          node - "$OUT" <<'NODE'
          const fs=require('fs');const r=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          console.log(JSON.stringify({
            summary:r.summary,
            rank32Losses:r.rank32Classes.filter(x=>x.lossCertified).map(x=>({q:x.exactQClass,kind:x.proofKind,obligations:x.rootObligations})),
            rank30Losses:r.sourceLeaves.filter(x=>x.fullyActionEliminated).map(x=>({leaf:x.sourceLeafId,actions:x.rootActions}))
          }));
          NODE
      - name: Commit durable forced-obligation loss evidence
        shell: bash
        run: |
          set -euo pipefail
          BRANCH=research/universal-structural-policy-20260930
          FILE=research/isograph/discovery/2026-09-30-universal-structural-policy/CPC_RANK20_RANK32_FORCED_OBLIGATION_LOSS_CENSUS_0_1.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$FILE"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research: record rank32 forced-obligation losses"
          git pull --rebase origin "$BRANCH"
          git push origin HEAD:"$BRANCH"
