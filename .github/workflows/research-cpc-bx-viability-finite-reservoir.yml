name: Research CPC Bx viability finite reservoir

on:
  push:
    branches:
      - research/universal-structural-policy-20260930
    paths:
      - .github/workflows/research-cpc-bx-viability-finite-reservoir.yml
      - research/isograph/discovery/2026-09-30-universal-structural-policy/run-cpc-bx-viability-finite-reservoir.mjs
      - research/isograph/discovery/2026-09-30-universal-structural-policy/CPC_BX_VIABILITY_FINITE_RESERVOIR_THEOREM.md

permissions:
  contents: write

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact pushed revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Pin Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26.7.0
      - name: Qualify Bx viability composition
        shell: bash
        run: |
          set -euo pipefail
          DIR=research/isograph/discovery/2026-09-30-universal-structural-policy
          OUT="$DIR/CPC_BX_VIABILITY_FINITE_RESERVOIR_0_1.json"
          node "$DIR/run-cpc-bx-viability-finite-reservoir.mjs" > "$OUT"
          node - "$OUT" <<'NODE'
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          if(r.oracleUsed!==false||r.solvedInputsUsed!==false)throw new Error('forbidden solved evidence flag');
          if(r.accept!==true||r.induction.rootProved!==true)throw new Error('Bx viability theorem rejected');
          for(const c of r.checks)if(!c.ok)throw new Error('failed transition '+JSON.stringify(c));
          console.log(JSON.stringify({
            accept:r.accept,
            invariant:r.invariant,
            stateInfo:r.stateInfo,
            induction:r.induction
          }));
          NODE
      - name: Commit durable theorem evidence
        shell: bash
        run: |
          set -euo pipefail
          BRANCH=research/universal-structural-policy-20260930
          FILE=research/isograph/discovery/2026-09-30-universal-structural-policy/CPC_BX_VIABILITY_FINITE_RESERVOIR_0_1.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$FILE"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research: record Bx viability finite reservoir theorem"
          for attempt in 1 2 3; do
            git fetch origin "$BRANCH"
            git rebase --autostash "origin/$BRANCH"
            if git push origin HEAD:"$BRANCH"; then exit 0; fi
            sleep 1
          done
          exit 1
