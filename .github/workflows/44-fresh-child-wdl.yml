name: Fresh rule-only 44 child WDL

on:
  workflow_dispatch:
  push:
    branches:
      - research/44-geometry-blind-20260928
    paths:
      - "research/isograph/discovery/2026-09-28-44-geometry-blind/fresh-isomax-child.mjs"
      - ".github/workflows/44-fresh-child-wdl.yml"

permissions:
  contents: read

jobs:
  child:
    strategy:
      fail-fast: false
      matrix:
        sequence: ["441","442","443","444"]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: connect4
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: iteathen/JSMinSys
          ref: 6bbba7c71c60afb1018a22b6d5c03f495f5d2c9e
          path: connect4/jsminsys
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "26.7.0"
      - name: Guard source against solved-data inputs
        working-directory: connect4
        run: |
          set -euo pipefail
          ! grep -E "reference/oracles|openingbook|bdd_w7_h6|solution_w7_h6|solved-actions" research/isograph/discovery/2026-09-28-44-geometry-blind/fresh-isomax-child.mjs
      - name: Solve child from rules
        working-directory: connect4
        env:
          SEQUENCE: ${{ matrix.sequence }}
        run: node research/isograph/discovery/2026-09-28-44-geometry-blind/fresh-isomax-child.mjs > child-${{ matrix.sequence }}.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: connect4-44-child-${{ matrix.sequence }}
          path: connect4/child-${{ matrix.sequence }}.json
          if-no-files-found: warn
