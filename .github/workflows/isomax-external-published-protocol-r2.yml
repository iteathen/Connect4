name: isomax-external-published-protocol-r2

on:
  push:
    branches:
      - experiment/isomax-external-calibration-r2
    paths:
      - '.github/workflows/isomax-external-published-protocol-r2.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: isomax-external-published-protocol-r2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  published-protocol-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PONS_SHA: d6ba50d8aaf2308c769d9bf2abd42d90f34baf41
      BEN_SHA: 28a112adaf3ff89ee23fb09411fa592b6597010e
    steps:
      - name: Setup exact Node runtime for summary
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26.7.0

      - name: Record runner and fetch exact external sources
        shell: bash
        run: |
          set -euo pipefail
          echo '=== PUBLISHED_CALIBRATION_ENV ==='
          uname -a
          echo "nproc=$(nproc)"
          lscpu
          echo "node=$(node --version)"
          echo "gcc=$(gcc --version | head -1)"
          echo "g++=$(g++ --version | head -1)"
          echo "rustc=$(rustc --version)"
          echo "cargo=$(cargo --version)"
          echo "git=$(git --version)"
          git -c credential.helper= clone --no-tags https://github.com/PascalPons/connect4.git "$RUNNER_TEMP/pons"
          git -C "$RUNNER_TEMP/pons" checkout --detach "$PONS_SHA"
          test "$(git -C "$RUNNER_TEMP/pons" rev-parse HEAD)" = "$PONS_SHA"
          git -c credential.helper= clone --no-tags https://github.com/benjaminrall/connect-four-ai.git "$RUNNER_TEMP/ben"
          git -C "$RUNNER_TEMP/ben" checkout --detach "$BEN_SHA"
          test "$(git -C "$RUNNER_TEMP/ben" rev-parse HEAD)" = "$BEN_SHA"
          echo "pons=$(git -C "$RUNNER_TEMP/pons" rev-parse HEAD)"
          echo "ben=$(git -C "$RUNNER_TEMP/ben" rev-parse HEAD)"
          sha256sum "$RUNNER_TEMP/ben/crates/test-data/end-easy" \
                    "$RUNNER_TEMP/ben/crates/test-data/middle-easy" \
                    "$RUNNER_TEMP/ben/crates/test-data/begin-easy"

      - name: Build exact Pascal weak and Ben no-book harnesses
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/pons-protocol.cpp" <<'CPP'
          #include "Solver.hpp"
          #include <chrono>
          #include <fstream>
          #include <iostream>
          #include <sstream>
          #include <string>
          using namespace GameSolver::Connect4;
          int main(int argc, char** argv) {
            if (argc != 2) return 2;
            std::ifstream input(argv[1]);
            if (!input) return 3;
            Solver solver;
            unsigned long long nodes = 0, count = 0, correct = 0;
            long long ns = 0;
            std::string line;
            while (std::getline(input, line)) {
              if (line.empty()) continue;
              std::istringstream in(line);
              std::string moves; int expected = 0;
              if (!(in >> moves >> expected)) return 4;
              Position p; if (p.play(moves) != moves.size()) return 5;
              solver.reset();
              const auto t0 = std::chrono::steady_clock::now();
              const int score = solver.solve(p, true);
              ns += std::chrono::duration_cast<std::chrono::nanoseconds>(std::chrono::steady_clock::now() - t0).count();
              const int want = expected > 0 ? 1 : expected < 0 ? -1 : 0;
              const int got = score > 0 ? 1 : score < 0 ? -1 : 0;
              correct += got == want;
              nodes += solver.getNodeCount();
              ++count;
            }
            std::cout << "RESULT pons " << argv[1] << ' ' << count << ' ' << correct << ' ' << nodes << ' ' << ns << '\n';
            return correct == count ? 0 : 6;
          }
          CPP
          g++ --std=c++11 -O3 -DNDEBUG -W -Wall -I "$RUNNER_TEMP/pons" \
            "$RUNNER_TEMP/pons-protocol.cpp" "$RUNNER_TEMP/pons/Solver.cpp" -o "$RUNNER_TEMP/pons-protocol"

          cat > "$RUNNER_TEMP/ben/crates/core/src/bin/calibrate_nobook.rs" <<'RS'
          use connect_four_ai::{Position, Solver};
          use std::{env, fs::File, io::{BufRead, BufReader}, time::Instant};
          fn main() {
              let path = env::args().nth(1).expect("data path");
              let mut solver = Solver::empty();
              let mut count=0u64; let mut correct=0u64; let mut nodes=0u64; let mut ns=0u128;
              for line in BufReader::new(File::open(&path).expect("open data")).lines() {
                  let line=line.expect("line"); if line.trim().is_empty(){continue}
                  let mut f=line.split_whitespace();
                  let moves=f.next().expect("moves"); let expected:i8=f.next().expect("expected").parse().expect("score");
                  let p=Position::from_moves(moves).expect("position"); solver.reset();
                  let t0=Instant::now(); let actual=solver.solve(&p); ns+=t0.elapsed().as_nanos();
                  nodes+=solver.explored_positions as u64; count+=1; correct+=(actual==expected) as u64;
              }
              println!("RESULT ben {} {} {} {} {}",path,count,correct,nodes,ns);
              if correct!=count { std::process::exit(6); }
          }
          RS
          cargo build --manifest-path "$RUNNER_TEMP/ben/crates/core/Cargo.toml" --target-dir "$RUNNER_TEMP/ben-target" \
            --release --locked --bin calibrate_nobook
          echo '=== BUILD_FLAGS ==='
          echo 'PascalPons: g++ --std=c++11 -O3 -DNDEBUG -W -Wall; weak solve; reset before timed solve'
          echo 'connect-four-ai: cargo build --release --locked; Solver::empty(); strong solve; reset before timed solve'

      - name: Published-protocol interleaved samples
        shell: bash
        run: |
          set -euo pipefail
          run_pons(){ local d="$1" r="$2"; /usr/bin/time -v -o "$RUNNER_TEMP/pons-${d}-${r}.time" "$RUNNER_TEMP/pons-protocol" "$RUNNER_TEMP/ben/crates/test-data/$d" | tee "$RUNNER_TEMP/pons-${d}-${r}.out"; }
          run_ben(){ local d="$1" r="$2"; /usr/bin/time -v -o "$RUNNER_TEMP/ben-${d}-${r}.time" "$RUNNER_TEMP/ben-target/release/calibrate_nobook" "$RUNNER_TEMP/ben/crates/test-data/$d" | tee "$RUNNER_TEMP/ben-${d}-${r}.out"; }
          for d in end-easy middle-easy begin-easy; do
            echo "=== ${d} ROUND1 PONS BEN ==="; run_pons "$d" 1; run_ben "$d" 1
            echo "=== ${d} ROUND2 BEN PONS ==="; run_ben "$d" 2; run_pons "$d" 2
            echo "=== ${d} ROUND3 PONS BEN ==="; run_pons "$d" 3; run_ben "$d" 3
            for solver in pons ben; do for r in 1 2 3; do echo "=== TIME ${solver} ${d} ${r} ==="; cat "$RUNNER_TEMP/${solver}-${d}-${r}.time"; done; done
          done

      - name: Summarize published-protocol runner ratios
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const dir=process.env.RUNNER_TEMP;
          const datasets=['end-easy','middle-easy','begin-easy'];
          const published={pons:{'end-easy':3.217,'middle-easy':47.73,'begin-easy':3332},ben:{'end-easy':3.32,'middle-easy':32.2,'begin-easy':222}};
          const parse=(s,d,r)=>{const line=fs.readFileSync(`${dir}/${s}-${d}-${r}.out`,'utf8').trim().split(/\n+/).find(x=>x.startsWith('RESULT ')); if(!line)throw new Error(`missing ${s}/${d}/${r}`); const f=line.split(/\s+/); const count=+f.at(-4),correct=+f.at(-3),nodes=+f.at(-2),ns=+f.at(-1); return {count,correct,nodes,meanUs:ns/count/1000};};
          const out={kind:'published-protocol-runner-calibration',datasets:{}};
          for(const d of datasets){out.datasets[d]={}; for(const s of ['pons','ben']){const xs=[1,2,3].map(r=>parse(s,d,r)); const mean=xs.reduce((a,x)=>a+x.meanUs,0)/3; const pub=published[s][d]; out.datasets[d][s]={publishedMeanUs:pub,runnerSamplesMeanUs:xs.map(x=>x.meanUs),runnerMeanUs:mean,runnerMinUs:Math.min(...xs.map(x=>x.meanUs)),runnerMaxUs:Math.max(...xs.map(x=>x.meanUs)),runnerToPublished:mean/pub,nodesPerPosition:xs[0].nodes/xs[0].count,correct:xs.every(x=>x.correct===x.count)};}}
          console.log('=== PUBLISHED_PROTOCOL_SUMMARY ==='); console.log(JSON.stringify(out));
          NODE
