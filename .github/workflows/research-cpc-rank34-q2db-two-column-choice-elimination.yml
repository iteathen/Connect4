name: Research CPC rank34 q2db two-column choice elimination

concurrency:
  group: rank34-q2db-two-column-\${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [research/universal-structural-policy-20260930]
    paths:
      - .github/workflows/research-cpc-rank34-q2db-two-column-choice-elimination.yml
      - research/isograph/discovery/2026-09-30-universal-structural-policy/CPC_RANK34_Q2DB_TWO_COLUMN_CHOICE_ELIMINATION_DESIGN_0_1.md
      - research/isograph/discovery/2026-09-30-universal-structural-policy/test-cpc-rank34-q2db-two-column-choice-elimination.mjs
      - research/isograph/discovery/2026-09-30-universal-structural-policy/run-cpc-rank34-q2db-two-column-choice-elimination.mjs
      - research/isograph/discovery/2026-09-30-universal-structural-policy/CPC_Q2DB_TWO_COLUMN_TERMINAL_EXPOSURE_0_1.json

permissions:
  contents: write

jobs:
  compose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {fetch-depth: 0}
      - name: Check out pinned JSMinSys authority
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: iteathen/JSMinSys
          ref: bf23d3a67652cd42e1975f29c7dc4eed54f7eb42
          path: .jsminsys
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: {node-version: 26.7.0}
      - name: Verify frozen q2db composition contract
        run: node research/isograph/discovery/2026-09-30-universal-structural-policy/test-cpc-rank34-q2db-two-column-choice-elimination.mjs "$GITHUB_WORKSPACE/.jsminsys"
      - name: Generate durable q2db composition evidence
        shell: bash
        run: |
          set -euo pipefail
          DIR=research/isograph/discovery/2026-09-30-universal-structural-policy
          OUT="$DIR/CPC_RANK34_Q2DB_TWO_COLUMN_CHOICE_ELIMINATION_0_1.json"
          node "$DIR/run-cpc-rank34-q2db-two-column-choice-elimination.mjs" "$GITHUB_WORKSPACE/.jsminsys" > "$OUT"
          node - "$OUT" <<'NODE'
          const fs=require('fs');const r=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          console.log(JSON.stringify({
            classification:r.classification,
            actions:r.actions.map(x=>({p0Column:x.p0Column,disposition:x.disposition,replies:x.replies.map(y=>({reply:y.replyColumn,q:y.exactQClass,disposition:y.disposition,routes:y.positiveCertificates.map(z=>z.kind)}))})),
            summary:r.summary
          }));
          NODE
      - name: Commit durable q2db composition evidence
        shell: bash
        run: |
          set -euo pipefail
          BRANCH=research/universal-structural-policy-20260930
          FILE=research/isograph/discovery/2026-09-30-universal-structural-policy/CPC_RANK34_Q2DB_TWO_COLUMN_CHOICE_ELIMINATION_0_1.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$FILE"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research: record q2db two-column choice elimination"
          git pull --rebase origin "$BRANCH"
          git push origin HEAD:"$BRANCH"
