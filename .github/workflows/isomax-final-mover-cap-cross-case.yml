name: IsoMax final-mover cap cross-case

on:
  push:
    branches:
      - experiment/isomax-final-mover-cap-closure-20260929
    paths:
      - '.github/workflows/isomax-final-mover-cap-cross-case.yml'
      - 'research/isograph/discovery/2026-09-29-isomax-final-mover-cap-closure/run-final-mover-cap-cross-case.mjs'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 0}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with: {node-version: '26'}
      - name: Run final-mover cap cross-case audit
        run: node research/isograph/discovery/2026-09-29-isomax-final-mover-cap-closure/run-final-mover-cap-cross-case.mjs
      - name: Research integrity
        run: node tools/verify-research-integrity.mjs
      - name: Commit cross-case evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/isograph/discovery/2026-09-29-isomax-final-mover-cap-closure/FINAL_MOVER_CAP_CROSS_CASE_0_1.json
          if git diff --cached --quiet; then echo "No generated changes."; else
            git commit -m "research(isomax): freeze final-mover cap cross-case evidence"
            git push origin HEAD:experiment/isomax-final-mover-cap-closure-20260929
          fi
