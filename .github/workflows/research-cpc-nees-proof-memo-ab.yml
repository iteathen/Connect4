name: Research NEES guard proof memo A-B

on:
  push:
    branches:
      - research/universal-structural-policy-20260930
    paths:
      - .github/workflows/research-cpc-nees-proof-memo-ab.yml
      - research/isograph/discovery/2026-09-30-universal-structural-policy/run-cpc-guard-set-nees-proof-memo-target.mjs
      - research/isograph/discovery/2026-09-30-universal-structural-policy/run-cpc-current-state-guard-set-rba-words-key-target.mjs

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact pushed revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Pin Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26.7.0
      - name: Fetch baseline and NEES JSMinSys revisions
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/iteathen/JSMinSys.git jsminsys-base
          git -C jsminsys-base checkout 0899c5811918e68c22dc1b0e4dd8af97d9b4bbcb
          git clone --branch research/cpc-guard-proof-memo-nees-v1 --single-branch https://github.com/iteathen/JSMinSys.git jsminsys-nees
          git -C jsminsys-nees checkout e958c210deed02d452f6421006b83d0f143ad312
      - name: A-B D19 baseline versus typed proof memo
        shell: bash
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: |
          set -euo pipefail
          DIR=research/isograph/discovery/2026-09-30-universal-structural-policy
          /usr/bin/time -f 'wall=%e\nmaxrss_kb=%M\nuser=%U\nsys=%S' -o /tmp/base.time \
            node "$DIR/run-cpc-current-state-guard-set-rba-words-key-target.mjs" ./jsminsys-base 19 > /tmp/base.json
          /usr/bin/time -f 'wall=%e\nmaxrss_kb=%M\nuser=%U\nsys=%S' -o /tmp/nees.time \
            node "$DIR/run-cpc-guard-set-nees-proof-memo-target.mjs" ./jsminsys-nees 19 > /tmp/nees.json
          node - /tmp/base.json /tmp/nees.json /tmp/base.time /tmp/nees.time "$DIR/CPC_NEES_PROOF_MEMO_AB_D19_0_1.json" <<'NODE'
          const fs=require('fs');
          const [basePath,neesPath,bt,nt,out]=process.argv.slice(2);
          const parseTime=p=>Object.fromEntries(fs.readFileSync(p,'utf8').trim().split(/\n/).map(x=>x.split('=')));
          const base=JSON.parse(fs.readFileSync(basePath,'utf8'));
          const nees=JSON.parse(fs.readFileSync(neesPath,'utf8'));
          if(!base.result.accept||!nees.result.accept)throw new Error('D19 acceptance regression');
          const b=parseTime(bt),n=parseTime(nt);
          const result={
            schema:'connect4.cpc_nees_proof_memo_ab.v1',
            baselineSha:'0899c5811918e68c22dc1b0e4dd8af97d9b4bbcb',
            neesSha:'e958c210deed02d452f6421006b83d0f143ad312',
            horizon:19,
            baseline:{wallSeconds:Number(b.wall),maxRssKb:Number(b.maxrss_kb),work:base.work,result:base.result},
            nees:{wallSeconds:Number(n.wall),maxRssKb:Number(n.maxrss_kb),work:nees.work,result:nees.result},
            ratios:{
              wall:Number(n.wall)/Number(b.wall),
              maxRss:Number(n.maxrss_kb)/Number(b.maxrss_kb)
            },
            boundary:[
              'Same GitHub runner job and Node 26.7.0 profile; baseline uses Map/base64 class memo, NEES variant uses fixed typed-array exact RBA proof memo.',
              'Proof grammar, RBA cofactors, response rules, and horizon are unchanged.',
              'Wall/RSS are governing-unit evidence for this proof computation; cycle-ledger accounting remains in JSMinSys.'
            ]
          };
          fs.writeFileSync(out,JSON.stringify(result,null,2)+'\n');
          console.log(JSON.stringify(result,null,2));
          NODE
      - name: Verify NEES typed memo at D25
        shell: bash
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: |
          set -euo pipefail
          DIR=research/isograph/discovery/2026-09-30-universal-structural-policy
          OUT="$DIR/CPC_NEES_PROOF_MEMO_D25_0_1.json"
          /usr/bin/time -f 'NEES_D25 wall=%e maxrss_kb=%M user=%U sys=%S' \
            timeout 900 node "$DIR/run-cpc-guard-set-nees-proof-memo-target.mjs" ./jsminsys-nees 25 > "$OUT"
          node - "$OUT" <<'NODE'
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          if(!r.result.accept)throw new Error('NEES typed memo failed established D25');
          console.log('NEES_D25='+JSON.stringify({result:r.result,work:r.work}));
          NODE
      - name: Commit durable NEES memo evidence
        shell: bash
        run: |
          set -euo pipefail
          BRANCH=research/universal-structural-policy-20260930
          DIR=research/isograph/discovery/2026-09-30-universal-structural-policy
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$DIR/CPC_NEES_PROOF_MEMO_AB_D19_0_1.json" "$DIR/CPC_NEES_PROOF_MEMO_D25_0_1.json"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research: qualify NEES typed proof memo"
          for attempt in 1 2 3; do
            git fetch origin "$BRANCH"
            git rebase --autostash "origin/$BRANCH"
            if git push origin HEAD:"$BRANCH"; then exit 0; fi
            sleep 1
          done
          exit 1
