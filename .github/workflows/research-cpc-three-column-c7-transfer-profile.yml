name: Research CPC three-column c7 transfer profile

on:
  push:
    branches:
      - research/universal-structural-policy-20260930
    paths:
      - .github/workflows/research-cpc-three-column-c7-transfer-profile.yml
      - research/isograph/discovery/2026-09-30-universal-structural-policy/run-cpc-three-column-c7-transfer-profile.mjs

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact pushed revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Pin Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26.7.0
      - name: Fetch pinned JSMinSys authority
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/iteathen/JSMinSys.git jsminsys
          git -C jsminsys checkout bf23d3a67652cd42e1975f29c7dc4eed54f7eb42
          test -z "$(git -C jsminsys status --porcelain)"
      - name: Run structural c7 transfer profile
        shell: bash
        run: |
          set -euo pipefail
          DIR=research/isograph/discovery/2026-09-30-universal-structural-policy
          OUT="$DIR/CPC_THREE_COLUMN_C7_TRANSFER_PROFILE_0_1.json"
          node "$DIR/run-cpc-three-column-c7-transfer-profile.mjs" ./jsminsys > "$OUT"
          node - "$OUT" <<'NODE'
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          if(r.oracleUsed!==false||r.solvedInputsUsed!==false)throw new Error('forbidden solved evidence flag');
          if(r.jsMinSysSha!=='bf23d3a67652cd42e1975f29c7dc4eed54f7eb42')throw new Error('JSMinSys authority drift');
          console.log(JSON.stringify({
            directC3:r.directC3,
            rows:r.transferRows.map(x=>({
              p2:x.p2Column,
              p1:x.p1ResponseColumn,
              p1Terminal:x.p1ResponseTerminal,
              support:x.p1Support,
              cpc:x.state?.cpc,
              p2ImmediateWins:x.immediateP2WinningColumns,
              replies:x.replies.map(y=>({
                p2:y.p2Column,
                terminal:y.terminal,
                p1Immediate:y.immediateP1WinningColumns,
                cpc:y.state?.cpc
              }))
            }))
          }));
          NODE
      - name: Commit durable profile
        shell: bash
        run: |
          set -euo pipefail
          BRANCH=research/universal-structural-policy-20260930
          FILE=research/isograph/discovery/2026-09-30-universal-structural-policy/CPC_THREE_COLUMN_C7_TRANSFER_PROFILE_0_1.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$FILE"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research: record three-column c7 transfer profile"
          for attempt in 1 2 3; do
            git fetch origin "$BRANCH"
            git rebase --autostash "origin/$BRANCH"
            if git push origin HEAD:"$BRANCH"; then exit 0; fi
            sleep 1
          done
          exit 1
