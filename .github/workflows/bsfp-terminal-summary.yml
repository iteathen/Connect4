name: bsfp-terminal-summary

on:
  pull_request:

permissions:
  contents: read

jobs:
  terminal-summary:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26.7.0
      - name: Reproduce exact terminal specialization and print compact summary
        shell: bash
        run: |
          node --expose-gc reference/research-prototypes/2026-09-10-bsfp-terminal-specialization/measure-terminal-subtraction.mjs > terminal-full.json
          node --input-type=module -e "import fs from 'node:fs'; const j=JSON.parse(fs.readFileSync('terminal-full.json','utf8')); const results=j.results.map(r=>({geometry:r.geometry,rootWdl:r.rootWdl,supports:r.supports,terminalApplications:r.terminalApplications,inputFrontierRecords:r.inputFrontierRecords,affectedRecords:r.affectedRecords,unaffectedRecords:r.unaffectedRecords,genericPairCandidates:r.genericPairCandidates,specializedCandidates:r.specializedCandidates,candidateReduction:r.candidateReduction,unaffectedFraction:r.unaffectedFraction,exactMismatches:r.exactMismatches,lateRanks:r.byRank.slice(-6).map(x=>({rank:x.rank,terminalApplications:x.terminalApplications,inputFrontierRecords:x.inputFrontierRecords,unaffectedRecords:x.unaffectedRecords,genericPairCandidates:x.genericPairCandidates,specializedCandidates:x.specializedCandidates,candidateReduction:x.candidateReduction}))})); console.log('TERMINAL_SUMMARY='+JSON.stringify({kind:j.kind,outcome:j.outcome,results}))"
