name: Research triadic off-diagonal incidence

on:
  push:
    branches:
      - experiment/triadic-relational-normalization-20261003
    paths:
      - 'research/isograph/discovery/2026-10-03-triadic-relational-normalization/run-off-diagonal-incidence-falsifier.mjs'
      - '.github/workflows/research-triadic-off-diagonal-incidence.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  incidence:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - name: Generate CPCX target-transfer census
        run: |
          mkdir -p research/isograph/discovery/2026-10-03-triadic-relational-normalization/artifacts
          node research/isograph/discovery/2026-10-02-cpcx/run-uc4a-cpcx-normalized-p1-target-transfer-census.mjs \
            > research/isograph/discovery/2026-10-03-triadic-relational-normalization/artifacts/cpcx-target-transfer.json
      - name: Run off-diagonal incidence falsifier
        run: |
          node research/isograph/discovery/2026-10-03-triadic-relational-normalization/run-off-diagonal-incidence-falsifier.mjs \
            research/isograph/discovery/2026-10-03-triadic-relational-normalization/artifacts/cpcx-target-transfer.json \
            > research/isograph/discovery/2026-10-03-triadic-relational-normalization/artifacts/off-diagonal-incidence-v0_1.json
          cat research/isograph/discovery/2026-10-03-triadic-relational-normalization/artifacts/off-diagonal-incidence-v0_1.json
      - name: Upload result
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: triadic-off-diagonal-incidence-v0-1
          path: research/isograph/discovery/2026-10-03-triadic-relational-normalization/artifacts/off-diagonal-incidence-v0_1.json
