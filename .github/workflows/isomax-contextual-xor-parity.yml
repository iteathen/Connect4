name: IsoMax contextual XOR parity

on:
  push:
    branches:
      - experiment/isomax-contextual-xor-parity-20260929
    paths:
      - '.github/workflows/isomax-contextual-xor-parity.yml'
      - 'research/isograph/discovery/2026-09-29-isomax-contextual-xor/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 0}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with: {node-version: '26'}
      - name: Run contextual XOR audit
        run: node research/isograph/discovery/2026-09-29-isomax-contextual-xor/run-contextual-xor-parity.mjs
      - name: Research integrity
        run: node tools/verify-research-integrity.mjs
      - name: Commit contextual XOR evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/isograph/discovery/2026-09-29-isomax-contextual-xor/CONTEXTUAL_XOR_PARITY_AUDIT_0_1.json
          if git diff --cached --quiet; then echo "No generated changes."; else
            git commit -m "research(isomax): freeze contextual XOR parity evidence"
            git push origin HEAD:experiment/isomax-contextual-xor-parity-20260929
          fi
