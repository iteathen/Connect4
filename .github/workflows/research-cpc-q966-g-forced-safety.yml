name: Research CPC q966 G-branch forced safety

concurrency:
  group: q966-g-forced-safety-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [research/universal-structural-policy-20260930]
    paths:
      - .github/workflows/research-cpc-q966-g-forced-safety.yml
      - research/isograph/discovery/2026-09-30-universal-structural-policy/CPC_Q966_G_BRANCH_FORCED_SAFETY_DESIGN_0_1.md
      - research/isograph/discovery/2026-09-30-universal-structural-policy/test-cpc-q966-g-branch-forced-safety.mjs
      - research/isograph/discovery/2026-09-30-universal-structural-policy/run-cpc-q966-g-branch-forced-safety.mjs
      - research/isograph/discovery/2026-09-30-universal-structural-policy/CPC_RANK30_D1_A_UNKNOWN_CHILD_STRUCTURAL_DIFFERENTIAL_0_1.json

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {fetch-depth: 0}
      - name: Check out pinned JSMinSys authority
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: iteathen/JSMinSys
          ref: bf23d3a67652cd42e1975f29c7dc4eed54f7eb42
          path: .jsminsys
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: {node-version: 26.7.0}
      - name: Verify frozen q966 G-branch contract
        run: node research/isograph/discovery/2026-09-30-universal-structural-policy/test-cpc-q966-g-branch-forced-safety.mjs "$GITHUB_WORKSPACE/.jsminsys"
      - name: Generate durable q966 G-branch evidence
        shell: bash
        run: |
          set -euo pipefail
          DIR=research/isograph/discovery/2026-09-30-universal-structural-policy
          OUT="$DIR/CPC_Q966_G_BRANCH_FORCED_SAFETY_0_1.json"
          node "$DIR/run-cpc-q966-g-branch-forced-safety.mjs" "$GITHUB_WORKSPACE/.jsminsys" > "$OUT"
          cat "$OUT"
      - name: Commit durable q966 G-branch evidence
        shell: bash
        run: |
          set -euo pipefail
          BRANCH=research/universal-structural-policy-20260930
          FILE=research/isograph/discovery/2026-09-30-universal-structural-policy/CPC_Q966_G_BRANCH_FORCED_SAFETY_0_1.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$FILE"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research: record q966 G-branch forced safety"
          git pull --rebase origin "$BRANCH"
          git push origin HEAD:"$BRANCH"
