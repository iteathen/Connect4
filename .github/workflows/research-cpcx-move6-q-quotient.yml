name: Research CPCX move6 q quotient

on:
  push:
    branches:
      - experiment/cpcx-20261002
    paths:
      - research/isograph/discovery/2026-10-02-cpcx/cpcx-q-quotient.mjs
      - research/isograph/discovery/2026-10-02-cpcx/cpcx-q-quotient.test.mjs
      - research/isograph/discovery/2026-10-02-cpcx/run-cpcx-move6-qo-quotient.mjs
      - research/isograph/discovery/2026-10-02-cpcx/cpcx-q-realizability.mjs
      - research/isograph/discovery/2026-10-02-cpcx/cpcx-q-branch-ti.mjs
      - research/isograph/discovery/2026-10-02-cpcx/cpcx-q-branch-ti.test.mjs
      - research/isograph/discovery/2026-10-02-cpcx/run-cpcx-move6-q-branch-ti.mjs
      - research/isograph/discovery/2026-10-02-cpcx/run-cpcx-move6-q-normalized-boundaries.mjs
      - research/isograph/discovery/2026-10-02-cpcx/run-cpcx-move6-neutral-reservoir.mjs
      - research/isograph/discovery/2026-10-02-cpcx/run-cpcx-move6-shared-deviation-substrate.mjs
      - research/isograph/discovery/2026-10-02-cpcx/cpcx-deadline.mjs
      - research/isograph/discovery/2026-10-02-cpcx/run-cpcx-move6-q-realizability.mjs
      - .github/workflows/research-cpcx-move6-q-quotient.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "26.7.0"
      - name: Qualify q_o transporter port
        run: |
          node --test research/isograph/discovery/2026-10-02-cpcx/cpcx-q-quotient.test.mjs
          node --test research/isograph/discovery/2026-10-02-cpcx/cpcx-q-branch-ti.test.mjs
      - name: Run move6 q_o quotient diagnostic
        run: |
          node research/isograph/discovery/2026-10-02-cpcx/run-cpcx-move6-qo-quotient.mjs > cpcx-move6-qo-quotient.json
          node research/isograph/discovery/2026-10-02-cpcx/run-cpcx-move6-q-realizability.mjs > cpcx-move6-q-realizability.json
          node research/isograph/discovery/2026-10-02-cpcx/run-cpcx-move6-q-branch-ti.mjs > cpcx-move6-q-branch-ti.json
          node research/isograph/discovery/2026-10-02-cpcx/run-cpcx-move6-q-normalized-boundaries.mjs > cpcx-move6-q-normalized-boundaries.json
          node research/isograph/discovery/2026-10-02-cpcx/run-cpcx-move6-neutral-reservoir.mjs > cpcx-move6-neutral-reservoir.json
          node research/isograph/discovery/2026-10-02-cpcx/run-cpcx-move6-shared-deviation-substrate.mjs > cpcx-move6-shared-deviation-substrate.json
          cat cpcx-move6-qo-quotient.json
          cat cpcx-move6-q-realizability.json
          cat cpcx-move6-q-branch-ti.json
          cat cpcx-move6-q-normalized-boundaries.json
          cat cpcx-move6-neutral-reservoir.json
          cat cpcx-move6-shared-deviation-substrate.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: cpcx-move6-qo-quotient
          path: |
            cpcx-move6-qo-quotient.json
            cpcx-move6-q-realizability.json
            cpcx-move6-q-branch-ti.json
            cpcx-move6-q-normalized-boundaries.json
            cpcx-move6-neutral-reservoir.json
            cpcx-move6-shared-deviation-substrate.json
          if-no-files-found: error
