name: Frontier rank7 D post-F5 dual kappa

on:
  push:
    branches:
      - research/frontier-negamax-conformance
    paths:
      - 'research/semantic-quotient/state-identity-unification/src/quotient-standard7x6-rank7-d-post-f5-dual-kappa-handoff.mjs'
      - 'research/semantic-quotient/state-identity-unification/src/quotient-standard7x6-target-distance-sequence-probe.mjs'
      - 'research/semantic-quotient/state-identity-unification/src/quotient-standard7x6-target-distance-lexicographic-proof-lib.mjs'
      - '.github/workflows/frontier-rank7-d-post-f5-dual-kappa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26.7.0
      - name: Qualify D post-F5 dual kappa handoff
        run: |
          set -euo pipefail
          f="$RUNNER_TEMP/rank7-d-dual.txt"
          timeout 300s node research/semantic-quotient/state-identity-unification/src/quotient-standard7x6-rank7-d-post-f5-dual-kappa-handoff.mjs | tee "$f"
          RESULT_FILE="$f" node <<'NODE'
          const fs=require('node:fs');
          const line=fs.readFileSync(process.env.RESULT_FILE,'utf8').split(/\r?\n/).find(x=>x.startsWith('RANK7_D_POST_F5_DUAL_KAPPA_HANDOFF='));
          if(!line) throw new Error('D dual-kappa summary missing');
          const x=JSON.parse(line.slice(line.indexOf('=')+1));
          if(x.startSequence!=='4665655466'||x.witness!=='D3') throw new Error('D dual-kappa identity drift');
          if(x.proved!==true) throw new Error('D dual-kappa handoff unproved');
          NODE
