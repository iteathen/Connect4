name: Frontier race-blocker cover screen

on:
  push:
    branches: [research/frontier-negamax-conformance]
    paths:
      - '.github/workflows/frontier-race-blocker-cover-screen.yml'
      - 'research/semantic-quotient/state-identity-unification/src/quotient-standard7x6-race-blocker-cover-screen.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screen:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26.7.0
      - name: Screen race-blocker cover geometry
        shell: bash
        run: |
          set -euo pipefail
          node research/semantic-quotient/state-identity-unification/src/quotient-standard7x6-race-blocker-cover-screen.mjs
