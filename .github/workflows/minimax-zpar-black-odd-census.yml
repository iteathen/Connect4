name: Minimax ZPAR Black-odd census

on:
  push:
    branches:
      - work/minimax-zpar-single-threat-20260911
    paths:
      - 'research/minimax/composition-campaign/zpar_black_odd_census.mjs'
      - '.github/workflows/minimax-zpar-black-odd-census.yml'
  workflow_dispatch:

jobs:
  black-odd-census:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26.7.0
      - name: Run targeted Black-odd census
        run: node --max-old-space-size=6144 research/minimax/composition-campaign/zpar_black_odd_census.mjs | tee /tmp/zpar-black-odd.json
      - name: Preserve census evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: minimax-zpar-black-odd-census
          path: /tmp/zpar-black-odd.json
          if-no-files-found: error
