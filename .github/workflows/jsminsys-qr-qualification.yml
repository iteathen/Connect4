name: JSMinSys q_r Qualification

on:
  push:
    branches:
      - work/isomax-jsminsys-boundary-cleanup
    paths:
      - '.github/workflows/jsminsys-qr-qualification.yml'
      - 'tools/qualify-jsminsys-qr.mjs'
  workflow_dispatch:

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          submodules: recursive
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '26.7.0'
          cache: npm
      - run: npm ci
      - name: Assert qualified JSMinSys revision
        shell: bash
        run: |
          actual="$(git -C vendor/jsminsys rev-parse HEAD)"
          test "$actual" = "93aca1758718bcbf0635c11a957a67ca6387d50c"
      - name: Qualify current exact key against q_r
        run: node tools/qualify-jsminsys-qr.mjs
