name: Freeze IsoGraph authority 1.1 candidate manifest

on:
  push:
    branches:
      - work/isograph-logic-authority-1-1-rebuild-20260918
    paths:
      - research/isograph/successor/RUN_FREEZE_CANDIDATE.request

permissions:
  contents: write

jobs:
  freeze:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26.7.0
      - name: Freeze semantic candidate manifest
        run: node research/isograph/successor/tools/freeze-candidate-manifest.mjs
      - name: Commit immutable candidate manifest
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "iteathen"
          git config user.email "josh.oshiro@gmail.com"
          git add research/isograph/successor/CONNECT4_LOGIC_CANDIDATE_MANIFEST_1_1.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research: freeze IsoGraph authority 1.1 semantic candidate manifest"
          git push origin HEAD:work/isograph-logic-authority-1-1-rebuild-20260918
