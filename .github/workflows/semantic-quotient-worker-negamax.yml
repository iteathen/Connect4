name: Quotient worker Negamax

on:
  push:
    branches:
      - research/semantic-quotient
    paths:
      - 'research/semantic-quotient/state-identity-unification/src/quotient-slot64-worker-negamax-lib.mjs'
      - 'research/semantic-quotient/state-identity-unification/src/quotient-slot64-worker-negamax-worker.mjs'
      - 'research/semantic-quotient/state-identity-unification/src/quotient-slot64-worker-negamax-campaign.mjs'
      - '.github/workflows/semantic-quotient-worker-negamax.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  COLUMNS: '4'
  ROWS: '5'
  CONNECT: '4'
  REPEATS: '5'
  WORKER_COUNTS: '1,2,4'
  PREFIX_CLASSES: '4096'

jobs:
  benchmark:
    name: Qualify quotient worker root split
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26.7.0
      - name: Run exact worker qualification and benchmark
        run: >-
          node --expose-gc --max-old-space-size=6144
          research/semantic-quotient/state-identity-unification/src/quotient-slot64-worker-negamax-campaign.mjs
