name: isomax-surplus-qualification

on:
  pull_request:
    paths:
      - 'components/isometric/solver.mjs'
      - 'components/isometric/execution/surplus-*.mjs'
      - 'components/isometric/test/surplus-execution.test.mjs'
      - 'benchmarks/isomax-workers/surplus-comparison.mjs'
      - '.github/workflows/isomax-surplus-qualification.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.7.0
      - name: Assert exact source and Node runtime
        run: |
          echo "SURPLUS_SOURCE=$(git rev-parse HEAD)"
          node -e "if (process.version !== 'v26.7.0') throw new Error('expected Node v26.7.0, got ' + process.version)"
      - name: Corrected surplus lifecycle and exactness
        run: node --test components/isometric/test/surplus-execution.test.mjs
      - name: Completed solves — late roots
        env:
          ISOMAX_SURPLUS_CORPUS: late
        run: |
          set -o pipefail
          node benchmarks/isomax-workers/surplus-comparison.mjs | tee surplus-comparison-late.json
      - name: Completed solves — historical hard roots
        env:
          ISOMAX_SURPLUS_CORPUS: hard
        run: |
          set -o pipefail
          node benchmarks/isomax-workers/surplus-comparison.mjs | tee surplus-comparison-hard.json


  qualify-windows:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.7.0
      - name: Assert exact source and Node runtime
        shell: pwsh
        run: |
          Write-Output "SURPLUS_SOURCE=$(git rev-parse HEAD)"
          node -e "if (process.version !== 'v26.7.0') throw new Error('expected Node v26.7.0, got ' + process.version)"
      - name: Corrected surplus lifecycle and exactness
        run: node --test components/isometric/test/surplus-execution.test.mjs
      - name: Completed solves - late roots
        env:
          ISOMAX_SURPLUS_CORPUS: late
        run: node benchmarks/isomax-workers/surplus-comparison.mjs
      - name: Completed solves - historical hard roots
        env:
          ISOMAX_SURPLUS_CORPUS: hard
        run: node benchmarks/isomax-workers/surplus-comparison.mjs
