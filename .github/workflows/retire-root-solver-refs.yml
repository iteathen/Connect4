name: Retire superseded root solver refs

on:
  push:
    branches:
      - solver/isometric
    paths:
      - cleanup/SOLVER_NAMESPACE_RENAME_TRIGGER_2026-09-17.json

permissions:
  contents: write

concurrency:
  group: solver-namespace-root-ref-retirement
  cancel-in-progress: false

jobs:
  retire:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out solver/isometric
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: solver/isometric
          persist-credentials: false

      - name: Prevalidate, archive, and delete old root refs
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const req=JSON.parse(fs.readFileSync('cleanup/SOLVER_NAMESPACE_RENAME_TRIGGER_2026-09-17.json','utf8'));
          if(process.env.REPOSITORY!=='iteathen/Connect4'||req.repository!==process.env.REPOSITORY) throw new Error('repository mismatch');

          const [owner,repo]=process.env.REPOSITORY.split('/');
          const api='https://api.github.com';
          const headers={
            Authorization:`Bearer ${process.env.GH_TOKEN}`,
            Accept:'application/vnd.github+json',
            'X-GitHub-Api-Version':'2022-11-28',
            'Content-Type':'application/json'
          };
          const enc=s=>s.split('/').map(encodeURIComponent).join('/');
          async function gh(path,{method='GET',body,ok=[200]}={}){
            const r=await fetch(api+path,{method,headers,body:body===undefined?undefined:JSON.stringify(body)});
            const text=await r.text();
            if(!ok.includes(r.status)) throw new Error(`${method} ${path} -> ${r.status}: ${text.slice(0,800)}`);
            return text?JSON.parse(text):null;
          }
          async function refSha(branch){
            return (await gh(`/repos/${owner}/${repo}/git/ref/heads/${enc(branch)}`)).object.sha;
          }
          async function isAncestor(base,head){
            const d=await gh(`/repos/${owner}/${repo}/compare/${base}...${head}`);
            return d.merge_base_commit?.sha===base && d.behind_by===0;
          }
          async function activeRunCount(branch,status){
            const q=new URLSearchParams({branch,status,per_page:'1'});
            return (await gh(`/repos/${owner}/${repo}/actions/runs?${q}`)).total_count;
          }
          async function tagTarget(tag){
            try{
              const r=await gh(`/repos/${owner}/${repo}/git/ref/tags/${enc(tag)}`);
              if(r.object.type==='commit') return r.object.sha;
              return (await gh(`/repos/${owner}/${repo}/git/tags/${r.object.sha}`)).object.sha;
            }catch(e){
              if(String(e).includes('-> 404:')) return null;
              throw e;
            }
          }
          async function ensureTag(tag,branch,sha){
            const existing=await tagTarget(tag);
            if(existing!==null){
              if(existing!==sha) throw new Error(`archive tag mismatch: ${tag}`);
              return;
            }
            const t=await gh(`/repos/${owner}/${repo}/git/tags`,{
              method:'POST',ok:[201],
              body:{tag,message:`Archive ${branch} before solver namespace normalization cleanup`,object:sha,type:'commit'}
            });
            await gh(`/repos/${owner}/${repo}/git/refs`,{
              method:'POST',ok:[201],
              body:{ref:`refs/tags/${tag}`,sha:t.sha}
            });
            if(await tagTarget(tag)!==sha) throw new Error(`archive verification failed: ${tag}`);
          }

          const pr=await gh(`/repos/${owner}/${repo}/pulls/54`);
          if(!pr.merged||pr.head.sha!=='91aec8e7a0d67f489ca34bd1b5938259544a539e') throw new Error('PR54 merge authority mismatch');

          const openPrs=await gh(`/repos/${owner}/${repo}/pulls?state=open&per_page=100`);
          const oldNames=new Set(req.renames.map(x=>x.old_branch));
          for(const p of openPrs){
            if(oldNames.has(p.head.ref)||oldNames.has(p.base.ref)) throw new Error(`open PR still depends on old ref: #${p.number}`);
          }

          const validated=[];
          for(const item of req.renames){
            const oldSha=await refSha(item.old_branch);
            if(oldSha!==item.old_head) throw new Error(`${item.old_branch} moved: ${oldSha}`);
            const newSha=await refSha(item.new_branch);
            if(!await isAncestor(oldSha,newSha)) throw new Error(`${item.old_branch} not contained by ${item.new_branch}`);
            if(await activeRunCount(item.old_branch,'queued')||await activeRunCount(item.old_branch,'in_progress')){
              throw new Error(`active workflow still depends on ${item.old_branch}`);
            }
            validated.push({item,oldSha,newSha});
          }
          console.log(`prevalidated ${validated.length} root solver ref renames`);

          for(const {item,oldSha,newSha} of validated){
            await ensureTag(item.archive_tag,item.old_branch,oldSha);
            await gh(`/repos/${owner}/${repo}/git/refs/heads/${enc(item.old_branch)}`,{method:'DELETE',ok:[204]});
            console.log(`archived+deleted ${item.old_branch} @ ${oldSha}; canonical=${item.new_branch} @ ${newSha}`);
          }
          NODE
