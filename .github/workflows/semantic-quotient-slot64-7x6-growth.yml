name: Standard 7x6 slot64 residual growth

on:
  push:
    branches:
      - research/semantic-quotient
    paths:
      - 'research/semantic-quotient/state-identity-unification/src/quotient-slot64-residual-pool.mjs'
      - 'research/semantic-quotient/state-identity-unification/src/quotient-native-negamax-slot64-residual-kernel.mjs'
      - 'research/semantic-quotient/state-identity-unification/src/quotient-slot64-7x6-forward-growth.mjs'
      - '.github/workflows/semantic-quotient-slot64-7x6-growth.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  growth:
    name: Measure slot64 standard-7x6 growth
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      EXPAND_THROUGH_RANK: '8'
      MAX_STATES: '2000000'
      PREFIX_CLASSES: '4096'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26.7.0
      - name: Run slot64 standard-7x6 forward-growth campaign
        run: node --expose-gc --max-old-space-size=6144 research/semantic-quotient/state-identity-unification/src/quotient-slot64-7x6-forward-growth.mjs
