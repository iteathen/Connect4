name: isomax-retained-pull-qualification

on:
  pull_request:
    paths:
      - 'components/isometric/execution/shared-work-pool.mjs'
      - 'components/isometric/execution/pull-*.mjs'
      - 'components/isometric/test/pull-execution.test.mjs'
      - '.github/workflows/isomax-retained-pull-qualification.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  retained-pull-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26.7.0
      - name: Retained pull lifecycle and exactness
        run: node --test components/isometric/test/pull-execution.test.mjs

  retained-pull-windows:
    runs-on: windows-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26.7.0
      - name: Retained pull lifecycle and exactness
        run: node --test components/isometric/test/pull-execution.test.mjs
