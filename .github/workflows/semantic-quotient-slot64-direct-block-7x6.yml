name: Slot64 direct block 7x6 growth

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  growth:
    name: Measure historical direct-block standard-7x6 growth
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26.7.0
      - name: Run historical exact rank-8 target-scale gate
        run: >-
          node --expose-gc --max-old-space-size=6144
          research/semantic-quotient/state-identity-unification/src/quotient-slot64-direct-block-7x6-growth.mjs
