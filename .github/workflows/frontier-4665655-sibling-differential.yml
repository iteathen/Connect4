name: Frontier 4665655 sibling differential

on:
  push:
    branches: [research/frontier-negamax-conformance]
    paths:
      - '.github/workflows/frontier-4665655-sibling-differential.yml'
      - 'research/semantic-quotient/state-identity-unification/src/quotient-standard7x6-4665655-sibling-differential.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  differential:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26.7.0
      - name: Compare pure structural sibling transitions
        shell: bash
        run: |
          set -euo pipefail
          node research/semantic-quotient/state-identity-unification/src/quotient-standard7x6-4665655-sibling-differential.mjs
