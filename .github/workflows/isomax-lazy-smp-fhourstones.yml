name: IsoMax Lazy SMP Fhourstones Benchmark

on:
  push:
    branches:
      - work/isomax-jsminsys-boundary-cleanup
    paths:
      - 'vendor/jsminsys'
      - 'tools/bench-fhourstones-lazy-smp.mjs'
      - '.github/workflows/isomax-lazy-smp-fhourstones.yml'
  workflow_dispatch:

jobs:
  lazy-smp-fhourstones:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          submodules: recursive
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '26.7.0'
          cache: npm
      - run: npm ci
      - name: Four-worker Lazy SMP Fhourstones qualification
        shell: pwsh
        run: node --experimental-ffi tools/bench-fhourstones-lazy-smp.mjs
