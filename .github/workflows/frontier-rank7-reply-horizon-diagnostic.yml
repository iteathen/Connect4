name: Frontier rank7 reply horizon diagnostic

on:
  push:
    branches:
      - research/frontier-negamax-conformance
    paths:
      - research/semantic-quotient/state-identity-unification/src/quotient-standard7x6-rank7-reply-horizon-diagnostic.mjs
      - .github/workflows/frontier-rank7-reply-horizon-diagnostic.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26.7.0
      - name: Classify exact rank7 P1 reply horizon
        shell: bash
        run: |
          set -euo pipefail
          f="$RUNNER_TEMP/rank7-replies.txt"
          timeout 270s node research/semantic-quotient/state-identity-unification/src/quotient-standard7x6-rank7-reply-horizon-diagnostic.mjs | tee "$f"
          RESULT_FILE="$f" node <<'NODE'
          const fs=require('node:fs');
          const line=fs.readFileSync(process.env.RESULT_FILE,'utf8').split(/\r?\n/).find(x=>x.startsWith('RANK7_REPLY_HORIZON_DIAGNOSTIC='));
          if(!line) throw new Error('rank7 diagnostic summary missing');
          const x=JSON.parse(line.slice(line.indexOf('=')+1));
          if(x.parent!=='4665655'||x.sideToMove!=='P1') throw new Error('rank7 diagnostic root drift');
          if(x.rows.length!==7||JSON.stringify(x.rows.map(r=>r.reply))!==JSON.stringify(['A','B','C','D','E','F','G'])) throw new Error('rank7 reply coverage drift');
          if(x.rows.filter(r=>r.knownRank8Child).length!==1||x.rows.find(r=>r.knownRank8Child)?.reply!=='E') throw new Error('rank7 exact E-child tag drift');
          NODE
