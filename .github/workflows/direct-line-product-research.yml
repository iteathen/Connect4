name: direct-line-product-research

on:
  push:
    branches:
      - research/direct-line-product-bsfp-20260910
    paths:
      - reference/research-prototypes/2026-09-10-identified-winline-quotient/direct-line-product-solver.mjs
      - reference/research-prototypes/2026-09-10-identified-winline-quotient/qualify-direct-line-product.mjs
      - .github/workflows/direct-line-product-research.yml

permissions:
  contents: read

jobs:
  exact-direct-line-product:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26.7.0
      - run: node --version
      - name: Qualify direct line-product recurrence
        run: node --expose-gc reference/research-prototypes/2026-09-10-identified-winline-quotient/qualify-direct-line-product.mjs | tee direct-line-product-evidence.json
