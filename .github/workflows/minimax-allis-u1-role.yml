name: Minimax U1 role-generalized Allis A1-A3

on:
  push:
    branches:
      - work/minimax-candidate-composition-20260911
    paths:
      - 'research/minimax/composition-campaign/allis_a123_u1_role.mjs'
      - '.github/workflows/minimax-allis-u1-role.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  u1-role-a123:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.7.0
      - name: Run U1 role-generalized A1-A3 differential
        run: node --max-old-space-size=6144 research/minimax/composition-campaign/allis_a123_u1_role.mjs | tee /tmp/u1-a123.json
      - name: Preserve U1/A1-A3 evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: minimax-u1-a123-role
          path: /tmp/u1-a123.json
          if-no-files-found: error
