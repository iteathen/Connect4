name: Research CPC q5d34 rank36 monotone consequence composition

concurrency:
  group: q5d34-rank36-consequence-composition-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [research/universal-structural-policy-20260930]
    paths:
      - .github/workflows/research-cpc-q5d34-rank36-consequence-composition.yml
      - research/isograph/discovery/2026-09-30-universal-structural-policy/CPC_Q5D34_RANK36_MONOTONE_CONSEQUENCE_COMPOSITION_DESIGN_0_1.md
      - research/isograph/discovery/2026-09-30-universal-structural-policy/test-cpc-q5d34-rank36-monotone-consequence-composition.mjs
      - research/isograph/discovery/2026-09-30-universal-structural-policy/run-cpc-q5d34-rank36-monotone-consequence-composition.mjs
      - research/isograph/discovery/2026-09-30-universal-structural-policy/CPC_Q5D34_THREE_SAFE_ACTION_CONSEQUENCE_CLOSURE_0_1.json
      - research/isograph/discovery/2026-09-30-universal-structural-policy/CPC_Q5D34_MONOTONE_PROOF_LIBRARY_AUDIT_0_1.json

permissions:
  contents: write

jobs:
  compose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {fetch-depth: 0}
      - name: Check out pinned JSMinSys authority
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: iteathen/JSMinSys
          ref: bf23d3a67652cd42e1975f29c7dc4eed54f7eb42
          path: .jsminsys
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: {node-version: 26.7.0}
      - name: Verify frozen q5d34 rank36 composition contract
        run: node research/isograph/discovery/2026-09-30-universal-structural-policy/test-cpc-q5d34-rank36-monotone-consequence-composition.mjs "$GITHUB_WORKSPACE/.jsminsys"
      - name: Generate durable q5d34 rank36 composition evidence
        shell: bash
        run: |
          set -euo pipefail
          DIR=research/isograph/discovery/2026-09-30-universal-structural-policy
          OUT="$DIR/CPC_Q5D34_RANK36_MONOTONE_CONSEQUENCE_COMPOSITION_0_1.json"
          node "$DIR/run-cpc-q5d34-rank36-monotone-consequence-composition.mjs" "$GITHUB_WORKSPACE/.jsminsys" > "$OUT"
          cat "$OUT"
      - name: Commit durable q5d34 rank36 composition evidence
        shell: bash
        run: |
          set -euo pipefail
          BRANCH=research/universal-structural-policy-20260930
          FILE=research/isograph/discovery/2026-09-30-universal-structural-policy/CPC_Q5D34_RANK36_MONOTONE_CONSEQUENCE_COMPOSITION_0_1.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$FILE"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research: record q5d34 rank36 consequence composition"
          git pull --rebase origin "$BRANCH"
          git push origin HEAD:"$BRANCH"
