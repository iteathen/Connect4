name: Research v4 first-nine timing baseline

on:
  push:
    branches:
      - research/universal-structural-policy-20260930
    paths:
      - .github/workflows/research-v4-first-nine-timing.yml
      - research/isograph/discovery/2026-09-30-universal-structural-policy/benchmark-universal-structural-policy-v4-first-nine.mjs
      - research/isograph/discovery/2026-09-30-universal-structural-policy/universal-structural-policy-v4.mjs

permissions:
  contents: write

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact pushed revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Pin Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26.7.0

      - name: Assert exact Node runtime
        run: node -e "if (process.version !== 'v26.7.0') throw new Error('expected Node v26.7.0, got ' + process.version)"

      - name: Run first-nine hot calculation benchmark
        shell: bash
        env:
          C4_BENCH_REPS: '1000'
          C4_BENCH_WARMUP: '200'
        run: |
          set -euo pipefail
          OUT=research/isograph/discovery/2026-09-30-universal-structural-policy/V4_FIRST_NINE_TIMING_BASELINE_0_1.json
          node research/isograph/discovery/2026-09-30-universal-structural-policy/benchmark-universal-structural-policy-v4-first-nine.mjs > "$OUT"
          node - "$OUT" <<'NODE'
          const fs = require('fs');
          const path = process.argv[2];
          const r = JSON.parse(fs.readFileSync(path, 'utf8'));
          console.log('SEQUENCE=' + r.subject.diagnostic.sequence);
          console.log('REPETITIONS=' + r.configuration.repetitions);
          console.log('WARMUP=' + r.configuration.warmupRepetitions);
          console.log('NODE=' + r.environment.node);
          console.log('V8=' + r.environment.v8);
          console.log('CPU=' + r.environment.cpuModel);
          console.log('TOTAL_MIN_MS=' + r.summary.totalFirstNine.minMs);
          console.log('TOTAL_MEDIAN_MS=' + r.summary.totalFirstNine.medianMs);
          console.log('TOTAL_P95_MS=' + r.summary.totalFirstNine.p95Ms);
          for (const p of r.summary.perPly) {
            console.log(`PLY_${p.ply}_REP=${p.representative} MEDIAN_MS=${p.medianMs} MIN_MS=${p.minMs} P95_MS=${p.p95Ms}`);
          }
          NODE

      - name: Write concise interpretation
        shell: bash
        run: |
          set -euo pipefail
          JSON=research/isograph/discovery/2026-09-30-universal-structural-policy/V4_FIRST_NINE_TIMING_BASELINE_0_1.json
          MD=research/isograph/discovery/2026-09-30-universal-structural-policy/V4_FIRST_NINE_TIMING_BASELINE_0_1.md
          node - "$JSON" "$MD" <<'NODE'
          const fs = require('fs');
          const [jsonPath, mdPath] = process.argv.slice(2);
          const r = JSON.parse(fs.readFileSync(jsonPath, 'utf8'));
          const t = r.summary.totalFirstNine;
          const lines = [
            '# v4 first-nine timing baseline',
            '',
            '**Status:** computational-cost baseline only; this does not promote v4 to a sound universal proof.',
            '',
            `Trajectory: \`${r.subject.diagnostic.sequence}\``,
            '',
            `Measured repetitions: ${r.configuration.repetitions}; warmup repetitions: ${r.configuration.warmupRepetitions}.`,
            '',
            '## Primary hot total',
            '',
            `- minimum: ${t.minMs.toFixed(6)} ms`,
            `- median: ${t.medianMs.toFixed(6)} ms`,
            `- p95: ${t.p95Ms.toFixed(6)} ms`,
            '',
            'The primary interval begins with the empty rank-local state ready and includes structural selection, deterministic minimum representative selection, and application through ply 9. It excludes process startup, checkout, source I/O, module initialization, oracle/book work, JSON/logging, Actions setup, and build time.',
            '',
            '## Per-ply calculation time',
            '',
            '| ply | representative | selected set | min ms | median ms | p95 ms |',
            '|---:|---:|:---|---:|---:|---:|',
            ...r.summary.perPly.map(p => `| ${p.ply} | ${p.representative} | ${p.selectedSet.join(',')} | ${p.minMs.toFixed(6)} | ${p.medianMs.toFixed(6)} | ${p.p95Ms.toFixed(6)} |`),
            '',
            '## Environment',
            '',
            `- Node: ${r.environment.node}`,
            `- V8: ${r.environment.v8}`,
            `- CPU: ${r.environment.cpuModel}`,
            `- OS: ${r.environment.osType} ${r.environment.osRelease}`,
            `- runner: ${r.environment.runnerOS || 'unknown'} / ${r.environment.runnerArch || 'unknown'}`,
            `- benchmark commit: ${r.environment.githubSha || 'unknown'}`,
            '',
            'Raw distributions and excluded initialization measurements are preserved in the sibling JSON file.',
            ''
          ];
          fs.writeFileSync(mdPath, lines.join('\n'));
          NODE

      - name: Commit durable benchmark evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             research/isograph/discovery/2026-09-30-universal-structural-policy/V4_FIRST_NINE_TIMING_BASELINE_0_1.json             research/isograph/discovery/2026-09-30-universal-structural-policy/V4_FIRST_NINE_TIMING_BASELINE_0_1.md
          git commit -m "research: preserve v4 first-nine timing evidence"
          git push origin HEAD:research/universal-structural-policy-20260930
