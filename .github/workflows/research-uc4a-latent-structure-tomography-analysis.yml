name: Research UC4A latent structure tomography analysis

concurrency:
  group: uc4a-tomography-analysis-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - research/universal-structural-policy-20260930
    paths:
      - .github/workflows/research-uc4a-latent-structure-tomography-analysis.yml
      - research/isograph/discovery/2026-09-30-universal-structural-policy/UC4A_LATENT_STRUCTURE_TOMOGRAPHY_ANALYSIS_PROTOCOL_0_2.md
      - research/isograph/discovery/2026-09-30-universal-structural-policy/test-uc4a-latent-structure-tomography-analysis.mjs
      - research/isograph/discovery/2026-09-30-universal-structural-policy/run-uc4a-latent-structure-tomography-analysis.mjs
      - research/isograph/discovery/2026-09-30-universal-structural-policy/UC4A_LATENT_STRUCTURE_TOMOGRAPHY_STRUCTURAL_0_1.json

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact pushed revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Pin Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26.7.0
      - name: Verify frozen tomography analysis contract
        run: node research/isograph/discovery/2026-09-30-universal-structural-policy/test-uc4a-latent-structure-tomography-analysis.mjs
      - name: Generate tomography analysis evidence
        shell: bash
        run: |
          set -euo pipefail
          DIR=research/isograph/discovery/2026-09-30-universal-structural-policy
          OUT="$DIR/UC4A_LATENT_STRUCTURE_TOMOGRAPHY_ANALYSIS_0_1.json"
          node "$DIR/run-uc4a-latent-structure-tomography-analysis.mjs" > "$OUT"
          node - "$OUT" <<'NODE'
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          if(r.boardCount!==52||r.labelCount!==52)throw new Error('expected complete 52-board join');
          if(r.sealedHoldoutsAccessed!==false)throw new Error('sealed holdout boundary violated');
          if(r.outcomeLabelsUsedOnlyAfterStructuralFreeze!==true)throw new Error('structural freeze ordering violated');
          console.log(JSON.stringify({
            boardCount:r.boardCount,
            unitEdges:r.views.view2.unitEdges.length,
            changing:r.views.view2.outcomeChangingEdges.length,
            integerRank:r.views.view4.integer,
            gf2Rank:r.views.view4.gf2,
            separatorCount:r.views.view5.minimalDifferentOutcomeSeparators.length,
            triangles:r.views.view6.triangles.length,
            focus:r.focus['8x6_9x6_10x6']
          }));
          NODE
      - name: Commit durable tomography evidence
        shell: bash
        run: |
          set -euo pipefail
          BRANCH=research/universal-structural-policy-20260930
          FILE=research/isograph/discovery/2026-09-30-universal-structural-policy/UC4A_LATENT_STRUCTURE_TOMOGRAPHY_ANALYSIS_0_1.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$FILE"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research: record UC4A latent structure tomography"
          for attempt in 1 2 3; do
            git fetch origin "$BRANCH"
            git rebase --autostash "origin/$BRANCH"
            if git push origin HEAD:"$BRANCH"; then exit 0; fi
            sleep 1
          done
          exit 1
