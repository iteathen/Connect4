name: Research CPC trigger5 forced compression

on:
  push:
    branches:
      - research/universal-structural-policy-20260930
    paths:
      - .github/workflows/research-cpc-trigger5-forced-compression.yml
      - research/isograph/discovery/2026-09-30-universal-structural-policy/run-cpc-trigger5-forced-compression.mjs
      - research/isograph/discovery/2026-09-30-universal-structural-policy/CPC_TRIGGER5_FORCED_COMPRESSION_LEMMA.md

permissions:
  contents: write

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact pushed revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Pin Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26.7.0
      - name: Assert exact Node runtime
        run: node -e "if (process.version !== 'v26.7.0') throw new Error('expected Node v26.7.0, got ' + process.version)"
      - name: Fetch pinned JSMinSys authority
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/iteathen/JSMinSys.git jsminsys
          git -C jsminsys checkout bf23d3a67652cd42e1975f29c7dc4eed54f7eb42
          test -z "$(git -C jsminsys status --porcelain)"
      - name: Qualify finite trigger5 compression
        shell: bash
        run: |
          set -euo pipefail
          DIR=research/isograph/discovery/2026-09-30-universal-structural-policy
          OUT="$DIR/CPC_TRIGGER5_FORCED_COMPRESSION_0_1.json"
          node "$DIR/run-cpc-trigger5-forced-compression.mjs" ./jsminsys > "$OUT"
          node - "$OUT" <<'NODE'
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          if(r.oracleUsed!==false)throw new Error('oracleUsed must be false');
          if(r.solvedInputsUsed!==false)throw new Error('solvedInputsUsed must be false');
          if(r.jsMinSysSha!=='bf23d3a67652cd42e1975f29c7dc4eed54f7eb42')throw new Error('JSMinSys authority drift');
          if(r.accept!==true)throw new Error('frozen forced-compression lemma rejected');
          const got=JSON.stringify(r.observedResponseColumns);
          if(got!==JSON.stringify([1,3,5,6,7]))throw new Error('unexpected legal response set '+got);
          const direct=r.rows.find(x=>x.responseColumn===5);
          if(!direct?.closesByImmediateP1Win)throw new Error('direct c5 reply did not close by immediate P1 win');
          for(const row of r.rows){
            if(row.responseColumn===5)continue;
            if(!row.nativeCpcForcesColumn5)throw new Error('native CPC did not force c5 after reply '+row.responseColumn);
            if(!row.literalOnlyColumn5AvoidsImmediateWin)throw new Error('literal cofactor check disagreed after reply '+row.responseColumn);
            if(!row.contractsToProjectedP1Singleton)throw new Error('residual did not contract after reply '+row.responseColumn);
          }
          console.log(JSON.stringify({
            accept:r.accept,
            parentRank:r.parent.rank,
            responseColumns:r.observedResponseColumns,
            remainingTargets:r.rows.filter(x=>x.attachment).map(x=>({
              response:x.responseColumn,
              target:x.attachment.remainingTarget
            }))
          }));
          NODE
      - name: Commit durable qualification evidence
        shell: bash
        run: |
          set -euo pipefail
          BRANCH=research/universal-structural-policy-20260930
          FILE=research/isograph/discovery/2026-09-30-universal-structural-policy/CPC_TRIGGER5_FORCED_COMPRESSION_0_1.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$FILE"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research: record trigger5 forced compression qualification"
          for attempt in 1 2 3; do
            git fetch origin "$BRANCH"
            git rebase --autostash "origin/$BRANCH"
            if git push origin HEAD:"$BRANCH"; then exit 0; fi
            sleep 1
          done
          exit 1
