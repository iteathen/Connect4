name: IsoMax foundational carrier audit

on:
  push:
    branches:
      - research/isomax-foundational-prior-audit-20260929
    paths:
      - '.github/workflows/isomax-foundational-carrier-audit.yml'
      - 'research/isograph/discovery/2026-09-29-isomax-foundational-prior-audit/extract-carrier-audit-input.mjs'
      - 'research/isograph/discovery/2026-09-29-isomax-foundational-prior-audit/run-carrier-prior-audit.mjs'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  carrier-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 0}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with: {node-version: '26'}
      - name: Extract raw carrier input
        run: node research/isograph/discovery/2026-09-29-isomax-foundational-prior-audit/extract-carrier-audit-input.mjs
      - name: Validate carrier input JSON
        run: node -e "JSON.parse(require('fs').readFileSync('research/isograph/discovery/2026-09-29-isomax-foundational-prior-audit/CARRIER_AUDIT_INPUT_0_1.json','utf8'))"
      - name: Run independent carrier audit
        run: node research/isograph/discovery/2026-09-29-isomax-foundational-prior-audit/run-carrier-prior-audit.mjs
      - name: Validate carrier audit JSON
        run: node -e "JSON.parse(require('fs').readFileSync('research/isograph/discovery/2026-09-29-isomax-foundational-prior-audit/CARRIER_PRIOR_AUDIT_0_1.json','utf8'))"
      - name: Research integrity
        run: node tools/verify-research-integrity.mjs
      - name: Commit carrier audit evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            research/isograph/discovery/2026-09-29-isomax-foundational-prior-audit/CARRIER_AUDIT_INPUT_0_1.json \
            research/isograph/discovery/2026-09-29-isomax-foundational-prior-audit/CARRIER_PRIOR_AUDIT_0_1.json
          if git diff --cached --quiet; then
            echo "No generated carrier audit changes."
          else
            git commit -m "research(isomax): freeze independent carrier prior audit"
            git pull --rebase origin research/isomax-foundational-prior-audit-20260929
            git push origin HEAD:research/isomax-foundational-prior-audit-20260929
          fi
