name: Research CPC same-column commutator

on:
  push:
    branches:
      - research/universal-structural-policy-20260930
    paths:
      - .github/workflows/research-cpc-same-column-commutator.yml
      - research/isograph/discovery/2026-09-30-universal-structural-policy/run-cpc-same-column-commutator-probe.mjs

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact pushed revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Pin Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26.7.0

      - name: Fetch pinned JSMinSys authority
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/iteathen/JSMinSys.git jsminsys
          git -C jsminsys checkout 0899c5811918e68c22dc1b0e4dd8af97d9b4bbcb
          test "$(git -C jsminsys rev-parse HEAD)" = "0899c5811918e68c22dc1b0e4dd8af97d9b4bbcb"

      - name: Run same-column commutator probe
        shell: bash
        run: |
          set -euo pipefail
          OUT=research/isograph/discovery/2026-09-30-universal-structural-policy/CPC_SAME_COLUMN_COMMUTATOR_0_1.json
          node research/isograph/discovery/2026-09-30-universal-structural-policy/run-cpc-same-column-commutator-probe.mjs ./jsminsys > "$OUT"
          node - "$OUT" <<'NODE'
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          console.log('ROWS='+JSON.stringify(r.rows.map(x=>({
            d:x.externalDefenderColumn,
            exactWords:x.exactWords,
            players:x.delta.players.map(p=>({
              player:p.player,
              activeSymDiff:p.activeSymDiff,
              minimalSymDiff:p.minimalSymDiff,
              activeOrientationCounts:p.activeOrientationCounts
            }))
          }))));
          NODE

      - name: Commit durable commutator evidence
        shell: bash
        run: |
          set -euo pipefail
          BRANCH=research/universal-structural-policy-20260930
          FILE=research/isograph/discovery/2026-09-30-universal-structural-policy/CPC_SAME_COLUMN_COMMUTATOR_0_1.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$FILE"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research: record same-column commutator probe"
          for attempt in 1 2 3; do
            git fetch origin "$BRANCH"
            git rebase "origin/$BRANCH"
            if git push origin HEAD:"$BRANCH"; then exit 0; fi
            sleep 1
          done
          exit 1
