name: IsoMax discovery V+D channel characterization

on:
  push:
    branches:
      - experiment/isomax-discovery-vd-channel-20260929
    paths:
      - '.github/workflows/isomax-discovery-vd-channel.yml'
      - 'research/isograph/discovery/2026-09-29-isomax-full-discovery/run-vd-channel.mjs'
      - 'research/isograph/discovery/2026-09-29-center-proof-cycle/control-algebra-dimensions.mjs'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  characterize:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 0}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with: {node-version: '26'}
      - name: Characterize H and V+D channels
        run: node research/isograph/discovery/2026-09-29-isomax-full-discovery/run-vd-channel.mjs
      - name: Research integrity
        run: node tools/verify-research-integrity.mjs
      - name: Commit channel characterization
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/isograph/discovery/2026-09-29-isomax-full-discovery/VD_CHANNEL_CHARACTERIZATION_0_1.json
          if git diff --cached --quiet; then echo "No generated changes."; else
            git commit -m "research(isomax): freeze V+D channel characterization"
            git push origin HEAD:experiment/isomax-discovery-vd-channel-20260929
          fi
