name: Research CPCX shared acquisition-block theorem

on:
  push:
    branches:
      - experiment/cpcx-20261002
    paths:
      - 'research/isograph/discovery/2026-10-02-cpcx/CPCX_SUPPORT_RELEASE_SHARED_ACQUISITION_BLOCK_0_1.md'
      - 'research/isograph/discovery/2026-10-02-cpcx/CPCX_SUPPORT_RELEASE_SHARED_ACQUISITION_BLOCK_0_2.md'
      - 'research/isograph/discovery/2026-10-02-cpcx/CPCX_SUPPORT_RELEASE_SHARED_ACQUISITION_BLOCK_0_3.md'
      - 'research/isograph/discovery/2026-10-02-cpcx/cpcx-support-release-shared-acquisition-block.mjs'
      - 'research/isograph/discovery/2026-10-02-cpcx/cpcx-support-release-shared-acquisition-block.test.mjs'
      - '.github/workflows/research-cpcx-shared-acquisition-block.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  theorem:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - name: Run shared acquisition-block qualification
        run: |
          node --test             research/isograph/discovery/2026-10-02-cpcx/cpcx-support-release-shared-acquisition-block.test.mjs
