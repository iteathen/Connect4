name: Minimax Allis A1-A9 A10 exact qualifier

on:
  push:
    branches:
      - work/minimax-a1a9-a10-exact-20260911
    paths:
      - 'research/minimax/composition-campaign/allis_a1a9_a10_exact.mjs'
      - '.github/workflows/minimax-allis-a1a9-a10-exact.yml'
  workflow_dispatch:

jobs:
  a1a9-a10:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26.7.0
      - name: Run conservative A1-A9 compatible-cover qualifier
        run: node --max-old-space-size=6144 research/minimax/composition-campaign/allis_a1a9_a10_exact.mjs | tee /tmp/allis-a1a9-a10.json
      - name: Preserve A10 evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: minimax-allis-a1a9-a10
          path: /tmp/allis-a1a9-a10.json
          if-no-files-found: warn
