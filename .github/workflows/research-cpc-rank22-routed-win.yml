name: Research CPC rank22 routed win composition

on:
  push:
    branches:
      - research/universal-structural-policy-20260930
    paths:
      - .github/workflows/research-cpc-rank22-routed-win.yml
      - research/isograph/discovery/2026-09-30-universal-structural-policy/CPC_RANK22_C1_ROUTED_WIN_COMPOSITION_THEOREM.md
      - research/isograph/discovery/2026-09-30-universal-structural-policy/test-cpc-rank22-c1-routed-win-composition.mjs
      - research/isograph/discovery/2026-09-30-universal-structural-policy/run-cpc-rank22-c1-routed-win-composition.mjs
      - research/isograph/discovery/2026-09-30-universal-structural-policy/run-cpc-rank22-c1-zugzwang-composition.mjs
      - research/isograph/discovery/2026-09-30-universal-structural-policy/run-cpc-rank24-zugzwang-win-composition.mjs
      - research/isograph/discovery/2026-09-30-universal-structural-policy/run-cpc-rank24-reply3-singleton-handoff-composition.mjs
      - research/isograph/discovery/2026-09-30-universal-structural-policy/run-cpc-rank24-reply7-routed-win-composition.mjs

permissions:
  contents: write

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26.7.0
      - name: Fetch pinned JSMinSys authority
        shell: bash
        run: |
          set -euo pipefail
          git clone -q https://github.com/iteathen/JSMinSys.git jsminsys
          git -C jsminsys checkout -q bf23d3a67652cd42e1975f29c7dc4eed54f7eb42
      - name: Verify frozen routed composition contract
        run: node research/isograph/discovery/2026-09-30-universal-structural-policy/test-cpc-rank22-c1-routed-win-composition.mjs ./jsminsys
      - name: Generate durable routed composition evidence
        shell: bash
        run: |
          set -euo pipefail
          DIR=research/isograph/discovery/2026-09-30-universal-structural-policy
          node "$DIR/run-cpc-rank22-c1-routed-win-composition.mjs" ./jsminsys > "$DIR/CPC_RANK22_C1_ROUTED_WIN_COMPOSITION_0_1.json"
      - name: Commit durable routed composition evidence
        shell: bash
        run: |
          set -euo pipefail
          BRANCH=research/universal-structural-policy-20260930
          FILE=research/isograph/discovery/2026-09-30-universal-structural-policy/CPC_RANK22_C1_ROUTED_WIN_COMPOSITION_0_1.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$FILE"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research: record rank22 routed win composition"
          git pull --rebase origin "$BRANCH"
          git push origin HEAD:"$BRANCH"
