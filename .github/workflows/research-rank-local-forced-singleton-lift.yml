name: Research rank-local forced singleton lift

on:
  push:
    branches:
      - research/universal-structural-policy-20260930
    paths:
      - .github/workflows/research-rank-local-forced-singleton-lift.yml
      - research/isograph/discovery/2026-09-30-universal-structural-policy/RANK_LOCAL_FORCED_SINGLETON_LIFT_THEOREM.md
      - research/isograph/discovery/2026-09-30-universal-structural-policy/run-rank-local-forced-singleton-lift.mjs

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact pushed revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Pin Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26.7.0

      - name: Assert exact Node runtime
        run: node -e "if (process.version !== 'v26.7.0') throw new Error('expected Node v26.7.0, got ' + process.version)"

      - name: Run exact structural controls
        shell: bash
        run: |
          set -euo pipefail
          OUT=research/isograph/discovery/2026-09-30-universal-structural-policy/RANK_LOCAL_FORCED_SINGLETON_LIFT_CONTROL_0_1.json
          node research/isograph/discovery/2026-09-30-universal-structural-policy/run-rank-local-forced-singleton-lift.mjs > "$OUT"
          node - "$OUT" <<'NODE'
          const fs = require('fs');
          const r = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          console.log('ORACLE_USED=' + r.oracleUsed);
          console.log('CHAIN=' + JSON.stringify(r.controls.fivePlyChain));
          console.log('V4_BOUNDARY=' + JSON.stringify(r.controls.v4ConsumedFalsifierBoundary));
          NODE

      - name: Commit durable structural evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/isograph/discovery/2026-09-30-universal-structural-policy/RANK_LOCAL_FORCED_SINGLETON_LIFT_CONTROL_0_1.json
          if git diff --cached --quiet; then
            echo "structural evidence unchanged"
            exit 0
          fi
          git commit -m "research: verify forced-singleton upper-bound lift"
          git push origin HEAD:research/universal-structural-policy-20260930
