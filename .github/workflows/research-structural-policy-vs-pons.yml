name: Research structural policy vs Pons oracle

on:
  push:
    branches:
      - research/universal-structural-policy-20260930
    paths:
      - .github/workflows/research-structural-policy-vs-pons.yml

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Fetch research branch and run frozen structural policy
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/iteathen/Connect4.git connect4
          cd connect4
          git checkout research/universal-structural-policy-20260930
          node research/isograph/discovery/2026-09-30-universal-structural-policy/universal-structural-policy-v0.mjs > ../structural.json
          cd ..
          python3 - <<'PY'
          import json
          x=json.load(open('structural.json'))
          print('STRUCTURAL_SEQUENCE',x['sequence'])
          print('STRUCTURAL_DISPOSITION',x['disposition'])
          for r in x['trace']:
              print('STRUCT',r['ply'],r['sequenceBefore'],r['selected'],r['reason'])
          PY

      - name: Build pinned Pascal Pons oracle
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/PascalPons/connect4.git pons-connect4
          cd pons-connect4
          git checkout d6ba50d8aaf2308c769d9bf2abd42d90f34baf41
          make -j2
          curl -fL --retry 3 -o 7x6.book https://github.com/PascalPons/connect4/releases/download/book/7x6.book
          echo "PONS_SHA=$(git rev-parse HEAD)"
          sha256sum 7x6.book

      - name: Analyze every structural-policy prefix
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          x=json.load(open('structural.json'))
          # Include the prefix before every move chosen by the structural policy.
          # Empty position is excluded from stdin because Pons accepts it but it is expensive
          # and our immediate target is continuation from the already qualified opening.
          seqs=[r['sequenceBefore'] for r in x['trace'] if r['sequenceBefore']]
          open('prefixes.txt','w').write('\n'.join(seqs)+'\n')
          PY
          ./pons-connect4/c4solver -b ./pons-connect4/7x6.book -a < prefixes.txt > oracle-vectors.txt
          cat oracle-vectors.txt

      - name: Compare structural selections with project acceptable sets
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          x=json.load(open('structural.json'))
          vectors={}
          for line in open('oracle-vectors.txt'):
              f=line.strip().split()
              if not f: continue
              vectors[f[0]]=list(map(int,f[1:]))
          bad=[]
          for r in x['trace']:
              seq=r['sequenceBefore']
              if not seq or seq not in vectors: continue
              scores=vectors[seq]
              legal=[(i+1,s) for i,s in enumerate(scores) if s!=-1000]
              wins=[m for m,s in legal if s>0]
              draws=[m for m,s in legal if s==0]
              if wins:
                  acceptable=wins
                  basis='ANY_WIN'
              elif draws:
                  acceptable=draws
                  basis='ANY_DRAW'
              else:
                  best=max(s for _,s in legal)
                  acceptable=[m for m,s in legal if s==best]
                  basis='MAX_DELAY_LOSS'
              selected=r['selected']
              ok=all(m in acceptable for m in selected)
              print('CHECK',json.dumps({
                  'ply':r['ply'],'sequenceBefore':seq,'selected':selected,
                  'scores':scores,'acceptable':acceptable,'basis':basis,'ok':ok
              },separators=(',',':')))
              if not ok:
                  bad.append((r['ply'],seq,selected,acceptable,scores))
                  break
          if bad:
              print('FIRST_MISMATCH',json.dumps(bad[0],separators=(',',':')))
          else:
              print('NO_MISMATCH_ON_GENERATED_PREFIXES')
          PY
