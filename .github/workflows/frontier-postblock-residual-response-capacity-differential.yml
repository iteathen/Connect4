name: Frontier post-block residual response-capacity differential

on:
  push:
    branches:
      - research/frontier-negamax-conformance
    paths:
      - research/semantic-quotient/state-identity-unification/src/quotient-standard7x6-postblock-residual-response-capacity-differential.mjs
      - .github/workflows/frontier-postblock-residual-response-capacity-differential.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  differential:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      defects: ${{ steps.run.outputs.defects }}
      forced: ${{ steps.run.outputs.forced }}
      matched: ${{ steps.run.outputs.matched }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26.7.0
      - name: Qualify exact response-capacity differential
        id: run
        shell: bash
        run: |
          set -euo pipefail
          f="$RUNNER_TEMP/postblock-response-capacity.txt"
          timeout 270s node --expose-gc research/semantic-quotient/state-identity-unification/src/quotient-standard7x6-postblock-residual-response-capacity-differential.mjs | tee "$f"
          RESULT_FILE="$f" node <<'NODE'
          const fs=require('node:fs');
          const line=fs.readFileSync(process.env.RESULT_FILE,'utf8').split(/\r?\n/).find(x=>x.startsWith('POSTBLOCK_RESIDUAL_RESPONSE_CAPACITY_DIFFERENTIAL='));
          if(!line) throw new Error('response-capacity differential summary missing');
          const x=JSON.parse(line.slice(line.indexOf('=')+1));
          if(x.exactRank18Roots!==84||x.qualifiedPositiveRoots!==62||x.residualRoots!==22) throw new Error('rank18/residual inventory drift');
          if(x.residualInventory.G3.length!==17||x.residualInventory.C3.length!==5) throw new Error('residual side inventory drift');
          fs.appendFileSync(process.env.GITHUB_OUTPUT,[
            `defects=${x.exactCapacityDefectChildren}`,
            `forced=${x.exactForcedDefenseChildren}`,
            `matched=${x.matchedOppositeSignaturePairs}`,
          ].join('\n')+'\n');
          NODE

  summary:
    needs: differential
    name: response-capacity-defects-${{ needs.differential.outputs.defects }}-forced-${{ needs.differential.outputs.forced }}-matched-${{ needs.differential.outputs.matched }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - run: echo "response-capacity differential counts encoded in job name"
