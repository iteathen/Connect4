name: IsoMax XOR parity discovery lens

on:
  push:
    branches:
      - experiment/isomax-xor-parity-lens-20260929
    paths:
      - '.github/workflows/isomax-xor-parity-lens.yml'
      - 'research/isograph/discovery/2026-09-29-isomax-xor-parity/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 0}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with: {node-version: '26'}
      - name: Run XOR parity discovery lens
        run: node research/isograph/discovery/2026-09-29-isomax-xor-parity/run-xor-parity-lens.mjs
      - name: Research integrity
        run: node tools/verify-research-integrity.mjs
      - name: Commit XOR parity evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/isograph/discovery/2026-09-29-isomax-xor-parity/XOR_PARITY_LENS_0_1.json
          if git diff --cached --quiet; then echo "No generated changes."; else
            git commit -m "research(isomax): freeze XOR parity evidence"
            git push origin HEAD:experiment/isomax-xor-parity-lens-20260929
          fi
