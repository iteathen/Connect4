name: bsfp-tensor-dominance-experimental

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout Connect4
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Checkout exact CUDA-JS authority
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: iteathen/CUDA-JS
          ref: 98e2ebc942c14d63acf4dd82e912dd548c363a05
          path: cuda-js
          persist-credentials: false

      - name: Checkout qualified Tensor research candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: iteathen/CUDA-JS-Tensor
          ref: 63fbd0c5cd50a2251e3474a15bc79e786530eaec
          path: cuda-js-tensor
          persist-credentials: false

      - name: Select Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26.7.0

      - name: Stage Tensor exact CUDA-JS pair
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const file = 'cuda-js-tensor/components/tensor-value/src/tensor-session.mjs';
          let source = readFileSync(file, 'utf8');
          const replacements = [
            ['0.1.0-alpha.18', '0.1.0-alpha.20'],
            ['45a9ef15537b52d6fd7c615b7e596676dfd00587', '98e2ebc942c14d63acf4dd82e912dd548c363a05'],
          ];
          for (const [from, to] of replacements) {
            const count = source.split(from).length - 1;
            if (count !== 1) throw new Error(`expected one Tensor compatibility occurrence of ${from}, found ${count}`);
            source = source.replace(from, to);
          }
          writeFileSync(file, source);
          NODE

      - name: Install exact CUDA-JS dependencies
        run: npm ci --prefix cuda-js

      - name: Bind research package topology
        shell: pwsh
        run: |
          node -e "const fs=require('fs'),p=require('path');fs.mkdirSync('node_modules',{recursive:true});for(const[n,t]of[['cuda-js','cuda-js'],['cuda-js-tensor','cuda-js-tensor']]){const link=p.resolve('node_modules',n),target=p.resolve(t);fs.rmSync(link,{recursive:true,force:true});fs.symlinkSync(target,link,process.platform==='win32'?'junction':'dir')}"

      - name: Run full-shape portable Tensor dominance composition
        run: node research/experiments/cuda-bsfp-tensor-dominance/run.mjs portable
