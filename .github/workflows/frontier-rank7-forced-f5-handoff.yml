name: Frontier rank7 forced F5 handoff

on:
  push:
    branches:
      - research/frontier-negamax-conformance
    paths:
      - research/semantic-quotient/state-identity-unification/src/quotient-standard7x6-rank7-forced-f5-handoff.mjs
      - .github/workflows/frontier-rank7-forced-f5-handoff.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26.7.0
      - name: Qualify forced F5 handoff family
        shell: bash
        run: |
          set -euo pipefail
          f="$RUNNER_TEMP/rank7-forced-f5.txt"
          timeout 270s node research/semantic-quotient/state-identity-unification/src/quotient-standard7x6-rank7-forced-f5-handoff.mjs | tee "$f"
          RESULT_FILE="$f" node <<'NODE'
          const fs=require('node:fs');
          const line=fs.readFileSync(process.env.RESULT_FILE,'utf8').split(/\r?\n/).find(x=>x.startsWith('RANK7_FORCED_F5_HANDOFF='));
          if(!line) throw new Error('rank7 F5 handoff summary missing');
          const x=JSON.parse(line.slice(line.indexOf('=')+1));
          if(x.provedForcedHandoffCount!==5) throw new Error('rank7 F5 handoff count drift');
          if(JSON.stringify(x.coveredReplies)!==JSON.stringify(['A','B','C','D','G'])) throw new Error('rank7 F5 handoff reply set drift');
          for(const c of x.cases){
            if(c.witness!=='F4') throw new Error(`F4 witness drift ${c.reply}`);
            if(!c.replies.some(r=>r.route==='forced_F5_block')) throw new Error(`missing F5 block ${c.reply}`);
          }
          NODE
