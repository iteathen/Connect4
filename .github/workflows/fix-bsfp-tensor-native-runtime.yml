name: fix-bsfp-tensor-native-runtime

on:
  push:
    branches:
      - research/bsfp-tensor-overflow-dominance

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, 'enable compiler for Tensor native A/B') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: research/bsfp-tensor-overflow-dominance
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.7.0
      - name: Request compiler authority for native A/B
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const path = 'research/experiments/cuda-bsfp-tensor-dominance/run.mjs';
          const before = readFileSync(path, 'utf8');
          const from = 'const runtime = native ? await openCudaRuntime() : await openCudaRuntimeForTesting({ compiler: true });';
          const to = 'const runtime = native ? await openCudaRuntime({ compiler: true }) : await openCudaRuntimeForTesting({ compiler: true });';
          const count = before.split(from).length - 1;
          if (count !== 1) throw new Error(`expected one native runtime anchor, found ${count}`);
          writeFileSync(path, before.replace(from, to));
          NODE
      - run: node --test
      - name: Commit native runtime correction
        shell: bash
        run: |
          git config user.name iteathen
          git config user.email josh.oshiro@gmail.com
          git add research/experiments/cuda-bsfp-tensor-dominance/run.mjs
          git commit -m 'research: enable compiler for Tensor native A/B'
          git push origin HEAD:research/bsfp-tensor-overflow-dominance
