name: Research rank33 WDL value-equivalence quotient

on:
  push:
    branches:
      - research/semantic-quotient
    paths:
      - '.github/workflows/research-rank33-wdl-value-equivalence.yml'
      - 'research/isograph/discovery/2026-09-18-policy-frontier/rba-g2-fiber-equivalence.mjs'

permissions:
  contents: read
  actions: read

jobs:
  quotient:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26.7.0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: wdl-r33-state
          path: ${{ runner.temp }}/full
          github-token: ${{ github.token }}
          repository: iteathen/Connect4
          run-id: 38939600643
      - name: Compute exact claim-relative WDL quotient
        run: |
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import crypto from 'node:crypto';
          import { canonicalizeG2Fiber, g2ResidualShapes } from './research/isograph/discovery/2026-09-18-policy-frontier/rba-g2-fiber-equivalence.mjs';

          const src=path.join(process.env.RUNNER_TEMP,'full');
          function subset(a,b){return (a&b)===a;}
          function cmpBig(a,b){return a<b?-1:a>b?1:0;}
          function loadHex(file){const t=fs.readFileSync(file,'utf8').trim();return t?t.split(/\n/).map(x=>BigInt('0x'+x)):[];}
          function qRemap(q,n,map){
            const all=n?((1n<<BigInt(n))-1n):0n;
            const m=q&all,o=all^((q>>BigInt(n))&all);
            let mm=0n,oo=0n;
            for(let i=0;i<n;i++){
              const b=1n<<BigInt(map[i]);
              if(m&(1n<<BigInt(i)))mm|=b;
              if(o&(1n<<BigInt(i)))oo|=b;
            }
            return mm|((all^oo)<<BigInt(n));
          }
          function valueSignature(e){
            const shapes=g2ResidualShapes(e.support),n=shapes.length,c=canonicalizeG2Fiber(e.support);
            const order=Array.from({length:n},(_,i)=>i).sort((a,b)=>c.shapeKeyByIndex[a].localeCompare(c.shapeKeyByIndex[b]));
            const map=Array(n);for(let j=0;j<n;j++)map[order[j]]=j;
            const relation=Array(n).fill(0n);
            for(let i=0;i<n;i++)for(let j=0;j<n;j++)if(subset(shapes[i],shapes[j]))relation[map[i]]|=1n<<BigInt(map[j]);
            const U=e.U.map(q=>qRemap(q,n,map)).sort(cmpBig);
            const L=e.L.map(q=>qRemap(q,n,map)).sort(cmpBig);
            return JSON.stringify([n,relation.map(String),U.map(String),L.map(String)]);
          }

          const entries=[];
          for(const name of fs.readdirSync(src).filter(x=>x.endsWith('.json')&&x!=='manifest.json')){
            const meta=JSON.parse(fs.readFileSync(path.join(src,name),'utf8'));
            if(meta.rank!==33||!Array.isArray(meta.support))continue;
            const base=name.slice(0,-5);
            entries.push({base,support:meta.support,U:loadHex(path.join(src,base+'.U.hex')),L:loadHex(path.join(src,base+'.L.hex'))});
          }
          if(entries.length!==4809)throw new Error('rank33 support count mismatch');

          const g2=new Map();
          for(const e of entries){
            e.g2=canonicalizeG2Fiber(e.support);
            if(!g2.has(e.g2.key))g2.set(e.g2.key,e);
          }
          if(g2.size!==2223)throw new Error('rank33 G2 count mismatch '+g2.size);

          const valueClasses=new Map();
          for(const e of g2.values()){
            const sig=valueSignature(e);
            let group=valueClasses.get(sig);if(!group){group=[];valueClasses.set(sig,group);}
            group.push(e);
          }
          let maxClass=0,nontrivial=0,membersInNontrivial=0;
          const distribution={};
          for(const g of valueClasses.values()){
            maxClass=Math.max(maxClass,g.length);
            distribution[g.length]=(distribution[g.length]??0)+1;
            if(g.length>1){nontrivial++;membersInNontrivial+=g.length;}
          }
          const result={
            schema:'standard7x6-r33-wdl-value-equivalence-v0_1',
            supports:entries.length,
            g2FiberClasses:g2.size,
            wdlValueClasses:valueClasses.size,
            g2OverValue:+(g2.size/valueClasses.size).toFixed(6),
            supportOverValue:+(entries.length/valueClasses.size).toFixed(6),
            nontrivialValueClasses:nontrivial,
            g2MembersInNontrivialValueClasses:membersInNontrivial,
            maxValueClassSize:maxClass,
            classSizeDistribution:distribution,
            equivalenceDefinition:'same residual-shape poset relation and same exact U/L frontier sets under an explicit canonical shape-index bijection',
            scope:'state WDL boundary claim only; does not imply G2/action/cofactor equivalence'
          };
          result.digest=crypto.createHash('sha256').update(JSON.stringify(result)).digest('hex');
          console.log(JSON.stringify(result,null,2));
          NODE
