name: Quotient shared TT workers

on:
  push:
    branches:
      - research/semantic-quotient
    paths:
      - 'research/semantic-quotient/state-identity-unification/src/quotient-shared-*.mjs'
      - '.github/workflows/semantic-quotient-shared-tt-workers.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  REPEATS: '7'
  WORKER_COUNTS: '1,2,4'
  PREFIX_CLASSES: '4096'

jobs:
  benchmark:
    name: Qualify shared TT and dedup ownership
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26.7.0
      - name: Run shared TT worker campaign
        run: >-
          node --expose-gc --max-old-space-size=6144
          research/semantic-quotient/state-identity-unification/src/quotient-shared-tt-worker-campaign.mjs
