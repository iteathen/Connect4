name: bsfp-clause-coverage-experimental

on:
  pull_request:
    paths:
      - 'research/experiments/cuda-bsfp-clause-coverage/**'
      - '.github/workflows/bsfp-clause-coverage-experimental.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable:
    name: clause-coverage portable
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout Connect4
        uses: actions/checkout@3d3c42e5aac5ba805da76410c181273ba90b1

      - name: Checkout exact CUDA-JS authority
        uses: actions/checkout@3d3c42e5aac5ba805da76410c181273ba90b1
        with:
          repository: iteathen/CUDA-JS
          ref: 98e2ebc942c14d63acf4dd82e912dd548c363a05
          path: cuda-js
          persist-credentials: false

      - name: Select Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26.7.0

      - name: Install exact CUDA-JS dependencies without engine gating
        env:
          npm_config_engine_strict: 'false'
        run: npm ci --prefix cuda-js

      - name: Bind exact CUDA-JS package through public package surface
        run: |
          node -e "const fs=require('fs'),p=require('path');fs.mkdirSync('node_modules',{recursive:true});const link=p.resolve('node_modules','cuda-js'),target=p.resolve('cuda-js');fs.rmSync(link,{recursive:true,force:true});fs.symlinkSync(target,link,'dir')"

      - name: Compile and submit synthetic coverage contract fixture
        run: node research/experiments/cuda-bsfp-clause-coverage/run.mjs portable

      - name: Derive, pack, compile and submit real BSFP hot workloads
        run: node research/experiments/cuda-bsfp-clause-coverage/run-real.mjs portable

      - name: Derive, map, compile and submit real support-edge cofactors
        run: node research/experiments/cuda-bsfp-clause-coverage/run-cofactor.mjs portable

      - name: Census scalar versus preimage cofactor work shape
        run: node research/experiments/cuda-bsfp-clause-coverage/analyze-cofactor-work.mjs

      - name: Derive and submit real three-word 6x5 support-edge cofactors
        run: node research/experiments/cuda-bsfp-clause-coverage/run-multiword-cofactor.mjs portable

      - name: Qualify real three-word 6x5 universal merges
        run: node research/experiments/cuda-bsfp-clause-coverage/qualify-multiword-universal.mjs

      - name: Qualify multiword cell and coverage legal-slice guards
        run: node research/experiments/cuda-bsfp-clause-coverage/qualify-multiword-capacity.mjs
