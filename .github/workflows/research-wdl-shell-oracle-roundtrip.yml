name: Research WDL shell oracle roundtrip

on:
  push:
    branches:
      - research/semantic-quotient
    paths:
      - '.github/workflows/research-wdl-shell-oracle-roundtrip.yml'
      - 'research/isograph/discovery/2026-10-16-oracle-compiled-frontier/rba-wdl-oracle-roundtrip.mjs'

permissions:
  contents: read
  actions: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26.7.0
      - name: Assert exact Node runtime
        run: node -e "if (process.version !== 'v26.7.0') throw new Error('expected Node v26.7.0, got ' + process.version)"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: wdl-shell-r33
          path: ${{ runner.temp }}/wdl-frontier
          github-token: ${{ github.token }}
          repository: iteathen/Connect4
          run-id: 38937734403
      - name: Validate compiled shell against qualified oracle vectors
        run: |
          node research/isograph/discovery/2026-10-16-oracle-compiled-frontier/rba-wdl-oracle-roundtrip.mjs \
            "$RUNNER_TEMP/wdl-frontier" 33
