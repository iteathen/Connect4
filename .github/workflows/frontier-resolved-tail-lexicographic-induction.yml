name: Frontier resolved-tail lexicographic induction

on:
  push:
    branches:
      - research/frontier-negamax-conformance
    paths:
      - research/semantic-quotient/state-identity-unification/src/quotient-standard7x6-resolved-tail-lexicographic-induction.mjs
      - .github/workflows/frontier-resolved-tail-lexicographic-induction.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  induction:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      starts: ${{ steps.run.outputs.starts }}
      proved: ${{ steps.run.outputs.proved }}
      failed: ${{ steps.run.outputs.failed }}
      resource: ${{ steps.run.outputs.resource }}
      tail: ${{ steps.run.outputs.tail }}
      repair: ${{ steps.run.outputs.repair }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26.7.0
      - name: Qualify resolved-tail lexicographic induction
        id: run
        shell: bash
        run: |
          set -euo pipefail
          f="$RUNNER_TEMP/resolved-tail-lex.txt"
          timeout 270s node --expose-gc research/semantic-quotient/state-identity-unification/src/quotient-standard7x6-resolved-tail-lexicographic-induction.mjs | tee "$f"
          RESULT_FILE="$f" node <<'NODE'
          const fs=require('node:fs');
          const line=fs.readFileSync(process.env.RESULT_FILE,'utf8').split(/\r?\n/).find(x=>x.startsWith('RESOLVED_TAIL_LEXICOGRAPHIC_INDUCTION='));
          if(!line) throw new Error('resolved-tail lexicographic summary missing');
          const x=JSON.parse(line.slice(line.indexOf('=')+1));
          if(x.exactPreviouslyUnprovedStarts!==12) throw new Error('representative start inventory drift');
          fs.appendFileSync(process.env.GITHUB_OUTPUT,[
            `starts=${x.exactPreviouslyUnprovedStarts}`,
            `proved=${x.provedStarts}`,
            `failed=${x.failedStarts}`,
            `resource=${x.resourceFailures}`,
            `tail=${x.witnessKinds.resolved_tail_descent||0}`,
            `repair=${x.witnessKinds.repair_descent||0}`,
          ].join('\n')+'\n');
          NODE

  summary:
    needs: induction
    name: lex-s${{ needs.induction.outputs.starts }}-p${{ needs.induction.outputs.proved }}-f${{ needs.induction.outputs.failed }}-t${{ needs.induction.outputs.tail }}-r${{ needs.induction.outputs.repair }}-x${{ needs.induction.outputs.resource }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - run: echo "resolved-tail lexicographic induction counts encoded in job name"
