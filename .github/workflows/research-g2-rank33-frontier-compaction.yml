name: Research G2 rank33 frontier compaction

on:
  push:
    branches:
      - research/semantic-quotient
    paths:
      - '.github/workflows/research-g2-rank33-frontier-compaction.yml'
      - 'research/isograph/discovery/2026-09-18-policy-frontier/rba-g2-fiber-equivalence.mjs'

permissions:
  contents: read
  actions: read

jobs:
  compact:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26.7.0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: wdl-r33-state
          path: ${{ runner.temp }}/full
          github-token: ${{ github.token }}
          repository: iteathen/Connect4
          run-id: 38939600643
      - name: Compact by exact G2 fiber equivalence
        run: |
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import crypto from 'node:crypto';
          import {
            canonicalizeG2Fiber,
            g2ResidualShapes,
            transportG2Front,
            samePackedSet,
          } from './research/isograph/discovery/2026-09-18-policy-frontier/rba-g2-fiber-equivalence.mjs';

          const src=path.join(process.env.RUNNER_TEMP,'full');
          const dst=path.join(process.env.RUNNER_TEMP,'g2-r33');
          fs.mkdirSync(dst,{recursive:true});

          function pc(x){let n=0;while(x){x&=x-1n;n++;}return n;}
          function subset(a,b){return (a&b)===a;}
          function cmpBig(a,b){return a<b?-1:a>b?1:0;}
          function loadHex(file){
            const t=fs.readFileSync(file,'utf8').trim();
            return t?t.split(/\n/).map(x=>BigInt('0x'+x)):[];
          }
          function serialize(a){return a.slice().sort(cmpBig).map(x=>x.toString(16)).join('\n')+'\n';}
          function shapeInfo(h){
            const shapes=g2ResidualShapes(h),n=shapes.length;
            const up=Array(n).fill(0n);
            for(let i=0;i<n;i++)for(let j=0;j<n;j++)if(subset(shapes[i],shapes[j]))up[i]|=1n<<BigInt(j);
            const all=n?((1n<<BigInt(n))-1n):0n;
            return {h:h.slice(),shapes,n,up,all,bits:2*n};
          }

          const entries=[];
          for(const name of fs.readdirSync(src).filter(x=>x.endsWith('.json')&&x!=='manifest.json')){
            const meta=JSON.parse(fs.readFileSync(path.join(src,name),'utf8'));
            if(meta.rank!==33||!Array.isArray(meta.support))continue;
            const base=name.slice(0,-5);
            entries.push({
              base,
              support:meta.support,
              meta,
              U:loadHex(path.join(src,base+'.U.hex')),
              L:loadHex(path.join(src,base+'.L.hex')),
            });
          }
          if(entries.length!==4809)throw new Error('expected 4809 rank33 supports, got '+entries.length);
          entries.sort((a,b)=>a.base.localeCompare(b.base));

          const groups=new Map();
          for(const e of entries){
            e.canonical=canonicalizeG2Fiber(e.support);
            e.info=shapeInfo(e.support);
            let g=groups.get(e.canonical.key);
            if(!g){g=[];groups.set(e.canonical.key,g);}
            g.push(e);
          }
          if(groups.size!==2223)throw new Error('expected 2223 rank33 fibers, got '+groups.size);

          let originalGenerators=0,representativeGenerators=0,transported=0,mismatches=0,maxClass=0;
          let originalBytes=0,representativeBytes=0;
          const mapping=[];
          const reps=[];
          for(const group of groups.values()){
            maxClass=Math.max(maxClass,group.length);
            group.sort((a,b)=>a.base.localeCompare(b.base));
            const rep=group[0];
            const uText=serialize(rep.U),lText=serialize(rep.L);
            fs.writeFileSync(path.join(dst,rep.base+'.U.hex'),uText);
            fs.writeFileSync(path.join(dst,rep.base+'.L.hex'),lText);
            fs.writeFileSync(path.join(dst,rep.base+'.json'),JSON.stringify({
              rank:33,support:rep.support,upper:rep.U.length,lower:rep.L.length,
              fiberMembers:group.length
            })+'\n');
            representativeGenerators+=rep.U.length+rep.L.length;
            representativeBytes+=Buffer.byteLength(uText)+Buffer.byteLength(lText);
            reps.push(rep.base);

            for(const e of group){
              originalGenerators+=e.U.length+e.L.length;
              originalBytes+=fs.statSync(path.join(src,e.base+'.U.hex')).size+fs.statSync(path.join(src,e.base+'.L.hex')).size;
              mapping.push([e.base,rep.base]);
              if(e===rep)continue;
              const U=transportG2Front(rep.info,rep.canonical,e.info,e.canonical,rep.U);
              const L=transportG2Front(rep.info,rep.canonical,e.info,e.canonical,rep.L);
              transported++;
              if(!samePackedSet(U,e.U)||!samePackedSet(L,e.L))mismatches++;
            }
          }
          if(originalGenerators!==8049016)throw new Error('original generator total mismatch '+originalGenerators);
          if(mismatches!==0)throw new Error('G2 frontier transport mismatches '+mismatches);

          mapping.sort((a,b)=>a[0].localeCompare(b[0]));
          reps.sort();
          const result={
            schema:'standard7x6-r33-g2-frontier-compaction-v0_1',
            rank:33,
            supports:entries.length,
            fiberClasses:groups.size,
            transportedSupports:transported,
            transportMismatches:mismatches,
            maxClass,
            originalGenerators,
            representativeGenerators,
            generatorCompression:+(originalGenerators/representativeGenerators).toFixed(6),
            originalBoundaryBytes:originalBytes,
            representativeBoundaryBytes:representativeBytes,
            byteCompression:+(originalBytes/representativeBytes).toFixed(6),
            mapEntries:mapping.length,
          };
          const manifest=JSON.stringify({result,mapping,reps},null,2)+'\n';
          fs.writeFileSync(path.join(dst,'manifest.json'),manifest);
          result.manifestSha256=crypto.createHash('sha256').update(manifest).digest('hex');
          console.log(JSON.stringify(result,null,2));
          NODE
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: wdl-r33-g2-compact
          path: ${{ runner.temp }}/g2-r33
          if-no-files-found: error
          retention-days: 7
