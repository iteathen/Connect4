name: Persistent chunked residual compact summary

on:
  push:
    branches:
      - research/semantic-quotient
    paths:
      - '.github/workflows/semantic-quotient-chunked-residual-summary.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  summarize:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26.7.0
      - name: Run campaign and emit compact summary
        shell: bash
        run: |
          set -o pipefail
          node --expose-gc --max-old-space-size=6144 research/semantic-quotient/state-identity-unification/src/quotient-chunked-residual-campaign.mjs 2>&1 \
            | grep -E '^(CHUNKED_RESIDUAL_SUMMARY=|\[q-chunked\])'
